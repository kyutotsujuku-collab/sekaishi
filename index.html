.tbl .g{font-size:12px;color:#666;padding:0 12px 8px;background:#fff7ec}

.opts button.ng{border-color:var(--ng);background:#fbeaea}

.wrong b{color:var(--acc)}

.hide{display:none}

let mode = "quiz";
let POOL = [], set = [], idx = 0, score = 0, wrong = [], curTitle = "", revealed = false, answered = false;

const $ = s => document.querySelector(s);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function buildMenu() {
  const ch = $("#chaps");
  const all = [];
  DATA.chapters.forEach((c, i) => {
    const d = document.createElement("div"); d.className = "row";
    d.innerHTML = `<span>${c.title}</span><small>${c.items.length}問</small>`;
    d.onclick = () => start(c.title, c.items.map(x => ({ sec: x.sec, q: x.q, a: x.a })), all.map(x => x.a));
    ch.appendChild(d);
    all.push(...c.items);
  });
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = `<span><b>文化史 全範囲</b></span><small>${all.length}問</small>`;
  d.onclick = () => start("文化史 全範囲", all.map(x => ({ sec: x.sec, q: x.q, a: x.a })), all.map(x => x.a));
  ch.appendChild(d);

  const yr = $("#years");
  const fwd = DATA.years.map(x => ({ sec: "出来事→年号", q: x.e, a: x.y, g: x.g }));
  const rev = DATA.years.map(x => ({ sec: "年号→出来事", q: x.y, a: x.e, g: x.g }));
  [["出来事 → 年号", fwd], ["年号 → 出来事", rev]].forEach(([t, s]) => {
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<span>${t}</span><small>${s.length}問</small>`;
    r.onclick = () => start(t, s, s.map(x => x.a));
    yr.appendChild(r);
  });
}

document.querySelectorAll("#mode button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#mode button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); mode = b.dataset.m;
});
$("#home").onclick = goHome;
function goHome() { $("#play").classList.add("hide"); $("#menu").classList.remove("hide"); $("#home").classList.add("hide"); $("#ttl").textContent = "世界史 文化史・年号"; }

function start(title, items, pool) {
  POOL = pool;
  curTitle = title; $("#ttl").textContent = title;
  $("#menu").classList.add("hide"); $("#play").classList.remove("hide"); $("#home").classList.remove("hide");
  if (mode === "list") return showList(items);
  set = shuffle(items.slice()); idx = 0; score = 0; wrong = [];
  render();
}

function showList(items) {
  $("#pnum").textContent = items.length + "問"; $("#pscore").textContent = ""; $("#pbar").style.width = "100%";
  let hidden = false;
  const st = $("#stage");
  const draw = () => {
    let h = `<div class="ctl"><button class="g" id="tog">${hidden ? "答えを表示" : "答えを隠す"}</button></div><div class="tbl">`;
    let sec = null;
    items.forEach(x => {
      if (x.sec !== sec) { sec = x.sec; h += `<div class="s">${sec}</div>`; }
      h += `<div class="i ${hidden ? "h" : ""}"><span>${x.q}</span><span>${x.a}</span></div>`;
      if (x.g) h += `<div class="g">💡 ${x.g}</div>`;
    });
    st.innerHTML = h + "</div>";
    document.querySelectorAll(".tbl .i").forEach(el => el.onclick = () => el.classList.toggle("h"));
    $("#tog").onclick = () => { hidden = !hidden; draw(); };
  };
  draw();
}

function render() {
  if (idx >= set.length) return finish();
  const it = set[idx];
  $("#pnum").textContent = `${idx + 1} / ${set.length}`;
  $("#pscore").textContent = mode === "quiz" ? `正解 ${score}` : `覚えた ${score}`;
  $("#pbar").style.width = (idx / set.length * 100) + "%";
  revealed = false; answered = false;
  let h = `<div class="q"><div class="sec">${it.sec}</div><div class="txt">${it.q}</div><div class="ans hide" id="ans">${it.a}${it.g ? `<div class="goro">💡 ${it.g}</div>` : ""}</div></div>`;
  if (mode === "quiz") {
    const pool = shuffle(POOL.filter(a => a !== it.a).filter((v, i, a) => a.indexOf(v) === i)).slice(0, 3);
    const opts = shuffle([it.a, ...pool]);
    h += `<div class="opts">` + opts.map(o => `<button data-a="${o.replace(/"/g, "&quot;")}">${o}</button>`).join("") + `</div>`;
    h += `<div class="ctl"><button id="next" class="g hide">次へ</button></div>`;
  } else {
    h += `<div class="ctl" id="c1"><button id="show">答えを見る</button></div>
          <div class="ctl hide" id="c2"><button class="r" id="ng">まだ</button><button id="ok">覚えた</button></div>`;
  }
  $("#stage").innerHTML = h;
  if (mode === "quiz") {
    document.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (answered) return; answered = true;
      const ok = b.dataset.a === it.a;
      document.querySelectorAll(".opts button").forEach(x => { if (x.dataset.a === it.a) x.classList.add("ok"); });
      if (ok) score++; else { b.classList.add("ng"); wrong.push(it); }
      $("#next").classList.remove("hide");
      if (it.g) $("#ans").classList.remove("hide");
      if (ok && !it.g) setTimeout(() => { idx++; render(); }, 500);
    });
    $("#next").onclick = () => { idx++; render(); };
  } else {
    $("#show").onclick = () => { $("#ans").classList.remove("hide"); $("#c1").classList.add("hide"); $("#c2").classList.remove("hide"); };
    $("#ok").onclick = () => { score++; idx++; render(); };
    $("#ng").onclick = () => { wrong.push(it); idx++; render(); };
  }
}

function finish() {
  $("#pbar").style.width = "100%";
  const n = set.length, pct = Math.round(score / n * 100);
  let h = `<div class="res"><div class="big">${pct}%</div><div>${score} / ${n}</div></div>`;
  h += `<div class="ctl">${wrong.length ? `<button class="r" id="retry">間違い${wrong.length}問を復習</button>` : ""}<button class="g" id="again">もう一度</button></div>`;
  if (wrong.length) {
    h += `<div class="wrong"><h2>間違えた問題</h2>` + wrong.map(x => `<div>${x.q}<br><b>${x.a}</b>${x.g ? `<br><small>💡 ${x.g}</small>` : ""}</div>`).join("") + `</div>`;
  }
  $("#stage").innerHTML = h;
  const full = set.slice();
  if (wrong.length) $("#retry").onclick = () => { set = shuffle(wrong.slice()); idx = 0; score = 0; wrong = []; render(); };
  $("#again").onclick = () => { set = shuffle(full); idx = 0; score = 0; wrong = []; render(); };
}

buildMenu();
</script>
</body>
</html>
