<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界史 ヨコのつながり</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --sub:#6b7078; --line:#e3e0d8;
  --accent:#b5461f; --accent-ink:#fff; --ok:#1f7a4d; --ng:#b3261e; --chip:#ece9e1; --chip-on:#1f2328;
  --kt:#c0392b; --W:#3b6fb6; --E:#7b4fb2; --I:#2e8b7a; --S:#c48a1a; --C:#c0392b; --J:#d2617a; --A:#5a8f2b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1f2226; --ink:#eceef0; --sub:#9aa0a8; --line:#33373d;
    --accent:#e2764f; --accent-ink:#1a0d08; --kt:#ff8577; --ok:#5fc48e; --ng:#ef7a73; --chip:#2a2e34; --chip-on:#eceef0;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1f2226; --ink:#eceef0; --sub:#9aa0a8; --line:#33373d;
  --accent:#e2764f; --accent-ink:#1a0d08; --ok:#5fc48e; --ng:#ef7a73; --chip:#2a2e34; --chip-on:#eceef0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0}
.hrow{display:flex;align-items:baseline;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:700}
.ver{font-size:12px;color:var(--sub)}
nav{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--sub);padding:8px 7px;font-size:13px;border-bottom:2px solid transparent;font-weight:600}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:12px 16px 90px;max-width:720px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--chip-on);color:var(--bg);border-color:var(--chip-on)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin:6px 0 10px}
.grid .chip{width:100%;text-align:center;padding:7px 4px}
.note{white-space:pre-wrap;line-height:1.6;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0 12px}
.note b{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ev{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px;cursor:pointer}
.ev:first-of-type{border-top:0}
.ev .y{flex:0 0 58px;color:var(--sub);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.ev.hl{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px;padding-left:6px;margin-left:-6px}
.empty{color:var(--sub);font-size:13px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80vh;overflow-y:auto;background:var(--card);border-radius:16px 16px 0 0;padding:12px 16px 24px;z-index:10;display:none;max-width:720px;margin:0 auto;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.sheet.open,.sheet-bg.open{display:block}
.sheet h2{font-size:16px;margin:4px 0 8px}
.sheet .close{position:absolute;right:12px;top:8px;border:0;background:var(--chip);color:var(--ink);border-radius:999px;width:32px;height:32px;font-size:18px}
.dyn{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin:8px 0 10px;padding:8px 10px;background:var(--bg);border-radius:8px}
.dyn span:nth-child(odd){color:var(--sub)}
.mapwrap{margin:8px 0 12px}
.mapwrap svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px}
.mapbtn{margin-top:8px}
.mapwrap svg text{pointer-events:none}
.mapwrap svg .tap{cursor:pointer}
.mapwrap svg .tapt{pointer-events:auto;cursor:pointer}
.mapwrap svg .sel{filter:drop-shadow(0 0 2px #000)}
.mapwrap svg .sel.area,.mapwrap svg .sel.mark{fill-opacity:.65;stroke-width:2.6}
.mapwrap svg .sel.city{r:4.5}
.maptools{display:flex;justify-content:flex-end;margin:4px 0 2px}.maptools .chip{font-size:12px;padding:4px 10px}
.modern svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:4px}
.mapinfo{margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 10px;font-size:13.5px;line-height:1.55}
.mapinfo .hint{color:var(--sub);font-size:12px}
.mapinfo h4{margin:0 0 2px;font-size:15px}
.mapinfo .yr{color:var(--sub);font-size:12px;margin-left:6px;font-weight:400}
.mapinfo .body{margin:4px 0 6px;white-space:pre-line}
.mapinfo .yoko{background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;padding:6px 8px;margin:6px 0;font-size:13px}
.mapinfo .yoko b{color:var(--accent)}
.mapinfo .yoko div{padding:1px 0 1px 1em;text-indent:-1em}
.mapinfo .pic,.exp .pic,.note .pic{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:6px;font-size:11px;padding:0 5px;margin:0 3px;line-height:1.5;vertical-align:middle;cursor:pointer}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}#lb img{max-width:100%;max-height:70vh;border-radius:8px}#lb .cap{color:#fff;font-size:13px;margin-top:10px;text-align:center}#lb .close{color:#bbb;font-size:12px;margin-top:8px}#lb .ld{color:#ddd;font-size:14px;padding:40px 0}#lb .hq{background:#333;color:#fff;border:1px solid #666;border-radius:6px;font-size:12px;padding:3px 8px}
.mapinfo figure{margin:6px 0}.mapinfo figure img{width:100%;border-radius:8px;display:block}.mapinfo figcaption{font-size:11.5px;color:var(--sub);margin-top:2px}
.mapinfo .src{color:var(--sub);font-size:11.5px;margin-top:4px}
.mapinfo .rel{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mapinfo .rel button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 9px;font-size:12px}
.mapinfo .rel button.q{border-color:var(--accent);color:var(--accent)}
.mapinfo .qlist{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.mapinfo .qitem{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);white-space:pre-wrap}
.mapinfo .qitem b{color:var(--ok)}
.rtag{font-size:11px;color:#fff;border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
/* quiz */
.q{font-size:16px;font-weight:600;margin:10px 0 12px;white-space:pre-wrap}
.ctx{border:1px solid var(--ink);border-radius:4px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin:8px 0;background:var(--card)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:15px;text-align:left;width:100%}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 14%,var(--card))}
.opt:disabled{opacity:1}
.exp{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px;white-space:pre-wrap}
.exp .v{font-weight:700}
.exp .v.ok{color:var(--ok)}.exp .v.ng{color:var(--ng)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-top:4px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;width:100%;margin-top:12px}
.btn.sec{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:8px}
.row .btn{margin-top:8px}
.setting{margin-bottom:10px}
.setting .lab{font-size:12px;color:var(--sub);margin-bottom:4px}
.result{text-align:center;padding:16px 0}
.result .big{font-size:40px;font-weight:800;color:var(--accent)}
.wrongitem{border-top:1px dashed var(--line);padding:8px 0;font-size:14px}
.wrongitem:first-child{border-top:0}
.wrongitem small{color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;min-height:170px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.fcard .front{font-size:17px;font-weight:700}
.fcard .back{font-size:15px;white-space:pre-wrap}
.fcard .tag{font-size:12px;color:var(--sub);margin-bottom:6px}
.fcard .hint{font-size:12px;color:var(--sub);margin-top:10px;text-align:center}
.same{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}
.same div{padding:2px 0}

.ytbl{margin:10px 0 14px}
.yhead{font-size:15px;margin:4px 0 6px}.yhead b{color:var(--accent)}
.yintro{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;margin-bottom:10px}
.yband{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
.yt{background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:6px 10px}.yt span{font-weight:400;margin-left:8px;font-size:13px;opacity:.9}
.yrow{display:grid;grid-template-columns:58px 1fr;border-top:1px dashed var(--line)}
.yr{font-size:10.5px;letter-spacing:-.02em;font-weight:700;color:#fff;background:var(--rc);padding:8px 4px;display:flex;align-items:flex-start;justify-content:center;text-align:center;line-height:1.3}
.yc{padding:7px 10px 8px}.ye{font-weight:700;font-size:14px;line-height:1.5}.yx{font-size:13px;color:var(--sub);line-height:1.55;margin-top:2px}
.yyoko{border-top:1px solid var(--line);background:color-mix(in srgb,var(--accent) 9%,transparent);padding:8px 10px;font-size:13px;line-height:1.55;color:var(--accent);font-weight:600}
.ytbl .pic{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:6px;font-size:11px;padding:0 5px;margin:0 3px;line-height:1.5;vertical-align:middle;cursor:pointer}

.mapwrap svg{--ink:#1f2328;--sub:#6b7078;--accent:#b5461f}
.mapbox{position:relative}
.zoomb{position:absolute;right:8px;top:8px;font-size:12px;padding:3px 8px;border-radius:14px;border:1px solid #b9b2a4;background:rgba(255,255,255,.92);color:#1f2328;cursor:pointer}
#mz{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column}
.mzbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}.mzbar .muted{flex:1;font-size:11px}.mzbar .btn{width:auto;margin:0;padding:6px 12px;font-size:13px}
.mzstage{position:relative;height:52vh;overflow:hidden;background:#dfe8ee;touch-action:none;user-select:none;-webkit-user-select:none}
.mzstage svg{--ink:#1f2328;--sub:#6b7078;--accent:#b5461f;background:#dfe8ee}
.mzctl{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}.mzctl button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.mzinfo{flex:1;overflow:auto;padding:6px 10px 20px}
.kt{color:var(--kt);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>世界史 ヨコのつながり</h1><span class="ver">v32</span></div>
  <nav>
    <button data-tab="tl" class="on">タイムライン</button>
    <button data-tab="quiz">ヨコ問題</button>
    <button data-tab="cur">共テ形式模倣問題</button>
    <button data-tab="wrong">間違い一覧</button>
  </nav>
</header>
<main>
  <section id="tab-tl"></section>
  <section id="tab-quiz" hidden></section>
  <section id="tab-cur" hidden></section>
  <section id="tab-wrong" hidden></section>
</main>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<script>
// 世界史 同時代（ヨコ）学習データ  v1
// 出典：スタサプ スタンダード世界史探究／ベーシック世界史探究／ベーシック歴史総合 の用語・年代に準拠
// 年：負=紀元前。ラベル末尾の「頃」は概数。

const REGIONS = [
  {id:'W', name:'西欧・地中海', short:'西欧'},
  {id:'E', name:'東欧・ロシア・ビザンツ', short:'東欧・露'},
  {id:'I', name:'西アジア・イスラーム・アフリカ', short:'西亜・イスラーム'},
  {id:'S', name:'インド・東南アジア', short:'印・東南亜'},
  {id:'C', name:'中国・北方民族', short:'中国'},
  {id:'J', name:'日本・朝鮮', short:'日本・朝鮮'},
  {id:'A', name:'南北アメリカ', short:'アメリカ'},
];

// [year, region, label, note]
const EVENTS = [
[-3000,'I','シュメール人の都市国家（ウル・ウルク）','楔形文字'],

[-2000,'W','クレタ文明（クノッソス宮殿）が栄える','前2000〜前1400頃'],
[-1900,'I','バビロン第1王朝（古バビロニア王国）成立',''],
[-1750,'I','ハンムラビ法典（ハンムラビ王が全メソポタミア統一）','前18C'],
[-1600,'C','殷（商）の成立','前16C頃。甲骨文字・青銅器'],
[-1600,'W','ミケーネ文明（前16〜前12C）',''],
[-1600,'I','ヒッタイトが鉄器・戦車で強大化（前17C〜）',''],
[-1500,'S','アーリヤ人がパンジャーブ地方に侵入、ヴェーダ時代へ',''],
[-1286,'I','カデシュの戦い（ラメス2世 vs ヒッタイト）',''],
[-1200,'W','ミケーネ文明の崩壊、「海の民」の活動','ヒッタイトも滅亡'],
[-1200,'I','フェニキア人（シドン・ティルス）の地中海交易・アルファベット','前12C〜'],
[-1200,'A','オルメカ文明（メソアメリカ最古の文明）','前1200〜前400頃'],
[-1100,'C','周の成立（都：鎬京）','前11C頃'],
[-1000,'I','ヘブライ王国の全盛（ダヴィデ王・ソロモン王）','前10C'],
[-1000,'S','アーリヤ人がガンジス川流域へ進出、ヴァルナ制の形成',''],
[-800,'W','ギリシアにポリスが成立（アテネ・スパルタ）','前8C。ホメロス'],
[-770,'C','周の東遷（洛邑）、春秋時代へ',''],
[-753,'W','ローマ建国（伝説）',''],
[-722,'I','アッシリアが北のイスラエル王国を滅ぼす',''],

[-612,'I','アッシリア滅亡、四王国分立（エジプト・リディア・新バビロニア・メディア）',''],
[-594,'W','ソロンの改革（アテネ）',''],
[-586,'I','バビロン捕囚（新バビロニアのネブカドネザル2世）','〜前538'],
[-551,'C','孔子誕生（前551頃）、諸子百家の時代へ','春秋末〜戦国'],
[-550,'I','アケメネス朝ペルシア成立（キュロス2世）',''],
[-525,'I','アケメネス朝がエジプト征服、オリエント再統一',''],
[-509,'W','ローマ、王を追放し共和政成立',''],
[-508,'W','クレイステネスの改革（アテネ民主政の基礎）',''],
[-500,'W','ペルシア戦争（前500〜前449）','マラトン前490・サラミス前480'],
[-500,'S','ガウタマ＝シッダールタが仏教、ヴァルダマーナがジャイナ教を開く','前6〜前5C'],
[-450,'W','十二表法（ローマ）',''],
[-431,'W','ペロポネソス戦争（〜前404）',''],
[-403,'C','戦国時代始まる（晋が韓・魏・趙に分裂）',''],
[-400,'J','弥生時代（水稲耕作・金属器）','前4C頃〜（諸説あり）'],
[-338,'W','カイロネイアの戦い（マケドニアのフィリッポス2世がギリシア制圧）',''],
[-334,'W','アレクサンドロス大王の東方遠征（〜前324）',''],
[-330,'I','アケメネス朝滅亡（アルベラの戦い前331後）',''],
[-317,'S','マウリヤ朝成立（チャンドラグプタ王）',''],
[-300,'W','ヘレニズム諸国（プトレマイオス朝・セレウコス朝・アンティゴノス朝）','前3C'],
[-268,'S','アショーカ王即位（前268頃）、仏教保護・ダルマ',''],
[-264,'W','ポエニ戦争始まる（〜前146）',''],
[-248,'I','パルティア（アルサケス朝）成立',''],
[-221,'C','秦の始皇帝が中国統一',''],
[-216,'W','カンネーの戦い（ハンニバル）',''],
[-209,'C','陳勝・呉広の乱／匈奴の冒頓単于即位',''],
[-202,'C','前漢成立（劉邦、都：長安）',''],
[-202,'W','ザマの戦い（大スキピオがハンニバルに勝利）',''],
[-146,'W','カルタゴ滅亡、マケドニア属州化（ローマの地中海制覇）',''],
[-141,'C','武帝即位（〜前87）、匈奴討伐・郡県制強化',''],
[-139,'C','張騫を大月氏へ派遣（西域への道）',''],
[-133,'W','グラックス兄弟の改革（〜前121）「内乱の1世紀」へ',''],
[-108,'J','前漢の武帝が楽浪郡など朝鮮4郡を設置',''],
[-73,'W','スパルタクスの反乱',''],
[-60,'W','第1回三頭政治（ポンペイウス・カエサル・クラッスス）',''],
[-44,'W','カエサル暗殺',''],
[-37,'J','高句麗の建国（伝承、前1C頃）',''],
[-31,'W','アクティウムの海戦、翌年プトレマイオス朝滅亡',''],
[-27,'W','アウグストゥスの元首政開始（ローマ帝政）',''],
[-4,'I','イエス誕生（前4頃）',''],
[8,'C','王莽が新を建国（〜23）',''],
[25,'C','後漢成立（光武帝、都：洛陽）',''],
[30,'I','イエス処刑（30頃）、キリスト教の成立',''],
[57,'J','倭の奴国王が後漢の光武帝から金印を授かる',''],
[60,'S','クシャーナ朝成立（1C）',''],
[96,'W','五賢帝時代（〜180）「ローマの平和」',''],
[97,'C','班超が甘英を大秦（ローマ）へ派遣',''],
[100,'S','サータヴァーハナ朝、季節風貿易（『エリュトゥラー海案内記』）','1〜2C'],
[105,'C','蔡倫が製紙法を改良',''],
[130,'S','カニシカ王（クシャーナ朝最盛期）、ガンダーラ美術','2C半ば'],

  '12':'十字軍の世紀。金が北宋を滅ぼし南宋（1127）。サラディンがイェルサレム奪回（1187）と第3回十字軍。日本は平氏政権→鎌倉幕府（1185）。カンボジアではアンコール＝ワット。',
  '13':'モンゴルの世紀：チンギス＝ハン（1206）→バトゥの西征（1241）→バグダード陥落（1258）→元（1271）→元寇（1274・81）→南宋滅亡（1279）。同じ1206年にデリー＝スルタン朝。マグナ＝カルタ（1215）、アッコン陥落（1291）、オスマン帝国成立（1299）。',
  '14':'「14世紀の危機」：黒死病（1348）・百年戦争（1339）・教会大分裂。元も紅巾の乱（1351）→明（1368）。日本は南北朝の動乱と室町幕府（1338）。ティムール朝（1370）、朝鮮建国（1392）。',
  '15':'鄭和の南海遠征（1405〜）とポルトガルの探検（1488喜望峰）は同じ世紀の「海の時代」。コンスタンティノープル陥落（1453）とレコンキスタ完了・コロンブス（1492）。応仁の乱（1467）、モスクワ大公国の独立（1480）。',
  '16':'1517年に宗教改革とオスマンのマムルーク朝征服。サファヴィー朝（1501）・ムガル帝国（1526）・オスマン最盛期が並ぶ「イスラーム三帝国」の時代。アステカ（1521）・インカ（1533）の征服とポトシ銀（1545）→銀が明と日本へ。鉄砲伝来（1543）、秀吉の朝鮮侵略（1592）。',
  '17':'「17世紀の危機」：三十年戦争（1618）・ピューリタン革命（1642）・明の滅亡（1644）・ロマノフ朝（1613）・江戸幕府（1603）。後半はルイ14世・康熙帝・アウラングゼーブ・ピョートル1世・徳川綱吉が同時代の君主。ネルチンスク条約（1689）で清露が国境画定。',
  '18':'産業革命（英）・啓蒙思想・アメリカ独立（1776）・フランス革命（1789）の「大西洋革命」。清は乾隆帝の最盛期（1735〜）、ムガルは衰退しプラッシー（1757）で英が優位。ポーランド分割（1772〜）。日本は享保・寛政の改革。',
  '19':'前半：ウィーン体制・ラテンアメリカ独立・アヘン戦争（1840）・天保の改革。1848年革命。1860年代に国家統合が集中：南北戦争・農奴解放・イタリア王国（1861）、明治維新（1868）、ドイツ帝国（1871）。後半は帝国主義：ベルリン会議（1884）・インド帝国（1877）・日清戦争（1894）。',
  '20':'日露戦争（1904〜05）がアジアの立憲運動を刺激：イラン立憲革命（1905）・青年トルコ革命（1908）・辛亥革命（1911）。二つの世界大戦とロシア革命（1917）、世界恐慌（1929）。戦後は冷戦とアジア・アフリカの独立（1947インド、1949中国、1960アフリカの年）、1989冷戦終結→1991ソ連解体。',

 zhou:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Knife_Money_Yan.jpg/960px-Knife_Money_Yan.jpg',cap:'戦国時代・燕の刀銭（明刀）（Wikimedia Commons／Davidhartill／CC BY-SA 3.0）',w:'刀'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Western_Zhou_Bronze_Ding_06.jpg/960px-Western_Zhou_Bronze_Ding_06.jpg',cap:'西周の青銅器・鼎（かなえ）（Wikimedia Commons／Gary Todd／CC0）',w:'青銅'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Warring_States_Bronze_Spade_Currency_10.jpg/960px-Warring_States_Bronze_Spade_Currency_10.jpg',cap:'戦国時代の青銅貨幣・布銭（ふせん）（Wikimedia Commons／Gary Lee Todd／CC0）',w:'布'}],kw:['春秋','戦国','周王朝','周の'],n:'周（春秋・戦国時代）',y:'前770〜前221年｜現在の中国・黄河流域',b:'前770年、西方の遊牧民の犬戎（けんじゅう）の侵入によって周王朝は都を鎬京（こうけい、現在の中国・西安）から洛邑（らくゆう、現在の中国・洛陽（現在の中国河南省））へ移す。この事件から諸侯（しょこう）が群雄割拠する春秋・戦国時代となり、政治的激動期ながら社会・経済にも大きな変化が生まれた。戦国時代初期までに鉄製農具・牛耕（ぎゅうこう）農法が普及し、農業生産が飛躍的に向上。青銅貨幣（刀・布・円・蟻鼻銭（ぎびせん））の使用、製鉄・製塩業、大都市の発展、諸子百家の出現。\n【スタサプ補足】周は前11世紀に西方の渭水（いすい）流域におこって殷（いん、現在の中国河南省）を滅ぼし、封土（ほうど）と軍役・貢納（こうのう）の義務で諸侯を支配する封建制度をとった。前770年以後を東周と呼ぶ。春秋時代は有力諸侯が覇者（はしゃ、斉（せい、現在の中国山東省）の桓公（かんこう）・晋（しん）の文公など春秋の五覇）となって「尊王攘夷（そんのうじょうい）」を名目に勢力拡大。前403年に晋が趙（ちょう）・魏（ぎ）・韓（かん）に分裂して戦国時代へ、戦国の七雄（燕（えん、現在の中国・北京付近）・斉・楚（そ、現在の中国長江中流域）・秦・韓・魏・趙）が争い、諸侯が王を自称。各国が富国強兵に努め、秦は法家の商鞅（しょうおう）を登用した変法（へんぽう）で急激に強大化。',
  yoko:['前6〜前5世紀、インド・中国ともに鉄器が普及し商工業・貨幣経済が著しく発展した（ヨコの鉄則）','中国・インドは鉄器普及による農業生産の向上、ギリシアは広範囲な貿易活動により社会が動いた','孔子（前551頃〜前479）とギリシアのソクラテス（前470頃〜前399）はほぼ同時代'],

 achaemenid:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Behistun_relief_Darius.jpg/960px-Behistun_relief_Darius.jpg',cap:'ダレイオス1世のベヒストゥン碑文レリーフ（イラン）（Wikimedia Commons／Patrick C (dynamosquito)／CC BY-SA 2.0）',w:'ダレイオス1世'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Cyrus_Cylinder_2.jpg/960px-Cyrus_Cylinder_2.jpg',cap:'キュロス2世の円筒印章文書「キュロス＝シリンダー」（大英博物館）（Wikimedia Commons／Mike Peel／CC BY-SA 4.0）',w:'キュロス'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/20101229_Gates_of_the_nations_Persepolis_Iran.jpg/960px-20101229_Gates_of_the_nations_Persepolis_Iran.jpg',cap:'ペルセポリスの「万国の門」（イラン）（Wikimedia Commons／Ggia／CC BY-SA 3.0）',w:'ペルセポリス'}],n:'アケメネス朝ペルシア',y:'前550〜前330年｜現在のイラン',b:'紀元前6世紀から前5世紀の地図では、多くの民族を服属させた「初の世界帝国」ともいわれるアケメネス朝ペルシア（現在のイラン）帝国の存在感が際立つ。全国を20の州に分け、中央から非世襲のサトラップ（知事）を派遣。各州に「王の目」「王の耳」（監察官）を派遣して監視し、「王の道」を整備。各民族の宗教・言語・法律・習慣には干渉せず寛大だった。ダレイオス1世が代表的な王。前5世紀前半、数度にわたってギリシアに侵攻するも撃退される（ペルシア戦争）。前330年、アレクサンドロスにより滅亡。\n【スタサプ補足】前6世紀半ば、インド＝ヨーロッパ語系ペルシア人のキュロス2世が建国。前538年ユダヤ人をバビロン捕囚から解放、前525年エジプトを征服してオリエントを再統一。第3代ダレイオス1世（位前522〜前486）の時代にエーゲ海沿岸からインダス川に至る大帝国に。アラム人・フェニキア人（現在のレバノン沿岸）・ギリシア人などの交易を保護し、金貨・銀貨を発行。公式行事のための新都ペルセポリス（現在のイラン南部）を建設。民族宗教はゾロアスター教（拝火教）で、善悪二元論や最後の審判の思想はのちの一神教に影響。',
  yoko:['秦の郡県制（ぐんけんせい）はアケメネス朝のサトラップ制と「またまた似ている」（『ヨコから見る』p.36 比較表）','ギリシアはポリス社会・民主政の完成期。強力な中央集権体制のペルシアと、タイプの違う二つの世界が地中海の支配をめぐって衝突（ペルシア戦争）','前7〜前6世紀にかけてイランではゾロアスター教、イスラエルではユダヤ教、インドでは仏教が成立'],
  src:'『同時に学べ』p.14／『ヨコから見る』p.25・36〜37／スタサプ 第2講',rel:['susa','persepolis','sardes','王の道','ペルシア戦争','greece','qin','alexander']},
 greece:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Parthenon_from_south.jpg/960px-Parthenon_from_south.jpg',cap:'アテネのパルテノン神殿（Wikimedia Commons／Thermos／CC BY-SA 2.5）',w:'アテネ'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Delphi_BW_2017-10-08_11-44-18.jpg/960px-Delphi_BW_2017-10-08_11-44-18.jpg',cap:'デルフォイの遺跡（ギリシア）。ポリスが共通に信仰した聖域（Wikimedia Commons／Berthold Werner／CC BY-SA 3.0）',w:'ポリス'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Plato-Musei_Capitolini.jpg/960px-Plato-Musei_Capitolini.jpg',cap:'プラトンの胸像（ローマ・カピトリーニ美術館）（Wikimedia Commons／Yair Haklai／CC BY-SA 3.0）',w:'プラトン'}],n:'ギリシア（ポリス）',y:'前8〜前4世紀｜現在のギリシア',b:'前8〜前6世紀頃、人口増加による土地不足や貴族間の政治抗争から海外への植民活動が活発化（ビザンティオン、ネアポリス、マッサリアなど）。前7世紀には小アジアのリディア（現在のトルコ西部）から鋳造貨幣が入り、商業・貿易が非常に発展した。前6〜前5世紀にはポリス社会が完成し、アテネなどで民主政が完成。経済的な豊かさの中でソクラテス・プラトン・アリストテレスの三大哲学者が生まれた。\n【スタサプ補足】前8世紀、集落が連合・集住（シノイキスモス）して都市国家ポリスが成立。中央に神殿のあるアクロポリスと政治の場アゴラを持ち、ポリス同士は対立して統一国家はつくらなかったが、共通の言語と神話、オリンピアの祭典などで同一民族の意識を持ち、自らをヘレネス、異民族をバルバロイと呼んだ。前7世紀頃、貨幣経済の浸透で富裕な平民が現れ、自費で武装する重装歩兵として軍の主力に→参政権を要求。アテネではドラコンの立法→ソロンの財産政治→ペイシストラトスの僭主政→クレイステネスの改革（前508、10部族制・500人評議会・陶片追放）で民主政の基礎ができ、ペリクレスのもとで完成。スパルタ（現在のギリシア南部）はドーリア人のポリスで軍国主義的体制。',
  yoko:['中国・インドは農業生産の向上により、ギリシアは広範囲な貿易活動により社会が動いた（ヨコの鉄則）','ペルシア戦争（前490マラトン・前480サラミスなど）に勝利→地中海の支配権がフェニキア人からギリシア人へ移り、アテネはデロス同盟の盟主として繁栄','ソクラテス（前470頃〜前399）と中国の孔子（前551頃〜前479）が同時代に活動'],
  src:'『ヨコから見る』p.16〜17・25〜27／『同時に学べ』p.14／スタサプ 第2講',rel:['athens','socrates','ペルシア戦争','achaemenid','greeks','sardes']},
 alexander:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Alexander_the_Great_mosaic.jpg/960px-Alexander_the_Great_mosaic.jpg',cap:'アレクサンドロス大王（ポンペイ出土「イッソスの戦い」モザイク）（Wikimedia Commons／パブリックドメイン）',w:'アレクサンドロス'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Alexander_Sarcophagus%2C_Istanbul_Archaeological_Museums_2020.jpg/960px-Alexander_Sarcophagus%2C_Istanbul_Archaeological_Museums_2020.jpg',cap:'「アレクサンドロス石棺」（イスタンブール考古学博物館）。ペルシア軍と戦うアレクサンドロス（Wikimedia Commons／Kingbjelica／CC BY-SA 4.0）',w:'ダレイオス'}],n:'アレクサンドロスの帝国',y:'前334〜前323年｜現在のギリシア〜パキスタン',b:'マケドニア（現在のギリシア北部）のフィリッポス2世がコリントス（ヘラス、現在のギリシア南部）同盟でギリシア世界をまとめ、ペルシアへの復讐戦を決意するが暗殺され、子のアレクサンドロスが20歳で即位。前334年に東方遠征を開始し、前333年イッソス（現在のトルコ南部）の戦い、前331年アルベラ（現在のイラク北部）の戦いでダレイオス3世を破り、前330年アケメネス朝（現在のイラン）を滅ぼす。帝国はギリシアからインドの北西にまで及んだ。コイネー（共通ギリシア語）の普及、ギリシア人の東方移住とペルシア人との通婚奨励、ペルシアの伝統尊重という東西融合政策を行い、ヘレニズム文化が生まれる。33歳で急死し、帝国は分裂。\n【スタサプ補足】ペルシア戦争後、アテネ（デロス同盟）とスパルタ（ペロポネソス同盟、現在のギリシア南部）のペロポネソス戦争（前431〜前404）などでポリス社会が衰退する中、北方のマケドニア王国がフィリッポス2世のもとで軍事力を強化。前338年カイロネイアの戦いでテーベ・アテネ連合軍を破り、スパルタを除く全ポリスでコリントス同盟を結成。アレクサンドロスはギリシア・西アジア・エジプト・インダス川（現在のパキスタン）流域に至る大帝国を築き、前323年急死。ディアドコイ（後継者）の争いでアンティゴノス朝マケドニア・セレウコス朝シリア（現在のシリア〜イラン一帯）・プトレマイオス朝エジプトに分裂。遠征からプトレマイオス朝滅亡（前30）までの約300年をヘレニズム時代という。',
  yoko:['インド：遠征に刺激され、チャンドラグプタがインド初の統一王朝マウリヤ朝を建てる（前317頃）','中国：春秋時代から戦国時代（前403〜前221）へ。それから始皇帝の秦に移行','ヘレニズム文化はインドのガンダーラ美術に影響、ストア派の哲学はローマ時代に流行'],
  src:'『同時に学べ』p.15／『ヨコから見る』p.24〜27／スタサプ 第2講',rel:['pella','alexandria','東方遠征','maurya','ptolemy','antioch','achaemenid']},
 maurya:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Lion_capital_of_Ashoka%2C_Sarnath.jpg/960px-Lion_capital_of_Ashoka%2C_Sarnath.jpg',cap:'アショーカ王のサールナート石柱頭（獅子柱頭）。現在のインドの国章（Wikimedia Commons／lisa bat／CC BY 2.0）',w:'アショーカ王'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Ashoka_pillar_at_Vaishali%2C_Bihar%2C_India.jpg/960px-Ashoka_pillar_at_Vaishali%2C_Bihar%2C_India.jpg',cap:'アショーカ王がヴァイシャーリー（インド・ビハール州）に建てた石柱（Wikimedia Commons／Bpilgrim／CC BY-SA 2.5）',w:'石柱'}],n:'マウリヤ朝',y:'前317頃〜前180年頃｜現在のインド',b:'アケメネス朝（現在のイラン）を滅ぼしたアレクサンドロス大王はその矛先をインドに替え、パンジャーブ地方（現在のパキスタン・インド北西部）を平定。これに対してインド側でも統一の機運が芽生え、チャンドラグプタがギリシア軍を追い、インド最初の統一王朝マウリヤ朝を建設した。のちにセレウコス朝（現在のシリア〜イラン一帯）と和を結び、使者メガステネスが『インド誌』を著す。第3代アショーカ王（位前268頃〜前232頃）の時代に最盛期。仏教に深く帰依し、各地に石柱碑・磨崖碑を建て、第3回仏典結集を行い、セイロン島（スリランカ、現在のスリランカ）に上座部仏教を布教した。王の死後まもなく崩壊。\n【スタサプ補足】前6世紀頃からガンジス川（現在のインド北部）流域に城塞都市を持つ王国が多数分立し、前5世紀にコーサラ国（現在のインド北部）を滅ぼしたマガダ国（現在のインド東部ビハール）が北インド最大の勢力に。マガダ国の武将だったチャンドラグプタが前317年頃、ガンジス川中流域のパータリプトラ（現在のインド東部パトナ）を首都に建国し、インダス川（現在のパキスタン）流域のギリシア勢力を排して西南インド・デカン高原（現在のインド中南部）にも進出。アショーカ王は征服活動（カリンガ国）での虐殺を悔いて仏教に帰依し、不殺生・慈悲などのダルマ（法）による統治を理念とし、詔勅を刻んだ磨崖碑・石柱碑を各地に建造。王の死後、仏教優遇へのバラモンの反発や財政難で急速に衰退。',
  yoko:['アレクサンドロスの遠征がマウリヤ朝成立のきっかけ（ヨコの鉄則）','ヘレニズム文化はインドのガンダーラ美術に影響','同じ前3世紀、中国では秦が統一（前221）、地中海ではポエニ戦争（前264〜）'],
  src:'『ヨコから見る』p.25・28／『同時に学べ』p.15／スタサプ 第3講',rel:['pataliputra','alexander','buddhism','qin','ガンジス川']},
 qin:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Portrait_of_Qin_Shi_Huang.jpg/960px-Portrait_of_Qin_Shi_Huang.jpg',cap:'秦の始皇帝（後世の想像画）（Wikimedia Commons／パブリックドメイン）',w:'始皇帝'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Qin_Terracotta_Army%2C_Pit_1_04.jpg/960px-Qin_Terracotta_Army%2C_Pit_1_04.jpg',cap:'始皇帝陵の兵馬俑（1号坑）（Wikimedia Commons／Gary Lee Todd／CC0）'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Qin_bronze_chariot_two.jpg/960px-Qin_bronze_chariot_two.jpg',cap:'始皇帝陵から出土した青銅の馬車（銅車馬）（Wikimedia Commons／Jmhullot／CC BY 3.0）',w:'始皇帝'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Badaling_China_Great-Wall-of-China-01.jpg/960px-Badaling_China_Great-Wall-of-China-01.jpg',cap:'万里の長城（八達嶺、現在の姿は明代の再建）（Wikimedia Commons／CEphoto, Uwe Aranas／CC BY-SA 3.0）',w:'長城'}],kw:['秦'],n:'秦',y:'前221〜前206年｜現在の中国',b:'春秋・戦国時代（前770〜前221）の混乱を収拾して初めて統一王朝を樹立したのが秦の始皇帝。法家の李斯（りし）を丞相（じょうしょう）として用い、さまざまな改革を行った。その代表が郡県制（ぐんけんせい、全国を36郡に分け、その下に県を置き、中央から非世襲の官僚を派遣する中央集権制）。首都は咸陽（かんよう、現在の中国・西安付近）、「馳道（ちどう）」を整備。法家に基づく厳しい支配、焚書（ふんしょ）・坑儒（こうじゅ）。改革を急ぎすぎたため、わずか15年で滅亡。\n【スタサプ補足】前221年、6国を征服した秦王の政が「皇帝」の称号を初めて用いる（始皇帝）。封建制を廃して郡県制を敷き、農業・医薬・占い以外の書物を焼く焚書、批判的な儒家を生き埋めにする坑儒を強行。度量衡（どりょうこう）・文字・貨幣・車軌（しゃき）を統一。対外的には騎馬遊牧民の匈奴（現在のモンゴル高原）を討ってオルドス地方を奪い、長城を修理・拡張（のちの万里の長城）、中国南部を征服して南海郡などを設置。始皇帝の没後、前209年に陳勝・呉広（ちんしょう・ごこう）の乱がおこり、前206年に劉邦（りゅうほう）が咸陽を占領して滅亡。',
  yoko:['秦の郡県制（ぐんけんせい）とアケメネス朝ペルシアのサトラップ制の比較は大学入試の定番（『ヨコから見る』p.36〜37 比較表）','地中海でポエニ戦争が始まった頃（前264）、中国は戦国時代→前221に秦が統一','マウリヤ朝もほぼ同時期（前3世紀）のインド初の統一王朝'],
  src:'『ヨコから見る』p.36〜37／『同時に学べ』p.15／スタサプ 第4講',rel:['xianyang','achaemenid','maurya','hanwu','xiongnu','confucius']},
 xiongnu:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Noin-Ula_carpet_%28museum_shot%29.jpg/960px-Noin-Ula_carpet_%28museum_shot%29.jpg',cap:'匈奴の墓（ノイン＝ウラ、モンゴル）から出土した毛織物（Wikimedia Commons／Gary Todd／CC0）',w:'匈奴'}],n:'匈奴',y:'前3〜前1世紀｜現在のモンゴル高原',b:'北方モンゴル高原の遊牧民。前漢の建国者・劉邦（りゅうほう）の時代、冒頓単于（ぼくとつぜんう、位前209〜前174）のもとで全盛期を迎え、白登山（はくとうざん、平城、現在の中国山西省・大同）の戦いで劉邦を破る。以後前漢は和親政策をとり、当初は事実上の属国のような存在だった。7代目の武帝が強烈な巻き返しを行い、前129年に衛青（えいせい）・霍去病（かくきょへい）が匈奴（現在のモンゴル高原）を討伐、匈奴をゴビ砂漠の北に追う。将軍李陵（りりょう）が匈奴に投降し、これを弁護した司馬遷（しばせん）が宮刑（きゅうけい）となった話も有名。\n【スタサプ補足】単于と呼ばれる君主のもとで遊牧国家を建設した騎馬遊牧民。前3世紀末に単于の位についた冒頓単于が月氏（げっし）など周辺諸民族を討ってモンゴル高原を統一。前200年、漢の高祖（こうそ、劉邦）を大敗させ、以後漢は和親政策をとった。秦の始皇帝も匈奴を討ってオルドス地方を奪い、侵入を防ぐため長城を修理・拡張している。武帝に攻撃されて後退し、前1世紀半ばに東西に分裂。騎馬遊牧の技術は前6世紀頃に黒海沿岸で最初の遊牧国家を建てたイラン系のスキタイ（現在の黒海北岸・ウクライナ）から周辺の遊牧民に伝わった。',
  yoko:['匈奴と前漢の抗争は「東西交易路（絹の道）の支配をめぐる抗争」（『ヨコから見る』まとめ）','西では同じ頃ローマがカルタゴと地中海の覇権を争う。東西で「二つの世界帝国」が並び立つ'],
  src:'『ヨコから見る』p.33・37〜38／『同時に学べ』p.16／スタサプ 第4講',rel:['hanwu','匈奴の圧迫','絹の道','大月氏','qin']},
 rome_bc1:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Head_of_Julius_Caesar_from_Tusculum_MAntTorino_2089_n01.jpg/960px-Head_of_Julius_Caesar_from_Tusculum_MAntTorino_2089_n01.jpg',cap:'カエサル像（トゥスクルム出土、トリノ古代博物館）（Wikimedia Commons／Marie-Lan Taÿ Pamart／パブリックドメイン）',w:'カエサル'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Roman_Forum_looking_East_panorama.jpg/960px-Roman_Forum_looking_East_panorama.jpg',cap:'ローマのフォルム＝ロマヌム跡（Wikimedia Commons／Nicholas Hartmann／CC BY-SA 4.0）',w:'元老院'}],kw:['ローマ'],n:'共和政ローマ',y:'前2〜前1世紀｜現在のイタリア〜地中海沿岸',b:'この時代のローマは、まだ皇帝が存在しない「共和政」の段階。イタリアはギリシアと違って耕作地が広く、農業が栄える条件は十分にあり、中小土地所有農民の重装歩兵が政治の軸となる地味な農業国家だった。分割統治によりイタリア半島全土を支配したのち、フェニキア人（現在のレバノン沿岸）の都市カルタゴ（現在のチュニジア）と3度にわたるポエニ戦争（前264〜前146）を戦い、北アフリカを中心に地中海に大きな勢力をほこるカルタゴを破って西地中海の制海権を得た。前146年にはコリントス、前133年ペルガモン（現在のトルコ西部）王国、前64年シリア、前30年エジプトも滅ぼし、地中海を「われらの海」と呼ぶようになる。\n【スタサプ補足】共和政では貴族（パトリキ）から任期1年・2名の執政官（コンスル）が選ばれ、公職経験者の貴族からなる元老院が実質的な指導権を持った。平民（プレブス）は中小農民で重装歩兵として国防を担い、護民官・平民会の設置、十二表法、リキニウス・セクスティウス法（前367）、ホルテンシウス法（前287）を経て貴族と法的に平等に。ポエニ戦争後、属州からの安価な穀物の流入と、奴隷を使うラティフンディア（大土地所有制）の広がりで中小農民が没落し、「内乱の1世紀」へ。グラックス兄弟の改革（前133〜）→マリウスとスラの対立→スパルタ（現在のギリシア南部）クスの反乱→第1回三頭政治（前60、カエサル・ポンペイウス・クラッスス）→カエサルの独裁と暗殺（前44）→第2回三頭政治→前31年アクティウムの海戦でオクタウィアヌスがアントニウス・クレオパトラを破り、地中海を統一。',
  yoko:['前202年 ザマの戦い（ハンニバル敗北）は、劉邦（りゅうほう）が前漢を建てたのと同年','前146年 カルタゴ滅亡の直後、前141年に前漢の武帝が即位','ローマとパルティアは敵対、パルティアは前漢と交易（ローマ⇄パルティア⇄前漢）'],
  src:'『同時に学べ』p.16／『ヨコから見る』p.32〜35／スタサプ 第2講',rel:['rome','carthage','ポエニ戦争','ptolemy','parthia','hanwu']},
 ptolemy:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/Bust_of_Cleopatra_VII_-_Altes_Museum_-_Berlin_-_Germany_2017.jpg/960px-Bust_of_Cleopatra_VII_-_Altes_Museum_-_Berlin_-_Germany_2017.jpg',cap:'クレオパトラ7世の胸像（ベルリン旧博物館）（Wikimedia Commons／José Luiz／パブリックドメイン）',w:'クレオパトラ'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Ptolemy_I_Soter_Louvre_Ma849.jpg/960px-Ptolemy_I_Soter_Louvre_Ma849.jpg',cap:'プトレマイオス1世の胸像（ルーヴル美術館）（Wikimedia Commons／Marie-Lan Nguyen／パブリックドメイン）',w:'プトレマイオス'}],n:'プトレマイオス朝エジプト',y:'〜前30年｜現在のエジプト',b:'アレクサンドロス大王の死後、帝国は前301年のイプソスの戦いののち3つのヘレニズム国家に分裂した。そのひとつプトレマイオス朝エジプトは、アレクサンドリア（現在のエジプト北部）を中心に東地中海の覇権を握り、最大の繁栄を誇った。学芸・文化の中心としてムセイオン（王立研究所）に専門の学者が集まり、自然科学が発展。のちクレオパトラが出て、前30年にローマにより滅亡。\n【スタサプ補足】アレクサンドロスが建設したアレクサンドリアはプトレマイオス朝の首都となり、ヘレニズム世界最大の都市に成長。前31年、女王クレオパトラと結んだアントニウスがアクティウムの海戦でオクタウィアヌスに敗れ、プトレマイオス朝は滅亡してローマの属州となった。これで地中海はローマにより統一され、ヘレニズム時代が終わる。',
  yoko:['他のヘレニズム国家：アンティゴノス朝マケドニア（経済の発展からとり残され最も後進国）、セレウコス朝シリア（ギリシア文化をアジアに伝える「ヨコの関係」で最重要）','ローマの地中海制圧の最終段階でエジプトが滅び、地中海世界が成立'],
  src:'『ヨコから見る』p.28・35／スタサプ 第2講',rel:['alexandria','alexander','rome_bc1','ナイル川']},
 parthia:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/2/2a/Parthian_mounted_archer.jpg',cap:'パルティアの騎馬弓兵（後ろ向きに矢を射る「パルティアン＝ショット」）（Wikimedia Commons／Jona Lendering／CC0）',w:'パルティア'}],n:'パルティア',y:'前3〜前1世紀｜現在のイラン・イラク',b:'セレウコス朝シリア（現在のシリア〜イラン一帯）から自立したイラン系の国家（ギリシア系のバクトリア（現在のアフガニスタン北部）とともに自立）。セレウコス朝は弱体化し、前64年にローマに滅ぼされる。パルティア（現在のイラン・イラク）はローマと敵対する一方、前漢と交易を行い、東西の二つの世界帝国を結ぶ位置にあった。\n【スタサプ補足】前3世紀中頃、カスピ海南東部で遊牧イラン人の族長アルサケスが建国。同じ頃アム川上流域のギリシア人が独立してバクトリアを建国（前145年、大月氏（だいげっし、現在のアフガニスタン北部〜ウズベキスタン）の攻撃で滅亡）。前2世紀中頃にメソポタミア（現在のイラク）を併合し、ティグリス川中流域に首都クテシフォン（現在のイラク・バグダード南東）を建設。「絹の道」の中継貿易で栄え、中国名は安息（あんそく）。アケメネス朝（現在のイラン）の統治制度を受け継ぎ、ヘレニズム文化も栄えた。224年、ササン朝ペルシアに倒される。',
  yoko:['「ローマ（共和政時代）⇄敵対⇄パルティア⇄交易⇄前漢」（『ヨコから見る』LESSON3 時代概観図）','張騫（ちょうけん）の派遣以後、西域経営が本格化して東西交渉が活発になる（前121年頃〜）','武帝はパルティアとの交易路であるシルクロードの東半分を支配（スタサプ）'],
  src:'『ヨコから見る』p.32〜33・35／スタサプ 第2・4講',rel:['rome_bc1','hanwu','絹の道','antioch','大月氏']},
 hanwu:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/e/e9/%E6%BC%A2%E6%AD%A6%E5%B8%9D.jpg',cap:'前漢の武帝（後世の想像画）（Wikimedia Commons／パブリックドメイン）',w:'武帝'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Zhang_Qian.jpg/960px-Zhang_Qian.jpg',cap:'張騫の出発を描いた敦煌莫高窟の壁画（唐代）（Wikimedia Commons／パブリックドメイン）',w:'張騫'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Han_Bronze_Mirror_-_1.jpg/960px-Han_Bronze_Mirror_-_1.jpg',cap:'漢代の青銅鏡（Wikimedia Commons／Gary Todd／CC0）',w:'漢'},{src:'https://upload.wikimedia.org/wikipedia/commons/2/2b/Mawangdui_silk_banner_from_tomb_no1.jpg',cap:'前漢初期の絹の帛画（はくが）（馬王堆漢墓出土、長沙）（Wikimedia Commons／パブリックドメイン）',w:'武帝'}],kw:['前漢','武帝'],n:'前漢（武帝）',y:'前202〜／武帝 位前141〜前87｜現在の中国',b:'前漢の建国者は農民出身の劉邦（りゅうほう、高祖）。前202年に成立（ザマの戦いと同年）。当初は匈奴（現在のモンゴル高原）に圧迫されて事実上の属国のような存在だったが、前154年の呉楚（現在の中国長江中流域）七国の乱（ごそしちこくのらん）を鎮圧して最盛期を迎え、7代目の武帝が対外遠征を行う。①前139年 張騫（ちょうけん）を大月氏（だいげっし、現在のアフガニスタン北部〜ウズベキスタン）国に派遣（挟み討ちは失敗するが西域（現在の中国新疆〜中央アジア）の情報が入る）②前129年 衛青（えいせい）・霍去病（かくきょへい）の匈奴討伐③前121年頃 西域に河西四郡（かせいしぐん、敦煌（とんこう、現在の中国甘粛省）・武威（ぶい）・張掖（ちょうえき）・酒泉（しゅせん））を設置→西域経営が本格化④前111年 南越（なんえつ、現在の中国広東省〜ベトナム北部）に遠征→9郡⑤前108年 朝鮮に遠征→楽浪（らくろう）など4郡を設置。前102年には李広利（りこうり）が大宛（だいえん、現在のウズベキスタン東部）から汗血馬（かんけつば）を持ち帰った。この時代の日本は「倭」と呼ばれ、前漢に使者を送る者がいたことが『漢書』に記される。\n【スタサプ補足】劉邦は楚の貴族出身の項羽（こうう）を倒し、前202年に高祖として即位、長安（現在の中国・西安）を都とする。直轄地には郡県制（ぐんけんせい）、東方諸国には皇族・功臣を王侯に封じる封建制を併用（郡国制（ぐんこくせい））。前200年に冒頓単于（ぼくとつぜんう）の匈奴に大敗して和親政策へ。前154年、景帝（けいてい）が呉楚七国の乱を鎮圧して中央集権化が進む。武帝は郷挙里選（きょうきょりせん）で官僚を登用、董仲舒（とうちゅうじょ）の意見で儒学を官学化（五経博士）、外征費用のため塩・鉄・酒の専売、五銖銭（ごしゅせん）の鋳造、均輸・平準法（きんゆ・へいじゅんほう）を実施。朝鮮では衛氏朝鮮（えいしちょうせん）を征服して楽浪郡（現在の北朝鮮・平壌付近）など4郡、南方では南越を征服して南海郡など9郡を置き、ベトナム北部まで支配。',
  yoko:['武帝の即位（前141）は、ローマがカルタゴを滅ぼした前146年の直後','中国では秦が中国を初めて統一→前漢で最盛期。西ではポエニ戦争の結果ローマが農業国家から商業国家へ','日本の「倭」が前漢に使者を送る（『漢書』）'],
  src:'『ヨコから見る』p.33・37〜39／『同時に学べ』p.16／スタサプ 第4講',rel:['changan','dunhuang','xiongnu','匈奴の圧迫','大月氏','大宛','絹の道','海の道','parthia','yayoi']},
 carthage:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Capuan_bust_of_Hannibal%2C_Republican_Rome.jpg/960px-Capuan_bust_of_Hannibal%2C_Republican_Rome.jpg',cap:'ハンニバルとされる胸像（カプア出土）（Wikimedia Commons／H. L. Havell (1913)／制限なし）',w:'ハンニバル'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Tophet_de_Carthage.jpg/960px-Tophet_de_Carthage.jpg',cap:'カルタゴのトフェト（聖域）跡（現在のチュニジア）（Wikimedia Commons／IssamBarhoumi／CC BY-SA 4.0）',w:'カルタゴ'},{src:'https://upload.wikimedia.org/wikipedia/commons/6/60/Joseph_Mallord_William_Turner_-_Snow_Storm%2C_Hannibal_and_his_Army_Crossing_the_Alps_-_WGA23167.jpg',cap:'アルプスを越えるハンニバル軍（ターナー画、1812年）（Wikimedia Commons／パブリックドメイン）',w:'アルプス'}],n:'カルタゴ',y:'〜前146年｜現在のチュニジア',b:'フェニキア人（ティルス、現在のレバノン沿岸）の植民都市で、"地中海の女王"と呼ばれ、空前の繁栄を誇っていた。農業国家から商業国家への変貌を図るローマは地中海の制海権をめぐってカルタゴ（現在のチュニジア）と衝突し、3度にわたるポエニ戦争（前264〜前146）となる。第2次ではハンニバルがアルプスを越えてイタリアに侵入し前216年カンナエ（現在のイタリア南部）の戦いでローマ軍を包囲殲滅するが、前202年ザマ（現在のチュニジア）の戦いでローマ軍に敗北。第3次で小スキピオがカルタゴを徹底的に滅ぼした（前146）。\n【スタサプ補足】フェニキア人はシドン（現在のレバノン）・ティルスの海港都市を拠点に地中海貿易を独占し、北アフリカのカルタゴなど多くの植民都市を建設した。前3世紀前半に全イタリア半島を支配したローマは、海上で地中海西方を支配していたカルタゴと衝突。第1回でシチリア島を獲得、第2回ではザマの戦い（前202）でスキピオが勝利してカルタゴが降伏、第3回でローマがカルタゴを滅ぼし西地中海の覇権を握った。',
  yoko:['前202年 ザマの戦いは劉邦（りゅうほう）が前漢を建てたのと同年','前146年 カルタゴ滅亡→前141年 武帝即位（『ヨコから見る』p.33）','フェニキア人はギリシア人のライバルとして地中海各地に植民市を建設し、アケメネス朝ペルシアがその商業活動を保護していた'],
  src:'『ヨコから見る』p.27・32〜35／スタサプ 第1・2講',rel:['ポエニ戦争','rome_bc1','phoenicia','tyre']},

 greeks:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Delphi_BW_2017-10-08_11-44-18.jpg/960px-Delphi_BW_2017-10-08_11-44-18.jpg',cap:'デルフォイの遺跡。ギリシア人共通の聖域（Wikimedia Commons／Berthold Werner／CC BY-SA 3.0）',w:'ギリシア世界'}],kw:['植民'],n:'ギリシア人',y:'前8〜前6世紀｜現在のギリシア〜地中海沿岸',b:'前8〜前6世紀頃、ギリシア世界では人口増加による土地不足や貴族間の政治抗争から海外への植民活動が活発化。東は黒海沿岸から西はフランス南部に至る広範囲にビザンティオン（現イスタンブル）・ネアポリス（現ナポリ）・マッサリア（現マルセイユ）などを建設。ギリシアは土地がやせていて経済基盤が弱かったため、商業活動によって貿易しやすい海港植民市が多くなった。\n【スタサプ補足】ミケーネ文明滅亡後の前13世紀頃から暗黒時代（初期鉄器時代）に入り、ギリシア人はエーゲ海の島々や小アジアにも移住（方言の違いでイオニア人・アイオリス人・ドーリア人）。前8世紀にポリスが成立し、前8世紀半ばから各ポリスが地中海と黒海の沿岸各地に植民市を建設して地中海全域で活発に交易した。',
  yoko:['同じ頃、中国では周が春秋時代に入り（前770〜）、インドではアーリヤ人がガンジス川流域に進出（前1000年頃）・鉄器使用（前800年頃）'],
  src:'『ヨコから見る』p.16〜17／『同時に学べ』p.13／スタサプ 第2講',rel:['greece','phoenicia','athens']},
 phoenicia:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Phoenician_alphabet_as_was_discovered_in_Byblos.png/960px-Phoenician_alphabet_as_was_discovered_in_Byblos.png',cap:'フェニキア文字（ビブロス出土碑文にもとづく）（Wikimedia Commons／パブリックドメイン）',w:'フェニキア文字'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/PhoenicianShrine_AlMinaCitySite_TyreLebanon_RomanDeckert23082019.jpg/960px-PhoenicianShrine_AlMinaCitySite_TyreLebanon_RomanDeckert23082019.jpg',cap:'フェニキアの港市ティルス（現在のレバノン・スール）の遺跡（Wikimedia Commons／RomanDeckert／CC BY-SA 4.0）',w:'ティルス'}],kw:['フェニキア'],n:'フェニキア人',y:'前10〜前5世紀｜現在のレバノン沿岸',b:'セム系で、シドン・ティルス（現在のレバノン南部）などの都市国家を中心に海に進出した（当時なんと中南米まで行った可能性もある）。彼らはフェニキア文字（アルファベット）をギリシアに伝えた。ギリシア人と同じく地中海沿岸に植民市を数多く建設し（カルタゴ（現在のチュニジア）など）、ギリシア人のライバルとして対立。その商業活動を保護していたのがアケメネス朝ペルシア（現在のイラン）。\n【スタサプ補足】前1200年頃から、シリア・パレスチナ地方（現在のイスラエル・パレスチナ）でセム語系の3民族（アラム人・フェニキア人（現在のレバノン沿岸）・ヘブライ人（現在のイスラエル・パレスチナ））が活動。アラム人はダマスクスを中心に内陸の中継貿易、フェニキア人は東地中海に面したシドン・ティルスを拠点に地中海貿易を独占し、北アフリカのカルタゴなど多くの植民都市を建設。カナーン人の表音文字からつくったフェニキア文字は、ギリシア文字を経てアルファベットとなり、ラテン文字などヨーロッパの文字の基礎となった。',
  yoko:['ペルシア戦争のペルシア海軍の主体はフェニキア人。サラミスの海戦（前480）で敗れ、地中海の支配権はフェニキア人からギリシア人に移った（ヨコの鉄則）'],
  src:'『ヨコから見る』p.21・26〜27／スタサプ 第1講',rel:['tyre','carthage','ペルシア戦争','greeks']},
 jomon:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Jomon_Flame_Style_Pottery%2C_3000_BC.jpg/960px-Jomon_Flame_Style_Pottery%2C_3000_BC.jpg',cap:'縄文時代の火焔型土器（Wikimedia Commons／Netherzone／CC BY-SA 4.0）'}],kw:['縄文'],n:'日本：縄文時代',y:'〜前8世紀｜現在の日本',b:'この時代の日本は縄文時代の最末期にあたり、紀元前8世紀ごろから九州北部で水田による米づくりが始まる。',
  yoko:['西ではアッシリアがオリエントを統一（前7世紀）、中国では周が春秋時代に入る（前770〜）'],src:'『同時に学べ』p.13',rel:['assyria','zhou','rice']},
 jomon_yayoi:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Yayoi_pottery_%28Yoshinogari_Site%29.JPG/960px-Yayoi_pottery_%28Yoshinogari_Site%29.JPG',cap:'弥生土器（吉野ヶ里遺跡出土）（Wikimedia Commons／Abasaa／パブリックドメイン）',w:'弥生'}],kw:['弥生','縄文'],n:'日本：縄文→弥生',y:'前5〜前4世紀｜現在の日本',b:'日本では紀元前5世紀から4世紀ごろに水田での米づくりが東日本にまで広がり、農耕を特徴とする弥生文化が始まる。\n【スタサプ補足】中国から稲作が伝わり、弥生時代に入って国の形成が始まる。',
  yoko:['同じ頃、ギリシアではソクラテス、中国では孔子など多くの哲学者・思想家が活動し、インドではガウタマ＝シッダールタが仏教を開いた'],src:'『同時に学べ』p.14／スタサプ 第4講',rel:['socrates','confucius','buddhism']},
 yayoi:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/YoshinogariIseki.jpg/960px-YoshinogariIseki.jpg',cap:'弥生時代の環濠集落・吉野ヶ里遺跡（佐賀県）の復元（Wikimedia Commons／パブリックドメイン）'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Yayoi_pottery_%28Yoshinogari_Site%29.JPG/960px-Yayoi_pottery_%28Yoshinogari_Site%29.JPG',cap:'弥生土器（吉野ヶ里遺跡出土）（Wikimedia Commons／Abasaa／パブリックドメイン）',w:'弥生時代'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Dotaku_%28bell-shaped_bronze%29_from_Tsuri-Kojinyama%2C_Hamamatsu-shi%2C_Shizuoka%2C_Yayoi_period%2C_1st-3rd_century_-_Tokyo_National_Museum_-_DSC05629.JPG/960px-Dotaku_%28bell-shaped_bronze%29_from_Tsuri-Kojinyama%2C_Hamamatsu-shi%2C_Shizuoka%2C_Yayoi_period%2C_1st-3rd_century_-_Tokyo_National_Museum_-_DSC05629.JPG',cap:'弥生時代の銅鐸（東京国立博物館）（Wikimedia Commons／Daderot／CC0）',w:'倭'}],kw:['弥生','倭'],n:'日本：弥生時代',y:'前3〜前1世紀｜現在の日本',b:'弥生時代の日本は「倭」と呼ばれており、前漢に使者を送る者がいたということが前漢の歴史書『漢書』に記されている。\n【スタサプ補足】武帝は前108年に衛氏朝鮮（えいしちょうせん）を滅ぼして楽浪（らくろう、現在の北朝鮮・平壌付近）郡など朝鮮4郡を設置し、以後中国が朝鮮半島を支配。朝鮮半島の諸国や倭国が中国に使者を派遣し、皇帝が首長に王の称号と印綬（いんじゅ）を与える冊封（さくほう）体制のもと、中国を中心とするアジアの文化圏が形成されていく（3世紀には邪馬台国（やまたいこく）の卑弥呼（ひみこ）が魏（ぎ）に朝貢）。',
  yoko:['武帝が前108年に朝鮮に遠征し楽浪（らくろう）郡などを設置→倭は前漢とつながる','西では共和政ローマがカルタゴを破り地中海の覇者（はしゃ）に'],src:'『同時に学べ』p.16／『ヨコから見る』p.37／スタサプ 第4講',rel:['hanwu','rome_bc1']},
 rome_early:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Roman_Forum_looking_East_panorama.jpg/960px-Roman_Forum_looking_East_panorama.jpg',cap:'ローマの中心フォルム＝ロマヌム（公共広場）跡（Wikimedia Commons／Nicholas Hartmann／CC BY-SA 4.0）',w:'ローマ'}],kw:['ローマ'],n:'ローマ（共和政）',y:'前6〜前3世紀｜現在のイタリア',b:'この頃のローマはまだ皇帝の存在しない共和政。イタリアはギリシアと違って耕作地が広く、中小土地所有農民の重装歩兵が政治の軸となる、地味な農業国家だった。ギリシア都市もローマの傘下に入り、分割統治によりイタリア半島全土を支配した（ローマの植民市は内陸が中心：ルテティア＝現パリ、ウィンドボナ＝現ウィーン、ロンディニウム＝現ロンドン）。\n【スタサプ補足】前10世紀頃イタリア半島に移住したラテン人がティベル河畔に都市国家ローマを建設。前6世紀末に先住民エトルリア人の王を追放して共和政に。貴族から選ばれる2名の執政官（コンスル）と元老院が政治を握り、平民は護民官・平民会（前5世紀初め）、十二表法（前5世紀半ば）、リキニウス・セクスティウス法（前367、コンスルの1名は平民から）、ホルテンシウス法（前287、平民会の決議が国法に）と身分闘争を進めた。前3世紀前半に全イタリア半島を支配し、征服した都市を植民市・自治市・同盟市に分けて待遇に差をつける分割統治で反乱を防いだ。',
  yoko:['ギリシアの植民市は海岸が中心、ローマの植民市は内陸が中心（『ヨコから見る』p.17 比較）','ポエニ戦争が始まった頃（前264）、中国は戦国時代、インドはマウリヤ朝'],
  src:'『ヨコから見る』p.17・32〜34／『同時に学べ』p.14〜15／スタサプ 第2講',rel:['rome','rome_bc1','carthage','ポエニ戦争']},
 buddhism:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Stupa_1%2C_Sanchi_02.jpg/960px-Stupa_1%2C_Sanchi_02.jpg',cap:'サーンチーの大ストゥーパ（仏塔）。アショーカ王が創建（Wikimedia Commons／Bernard Gagnon／CC BY-SA 3.0）'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Mahabodhi_Temple_South_Wall_%282%29.jpg/960px-Mahabodhi_Temple_South_Wall_%282%29.jpg',cap:'ブッダガヤの大菩提寺（マハーボディ寺院）。ガウタマ＝シッダールタが悟りを開いた地（Wikimedia Commons／Sumitsurai／CC BY-SA 4.0）',w:'ガウタマ'}],kw:['仏教','ガウタマ','シッダールタ'],n:'仏教の創始',y:'前6〜前5世紀｜現在のインド北部（ガンジス川流域）',b:'アーリヤ人がガンジス川（現在のインド北部）流域に進出し（前1000年頃）、鉄器の使用（前800年頃）により農業生産は飛躍的に向上、商工業も発展した。マガダ国やコーサラ国（現在のインド北部）が統一をうかがう中、商業の発展の波に乗ってクシャトリヤ（武士）やヴァイシャ（農民・牧畜民・商人）が力をつけ、バラモン（司祭）を頂点とするバラモン教に不満を抱く。この背景で、古い身分制を否定する新宗教として仏教（ガウタマ＝シッダールタ、前563頃〜前483頃）とジャイナ教（ヴァルダマーナ）が生まれた。仏教は民族・人種を超えた普遍性ゆえに東南アジア・中国・朝鮮・日本へ拡大。ジャイナ教は商人の中に信者が多い。\n【スタサプ補足】バラモン教はアーリヤ人の自然崇拝からおこり『ヴェーダ』を聖典とする多神教で、バラモンを最上位とするヴァルナ制が社会基盤。前6世紀頃からガンジス川中・下流域に城塞を持つ都市国家が多数生まれ、クシャトリヤとヴァイシャが台頭。祭式至上主義を批判する改革運動からウパニシャッド哲学（輪廻・業・梵我一如・解脱）が生まれ、前5世紀頃に仏教（四諦・八正道、ガンジス川中流から布教、出家者は教団サンガ）とジャイナ教（苦行と不殺生、商人層に信者）が成立。',
  yoko:['前6〜前5世紀、インド・中国ともに鉄器が普及し、商工業・貨幣経済が著しく発展した','前7〜前6世紀にかけてイランではゾロアスター教、イスラエルではユダヤ教、インドでは仏教が成立（ヨコの鉄則）','三大哲学者・仏教・諸子百家が同時に現れた共通の背景は、商工業の発展と平民層の台頭'],
  src:'『ヨコから見る』p.16〜19／『同時に学べ』p.14／スタサプ 第3講',rel:['ガンジス川','maurya','socrates','confucius']},
 '大月氏':{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Zhang_Qian.jpg/960px-Zhang_Qian.jpg',cap:'大月氏へ向かう張騫の出発を描いた敦煌莫高窟の壁画（唐代）（Wikimedia Commons／パブリックドメイン）',w:'張騫'}],n:'大月氏',y:'前2世紀｜現在のアフガニスタン北部〜ウズベキスタン',b:'民族不明。イラン系の大夏（たいか、トハラ、現在のアフガニスタン北部）を追ってこの地に移住し、東西交易路を支配して繁栄した。前139年、武帝は匈奴（現在のモンゴル高原）を挟み討ちにするため張騫（ちょうけん）を大月氏（だいげっし、現在のアフガニスタン北部〜ウズベキスタン）国に派遣。同盟の画策は失敗するが、西域（現在の中国新疆〜中央アジア）の情報が入ることになった。\n【スタサプ補足】月氏はイラン系とされる騎馬遊牧民で、もとはモンゴル高原の西半を支配。冒頓単于（ぼくとつぜんう）の匈奴に攻撃されて西走し、アム川流域で大月氏となった。前145年にはギリシア系のバクトリア（現在のアフガニスタン北部）を滅ぼしたとされる。張騫がもたらした西域の情報は、武帝の西方進出の足掛かりとなった。',
  yoko:['張騫（ちょうけん）の派遣→西域経営の本格化→東西交渉が活発化（絹の道）'],src:'『ヨコから見る』p.37・39／スタサプ 第2・4講',rel:['hanwu','絹の道','大宛','xiongnu','parthia']},
 '大宛':{n:'大宛（フェルガナ）',y:'前2世紀｜現在のウズベキスタン東部',b:'中央アジアのシル川上流にあった国。伝説の名馬「汗血馬（かんけつば、血の汗を流す馬）」を産した（この馬は単に寄生虫がついて血を流していただけともいわれる）。前104年の遠征には失敗したが、前102年に李広利（りこうり）が大宛（だいえん、現在のウズベキスタン東部）から汗血馬を持ち帰った。',
  yoko:['武帝の対外遠征のひとつ。匈奴・西域・南越（なんえつ）・朝鮮への遠征と並ぶ'],src:'『ヨコから見る』p.37・39',rel:['hanwu','大月氏']},

 rome:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Head_of_Julius_Caesar_from_Tusculum_MAntTorino_2089_n01.jpg/960px-Head_of_Julius_Caesar_from_Tusculum_MAntTorino_2089_n01.jpg',cap:'カエサル像（トゥスクルム出土）（Wikimedia Commons／Marie-Lan Taÿ Pamart／パブリックドメイン）'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Rome_Colosseum_exterior_2.jpg/960px-Rome_Colosseum_exterior_2.jpg',cap:'ローマのコロッセウム（円形闘技場、1世紀末完成）（Wikimedia Commons／Nicholas Hartmann／CC BY-SA 4.0）',w:'イタリア半島'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Roman_Forum_looking_East_panorama.jpg/960px-Roman_Forum_looking_East_panorama.jpg',cap:'ローマのフォルム＝ロマヌム（公共広場）跡（Wikimedia Commons／Nicholas Hartmann／CC BY-SA 4.0）',w:'共和政'}],kw:['ローマ'],n:'ローマ',y:'共和政｜現在のイタリア・ローマ',b:'イタリア半島の都市国家。地味な農業国家から出発し、分割統治で半島全土を支配、ポエニ戦争で地中海の覇者（はしゃ）に。まだ皇帝はいない共和政の時代。\n【スタサプ補足】前10世紀頃、インド＝ヨーロッパ語系のラテン人がティベル河畔に建設した都市国家。前6世紀末にエトルリア人の王を追放して共和政となった。',src:'『ヨコから見る』p.32〜34／『同時に学べ』p.16／スタサプ 第2講',rel:['rome_bc1','rome_early','ポエニ戦争']},
 athens:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Parthenon_from_south.jpg/960px-Parthenon_from_south.jpg',cap:'アテネのアクロポリスに建つパルテノン神殿（Wikimedia Commons／Thermos／CC BY-SA 2.5）'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/ACMA_1331_Alexander_1.JPG/960px-ACMA_1331_Alexander_1.JPG',cap:'アレクサンドロス大王の頭部像（アテネ・アクロポリス博物館）（Wikimedia Commons／CC BY-SA 2.5）',w:'アレクサンドロス'}],n:'アテネ',y:'前5世紀に全盛｜現在のギリシア・アテネ',b:'ポリス社会の中心。前6〜前5世紀に民主政が完成。ペルシア戦争ではマラトンの戦い（前490）で重装歩兵が、サラミスの海戦（前480）で海軍がペルシアを破り、戦後はデロス同盟（前478年頃結成、参加都市200）の盟主として繁栄。ソクラテス（"無知の知"）、その弟子プラトン（イデア論・哲人政治、教育機関アカデメイア）、その弟子アリストテレス（あらゆる分野に功績、アレクサンドロスの家庭教師）を生む。\n【スタサプ補足】イオニア人のポリスで、発達した奴隷制度のもと銀の採掘や交易で発展。前5世紀半ば頃、ペリクレスの指導で民主政が完成し、18歳以上の男性市民の民会が最高決定機関、公職はほとんど抽選、裁判は民衆裁判所（女性・奴隷・在留外国人には参政権なし）。パルテノン神殿、三大悲劇詩人、歴史家ヘロドトス・トゥキディデスなど文化の中心。ペルシア戦争後はスパルタ（現在のギリシア南部）とのペロポネソス戦争（前431〜前404）に敗北。',
  yoko:['プラトンの哲人政治は、ほぼ同じ時代に生きた孟子（もうし）の王道政治とも似ている（『ヨコから見る』p.17）'],src:'『ヨコから見る』p.17・26〜27／スタサプ 第2講',rel:['greece','socrates','ペルシア戦争','greeks']},
 c_carthage:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Quartier_Punique.JPG/960px-Quartier_Punique.JPG',cap:'カルタゴ遺跡のポエニ人居住区（チュニジア）（Wikimedia Commons／BishkekRocks／パブリックドメイン）'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Tophet_de_Carthage.jpg/960px-Tophet_de_Carthage.jpg',cap:'カルタゴのトフェト（聖域）跡（Wikimedia Commons／IssamBarhoumi／CC BY-SA 4.0）',w:'植民市'}],kw:['カルタゴ'],n:'カルタゴ（都市）',y:'〜前146年｜現在のチュニジア・チュニス近郊',b:'フェニキア人（現在のレバノン沿岸）ティルス（現在のレバノン南部）の植民市。"地中海の女王"。ポエニ戦争で前146年にローマに滅ぼされる。',src:'『ヨコから見る』p.29・35',rel:['carthage','ポエニ戦争','phoenicia']},
 alexandria:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/Bust_of_Cleopatra_VII_-_Altes_Museum_-_Berlin_-_Germany_2017.jpg/960px-Bust_of_Cleopatra_VII_-_Altes_Museum_-_Berlin_-_Germany_2017.jpg',cap:'クレオパトラ7世の胸像（ベルリン旧博物館）（Wikimedia Commons／José Luiz／パブリックドメイン）'}],n:'アレクサンドリア',y:'ヘレニズム時代｜現在のエジプト北部',b:'プトレマイオス朝エジプトの中心。エジプトのムセイオン（王立研究所）にはあらゆる専門の学者が集まり、自然科学が急激な発展を遂げた（アリスタルコス…太陽中心説、アルキメデス…円周率の計算・てこの原理、エウクレイデス…平面幾何学、エラトステネス…地球の子午線を測定）。前133年に小アジアで商業・文化の中心として栄えたペルガモン王国には、アレクサンドリア（現在のエジプト北部）に匹敵する図書館があった。\n【スタサプ補足】アレクサンドロスが建設し、プトレマイオス朝の首都としてヘレニズム世界最大の都市に成長。各地にギリシア風の都市が建設されてギリシア語（コイネー）が共通語となり、オリエントとギリシアの諸科学が集まって自然科学が発達。思想面ではポリスの枠にとらわれない世界市民主義（コスモポリタニズム）と個人主義が生まれ、エピクロス派（精神的快楽）とストア派（ゼノン、禁欲）が代表。ヘレニズム美術（ラオコーンなど）はローマやインド・中国・日本にまで影響。',
  yoko:['ヘレニズム文化の特徴は世界市民主義（コスモポリタニズム）と個人主義。ストア派はのちのローマ帝国で歓迎される'],src:'『ヨコから見る』p.28・35／スタサプ 第2講',rel:['ptolemy','alexander','ナイル川']},

 sardes:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/f/f7/Electrum_trite%2C_Alyattes%2C_Lydia%2C_620-563_BC.jpg',cap:'リディアのエレクトロン貨（前7〜前6世紀）。世界最古級の鋳造貨幣（Wikimedia Commons／CNG coins／CC BY-SA 3.0）',w:'リディア'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Temple_of_Artemis_Sardis_Turkey.jpg/960px-Temple_of_Artemis_Sardis_Turkey.jpg',cap:'サルデス（現在のトルコ）のアルテミス神殿跡（Wikimedia Commons／simonjenkins\' photos／CC BY-SA 2.0）',w:'リディア'}],n:'サルデス',y:'前7世紀〜｜現在のトルコ西部',b:'ギリシアが鋳造貨幣を学んだのは小アジアのリディア（『ヨコから見る』）。アケメネス朝（現在のイラン）の「王の道」はスサ（現在のイラン南西部）からここまで。\n【スタサプ補足】アッシリア（現在のイラク北部）滅亡（前612）後の四国分立時代、アナトリア（小アジア）でインド＝ヨーロッパ語系リディア人が建てたリディア王国の首都。世界で初めて金と銀の合金による金属貨幣を鋳造した。',src:'『ヨコから見る』p.17・21・37／スタサプ 第1講',rel:['王の道','susa','greece','achaemenid']},
 antioch:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Antakya_Archaeological_Museum_Yakto_mosaic_All_2008_6588.jpg/960px-Antakya_Archaeological_Museum_Yakto_mosaic_All_2008_6588.jpg',cap:'アンティオキア（現在のトルコ・アンタキヤ）出土のモザイク（ハタイ考古学博物館）（Wikimedia Commons／Dosseman／CC BY-SA 4.0）',w:'セレウコス朝'}],n:'アンティオキア',y:'ヘレニズム時代｜現在のトルコ南部アンタキヤ',b:'セレウコス朝シリア（現在のシリア〜イラン一帯）の都。セレウコス朝はギリシア文化をアジアに伝えるという「ヨコの関係」では最も重要だが、イラン系のパルティア（現在のイラン・イラク）、ギリシア系のバクトリア（現在のアフガニスタン北部）が自立して弱体化し、前64年ローマにより滅亡。',src:'『ヨコから見る』p.35',rel:['parthia','alexander','ptolemy']},

 luoyi:{n:'洛邑',y:'前770年〜｜現在の中国・洛陽',b:'前770年、西方の遊牧民の犬戎（けんじゅう）の侵入によって周王朝が鎬京（こうけい、現在の中国・西安）から都を移した先。これ以後が春秋・戦国時代。【スタサプ】現在の洛陽（らくよう、現在の中国河南省）市。周は建国当初、東方統治のために新たに洛邑（らくゆう、現在の中国・洛陽）を建設していた。遷都以後の周を東周と呼ぶ。',src:'『ヨコから見る』p.14／スタサプ 第1・4講',rel:['zhou','haojing','黄河']},
 haojing:{n:'鎬京',y:'〜前770年｜現在の中国・西安',b:'周の最初の都。前770年に犬戎（けんじゅう）の侵入で放棄され、都は洛邑（らくゆう）へ。【スタサプ】現在の西安市。渭水（いすい）流域におこった周が殷（いん、現在の中国河南省）を滅ぼしてここを都とした。',src:'『ヨコから見る』p.14／スタサプ 第1講',rel:['zhou','luoyi']},
 dunhuang:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Zhang_Qian.jpg/960px-Zhang_Qian.jpg',cap:'敦煌莫高窟の壁画に描かれた張騫の出発（唐代）（Wikimedia Commons／パブリックドメイン）'},{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Mingsha_Sand_Dunes_%2840098545980%29.jpg/960px-Mingsha_Sand_Dunes_%2840098545980%29.jpg',cap:'敦煌の鳴沙山（めいさざん）。砂漠のオアシス都市の景観（Wikimedia Commons／David Stanley／CC BY 2.0）',w:'敦煌'}],n:'敦煌',y:'前121年頃〜｜現在の中国甘粛省',b:'武帝が前121年頃、西域（現在の中国新疆〜中央アジア）に設置した河西四郡（かせいしぐん、敦煌（とんこう、現在の中国甘粛省）・武威（ぶい）・張掖（ちょうえき）・酒泉（しゅせん））のうち最も西に位置する郡。東から武威→張掖→酒泉→敦煌の順。ここから西域経営が本格化し、東西交渉が活発化した。【スタサプ】匈奴（現在のモンゴル高原）の侵入に備えて河西地方に敦煌郡など4郡を設置し、パルティア（現在のイラン・イラク）との交易路シルクロードの東半分を支配。',src:'『ヨコから見る』p.37・39／スタサプ 第4講',rel:['hanwu','絹の道','大月氏']},

 pella:{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/ACMA_1331_Alexander_1.JPG/960px-ACMA_1331_Alexander_1.JPG',cap:'ペラ生まれのアレクサンドロス大王の頭部像（アクロポリス博物館）（Wikimedia Commons／CC BY-SA 2.5）',w:'アレクサンドロス'}],n:'ペラ',y:'前4世紀｜現在のギリシア北部',b:'マケドニア（現在のギリシア北部）の都。フィリッポス2世・アレクサンドロス大王の出身地マケドニアは、ポリスではなく王制だった。ここから前334年、東方遠征が始まる。【スタサプ】マケドニアはギリシア人の一派で北方の王国。前338年カイロネイアの戦いでテーベ・アテネ連合軍を破り、コリントス（現在のギリシア南部）同盟でギリシアを支配下に置いた。',src:'『ヨコから見る』p.27／スタサプ 第2講',rel:['alexander','東方遠征']},

 '海の道':{img:[{src:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/02023_Roman_glass_bowl_decorated_with_ribs_found_in_Kosin.jpg/960px-02023_Roman_glass_bowl_decorated_with_ribs_found_in_Kosin.jpg',cap:'ローマのガラス器（1世紀）。海の道の交易品の一つ（Wikimedia Commons／CC BY 2.5）',w:'ローマ'}],n:'海の道（マリン＝ロード）',y:'現在の南シナ海〜インド洋〜紅海',b:'東西交易路の3つのルートのひとつ。ローマ帝国、サータヴァーハナ朝（現在のインド中南部）、後漢などを結んだ。義浄（『南海寄帰内法伝』）などが使用。',src:'『ヨコから見る』p.39',rel:['絹の道','rome_bc1','hanwu']},
