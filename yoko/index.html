 gupta:{img:[{src:'img/p50.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Kumhrar_-_Patna_%289%29.jpg/960px-Kumhrar_-_Patna_%289%29.jpg',cap:'パータリプトラの宮殿跡（クムラール遺跡、現在のパトナ）（Wikimedia Commons／Sumitsurai／CC BY-SA 4.0）',w:'パータリプトラ'},{src:'img/p102.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Bodhisattva_Padmapani%2C_cave_1%2C_Ajanta%2C_India.jpg/960px-Bodhisattva_Padmapani%2C_cave_1%2C_Ajanta%2C_India.jpg',cap:'アジャンター石窟寺院の壁画「蓮華手菩薩」（グプタ様式）（Wikimedia Commons／パブリックドメイン）',w:'アジャンター'},{src:'img/p103.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Udayagiri_Caves%2C_cave_5%2C_Vishnu_as_Varaha_Avatar_%289839977024%29.jpg/960px-Udayagiri_Caves%2C_cave_5%2C_Vishnu_as_Varaha_Avatar_%289839977024%29.jpg',cap:'グプタ朝期のヒンドゥー教彫刻。猪の姿のヴィシュヌ神（ウダヤギリ石窟、5世紀初め）（Wikimedia Commons／Arian Zwegers／CC BY 2.0）',w:'ヒンドゥー教'},{src:'img/p113.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Ellora_Caves%2C_India%2C_Kailasa_Temple.jpg/960px-Ellora_Caves%2C_India%2C_Kailasa_Temple.jpg',cap:'エローラ石窟寺院（カイラーサナータ寺院は8世紀の造営）（Wikimedia Commons／Vyacheslav Argenberg／CC BY 4.0）',w:'エローラ'},{src:'img/p127.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Buddha_in_Sarnath_Museum_%28Dhammajak_Mutra%29.jpg/960px-Buddha_in_Sarnath_Museum_%28Dhammajak_Mutra%29.jpg',cap:'サールナート出土の初転法輪仏坐像（475年ごろ）。グプタ様式の代表作（Wikimedia Commons／CC BY-SA 3.0）',w:'グプタ様式'},{src:'img/p128.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gupta_Empire%2C_Samudragupta%2C_335-380_AD%2C_Gold_Dinar%2C_7.9g%2C_Javelin_Type.jpg/960px-Gupta_Empire%2C_Samudragupta%2C_335-380_AD%2C_Gold_Dinar%2C_7.9g%2C_Javelin_Type.jpg',cap:'グプタ朝サムドラグプタ（チャンドラグプタ2世の父）の金貨（Wikimedia Commons／Mitresh66／CC BY-SA 4.0）',w:'北インド'},{src:'img/p129.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Temple_12_-_Nalanda_Mahavihara_%2817%29.jpg/960px-Temple_12_-_Nalanda_Mahavihara_%2817%29.jpg',cap:'ナーランダー僧院跡（インド・ビハール州）（Wikimedia Commons／Sumitsurai／CC BY-SA 4.0）',w:'ナーランダー僧院'}],kw:['グプタ朝','チャンドラグプタ1世','チャンドラグプタ2世','ヒンドゥー教','法顕','グプタ様式','アジャンター'],n:'グプタ朝',y:'320頃〜550頃｜現在のインド北部',b:'4世紀前半、インド北部でグプタ朝がおこり、北インドを統合する大国に発展。最盛期の王チャンドラグプタ2世は南インドにも影響力を及ぼすほどグプタ朝を強大な存在にした。文化に理解を示したことから宮廷を中心に文学や美術が発展。このころインドの民衆の間にヒンドゥー教が定着したが、仏教もまだまだ信仰されていた。中国の東晋王朝の法顕（ほっけん）という僧がこの時代のインドを訪れ、多くの経典を中国に持ち帰っている。\n【『ヨコから見る』】グプタ朝はクシャーナ朝に代わった王朝。クシャーナ朝の国際性を嫌い、さらにひとつ前のマウリヤ朝を理想とした。マウリヤ朝の都はパータリプトラでチャンドラグプタが建国、グプタ朝の都もパータリプトラでチャンドラグプタ1世が建国——似ているのは偶然ではない。復古主義（"インドの原点に帰る"）をスローガンにした王朝だから、宗教もバラモン教を中心にインドのさまざまな民間信仰が融合した純インド的なヒンドゥー教が成立（シヴァ神・ヴィシュヌ神・ブラフマー神などの多神教で今もインドで最も信仰されている）。美術も純インド的なグプタ様式が発達（アジャンターとエローラの石窟寺院）。国王の業績：チャンドラグプタ1世（グプタ朝を創始）、チャンドラグプタ2世（超日王。全盛期を築く。東晋の法顕（『仏国記』）がインド訪問。カーリダーサの戯曲『シャクンタラー』のモデル）。5世紀にはナーランダー僧院が建設され仏教の最高学府として世界中から僧が集まったが、あまりに哲学的で難解になりすぎたため次第に民衆の信仰を失う。二大叙事詩『マハーバーラタ』『ラーマーヤナ』もこの頃成立。古典文化の黄金期を迎えたグプタ朝も、5世紀の民族移動期の中で衰退・滅亡していく。\n【スタサプ補足】4世紀前半、ガンジス川中流域でチャンドラグプタ1世が建国、都はパータリプトラ。4世紀後半チャンドラグプタ2世が北インドの大部分を統一し最盛期（分権的な統治体制）。5世紀後半に地方勢力の台頭や中央アジアの遊牧民エフタルの進出により衰退、6世紀半ば滅亡。ヒンドゥー教はバラモン教に民間信仰や慣習が融合して成立、ヴァルナごとの義務や生活規範を体系化した『マヌ法典』。サンスクリット語が公用語化。インド数字・十進法・ゼロの概念。アジャンター石窟寺院はグプタ様式の代表作で中国・朝鮮・日本にも影響。',
  yoko:['グプタ朝（インド）・ササン朝ペルシア（イラン）では復古主義的な宗教が主流になる→インドではヒンドゥー教が成立、イランではゾロアスター教が国教（ヨコの鉄則、『ヨコから見る』p.53）','東晋の法顕（337頃〜422頃）は60歳を過ぎてインドへ出発。行きは陸路、帰りは海路でセイロン島に立ち寄った（『ヨコから見る』p.56）','マウリヤ朝（前4〜前2世紀）の「復興」をめざしたグプタ朝⇔アケメネス朝の再現を願ったササン朝（『ヨコから見る』p.49）'],
  src:'『同時に学べ』p.44／『ヨコから見る』p.52〜53／スタサプ 第3講',rel:['india_3c','pataliputra','sassanid','maurya','buddhism_mahayana','jin']},
 '三国時代':{img:[{src:'img/p104.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Cao_Cao_Portrait_ROTK.jpg/960px-Cao_Cao_Portrait_ROTK.jpg',cap:'曹操（清代の『三国志演義』挿絵）（Wikimedia Commons／パブリックドメイン）',w:'曹操'},{src:'img/p105.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Zhuge_Liang.jpg/960px-Zhuge_Liang.jpg',cap:'諸葛亮（諸葛孔明）の想像画（Wikimedia Commons／パブリックドメイン）',w:'諸葛孔明'},{src:'img/p130.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Chibi.jpg/960px-Chibi.jpg',cap:'赤壁（現在の中国湖北省）。208年の赤壁の戦いの伝承地（Wikimedia Commons／CC BY-SA 3.0）',w:'赤壁'}],kw:['三国時代','曹操','曹丕','劉備','孫権','諸葛亮','赤壁'],n:'三国時代（魏・蜀・呉）',y:'220〜280｜現在の中国',b:'後漢王朝は後期になると幼い皇帝が続き、実権をめぐって外戚（がいせき、皇帝の妻の親戚）や宦官（かんがん）らの争いがたびたび起こった。その影響で大規模な土木工事などの事業が進まず、治水や灌漑（かんがい）も滞り飢饉（ききん）が頻発。この中で184年に宗教結社が中心となった黄巾（こうきん）の乱という大規模な反乱が起き、混乱が深まったまま3世紀に突入した。中国はここから目まぐるしく王朝が交代する「魏晋南北朝時代」と呼ばれる時代となる。\n黄巾の乱に始まる群雄割拠の中からいくつもの軍事集団が登場し、その抗争から華北の曹操（そうそう）の勢力が成長。220年、曹操の子の曹丕（そうひ）が後漢の皇帝から皇帝の位を奪って魏王朝をたてると、中国東南部に建国された孫権（そんけん）を中心とする呉や、西南部の四川盆地に建国された劉備（りゅうび）を中心とする蜀（諸葛孔明（しょかつこうめい、諸葛亮）はこの蜀の家臣）など、軍事集団の中から相次いで王朝がつくられ、魏・呉・蜀の「三国時代」となる。三国時代の最終勝者はこの3つの国のどれでもなく、魏の家臣であった司馬炎（しばえん）。265年に魏を乗っ取って晋王朝をたて中国を再び統一する。\n【『ヨコから見る』】魏（220〜265）華北、都：洛陽、曹丕が建国、三国の中で最も強力。蜀（221〜263）四川、都：成都、劉備が建国、諸葛亮の活躍。呉（222〜280）江南、都：建業、孫権が建国、江南の開発開始。ヨコの流れで考えると三国の中では呉が最も重要：豪族に率いられた農民が江南地方へ移住し華北の農業技術が導入され開発が進んだ。この経済力を背景に呉は北ベトナムに進出し東南アジアの諸国と交易、カンボジアの扶南（ふなん）に使節を派遣（ヨコの鉄則：呉は東南アジアの諸国家と通商を行う）。魏は高句麗（こうくり）を討ち朝鮮半島まで勢力を拡大、蜀も雲南地方を征服するなど三国とも国力の充実に努めた。魏の重要な制度が九品中正（きゅうひんちゅうせい）：前漢（武帝時代）の郷挙里選（きょうきょりせん）に代わる官吏任用制度で、プロの中正官が地方の人物を9ランクに選別。しかし中正官はその地方出身の名門豪族だったため家柄によってランクが決まり（「上品に寒門なく、下品に勢族なし」）、豪族は（門閥）貴族という特権階級へ進化した。\n【スタサプ補足】208年 赤壁の戦いで孫権・劉備連合軍が曹操軍を破る。263年 魏が蜀を滅ぼす。魏の統治政策：屯田制（集団で国有地を耕作）、九品中正（九品官人法）。',
  yoko:['220年 後漢滅亡・魏の成立⇔235年 ローマ軍人皇帝時代の始まり（共通：東西ともに武人の時代）（『ヨコから見る』p.58）','邪馬台国の卑弥呼（239年に魏へ遣使）と蜀の諸葛孔明（234年没）は同時代人。2人は同じ『三国志』によって世に知られ、孔明は魏を倒すために戦い、卑弥呼は魏と友好関係を結んだ（『同時に学べ』p.36〜38）','ササン朝の成立（224）と魏の成立（220）——東西の大国交代が同時（『ヨコから見る』p.55）','呉の東南アジア交易（扶南へ使節）は、ローマ商人後退後の「海の道」の東側の担い手'],
  src:'『同時に学べ』p.45／『ヨコから見る』p.53〜54／スタサプ 第5講',rel:['wei','shu','wu','jin','later_han','yamatai','卑弥呼の遣使','funan']},
 wei:{img:[{src:'img/p106.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Cao_Pi_Tang.jpg/960px-Cao_Pi_Tang.jpg',cap:'魏の文帝・曹丕（唐・閻立本筆と伝わる『歴代帝王図巻』）（Wikimedia Commons／パブリックドメイン）',w:'曹丕'}],kw:['魏','九品中正'],n:'魏',y:'220〜265｜現在の中国・華北',b:'220年、曹操の子の曹丕（そうひ）が後漢の皇帝から帝位を奪って建国。華北（現在の中国北部）を支配し、都は洛陽（らくよう、現在の中国河南省）。三国の中で最も強力だったが、蜀・呉が連合したため中国統一はならなかった。高句麗（こうくり）を討ち朝鮮半島まで勢力を拡大。邪馬台国の卑弥呼は239年に魏の皇帝に使いを送り「親魏倭王」の称号と金印、多数の銅鏡を贈られた。クシャーナ朝の王も「親魏大月氏王」の称号を与えられ、魏から見ると卑弥呼と「同格」の扱い。263年に蜀を滅ぼすが、265年に家臣の司馬炎（しばえん）に帝位を奪われ晋（西晋）となる。\n【『ヨコから見る』】魏の九品中正（きゅうひんちゅうせい）：前漢の郷挙里選（地方長官が地方の有徳者を推薦、アマチュア、1ランク）に代わり、中正官（プロ）が地方の人材を九品等（9ランク）に分けて推薦。中正官が名門豪族だったため家柄でランクが決まり、門閥貴族という特権階級を形成（「上品に寒門なく、下品に勢族なし」）。\n【スタサプ補足】屯田制（集団で国有地を耕作させる）を実施。地方の豪族が中央政界に進出し要職を世襲的に独占する門閥貴族となる。',
  yoko:['魏の冊封：東の卑弥呼（親魏倭王）と西のクシャーナ朝（親魏大月氏王）を同格に扱う（『同時に学べ』p.44・47）'],
  src:'『同時に学べ』p.45〜47／『ヨコから見る』p.53〜54／スタサプ 第5講',rel:['三国時代','luoyang','卑弥呼の遣使','kushan_34','jin']},
 shu:{img:[{src:'img/p105.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Zhuge_Liang.jpg/960px-Zhuge_Liang.jpg',cap:'諸葛亮（諸葛孔明）の想像画（Wikimedia Commons／パブリックドメイン）',w:'諸葛亮'},{src:'img/p131.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Liu_Bei_Tang.jpg/960px-Liu_Bei_Tang.jpg',cap:'蜀の劉備（唐・閻立本筆と伝わる『歴代帝王図巻』）（Wikimedia Commons／パブリックドメイン）',w:'劉備'}],kw:['蜀','成都'],n:'蜀',y:'221〜263｜現在の中国・四川省',b:'西南部の四川盆地（現在の中国四川省）に劉備（りゅうび）が建国（221）。都は成都（せいと）。漢の正当性を訴え、中国を代表する名臣・諸葛亮（しょかつりょう、諸葛孔明）を従えた。雲南地方を征服するなど国力の充実に努めたが、諸葛亮を失った蜀は263年に魏に滅ぼされた。\n【『同時に学べ』】弱小勢力だった主君の劉備玄徳に仕えて軍師になり、大軍を手足のように動かして敵を破り、主君を三国の一角にまで押し上げる『三国志演義』の諸葛孔明のストーリーは読む者の胸を熱くさせる。諸葛孔明は『三国志』の中の「蜀志」に「蜀」の重臣として登場する。',
  yoko:['諸葛孔明（234年没）と邪馬台国の卑弥呼は同時代人（『同時に学べ』p.37）'],
  src:'『同時に学べ』p.36〜37・45／『ヨコから見る』p.53〜54',rel:['三国時代','chengdu','wei','yamatai']},
 wu:{img:[{src:'img/p132.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Sun_Quan_Tang.jpg/960px-Sun_Quan_Tang.jpg',cap:'呉の孫権（唐・閻立本筆と伝わる『歴代帝王図巻』）（Wikimedia Commons／パブリックドメイン）',w:'孫権'}],kw:['呉','建業','孫権'],n:'呉',y:'222〜280｜現在の中国・江南（長江下流）',b:'中国東南部・江南（現在の中国・長江下流域）に孫権（そんけん）が建国（222）。都は建業（けんぎょう、現在の南京）。豊かな資源を背景に成立。280年、晋に滅ぼされ三国時代が終わる。\n【『ヨコから見る』】ヨコの流れで考えると三国の中では呉が最も重要。呉の時代には豪族に率いられた農民が江南地方へ移住し、それと同時に華北の農業技術がこの地に導入され開発が進む（江南の開発開始）。この経済力を背景に呉は北ベトナムに進出し、東南アジアの諸国と交易を行った。呉はカンボジアの扶南（ふなん）に使節を派遣し盛んに交易。また後漢末の混乱に乗じて2世紀末にチャム人がチャンパー（中国名は林邑（りんゆう）、2〜7世紀）を建てており、この国はインド文化を受容し中継貿易で非常に繁栄した。3〜4世紀にローマ・後漢の分裂・滅亡で国際商業の規模は縮小したが、決して消滅したわけではない（ヨコの鉄則：呉は東南アジアの諸国家と通商を行う）。',
  yoko:['呉→扶南・チャンパーとの交易：ローマ商人が後退した後も「海の道」の東側は生きていた（『ヨコから見る』p.53〜54）','華北から江南への人口移動→のちの東晋・南朝の基盤に'],
  src:'『ヨコから見る』p.53〜54',rel:['三国時代','jianye','funan','champa','jin']},
 jin:{img:[{src:'img/p107.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Sima_Yan_%28Emperor_Wu_of_Jin%29.png/960px-Sima_Yan_%28Emperor_Wu_of_Jin%29.png',cap:'晋の武帝・司馬炎（後世の想像画）（Wikimedia Commons／パブリックドメイン）',w:'司馬炎'},{src:'img/p108.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/LantingXu.jpg/960px-LantingXu.jpg',cap:'王羲之「蘭亭序」（唐代の模本）（Wikimedia Commons／パブリックドメイン）',w:'王羲之'},{src:'img/p109.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Tao_Yuanming_portrait1.jpg/960px-Tao_Yuanming_portrait1.jpg',cap:'陶淵明の肖像（木版画）（Wikimedia Commons／パブリックドメイン）',w:'陶淵明'},{src:'img/p134.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Seven_Sages_of_the_Bamboo_Grove_1.Nanjing_Museum.jpg/960px-Seven_Sages_of_the_Bamboo_Grove_1.Nanjing_Museum.jpg',cap:'「竹林の七賢」の磚画（せんが）（南京博物院）。東晋〜南朝の貴族文化（Wikimedia Commons／Gary Lee Todd／CC BY-SA 4.0）',w:'エリート層'}],kw:['晋','西晋','東晋','司馬炎','八王の乱','淝水の戦い'],n:'晋（西晋→東晋）',y:'265〜316（西晋）／317〜420（東晋）｜現在の中国',b:'三国時代の最終勝者は3つの国のどれでもなく、魏の家臣であった司馬炎（しばえん）。265年に魏を乗っ取って晋王朝をたて中国を再び統一（280年に呉を滅ぼす）。しかしこの晋王朝は不安定で、皇族たちの主導権争い（八王の乱）が繰り広げられ、すぐに弱体化して滅亡する（316）。晋の皇帝の一族は南に逃れ、317年に新しい王朝をたてた。これが「東晋」（都は建康（けんこう）、建業を改称、現在の南京）。もともと亡命政権のため権力基盤は弱かったが、中国南部の高い生産力に支えられて次第に安定し、五胡十六国時代の北部の諸国と対抗する力をつけた。東晋では北部から亡命してきた貴族が南部の豪族と結びつき政治・社会のエリート層を形成、幅広い教養が好まれ文化が育まれた。「田園詩人」陶淵明（とうえんめい）、「書聖」王羲之（おうぎし）、「画聖」顧愷之（こがいし）など歴史に残る芸術家が多く誕生したのもこの時代。383年、淝水（ひすい）の戦いで華北を統一した前秦（ぜんしん）の苻堅（ふけん）の南下を東晋が撃退し、中国の南北分裂が決定的に。東晋の僧・法顕（ほっけん）は399年にインドへ向かい、グプタ朝のインドから多くの経典を持ち帰った（『仏国記』）。\n【スタサプ補足】265年 司馬炎（武帝）が晋を建国、都は洛陽。280年 呉を滅ぼし統一、占田・課田法。3世紀末 八王の乱（華北西部や河西地方に移住していた遊牧民が兵力として活躍）。316年 五胡に攻略され西晋滅亡。317年 司馬睿（しばえい）が建康で即位し東晋建国。420年 東晋滅亡。\n【『ヨコから見る』p.64〜65 補足】八王の乱（290〜306）は皇族8人の権力争いで、諸王が匈奴などの五胡を兵力として招き入れたことが、永嘉の乱（311〜316）による西晋滅亡につながった。383年の淝水（ひすい）の戦いでは、華北を統一した前秦（ぜんしん）の苻堅（ふけん）が号して90万ともいわれる大軍で南下したが、東晋の7〜8万の軍に大敗し、前秦は崩壊して華北は再び分裂、中国の南北分裂が決定的になった。苻堅の部将呂光（りょこう）は西域遠征で鳩摩羅什（くまらじゅう）を中国へ連れ帰った。',
  yoko:['313年 ミラノ勅令・325年 ニケーア公会議（キリスト教によるローマの精神的統一）⇔317年 東晋の建国（中国の統一崩れる）（『ヨコから見る』p.58）','383年 淝水の戦い（中国の南北分裂決定）⇔395年 テオドシウス帝死亡（ローマの東西分裂決定）（共通）（『ヨコから見る』p.58）','法顕がインド（グプタ朝）へ：東晋とグプタ朝を結ぶ僧の往来'],
  src:'『同時に学べ』p.45〜46／『ヨコから見る』p.54・58／スタサプ 第5講',rel:['三国時代','五胡','gupta','jianye','wei']},
 '五胡':{img:[{src:'img/p137.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Pottery_Tomb_Guard_Warrior_%28Tomb_Figurine%29%2C_Northern_Wei.jpg/960px-Pottery_Tomb_Guard_Warrior_%28Tomb_Figurine%29%2C_Northern_Wei.jpg',cap:'北魏の武人俑（大同博物館）（Wikimedia Commons／BY Chu／CC BY-SA 2.0）',w:'五胡十六国'}],kw:['五胡','五胡十六国','羯','氐','羌','遊牧系民族の南下'],n:'遊牧系民族の南下と五胡十六国',y:'304〜439｜現在の中国北部（華北）',b:'中国が混乱・分裂の時代を迎えたころ、中国の北方に存在する遊牧系の民族が盛んに中国北部に南下するようになった。こうした民族の一部はすでに後漢や魏の時代から中国に入り、傭兵などとして活用されていたが、晋の混乱の時期に、気候の寒冷化も要因となり、大挙して中国に進出する。この時代に中国内に進出した代表的存在が、いわゆる「五胡」といわれる遊牧系の民族。「匈奴（きょうど）」「鮮卑（せんぴ）」「羯（けつ）」「羌（きょう）」「氐（てい）」といわれる民族が次々と万里の長城の内部に国を建国し、「五胡十六国時代」が訪れる（「五胡」や「十六国」は「いくつもの」というような表現で、5とか16とかは正確な数ではない）。また「進出」といっても、後漢や三国の時代には漢民族とともに生活したり協力関係にあったりした人々も多かった。\n【スタサプ補足】3世紀になると中央アジアの東西で遊牧民の活動が活発になり、五胡（匈奴・羯・鮮卑・氐・羌）が華北に進出。316年 西晋が滅亡し五胡が華北で政権を樹立し興亡を繰り広げる（五胡十六国時代 304〜439）。386年 五胡の一つ鮮卑の拓跋氏（たくばつし）が北魏を建国。439年 北魏の太武帝が華北を統一。\n【『ヨコから見る』p.64〜65 補足】五胡のうち羯（けつ）は匈奴系、氐（てい）・羌（きょう）はチベット系。西晋では八王（はちおう）の乱（290〜306）で皇族たちが五胡を兵力として招き入れ、その五胡が永嘉（えいか）の乱（311〜316）を起こして西晋を滅ぼした。「帝国側が招き入れた民族が、帝国が弱ると自立する」という点で、ローマ帝国のゲルマン人傭兵とよく似た構図。華北では仏図澄（ぶっとちょう）・鳩摩羅什（くまらじゅう）ら西域出身の僧が五胡の王に仕えて仏教を広め、逆に東晋の法顕（ほっけん）はインドへ向かった（399〜）。',
  yoko:['4世紀のゲルマン人の大移動（375〜）と五胡の南下（304〜）は「ユーラシア規模の民族移動」。ともに寒冷化と草原の民の南下が背景（『同時に学べ』p.38・46）','4世紀の中国は「五胡十六国時代」のような混乱期→相対的に日本が朝鮮半島南部に及ぼす影響力が強まり、高句麗と交戦（『同時に学べ』p.48）'],
  src:'『同時に学べ』p.46／スタサプ 第5講',rel:['xianbei_34','s_xiongnu','jin','crisis3','ゲルマン人の大移動']},
 xianbei_34:{img:[{src:'img/p136.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Yungang_Grottoes_03.jpg/960px-Yungang_Grottoes_03.jpg',cap:'鮮卑の北魏がつくった雲崗（うんこう）石窟の大仏（5世紀、山西省大同）（Wikimedia Commons／Steve Cadman／CC BY-SA 2.0）',w:'北魏'}],kw:['鮮卑','拓跋氏','北魏'],n:'鮮卑',y:'3〜4世紀に南下｜現在のモンゴル高原東部→中国北部',b:'モンゴル高原東部の遊牧民。2世紀に北匈奴が西へ去った後のモンゴル高原を支配し、3世紀には気候の寒冷化を背景に南下（「3世紀の危機」の中国版）。五胡のひとつとして華北に進出し、4世紀末（386）に鮮卑の拓跋氏（たくばつし）が北魏を建国、439年に華北を統一して五胡十六国時代を終わらせる。\n【スタサプ補足】モンゴル高原には匈奴→鮮卑→柔然→突厥→ウイグルの順に遊牧民が台頭。',
  yoko:['寒冷化→鮮卑の南下（中国）⇔ゲルマン人の南下・西進（ヨーロッパ）（『同時に学べ』p.38）'],
  src:'『同時に学べ』p.34〜35・38・46／スタサプ 第4・5講',rel:['五胡','xianbei','n_xiongnu']},
 s_xiongnu:{kw:['南匈奴'],n:'匈奴（南匈奴）',y:'3〜4世紀｜現在の中国・オルドス〜山西',b:'1世紀半ばに東匈奴が南北に分裂し、南匈奴は後漢に服属して長城の内側（現在の中国・山西省〜オルドス）に住むようになった。後漢や魏の時代には傭兵などとして活用され、晋の混乱の時期（八王の乱）に大挙して進出。304年、匈奴の劉淵（りゅうえん）が漢（前趙）を建てて五胡十六国時代が始まり、316年に西晋を滅ぼした。『同時に学べ』p.34〜35の地図では鮮卑の南、魏の北に「匈奴」として示される。\n【スタサプ補足】五胡＝匈奴・羯・鮮卑・氐・羌。',
  yoko:['北匈奴は西へ→フン人としてゲルマン人の大移動を引きおこし、南匈奴は中国内へ→五胡十六国の口火。匈奴の分裂が東西の民族移動の両方につながる'],
  src:'『同時に学べ』p.34〜35・46／スタサプ 第4・5講',rel:['五胡','n_xiongnu','xiongnu','フン人の西進']},
 chengdu:{img:[{src:'img/p133.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Zhuge_Liang_-_Wuhou_Shrine_-_Chengdu%2C_China_-_DSC05454.jpg/960px-Zhuge_Liang_-_Wuhou_Shrine_-_Chengdu%2C_China_-_DSC05454.jpg',cap:'成都の武侯祠（ぶこうし）に祀られる諸葛亮像（Wikimedia Commons／Daderot／CC0）',w:'諸葛亮'}],kw:['成都'],n:'成都',y:'蜀の都（221〜263）｜現在の中国・四川省成都',b:'四川盆地（現在の中国四川省）に劉備が建国した蜀の都。諸葛亮（諸葛孔明）が丞相として活躍した。',
  src:'『ヨコから見る』p.53／スタサプ 第5講',rel:['shu','三国時代']},
 jianye:{img:[{src:'img/p135.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Gfp-china-nanjing-city-wall.jpg/960px-Gfp-china-nanjing-city-wall.jpg',cap:'南京の城壁（現在の城壁は明代のもの）（Wikimedia Commons／Yinan Chen／パブリックドメイン）',w:'南京'}],kw:['建業','建康','南京'],n:'建業（→建康）',y:'呉の都（222〜280）→東晋の都・建康（317〜）｜現在の中国・南京',b:'孫権が建国した呉の都（現在の中国・南京）。江南の開発が始まり、東南アジア諸国との交易の拠点となった。317年、西晋の一族の司馬睿（しばえい）がここで即位し建康（けんこう）と改称して東晋の都に。以後、宋・斉・梁・陳の南朝の都として6世紀末まで続く。',
  yoko:['華北から江南へ：五胡の南下に押されて漢民族が南へ移住し、建康は「南の中国」の中心に'],
  src:'『ヨコから見る』p.53／スタサプ 第5講',rel:['wu','jin','三国時代']},
 yamatai:{img:[{src:'img/p92.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/a/af/King_of_Na_gold_seal.jpg',cap:'「漢委奴國王」の金印（福岡市博物館）。卑弥呼が魏から贈られた金印は未発見（Wikimedia Commons／パブリックドメイン）',w:'金印'},{src:'img/p110.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Hashihaka_kohun_aerial.jpg/960px-Hashihaka_kohun_aerial.jpg',cap:'箸墓古墳（奈良県桜井市）。纏向遺跡にある最古級の前方後円墳（Wikimedia Commons／国土交通省／CC BY 4.0相当（出典表示））',w:'纏向'},{src:'img/p111.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/NintokuTomb_Aerial_photograph_2007.jpg/960px-NintokuTomb_Aerial_photograph_2007.jpg',cap:'大仙陵古墳（仁徳天皇陵古墳、大阪府堺市）。日本最大の前方後円墳（5世紀）（Wikimedia Commons／国土地理院／出典表示）',w:'前方後円墳'},{src:'img/p112.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/20230605_Stela_for_Gwanggaeto.jpg/960px-20230605_Stela_for_Gwanggaeto.jpg',cap:'広開土王碑（好太王碑、中国吉林省集安）（Wikimedia Commons／Yumeto／CC BY-SA 4.0）',w:'広開土王碑'},{src:'img/p138.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Makimuku_Ruins_%28Tsuji_area%29-2.jpg/960px-Makimuku_Ruins_%28Tsuji_area%29-2.jpg',cap:'纏向遺跡（奈良県桜井市）。邪馬台国の候補地のひとつ（Wikimedia Commons／Saigen Jiro／CC0）',w:'纏向'}],kw:['邪馬台国','卑弥呼','倭国大乱','魏志倭人伝','親魏倭王','纏向','ヤマト政権','前方後円墳','空白の4世紀'],n:'日本：邪馬台国の時代と「空白の4世紀」',y:'3世紀 弥生時代後期／4世紀 古墳時代｜現在の日本',b:'3世紀の日本の様子を今に伝える書物が『三国志』の一部「魏志」倭人伝（正確には「魏志」の中の「烏丸鮮卑東夷伝（うがんせんぴとういでん）」の「倭人の条」）。それによると、倭では2世紀末ごろから「倭国大乱」といわれる戦乱が続きなかなかおさまらなかった。そこで諸国が共同で邪馬台国（やまたいこく）の卑弥呼（ひみこ）を女王として立てたところ、ようやく争乱がおさまった。卑弥呼は巫女として神の意志を聞くことに長け、30余りの国の連合の女王として「鬼道」すなわち呪術を背景とする政治を行った。卑弥呼は239年に魏の皇帝に使いを送り「親魏倭王」の称号と金印、多数の銅鏡を贈られた。これらのことから、卑弥呼が中国の皇帝に対して従属的な関係である「冊封（さくほう）関係」であったことがわかる。卑弥呼はこの関係を利用して倭の中での自らの権威を高めたと考えられる。「魏志」倭人伝には社会に身分の差や刑罰、税などの制度があり各地で市が開かれていたことなど多くの情報が盛り込まれ、邪馬台国への行程も書かれているが、そのとおりにたどると九州の南の海上になるため「邪馬台国はどこにあったのか？」という謎が生まれた。主要な説は近畿地方の大和説と九州北部説の2つ。奈良県の纏向（まきむく）遺跡や佐賀県の吉野ヶ里遺跡の発掘によって解明に進展が期待されている。\n4世紀の日本については文献資料が少なく「空白の4世紀」といわれる。近年では4世紀の古墳から多くの発見が相次いでいる。この時代は大和地方を中心に規模の大きな前方後円墳が増え、地方にも同じような前方後円墳が見られるようになったことなどから、「ヤマト政権」という連合体が成立し東西にその影響力が拡大したとみられる。4世紀の中国は「五胡十六国時代」のような混乱期であり、相対的に日本が朝鮮半島南部に及ぼす影響力が強まり、朝鮮半島へ出兵することもあったようだ。現在の中国東北地方に存在する石碑（広開土王碑）には、日本が朝鮮半島北部の国家である高句麗と交戦したことが記されている。\n【スタサプ補足】3世紀頃、小国に分立していた国々が邪馬台国を中心に連合。239年 卑弥呼が魏へ朝貢し「親魏倭王」の称号と金印を得る。4世紀頃 ヤマト政権による統一が進む。朝鮮半島では4世紀初めに高句麗が楽浪郡を滅ぼし、4世紀半ばに馬韓の地に百済、辰韓の地に新羅が建国され三国時代に（南端は加羅（伽耶）諸国）。戦乱を避けて日本へ移り住む渡来人が先進的な文化や技術を伝えた。',
  yoko:['卑弥呼と諸葛孔明は同時代に活躍（卑弥呼のほうが年上だが没年は孔明が早い）。ともに2世紀末から3世紀の「乱世」が背景で、同じ『三国志』（「魏志」と「蜀志」）で世に知られる（『同時に学べ』p.36〜38）','180年代の倭国大乱⇔180年 ローマ五賢帝時代の終わり、184年 黄巾の乱、190年代 パルティアの反乱——2世紀末の同時多発的な弱体化（『同時に学べ』p.36）','クシャーナ朝の王の「親魏大月氏王」と卑弥呼の「親魏倭王」は魏から見て同格（『同時に学べ』p.44）','4世紀：中国は五胡十六国の混乱期→日本の朝鮮半島への影響力が相対的に強まり高句麗と交戦（『同時に学べ』p.48）'],
  src:'『同時に学べ』p.36〜38・47〜48／スタサプ 第4講',rel:['卑弥呼の遣使','三国時代','wei','goguryeo','yayoi_mid','nakoku']},
 '卑弥呼の遣使':{kw:['卑弥呼','親魏倭王','239'],n:'卑弥呼の遣使（239年）',y:'239年｜邪馬台国→魏の都・洛陽',b:'卑弥呼は239年に魏の皇帝に使いを送り、「親魏倭王」という称号と金印、そして多数の銅鏡を贈られた。これらのことから、卑弥呼が中国の皇帝に対して従属的な関係である「冊封関係」であったことがわかる。卑弥呼はこの関係を利用して倭の中での自らの権威を高めたと考えられる。「三国志」の中で、諸葛孔明は魏のライバル国家の蜀の軍師として魏を倒すために戦った人物であり、卑弥呼は自らの権威を高めるために魏と友好関係を結ぼうとした人物——ここには同じ「魏」という国家が登場している。\n【スタサプ補足】中国の皇帝は朝貢してきた周辺諸国の首長に王の称号を与え、代わりに首長はそのことを示す印綬を授かった（冊封体制）。日本の卑弥呼やヤマト政権、朝鮮は中国に朝貢して自国の支配を正当化した。',
  yoko:['57年 奴国王の金印（後漢・光武帝）→239年 卑弥呼の親魏倭王（魏）：日本の「クニ」は一貫して中国の冊封を権威の源に','同じ魏がクシャーナ朝の王に「親魏大月氏王」——魏の冊封の東西の端が日本とインド北西部（『同時に学べ』p.44）'],
  src:'『同時に学べ』p.38・47／スタサプ 第4講',rel:['yamatai','wei','nakoku','kushan_34']},

 rome_ad2:{img:[{src:'img/p70.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Statue-Augustus.jpg/960px-Statue-Augustus.jpg',cap:'初代皇帝アウグストゥスの像（プリマ＝ポルタのアウグストゥス、ヴァチカン美術館）（Wikimedia Commons／Till Niermann／パブリックドメイン）',w:'アウグストゥス'},{src:'img/p41.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Rome_Colosseum_exterior_2.jpg/960px-Rome_Colosseum_exterior_2.jpg',cap:'コロッセウム（ローマ）。帝政期の代表的建造物（Wikimedia Commons／Nicholas Hartmann／CC BY-SA 4.0）',w:'ローマ'},{src:'img/p71.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Pont_du_Gard_BLS.jpg/960px-Pont_du_Gard_BLS.jpg',cap:'ポン＝デュ＝ガール（南フランス）。ローマの水道橋（Wikimedia Commons／Benh LIEU SONG／CC BY-SA 3.0）',w:'ローマ帝国'}],kw:['ローマ帝国','五賢帝','アウグストゥス','元首政','ローマの平和'],n:'ローマ帝国（帝政）',y:'前27〜／五賢帝 96〜180｜現在のイタリア〜西欧・地中海沿岸',b:'1世紀の始まりはローマの帝政の始まり。ひとくちに「ローマ」といっても、前半の「皇帝がいない時代」の共和政と、後半の「皇帝がいる時代」の帝政（いわゆる「ローマ帝国」）に分かれる。前27年、長い内乱を制したオクタウィアヌスが初代皇帝となり「尊厳なるもの」を意味するアウグストゥスの名を与えられた。政治の権限のほとんどを手にしながら「元老院の第一人者」として元老院を尊重するスタンスをとる政治のしくみを「元首政（プリンキパトゥス）」という。「1世紀のスタート＝イエスの誕生のころ＝ローマの帝政の始まり」を世界史の「原点」として把握しておくと都合がよい。1世紀末から2世紀後半の「五賢帝」の時代（96〜180）が帝国の最盛期。初代アウグストゥスから五賢帝の時代までがおおむね「ローマの平和（パクス＝ロマーナ）」と呼ばれる。帝国の周辺部に軍隊を配置するとローマの文化がその場所に根付く。現在のロンドンやパリ、ウィーンはもともとローマの基地。\n【スタサプ補足】前27年、元老院から「アウグストゥス（尊厳者）」の称号を与えられ、「市民の第一人者（プリンケプス）」を自称。実際には軍の最高司令官・執政官・護民官も兼任する皇帝独裁だった。トラヤヌス帝の時にローマの領土は最大（北はブリテン島、南はサハラ砂漠、西はイベリア半島、東はティグリス川）。下層市民には「パンと見世物」。各地に建設されたローマ風の都市を通じて属州を支配。212年カラカラ帝が帝国領内の全自由人にローマ市民権を与え、235年からは軍人皇帝時代の「3世紀の危機」へ。',
  yoko:['ほぼ同時代の後漢の光武帝（位25〜57）とアウグストゥス（位前27〜後14）は、ともに強烈な個性こそ欠けるものの内政が整い、民衆は平和を享受できた（『ヨコから見る』p.40）','五賢帝時代の終焉は180年、黄巾の乱の発生は184年→ローマ・後漢は同時期に衰退・滅亡へ向かう（互いに因果関係はない）','ローマ帝国・パルティア・クシャーナ朝・後漢の安定期を背景に、シルクロードが「道」として十分に機能し始めた'],
  src:'『同時に学べ』p.22〜24／『ヨコから見る』p.40・44〜46／スタサプ 第2講',rel:['rome','五賢帝','christianity','germans','ゲルマン人の圧力','parthia','later_han','kushan','オアシスの道','海の道']},
 '五賢帝':{img:[{src:'img/p72.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Marble-bust-emperor-trajan.JPG/960px-Marble-bust-emperor-trajan.JPG',cap:'トラヤヌス帝の胸像（Wikimedia Commons／Slowking4／CC BY-SA 3.0）',w:'トラヤヌス'},{src:'img/p73.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Bust_of_Marcus_Aurelius_01.jpg/960px-Bust_of_Marcus_Aurelius_01.jpg',cap:'マルクス＝アウレリウス＝アントニヌス帝の胸像（Wikimedia Commons／MumblerJamie／CC BY-SA 2.0）',w:'マルクス＝アウレリウス'},{src:'img/p74.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Trajan%27s_Column_HD.jpg/960px-Trajan%27s_Column_HD.jpg',cap:'トラヤヌス帝の記念柱（ローマ）。ダキア遠征を刻む（Wikimedia Commons／Livioandronico2013／CC BY-SA 4.0）',w:'トラヤヌス'},{src:'img/p75.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Hadrian%27s_Wall_west_of_Housesteads_3.jpg/960px-Hadrian%27s_Wall_west_of_Housesteads_3.jpg',cap:'ハドリアヌスの長城（ブリタニア＝現在のイギリス北部）（Wikimedia Commons／Steven Fruitsmaak／パブリックドメイン）',w:'ハドリアヌス'},{src:'img/p76.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Eugen_Petersen_-_Column_of_Marcus_Aurelius_-_017_-_scene_011.jpg/960px-Eugen_Petersen_-_Column_of_Marcus_Aurelius_-_017_-_scene_011.jpg',cap:'マルクス＝アウレリウス帝の記念柱のレリーフ。ゲルマン人との戦い（Wikimedia Commons／パブリックドメイン）',w:'ゲルマン'}],n:'五賢帝時代',y:'96〜180年｜ローマ帝国（現在のイタリア〜西欧・地中海沿岸）',b:'1世紀末から2世紀後半にかけて登場した「五賢帝」といわれる皇帝たちの時代（96〜180）は、政治と社会が最も繁栄した帝国の最盛期といわれる。①ネルウァ（位96〜98）…老人で治世は短いながらも、血縁関係のない地方の属州出身者（現在のスペイン）のトラヤヌスを後継者に指名 ②トラヤヌス（位98〜117）…帝国の最大領域をもたらした。イベリア半島出身、ダキアとメソポタミア（現在のイラク）を得る。パルティアの首都クテシフォン（現在のイラク・バグダード南東）を占領し、一時はメソポタミアまで進出しペルシア湾に達するほどの領土を獲得（115〜117年、およそ2年間の「一時占領」） ③ハドリアヌス（位117〜138）…各地に防壁をつくり帝国の防衛を固めた。守勢にまわり、ブリタニア（現在のイギリス）に長城建設。メソポタミアは維持の困難さから放棄 ④アントニヌス＝ピウス（位138〜161）…「最も平穏な時期であった」 ⑤マルクス＝アウレリウス＝アントニヌス（位161〜180）…哲学者としても知られる。ストア派の哲人皇帝、『自省録』。中国では大秦王安敦（だいしんおうあんとん）の名で知られる。ただし五賢帝時代も決して安泰ではなく、ゲルマン人の侵入は激しく続き、中堅市民層は育たず、ローマの金貨はアジア方面へ流出し続けた（貨幣流出はローマ滅亡の一因）。この時代を最後にローマは衰退へ向かう。',
  yoko:['166年、大秦王安敦（マルクス＝アウレリウス）の使者が海路ベトナム中部（日南）に到着し、後漢の桓帝の時代に記録される','五賢帝時代の終焉（180）と黄巾の乱（184）はほぼ同時','光武帝が亡くなった頃（57年）のローマはネロ帝（位54〜68、キリスト教徒を迫害）の時代'],
  src:'『同時に学べ』p.24〜26／『ヨコから見る』p.45〜46／スタサプ 第2講',rel:['rome_ad2','大秦王安敦の使者','parthia','ctesiphon','later_han']},
 christianity:{img:[{src:'img/p77.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/9/90/Good_Shepherd_Catacomb_of_Priscilla.jpg',cap:'ローマのカタコンベ（地下墓所）に描かれた「善き羊飼い」（初期キリスト教美術）（Wikimedia Commons／パブリックドメイン）',w:'イエス'}],kw:['キリスト教','イエス'],n:'キリスト教の誕生',y:'1世紀｜現在のイスラエル・パレスチナ',b:'アウグストゥスの治世の時代、帝国の東部に位置するパレスチナ地方（現在のイスラエル・パレスチナ）でイエスが登場。当時パレスチナで信仰されていたのはユダヤ教で、ローマはユダヤ教の信仰自体は許容していたもののユダヤ人に税をかけ、徴税人が多くとりたてて多くのユダヤ人が重税に苦しんでいた。ユダヤ教の祭司たちが戒律と神による罰を説く中、イエスは「神は罰ではなく、愛を与えるのだ」という神の愛と隣人愛を説き、ユダヤ教の司祭たちを形式主義だと批判した。これがキリスト教の始まり。イエスはあくまで「ひとりのユダヤ教徒」としてユダヤ教のありかたに疑問を唱えた「改革者」にすぎず、ペテロやパウロといった「使徒」と呼ばれたイエスの弟子たちやその後継者たちが、イエスの教えや行動をもとに「キリスト教」を始め、広めていった。1〜2世紀には弾圧の対象と見られていた。\n【スタサプ補足】1世紀初め頃、権威主義と戒律主義に陥っていたユダヤ教を批判したイエスは、ユダヤ教の祭司やパリサイ派によってローマに対する反逆者と総督ピラトに告発され、30年頃処刑された。弟子たちの間にイエスの復活という信仰が生まれ、イエスを救世主（メシア、ギリシア語でキリスト）とするキリスト教が成立。ペテロ（のち「初代ローマ教皇」）やパウロ（異邦伝道）ら使徒が布教し、1世紀末頃から『新約聖書』の原型も整えられた。ローマ帝国は諸宗教に寛容だったので、ネロ帝（位54〜68）の迫害などを除いて初期の迫害は少なく、下層市民や女性を中心に帝国全土に広まった。313年ミラノ勅令で公認、392年に国教化。',
  yoko:['「1世紀のスタート＝イエスの誕生のころ＝ローマの帝政の始まり」が世界史の「原点」（『同時に学べ』p.22）','同じ1世紀、仏教が西域の絹の道を通って後漢の明帝の時代に中国に伝来したといわれる（『ヨコから見る』p.44）','光武帝が死んだ57年頃、ローマではネロ帝がキリスト教徒を迫害'],
  src:'『同時に学べ』p.23／スタサプ 第2講',rel:['rome_ad2','五賢帝','buddhism_mahayana']},
 germans:{img:[{src:'img/p78.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/Hermannsdenkmal_statue.jpg/960px-Hermannsdenkmal_statue.jpg',cap:'トイトブルクの森でローマ軍を破ったアルミニウス（ヘルマン）の記念像（ドイツ）（Wikimedia Commons／Daniel Schwen／パブリックドメイン）',w:'トイトブルク'},{src:'img/p76.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Eugen_Petersen_-_Column_of_Marcus_Aurelius_-_017_-_scene_011.jpg/960px-Eugen_Petersen_-_Column_of_Marcus_Aurelius_-_017_-_scene_011.jpg',cap:'マルクス＝アウレリウス帝記念柱のレリーフに刻まれたゲルマン人との戦い（Wikimedia Commons／パブリックドメイン）',w:'五賢帝'}],kw:['ゲルマン人'],n:'ゲルマン人',y:'1〜2世紀｜現在のドイツ（ライン川以東）',b:'ライン川の向こう側の周辺異民族、いわゆるゲルマン人の諸勢力はローマの悩みの種だった。ローマはここに遠征軍を派遣するが、西暦9年にローマ帝国軍が殲滅されるという大敗北を喫し（トイトブルク（現在のドイツ北西部）森の戦い。ウァルスの率いるローマ軍3個師団が壊滅し、アウグストゥスは「ウァルスよ余の軍隊を返せ」といって嘆いたという）、実質、ローマはライン川の向こうの征服をあきらめ、ライン川とドナウ川に沿った防衛線の構築に努めることになった。五賢帝時代にもゲルマン人の侵入は激しく続いた。',
  yoko:['アウグストゥス帝は後9年のトイトブルク森の戦いでゲルマン人に敗北して以降、守勢にまわった（『ヨコから見る』p.45）','北の異民族に悩まされたのは東の後漢も同じ：北匈奴が勢力を拡大し、班超が駆逐した'],
  src:'『同時に学べ』p.24／『ヨコから見る』p.45',rel:['rome_ad2','ゲルマン人の圧力','n_xiongnu']},
 'ゲルマン人の圧力':{img:[{src:'img/p76.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Eugen_Petersen_-_Column_of_Marcus_Aurelius_-_017_-_scene_011.jpg/960px-Eugen_Petersen_-_Column_of_Marcus_Aurelius_-_017_-_scene_011.jpg',cap:'マルクス＝アウレリウス帝記念柱のレリーフ。ゲルマン人との戦い（Wikimedia Commons／パブリックドメイン）',w:'ゲルマン人'},{src:'img/p75.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Hadrian%27s_Wall_west_of_Housesteads_3.jpg/960px-Hadrian%27s_Wall_west_of_Housesteads_3.jpg',cap:'ローマ帝国の北の境界・ハドリアヌスの長城（イギリス）（Wikimedia Commons／Steven Fruitsmaak／パブリックドメイン）',w:'ドナウ川'}],kw:['ゲルマン人'],n:'ローマ帝国への外からの圧力',y:'1〜2世紀｜現在のドイツ・イラク',b:'ローマにもライバル国家がいた。それがパルティア（現在のイラン・イラク）。ローマ帝国の東方のパルティアに対して、ローマは圧倒的といえるほどの優位には立てず、一時はメソポタミア（現在のイラク）まで征服したがその領地を維持できなかった。また、ライン川の向こう側のゲルマン人の諸勢力もローマの悩みの種で、西暦9年の大敗北以後、ライン川とドナウ川に沿った防衛線の構築に努めた。',
  src:'『同時に学べ』p.24',rel:['germans','parthia','rome_ad2']},
 kushan:{img:[{src:'img/p79.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/3/3c/Coin_of_the_Kushan_king_Kanishka.jpg',cap:'クシャーナ朝カニシカ王の金貨（Wikimedia Commons／CC BY 3.0）',w:'カニシカ王'},{src:'img/p80.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Kanishka_enhanced.jpg/960px-Kanishka_enhanced.jpg',cap:'カニシカ王の立像（マトゥラー博物館、頭部は欠損）（Wikimedia Commons／Biswarup Ganguly／CC BY-SA 3.0）',w:'カニシカ'}],kw:['クシャーナ朝','カニシカ'],n:'クシャーナ朝',y:'1〜3世紀｜現在のパキスタン〜インド北部・アフガニスタン',b:'1世紀の前半、「オアシスの道」周辺の遊牧民の一部が南下し、インド北西部を支配した王朝。インドの歴史に位置付けられることが多いが、もともとは中央ユーラシアの民族からおこった国家で、インドの王朝といってもだいぶ北寄りに位置している。そのため、東西の交易路が国家を貫いて存在している格好となり、東西を結ぶ交易で大いに繁栄した。最大の「お得意様」はローマ帝国で、ローマへ胡椒・宝石・象牙などを輸出し、ワインやオリーブ油などを輸入。ローマがクシャーナ朝（現在のパキスタン〜インド北部）から購入する額のほうが多かったため、その代金としてローマの金が大量にもたらされ、ローマの貨幣の重量を基準とした金貨がつくられた。クシャーナ朝が南下してインダス河の河口にまで達し、ローマと海で直接結ぶルートも開かれた（パルティア（現在のイラン・イラク）を経由せず、上乗せ価格をおさえられる）。最盛期の王カニシカ王は仏教を保護し、東西の交易路を伝わってパルティア・中央アジア・中国などに仏教が広がるきっかけをつくった。\n【『ヨコから見る』】建国したのはイラン系のクシャーン人。東は後漢に接し、西はパルティアの領土にまで迫っていた。都のプルシャプラ（現在のパキスタン・ペシャワール）は要チェック。絹の道の要衝を占め中継貿易で繁栄した、まさに国際的な通商国家。この国際性・開放性が文化・宗教・政治に決定的な影響を与えた：文化ではギリシア式の仏像彫刻であるガンダーラ様式、宗教では人種・国籍を超えて広く大衆を救う大乗仏教（サータヴァーハナ朝（現在のインド中南部）出身の竜樹＝ナーガールジュナが大成）。カニシカ王の業績：①大乗仏教の保護・奨励 ②第4回の仏典結集（サンスクリット語で編纂） ③ガンダーラ美術が発展。諸民族の宗教・習慣にも寛大だった。\n【スタサプ補足】後1世紀、大月氏（現在のアフガニスタン北部〜ウズベキスタン）から自立したイラン系のクシャーン人がバクトリア（現在のアフガニスタン北部）地方から進出して建国。2世紀のカニシカ王が都プルシャプラ（現ペシャワール）を中心に中央アジアからガンジス川（現在のインド北部）中流域までを支配。3世紀、西部をササン朝に、東部を地方勢力に奪われ滅亡。',
  yoko:['ヨコの鉄則：クシャーナ朝のKey Wordは国際性と開放性→ガンダーラ様式・大乗仏教・政治的寛容','パルティアとクシャーナ朝は1〜2世紀を代表する大国だが、どちらも中央ユーラシアの遊牧民からおこった国家（『同時に学べ』p.25）','東西の陸路を結ぶ国家として、西アジアのパルティア（安息）、北インドのクシャーナ朝が発展（『ヨコから見る』まとめ）'],

 gandhara:{img:[{src:'img/p81.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Gandhara_Buddha_%28tnm%29.jpeg/960px-Gandhara_Buddha_%28tnm%29.jpeg',cap:'ガンダーラ様式の仏立像（1〜2世紀、東京国立博物館）（Wikimedia Commons／World Imaging／パブリックドメイン）',w:'ガンダーラ様式'},{src:'img/p82.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Gandhara_Bodhisattva%2C_Paris%2C_Mus%C3%A9e_Guimet.jpg/960px-Gandhara_Bodhisattva%2C_Paris%2C_Mus%C3%A9e_Guimet.jpg',cap:'ガンダーラの菩薩像（パリ・ギメ東洋美術館）（Wikimedia Commons／Ninara／CC BY 2.0）',w:'仏像'}],kw:['ガンダーラ'],n:'ガンダーラ美術',y:'1〜2世紀｜現在のパキスタン北西部',b:'クシャーナ朝（現在のパキスタン〜インド北部）の都になったプルシャプラの周辺をガンダーラ地方（現在のパキスタン北西部）という。ガンダーラ地方ではギリシア文化の影響から、仏の姿を像にあらわすという、最初期の仏像がつくられた。ギリシア彫刻の流れをくむ仏像であるため、鼻筋がとおった、どことなく西洋風の顔立ちをしており、ギリシア風の服を着ているなど、現代の人がイメージする仏像とは少し雰囲気が違う。このような様式の仏像を「ガンダーラ様式」、それを含むガンダーラ地方で発展した美術を「ガンダーラ美術」という。クシャーナ朝のガンダーラ様式は中国にも伝わっている。\n【スタサプ補足】2世紀頃、ヘレニズム文化の影響を受けて仏像が制作されるようになり、クシャーナ朝の保護を受けた大乗仏教とともに中央アジアから中国・朝鮮・日本へ伝わった。',
  yoko:['アレクサンドロスの東方遠征（前4世紀）で伝わったギリシア文化が、400年後に仏教美術として花開いた（ヘレニズム文化→ガンダーラ美術）','仏教は西域の絹の道を通って後漢の明帝の時代（1世紀）に中国に伝来したといわれる'],
  src:'『同時に学べ』p.28／『ヨコから見る』p.42・44／スタサプ 第3講',rel:['kushan','purushapura','buddhism_mahayana','alexander']},
 buddhism_mahayana:{img:[{src:'img/p82.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Gandhara_Bodhisattva%2C_Paris%2C_Mus%C3%A9e_Guimet.jpg/960px-Gandhara_Bodhisattva%2C_Paris%2C_Mus%C3%A9e_Guimet.jpg',cap:'大乗仏教で信仰された菩薩の像（ガンダーラ、ギメ東洋美術館）（Wikimedia Commons／Ninara／CC BY 2.0）',w:'菩薩'}],kw:['大乗仏教','竜樹','ナーガールジュナ'],n:'大乗仏教の成立',y:'1〜2世紀｜現在のパキスタン〜インド北部',b:'クシャーナ朝（現在のパキスタン〜インド北部）の国際性・開放性のもとで、個人の解脱を目的とする上座部仏教に対して、人種・国籍を超えて広く大衆を救う大乗仏教が成立した。これはつまりイラン人もギリシア人も中国人も、誰でもわかって、みんなが救われるという意味。大乗仏教はサータヴァーハナ朝（現在のインド中南部）出身の竜樹（ナーガールジュナ）が大成し、クシャーナ朝全盛期のカニシカ王が保護・奨励した。朝鮮・日本にも伝わり、北伝仏教と呼ばれる。\n【スタサプ補足】紀元前後、保守・形式化した旧来の仏教（部派仏教）に対し改革運動がおこり、自己の悟りよりも衆生救済を重視し、そのための修行者を菩薩として信仰する考えが生まれた。「大きな乗り物」の意味で大乗と自称し、旧来の仏教を小乗仏教（上座部仏教）とした。教理は2〜3世紀頃に竜樹によって体系化され、「空」の思想はその後の仏教思想に大きな影響を与えた。',
  yoko:['同じ1世紀に、西ではキリスト教が生まれ、東では仏教が中国に伝来した','クシャーナ朝のKey Wordは国際性と開放性→ガンダーラ様式・大乗仏教・政治的寛容（ヨコの鉄則）'],
  src:'『ヨコから見る』p.42・47／スタサプ 第3講',rel:['kushan','gandhara','satavahana','christianity']},
 satavahana:{img:[{src:'img/p83.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Andhra_Ship_Coins.jpg/960px-Andhra_Ship_Coins.jpg',cap:'サータヴァーハナ朝の船を描いた貨幣（海上交易の証拠）（Wikimedia Commons／パブリックドメイン）'},{src:'img/p84.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Amaravati_Stupa_relief_at_Museum.jpg/960px-Amaravati_Stupa_relief_at_Museum.jpg',cap:'サータヴァーハナ朝期のアマラーヴァティー仏塔のレリーフ（Wikimedia Commons／Soham Banerjee／CC BY 2.0）',w:'海上交易'}],kw:['サータヴァーハナ','季節風','モンスーン','エリュトゥラー'],n:'サータヴァーハナ朝',y:'前1〜後3世紀（全盛期 後1〜2世紀）｜現在のインド中南部（デカン高原）',b:'クシャーナ朝（現在のパキスタン〜インド北部）は「インドの王朝」として認識されることが多いが、由来は中央ユーラシアの民族からきており、かなり北によっている。この当時、インド洋に突き出た半島部（インド亜大陸）に存在していた国家がサータヴァーハナ朝（現在のインド中南部）。インド洋のど真ん中に存在していたため、ローマ帝国と中国の後漢王朝の間に立ち、東西をつなぐ海上交易で繁栄していた。特にローマ帝国との貿易が盛んで、ローマから大量の金貨がもたらされた。\n【『ヨコから見る』】デカン高原（現在のインド中南部）に前1世紀に興る。最近その地の利を生かした盛んな東西交易が注目されており、入試の必須データ。ローマ帝国と季節風（モンスーン）を利用した交易を行い、香辛料・真珠・綿布などを輸出し、金貨・ガラス器・陶器などを輸入。今でも南インドの各地からローマの金貨が数多く発見されている。当時の海上貿易の存在を示すものとして『エリュトゥラー海案内記』がある。後1世紀にギリシア人（作者不明）によって書かれ、紅海⇄アラビア海⇄インド洋の航海ルートが詳しく載っている。全盛期は？→東西世界の安定がサータヴァーハナ朝の繁栄を支えたのだから、全盛期は後1〜2世紀頃とわかるはず（「ワセダ恐るるに足らず」）。南インドにはほかにチョーラ朝・パーンディヤ朝（ドラヴィダ系。ローマと通商した跡もある）。\n【スタサプ補足】1世紀頃、アラビア半島とインドの間で季節風を利用した航海が確立し、同じ頃インドと中国を結ぶ航路も開かれ、「海の道」が開けた。ローマ帝国時代の1〜4世紀頃、インドからは胡椒・宝石・象牙などを輸出、地中海世界からは大量の金貨・ガラス・金属細工・ワインなどを輸入。マウリヤ朝（現在のインド）衰退後の前1世紀、デカン高原にドラヴィダ系のサータヴァーハナ朝が独立。',
  yoko:['まず海路を押さえたのが南インドのサータヴァーハナ朝、陸路を押さえたのが北インドのクシャーナ朝と西アジアのパルティア（『ヨコから見る』p.41）','ローマの輸入超過で大量のローマ金貨がアジアに流出し、社会問題に。『ゲルマニア』『年代記』のタキトゥスは奢侈に流れるローマ人に批判的'],

 monsoon:{img:[{src:'img/p64.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Nile_River%2C_Felucca_boats%2C_Aswan%2C_Egypt.jpg/960px-Nile_River%2C_Felucca_boats%2C_Aswan%2C_Egypt.jpg',cap:'帆船（ナイル川のフェラッカ）。季節風を帆で受けて航海した（Wikimedia Commons／Vyacheslav Argenberg／CC BY 4.0）',w:'季節風'}],kw:['季節風','モンスーン'],n:'季節風を利用した交易',y:'1〜2世紀｜現在のインド洋',b:'クシャーナ朝やサータヴァーハナ朝（現在のインド中南部）に繁栄をもたらしたインド洋交易で大きな役割を果たしたのが、インド洋を吹き渡る季節風。夏にはユーラシア大陸が暖められて低気圧が発生し、大陸に向かう季節風が吹く。冬にはユーラシア大陸が冷やされて高気圧が発生し、大陸から海へと風が吹く。夏には東行き、冬には西行きにこの風を使うことで、商人たちはインド洋を横断することができた。\n【『ヨコから見る』】ヨコの鉄則：絹の道の貿易・季節風（モンスーン）貿易→アジアの香辛料・絹がローマへ!! 紅海、アラビア海、インド洋を経てデカン高原（現在のインド中南部）のサータヴァーハナ朝に至るモンスーン貿易。',
  src:'『同時に学べ』p.28／『ヨコから見る』p.41・45／スタサプ 第2・3講',rel:['satavahana','海の道','funan']},
 later_han:{img:[{src:'img/p85.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Han_Guangwu_Di.jpg/960px-Han_Guangwu_Di.jpg',cap:'後漢の光武帝（唐・閻立本筆と伝わる『歴代帝王図巻』）（Wikimedia Commons／パブリックドメイン）',w:'光武帝'},{src:'img/p86.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/27495-Luoyang%2C_White_Horse_Temple.jpg/960px-27495-Luoyang%2C_White_Horse_Temple.jpg',cap:'後漢の都・洛陽の白馬寺（中国最古の仏教寺院と伝わる）（Wikimedia Commons／xiquinhosilva／CC BY 2.0）',w:'洛陽'}],kw:['後漢','光武帝','班超','甘英','冊封','黄巾'],n:'後漢',y:'25〜220年｜現在の中国',b:'1世紀から2世紀にかけて、シルクロードの東の起点にあたる場所には後漢王朝が存在している。1世紀のはじめ、前漢は皇帝の親戚筋にあたる王莽（おうもう）に皇帝の位を奪われて滅亡。西暦8年に王莽がつくった新という王朝は（「新」という名に反して極端な復古政治をとった）反乱が勃発してわずか15年で滅んだ。その混乱をおさめ、西暦25年に漢王朝を復活させたのが劉秀（りゅうしゅう）で、この王朝は後漢と呼ばれ、劉秀は光武帝と呼ばれる。光武帝が漢を再興すると、周辺の国家や民族は相次いで後漢と外交関係を結び、「冊封（さくほう）」という関係でつながる（中国の王朝を君主、周辺の国家を臣下とみなしてつながりを持つ関係。中国の皇帝は天命を与えられた「天子」であり、周辺の国家はその地を治めることを委ねられた臣下という考え方）。周辺諸国は貢ぎ物を贈り（朝貢）、冊封のしるしとして臣下としての辞令と印綬（印章と組みひも）を授けられた。印章は金や銀、銅などの材質や、紫、青、黒などの紐の色で家臣としてのランクがわかる。日本のクニの王が授かった「金印」もそのひとつで、「金印」は日本だけのものではない。\n【『ヨコから見る』】赤眉の乱の混乱の中で劉秀が建国、都は洛陽（現在の中国河南省）。前漢の諸制度を引き継ぎ内政が整いやすかったため安定した王朝。後漢の外交・交易：①光武帝時代（位25〜57）倭国の使者に「漢委奴国（現在の福岡市付近）王」の印を賜う ②和帝時代（位88〜105）班超を西域（現在の中国新疆〜中央アジア）都護に任ずる（91）→部下の甘英がローマに向かうが条支国（シリア付近、現在のシリア付近）でひき返す（西域都護府はクチャ（現在の中国新疆）に設置） ③桓帝時代（位146〜167）大秦王安敦の使者が海路ベトナム中部（日南（現在のベトナム中部））に到着。ヨコの鉄則：前漢は内政が頻出（郡国制、均輸・平準法、儒教国学化）、後漢は外交が頻出（班超・甘英・大秦国王安敦の使者）。しかしこの後、宦官と儒派官僚の抗争である党錮の禁で政治が混乱し、184年には太平道の張角が率いた農民反乱、黄巾の乱でついに滅亡へ。三国時代へ突入。\n【スタサプ補足】武帝の死後、外戚と宦官が権力を振るい、地方では豪族が台頭。8年、外戚の王莽が新を建国したが、赤眉の乱（18〜27）などで15年で滅亡。25年、豪族反乱軍を率いた劉氏一族の劉秀が即位して光武帝に。2世紀に入ると宦官と外戚で政治が乱れ、166年党錮の禁、184年黄巾の乱→各地の豪族が台頭し220年滅亡、魏・呉・蜀の三国時代へ。文化：鄭玄らの訓詁学、班固『漢書』（紀伝体）、蔡倫の製紙法改良、張衡の地震計、インドから仏教伝来。',
  yoko:['光武帝（位25〜57）とアウグストゥス（位前27〜後14）はほぼ同時代の、内政が整った皇帝','後漢初期、光武帝が積極的に外交関係を求め、様々な国家と冊封関係を結んだ→57年、倭の奴国王に金印','五賢帝時代の終焉180年、黄巾の乱184年→ローマ・後漢は衰退・滅亡へ（互いに因果関係はないが偶然同時期）'],
  src:'『同時に学べ』p.29〜31／『ヨコから見る』p.43〜44・46／スタサプ 第4講',rel:['luoyang','班超の活動','甘英の派遣','大秦王安敦の使者','nakoku','yayoi_mid','n_xiongnu','オアシスの道','rome_ad2']},
 '班超の活動':{kw:['班超','西域都護'],n:'班超の活動',y:'1世紀末（91年 西域都護）｜現在の中国新疆〜中央アジア',b:'前漢のころから漢王朝はシルクロード、とりわけオアシスの道の国家と冊封関係を結び、間接的に支配していた。しかし、前漢から後漢に移行する混乱期に、中国の北方に位置する民族である匈奴の一派（北匈奴（現在のモンゴル高原））が勢力を拡大させており、後漢の時代のはじめにはオアシスの道への十分な支配力を及ぼせない状況だった。そこで登場したのが班超（はんちょう）。活躍時期はおおむね光武帝の死後、2代皇帝から4代皇帝にまたがる時代。歴史家の家に生まれた班超は、もともと文章の作成にあたっていた下級の役人だったが、武将として能力を発揮し、北匈奴を駆逐してオアシスの道を確保し、西域（現在の中国新疆〜中央アジア）都護（漢の北西一帯をおさめる役所の長官）になった。後漢が西の国家と交易できたのは班超のおかげといっても過言ではない。班超には、さらに西に存在する「安息」と呼ばれたパルティア（現在のイラン・イラク）や「大秦国」と呼ばれたローマ帝国などの情報も入っていた。\n【『ヨコから見る』】和帝時代（位88〜105）、班超を西域都護に任ずる（91）。西域都護府はクチャ（現在の中国新疆）に設置。班超の活躍のおかげで商業のみならず東西文化の交流も盛んになった。ドイツの地理学者リヒトホーフェンが絹の道（シルク＝ロード）と命名したように、班超により安全となった西域路を通って中国からは絹が輸出され、西方からは馬・ざくろなどが輸入された。班超の兄は『漢書』の班固。',
  yoko:['前漢の張騫（武帝の派遣）、後漢の班超と対で覚える','班超が確保したオアシスの道の西の端にはパルティア（安息）、さらに西にローマ（大秦国）'],
  src:'『同時に学べ』p.30〜31／『ヨコから見る』p.43〜44／スタサプ 第4講',rel:['later_han','甘英の派遣','オアシスの道','n_xiongnu','parthia']},
 '甘英の派遣':{kw:['甘英','大秦'],n:'甘英の派遣（97年）',y:'97年｜現在の中央アジア〜シリア',b:'班超は1世紀の末に部下のひとりである甘英（かんえい）という人物をローマ帝国に派遣して、より西の世界を探ろうとした。甘英はローマ帝国に辿り着けなかったが、西方の多くの情報を中国にもたらした。\n【『ヨコから見る』】後漢の西域（現在の中国新疆〜中央アジア）都護、班超が部下の甘英を大秦国（ローマ）に派遣したところ、パルティア（現在のイラン・イラク）の妨害で失敗したともいわれている。おそらく、パルティアが貿易の利を失うのを恐れたからだろう。甘英は条支国（シリア付近、現在のシリア付近）でひき返した。暗記年号：甘英のローマ出発（後97年）「苦難の旅へ甘英出発」。',
  yoko:['97年 甘英のローマ派遣（失敗、シリアで引き返す）⇔ 166年 大秦王安敦の使者の中国派遣（海路ベトナムに到着）— 東西の使者が対になる','甘英のローマ出発（97年）は五賢帝時代（96〜）の始まり直後'],
  src:'『同時に学べ』p.31／『ヨコから見る』p.43〜44・46',rel:['班超の活動','later_han','parthia','大秦王安敦の使者','rome_ad2']},
 '大秦王安敦の使者':{img:[{src:'img/p54.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/02023_Roman_glass_bowl_decorated_with_ribs_found_in_Kosin.jpg/960px-02023_Roman_glass_bowl_decorated_with_ribs_found_in_Kosin.jpg',cap:'ローマ帝国のガラス器（1世紀）（Wikimedia Commons／CC BY 2.5）',w:'大秦'}],kw:['大秦王安敦','安敦'],n:'大秦王安敦の使者（166年）',y:'166年｜現在のベトナム中部',b:'桓帝時代（位146〜167）、大秦王安敦の使者が海路ベトナム中部（日南）に到着した。大秦王安敦とは五賢帝の最後、マルクス＝アウレリウス＝アントニヌス帝（位161〜180）のこと。ストア派の哲学者（哲人皇帝、『自省録』）で、中国では大秦王安敦の名で知られる。後漢の外交は入試頻出（班超・甘英・大秦国王安敦の使者）。\n【スタサプ補足】2世紀半ば、大秦王安敦の使節が日南郡（ベトナム中部、現在のベトナム中部）を訪れる。大秦王安敦はローマ皇帝マルクス＝アウレリウス＝アントニヌスとされる。',
  yoko:['「4大国」による活発な東西交流：ローマ帝国⇄（草原の道・オアシスの道）⇄パルティア・クシャーナ朝⇄後漢、南回りの海の道はサータヴァーハナ朝・扶南・チャンパーを経由（『同時に学べ』p.32 まとめ図）','大秦王安敦の使者到着（166）の直後、党錮の禁（166）→黄巾の乱（184）で後漢は衰退、ローマも五賢帝時代が終わる（180）'],
  src:'『ヨコから見る』p.44〜46／スタサプ 第4講',rel:['五賢帝','later_han','nichinan','海の道','甘英の派遣']},
 n_xiongnu:{img:[{src:'img/p20.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Noin-Ula_carpet_%28museum_shot%29.jpg/960px-Noin-Ula_carpet_%28museum_shot%29.jpg',cap:'匈奴の墓（ノイン＝ウラ、モンゴル）から出土した毛織物（Wikimedia Commons／Gary Todd／CC0）',w:'匈奴'}],kw:['匈奴'],n:'北匈奴',y:'1世紀｜現在のモンゴル高原',b:'前漢から後漢に移行する漢王朝の混乱期に、中国の北方に位置する民族である匈奴の一派（北匈奴（現在のモンゴル高原））が勢力を拡大させており、後漢の時代のはじめにはオアシスの道への十分な支配力を及ぼせない状況だった。班超が北匈奴を駆逐してオアシスの道を確保した。「草原の道」をルーツにする遊牧民族は、機動力の高い騎馬軍団を持ち、内陸交易に携わりながらも、時には南方に広がる農耕民に対して軍事的に優位に立つこともあった。\n【スタサプ補足】匈奴は漢の武帝に攻撃されて後退し、前1世紀半ばに東西に、さらに後1世紀半ばに東匈奴が南北に分裂。4世紀半ば、北匈奴の西走で中央アジアの遊牧民フン人がヨーロッパへ移動し、ゲルマン人の大移動を引きおこした。',
  yoko:['北の遊牧民に悩まされたのは西のローマ（ゲルマン人）も同じ','草原の道はシルクロードの中でも最も北に位置し、牧畜を営む遊牧民がたてた遊牧国家が交易を担っていた'],
  src:'『同時に学べ』p.25・30／スタサプ 第4講',rel:['班超の活動','草原の道','xianbei','later_han','xiongnu']},
 xianbei:{n:'鮮卑',y:'1〜2世紀｜現在のモンゴル高原東部〜中国東北部',b:'『同時に学べ』p.18〜19の地図でモンゴル高原東部に示された遊牧民。「草原の道」をルーツにする遊牧民族は、機動力の高い騎馬軍団を持ち、内陸交易に携わりながら、時には南方の農耕民に対して軍事的に優位に立つこともあった。（本文に詳述はなく、地図上の勢力名として掲載）',
  src:'『同時に学べ』p.18〜19（地図）',rel:['n_xiongnu','草原の道','later_han']},
 goguryeo:{img:[{src:'img/p87.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Dongshouprocessionmural.jpg/960px-Dongshouprocessionmural.jpg',cap:'高句麗の古墳壁画（安岳3号墳の行列図、4世紀）（Wikimedia Commons／パブリックドメイン）',w:'高句麗'},{src:'img/p112.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/20230605_Stela_for_Gwanggaeto.jpg/960px-20230605_Stela_for_Gwanggaeto.jpg',cap:'広開土王碑（好太王碑、中国吉林省集安）（Wikimedia Commons／Yumeto／CC BY-SA 4.0）',w:'広開土王碑'}],n:'高句麗',y:'1〜4世紀｜現在の中国東北部〜北朝鮮',b:'『同時に学べ』p.18〜19・34〜35の地図で朝鮮半島北部〜中国東北部に示された国。3世紀には魏が高句麗を討って朝鮮半島まで勢力を拡大。4世紀、中国が五胡十六国の混乱期に入ると相対的に日本の朝鮮半島南部への影響力が強まり、現在の中国東北地方にある石碑（広開土王碑）には日本が高句麗と交戦したことが記されている（『同時に学べ』p.48／『ヨコから見る』p.54）。\n【スタサプ補足】4世紀初め、高句麗が中国の拠点の一つ楽浪郡（現在の北朝鮮・平壌付近）を滅ぼして朝鮮半島に進出。4世紀末の広開土王（好太王）の時代に最盛期を迎える。',
  src:'『同時に学べ』p.18〜19（地図）／スタサプ 第4講',rel:['later_han','nakoku']},
 kush:{img:[{src:'img/p88.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/5/53/Sudan_Meroe_Pyramids_2001.JPG',cap:'クシュ王国の都メロエのピラミッド群（現在のスーダン）（Wikimedia Commons／B N Chagny／CC BY-SA 1.0）',w:'メロエ'}],n:'クシュ王国',y:'1〜2世紀｜現在のスーダン',b:'『同時に学べ』p.18〜19の地図でナイル川上流に示された国。（本文に詳述はなく、地図上の勢力名として掲載）\n【スタサプ補足】前10世紀頃ナイル川上流（現在のスーダン）に成立した黒人最古の王国。前7世紀にアッシリア（現在のイラク北部）のエジプト征服によりさらに上流域に移動し、都をメロエ（現在のスーダン）に移してメロエ王国として栄えたが、4世紀中頃エチオピアのアクスム王国（現在のエチオピア・エリトリア）により滅亡。',
  src:'『同時に学べ』p.18〜19（地図）／スタサプ 第1講',rel:['aksum','海の道']},
 aksum:{img:[{src:'img/p89.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Stela_in_Main_Stelae_Field_-_Axum_%28Aksum%29_-_Ethiopia_-_01_%288701108913%29.jpg/960px-Stela_in_Main_Stelae_Field_-_Axum_%28Aksum%29_-_Ethiopia_-_01_%288701108913%29.jpg',cap:'アクスムの石柱（現在のエチオピア）（Wikimedia Commons／Adam Jones／CC BY-SA 2.0）',w:'アクスム'}],n:'アクスム王国',y:'1〜2世紀｜現在のエチオピア・エリトリア',b:'『同時に学べ』p.18〜19の地図で紅海の出口（エチオピア）に示された国。海の道の西の入口にあたる。（本文に詳述はなく、地図上の勢力名として掲載）\n【スタサプ補足】エチオピアのアクスム王国（現在のエチオピア・エリトリア）は4世紀中頃、メロエ（現在のスーダン）王国を滅ぼした。',

{set:'古代（紀元前）',type:'正しい文の組合せ',src:'『ヨコから見る世界史』LESSON1 p.14〜15',
 ctx:'ノート（春秋・戦国時代の社会）\n・戦国時代初期までに新しい農法が普及し，農業生産力が飛躍的に向上した。\n・農業の発展とともに商工業も発展し，社会全体に大きな変化が生まれた。\n・こうした中で諸子百家と呼ばれる思想家集団が出現した。',
 q:'ノートを参考にしつつ，春秋・戦国時代について述べた文あ〜えについて，正しいものの組合せを，次の①〜④のうちから一つ選べ。\n\nあ　鉄製農具と牛耕農法の普及によって，農業生産力が向上した。\nい　青銅製農具の普及によって，農業生産力が向上した。\nう　農村では血縁中心の氏族共同体が解体し，家族単位の農業経営が始まった。\nえ　諸子百家の思想は，現実の政治や社会から離れた宗教的な性格が強かった。',
 opts:['あ・う','あ・え','い・う','い・え'],a:0,
 exp:'鉄製農具・牛耕農法の普及→農業生産力の向上→商工業の発展（青銅貨幣，製鉄・製塩業）・大都市の発展・氏族共同体の解体と家族単位の農業経営→諸子百家の出現，という流れ（同書の図）。諸子百家は各国の富国強兵策の中で生まれたため「処世的（現実対応）」な性格が強い。青銅は貨幣に使われたが農具の普及は鉄製。'},
{set:'古代（紀元前）',type:'あ・いの正誤',src:'『ヨコから見る世界史』LESSON1 p.15',
 q:'諸子百家について述べた文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　法家の商鞅は秦の孝公に仕え，同じく法家の韓非・李斯は秦の始皇帝に仕えた。\nい　墨家の説く兼愛は，儒家の仁と同じく血縁を中心とする愛であった。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:1,
 exp:'あは正しい。法家は法治主義・信賞必罰を説き秦で採用された。いは誤り。墨家の兼愛は「博愛」で，血縁中心の儒家の仁に対抗する大勢力となったが，兼愛の教えは仁に敗れて消滅した。儒家は孔子・孟子（性善説・王道政治）・荀子（性悪説）が代表で，礼と仁を説き周の封建制の復活を願った。'},
{set:'古代（紀元前）',type:'語と説明の組合せ',src:'『ヨコから見る世界史』LESSON1 p.15 特別講義',
 ctx:'ノート\n・戦国時代には各国で青銅貨幣が使われ，どこでどの貨幣が使われたかがよく出題される。\n・斉・燕では［ ア ］が使われた。',
 q:'ノート中の空欄［ ア ］に入る貨幣の名あ・いと，その地域の説明Ｘ〜Ｚとについて，最も適当なものの組合せを，次の①〜⑥のうちから一つ選べ。\n\n［ ア ］に入る貨幣の名\nあ　刀銭\nい　布銭\n\n地域の説明\nＸ　狩猟が中心で戦いも多く，刀の形をした貨幣を用いた。\nＹ　農業生産地域で，農具の形をした貨幣を用いた。\nＺ　西方の情報が入りやすく，合理的な円形の貨幣を用いた。',
 opts:['あ―Ｘ','あ―Ｙ','あ―Ｚ','い―Ｘ','い―Ｙ','い―Ｚ'],a:0,
 exp:'斉・燕（現在の中国・北京付近）＝刀銭（狩猟中心・戦いが多い），韓・魏（趙）＝布銭（農具の形），秦＝円銭（環銭），楚（現在の中国長江中流域）＝蟻鼻銭（未解読の文字）。すべて青銅製。共通テスト2026追試でも，燕の貨幣（刀銭）が朝鮮半島西北部から出土していることを楽浪郡（現在の北朝鮮・平壌付近）の資料と組み合わせて出題している。'},
{set:'古代（紀元前）',yoko:true,type:'年代整序（6択）',src:'『世界史と日本史は同時に学べ』p.13〜15／『ヨコから見る世界史』LESSON2〜3',
