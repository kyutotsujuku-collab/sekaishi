 '王の道':{img:[{src:'img/p48.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Temple_of_Artemis_Sardis_Turkey.jpg/960px-Temple_of_Artemis_Sardis_Turkey.jpg',cap:'「王の道」の終点サルデス（現在のトルコ）の遺跡（Wikimedia Commons／simonjenkins\' photos／CC BY-SA 2.0）',w:'サルデス'}],n:'王の道',y:'アケメネス朝｜現在のイラン〜トルコ',b:'アケメネス朝ペルシア（現在のイラン）が整備した軍用道路。首都スサから小アジアのサルデス（現在のトルコ西部）まで。秦の始皇帝の「馳道（ちどう）」（首都咸陽（かんよう、現在の中国・西安付近）から約800km、幅は約64m）と比較される（『ヨコから見る』p.37 比較表）。【スタサプ】全国の要地を結ぶ国道で、駅伝制を整備した。',
  yoko:['アケメネス朝：王の道・サトラップ制・王の目・王の耳 ⇔ 秦：馳道（ちどう）・郡県制（ぐんけんせい）・御史大夫（ぎょしたいふ）と監（監察官）'],src:'『ヨコから見る』p.37／スタサプ 第2講',rel:['achaemenid','susa','sardes','qin']},
 '絹の道':{img:[{src:'img/p29.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/2/2b/Mawangdui_silk_banner_from_tomb_no1.jpg',cap:'前漢の絹の帛画（馬王堆漢墓出土）。絹は中国の特産品だった（Wikimedia Commons／パブリックドメイン）',w:'絹'},{src:'img/p53.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/7/7c/Taklamakan_desert.jpg',cap:'タクラマカン砂漠（現在の中国・新疆）。オアシス都市をつないで絹の道が通った（Wikimedia Commons／Pravit／CC BY-SA 4.0）',w:'オアシス'}],kw:['絹の道','シルク','東西交易','オアシス'],n:'絹の道（シルク＝ロード／オアシス＝ロード）',y:'前3000年頃〜｜現在の中国〜中央アジア〜西アジア',b:'砂漠や険しい山脈の中にあるオアシスの住人たちは、周辺の農耕社会・遊牧社会との交易を開始し、隊商交易も徐々に大きな利益を生むようになった。この交易の利をめぐって、遊牧社会と中国農耕社会は何度も対立、戦争をくり返す。前漢の武帝は匈奴の補給路を断つべく河西四郡（かせいしぐん、現在の中国甘粛省）を設置した。3つのルートのうち「絹の道（オアシス＝ロード）」は砂漠のオアシス都市国家を結ぶルートで、非常に厳しいコースだが、東西を結ぶ最短コース。ほかに北の草原の道（ステップ＝ロード）、南の海の道（マリン＝ロード）。\n【スタサプ補足】中央ユーラシアの砂漠にはオアシスが点在し、オアシス都市間を結ぶ「オアシスの道」でラクダの隊商交易が発達。中国産の絹が主要な交易品だったため絹の道とも呼ばれる。草原の道はモンゴル高原からアルタイ山脈を経て南ロシア草原に至り、騎馬遊牧民の支配のもとで交易や文化交流が行われた。パルティア（現在のイラン・イラク）は絹の道の中継貿易で栄え、武帝はその東半分を支配した。',
  yoko:['匈奴 vs 武帝の抗争＝東西交易路の支配をめぐる抗争（『ヨコから見る』まとめ）','ローマ⇄パルティア⇄前漢の交易ルート'],src:'『ヨコから見る』p.38〜39／スタサプ 第2・4講',rel:['hanwu','xiongnu','parthia','dunhuang','大月氏','海の道']},
 '海の道':{img:[{src:'img/p54.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/02023_Roman_glass_bowl_decorated_with_ribs_found_in_Kosin.jpg/960px-02023_Roman_glass_bowl_decorated_with_ribs_found_in_Kosin.jpg',cap:'ローマのガラス器（1世紀）。海の道の交易品の一つ（Wikimedia Commons／CC BY 2.5）',w:'ローマ'}],n:'海の道（マリン＝ロード）',y:'現在の南シナ海〜インド洋〜紅海',b:'東西交易路の3つのルートのひとつ。ローマ帝国、サータヴァーハナ朝（現在のインド中南部）、後漢などを結んだ。義浄（『南海寄帰内法伝』）などが使用。',src:'『ヨコから見る』p.39',rel:['絹の道','rome_bc1','hanwu']},
 // ---- 矢印・事件 ----
 'ペルシア戦争':{img:[{src:'img/p55.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/The_tumulus_%28tomb%29_of_the_Athenians_at_Marathon.jpg/960px-The_tumulus_%28tomb%29_of_the_Athenians_at_Marathon.jpg',cap:'マラトンの戦いで戦死したアテネ兵の墳墓（ギリシア）（Wikimedia Commons／George E. Koronaios／CC0）',w:'マラトン'},{src:'img/p56.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Leonidas_Statue_01.jpg/960px-Leonidas_Statue_01.jpg',cap:'テルモピレーに立つスパルタ王レオニダスの像（Wikimedia Commons／Pimpinellus／CC BY-SA 4.0）',w:'スパルタ'}],n:'ペルシア戦争',y:'前500〜前449年｜現在のギリシア',b:'原因：アケメネス朝ペルシア（現在のイラン）によるイオニア（現在のトルコ西岸）諸都市（ギリシア都市）の圧迫→反乱が発生→アテネがこれを支援。経過：前490年マラトンの戦い（アテネの重装歩兵がダレイオス1世のペルシア軍を破る）、前480年テルモピレーの戦い（レオニダス率いるスパルタ（現在のギリシア南部）軍は勇敢に戦うも全滅）、前480年サラミスの海戦（フェニキア人（現在のレバノン沿岸）主体のペルシア海軍がアテネ海軍に敗北）、前479年プラタイアの戦い（アテネ・スパルタ連合軍がペルシアの陸軍を破る）。結果：ギリシア世界の勝利が決定、アテネはデロス同盟の盟主として以後繁栄。\n【スタサプ補足】前500年、ペルシア支配下のイオニアでミレトス（現在のトルコ西岸）を中心とするギリシア人ポリスが反乱をおこし、アテネが支援したことが発端。サラミスの海戦はテミストクレスの指揮。勝利後、ポリスはペルシアの再来に備えてデロス同盟を結び、アテネが盟主として支配体制を確立。軍船の漕ぎ手として活躍した下層市民も政治に参加するようになり、民主政の完成へつながった。',
  yoko:['第1ラウンド（ペルシア戦争）はギリシアが勝利。地中海の支配権はフェニキア人からギリシア人に移った（ヨコの鉄則）','第2ラウンドはアレクサンドロス大王の東方遠征'],src:'『ヨコから見る』p.26〜27／『同時に学べ』p.14／スタサプ 第2講',rel:['achaemenid','greece','athens','phoenicia','東方遠征']},
 '東方遠征':{img:[{src:'img/p12.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Alexander_the_Great_mosaic.jpg/960px-Alexander_the_Great_mosaic.jpg',cap:'イッソスの戦いのモザイク（ポンペイ出土）に描かれたアレクサンドロス（Wikimedia Commons／パブリックドメイン）',w:'アレクサンドロス'},{src:'img/p13.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Alexander_Sarcophagus%2C_Istanbul_Archaeological_Museums_2020.jpg/960px-Alexander_Sarcophagus%2C_Istanbul_Archaeological_Museums_2020.jpg',cap:'「アレクサンドロス石棺」のレリーフ。ペルシア軍と戦うアレクサンドロス（Wikimedia Commons／Kingbjelica／CC BY-SA 4.0）',w:'ダレイオス'}],n:'東方遠征',y:'前334〜前324年｜現在のギリシア〜パキスタン',b:'マケドニア（現在のギリシア北部）のアレクサンドロス大王が前334年に開始。前333年イッソス（現在のトルコ南部）の戦い、前331年アルベラ（現在のイラク北部）の戦いでダレイオス3世を破り、前330年アケメネス朝ペルシア（現在のイラン）を滅ぼした。矛先をインドに替えてパンジャーブ地方（現在のパキスタン・インド北西部）を平定するが、インド側で統一の機運が芽生えマウリヤ朝（現在のインド）が成立。征服地にはコイネーを普及させ、ギリシア人の東方移住とペルシア人との通婚を奨励、ペルシアの伝統を尊重する東西融合政策を行った。\n【スタサプ補足】マケドニア・ギリシア連合軍を率いて出発。イッソスの戦いのあとエジプトを征服し（アレクサンドリア（現在のエジプト北部）建設）、アルベラの戦いでペルシアを撃破、さらに西北インドまで達した。前323年の急死後、ディアドコイの領土争いで3王国に分裂。',
  yoko:['この時の中国は戦国時代（前403〜前221）','遠征がインド初の統一王朝マウリヤ朝を生んだ'],src:'『ヨコから見る』p.24〜29／『同時に学べ』p.15／スタサプ 第2講',rel:['alexander','achaemenid','maurya','pella','alexandria']},
 '匈奴の圧迫':{img:[{src:'img/p27.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Zhang_Qian.jpg/960px-Zhang_Qian.jpg',cap:'匈奴挟撃のため大月氏へ向かう張騫（敦煌莫高窟の壁画、唐代）（Wikimedia Commons／パブリックドメイン）'},{src:'img/p57.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/0/0a/Tree_on_the_Mongolian_steppe_%28June_1997%29.jpg',cap:'匈奴の本拠地モンゴル高原の草原（Wikimedia Commons／Damiano Luchetti／パブリックドメイン）',w:'モンゴル'}],kw:['匈奴'],n:'匈奴の圧迫と武帝の反撃',y:'前3〜前2世紀｜現在のモンゴル高原〜中国北部',b:'前漢は当初、モンゴル高原の遊牧国家である匈奴（現在のモンゴル高原）にかなり圧迫されており、事実上の属国のような存在だった。冒頓単于（ぼくとつぜんう）が白登山（はくとうざん、現在の中国山西省・大同）の戦いで劉邦（りゅうほう）に勝ち、以後前漢は和親政策をとる。武帝（位前141〜前87）が匈奴を破るまで続いた。前129年 衛青（えいせい）・霍去病（かくきょへい）の匈奴討伐で匈奴をゴビ砂漠の北に追い、前121年頃 河西四郡（かせいしぐん、現在の中国甘粛省）を設置して匈奴の補給路を断った。【スタサプ】前200年に高祖（こうそ）が冒頓単于に大敗。武帝はたびたび攻撃を加えて匈奴をゴビ砂漠の北に追いやり、オルドス地方にも勢力を伸ばした。',
  yoko:['匈奴と前漢の争いは絹の道（東西交易路）の支配をめぐる争い'],src:'『同時に学べ』p.16／『ヨコから見る』p.37〜38／スタサプ 第4講',rel:['xiongnu','hanwu','絹の道','大月氏']},
 'ポエニ戦争':{img:[{src:'img/p30.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Capuan_bust_of_Hannibal%2C_Republican_Rome.jpg/960px-Capuan_bust_of_Hannibal%2C_Republican_Rome.jpg',cap:'ハンニバルとされる胸像（カプア出土）（Wikimedia Commons／H. L. Havell (1913)／制限なし）',w:'ハンニバル'},{src:'img/p32.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/6/60/Joseph_Mallord_William_Turner_-_Snow_Storm%2C_Hannibal_and_his_Army_Crossing_the_Alps_-_WGA23167.jpg',cap:'アルプスを越えるハンニバル軍（ターナー画、1812年）（Wikimedia Commons／パブリックドメイン）',w:'アルプス'}],n:'ポエニ戦争',y:'前264〜前146年｜現在の地中海西部（イタリア・チュニジア・スペイン）',b:'第1次（前264〜前241）：カルタゴ（現在のチュニジア）はローマの海軍力を甘くみて油断。ローマの勝利に終わり、シチリア島を最初の属州として獲得。第2次（前218〜前201）：カルタゴのハンニバルがアルプスを越えてイタリアへ侵入し、前216年カンナエ（現在のイタリア南部）の戦いでローマ軍を包囲殲滅。前202年ザマ（現在のチュニジア）の戦いでローマ軍が北アフリカでハンニバルを破る。第3次（前149〜前146）：ローマの将軍小スキピオがカルタゴを徹底的に滅ぼす。ポエニ戦争に勝利したローマは西地中海の制海権を得た。\n【スタサプ補足】ローマとカルタゴの地中海の覇権争い。以後ローマはイタリア半島以外の占領地を属州として総督が軍隊で統治、徴税は騎士（エクイテス）が請け負う。属州からの安価な穀物の流入とラティフンディアの拡大で中小農民が没落し、「内乱の1世紀」の原因となった。',
  yoko:['ポエニ戦争の結果、ローマは農業国家から商業国家へと変貌','ザマの戦い（前202）は劉邦（りゅうほう）が前漢を建てたのと同年','ポエニ戦争が始まった頃（前264）、中国は戦国時代の末期'],src:'『ヨコから見る』p.33〜35／スタサプ 第2講',rel:['carthage','rome_bc1','hanwu']},
 // ---- 点線・注記 ----
 iron:{img:[{src:'img/p58.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Lion_Gate%2C_Hattusa_01.jpg/960px-Lion_Gate%2C_Hattusa_01.jpg',cap:'ヒッタイトの都ハットゥシャの獅子門（現在のトルコ）。ヒッタイトは早くから鉄を用いた（Wikimedia Commons／Bernard Gagnon／CC BY-SA 3.0）',w:'ヒッタイト'}],kw:['鉄器','鉄製'],n:'鉄器使用の広がり',y:'前10〜前7世紀｜現在の西アジア〜中国',b:'この時代の特徴は、鉄器の広がり。前1000年を過ぎると鉄器が広く使用され、生産力や軍事力の増大をもたらした。前7世紀には鉄製の武器を用いたアッシリア（現在のイラク北部）がオリエントを統一。中国では戦国時代初期までに鉄製農具・牛耕（ぎゅうこう）農法が普及し、インドでも前800年頃から鉄器を使用。【スタサプ】ヒッタイト（現在のトルコ）がアナトリアの製鉄技術を発展させ初めて鉄製武器を使用。アッシリアは前9世紀頃に鉄製の武器や戦車・騎兵隊を採用して強国化。中国では春秋戦国時代に鉄製農具と牛耕の使用で農業生産力が飛躍的に向上した。',
  yoko:['前6〜前5世紀、インド・中国ともに鉄器が普及して商工業・貨幣経済が著しく発展（ヨコの鉄則）'],src:'『同時に学べ』p.13／『ヨコから見る』p.14・16／スタサプ 第1・4講',rel:['assyria','zhou','buddhism']},
 socrates:{img:[{src:'img/p59.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Socrates_Louvre.jpg/960px-Socrates_Louvre.jpg',cap:'ソクラテス像（ルーヴル美術館）（Wikimedia Commons／パブリックドメイン）'},{src:'img/p11.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Plato-Musei_Capitolini.jpg/960px-Plato-Musei_Capitolini.jpg',cap:'プラトンの胸像（ローマ・カピトリーニ美術館）（Wikimedia Commons／Yair Haklai／CC BY-SA 3.0）',w:'プラトン'},{src:'img/p60.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Aristotle_Altemps_Inv8575.jpg/960px-Aristotle_Altemps_Inv8575.jpg',cap:'アリストテレスの胸像（リュシッポス原作の模刻、ローマ国立博物館）（Wikimedia Commons／パブリックドメイン）',w:'アリストテレス'}],n:'ソクラテスの活動',y:'前470頃〜前399年｜現在のギリシア・アテネ',b:'ギリシアの三大哲学者の筆頭。著作はひとつも残していないが、若者と対話しながら"無知の知"を説いてまわり、最後はアテネの国法に従って毒杯を飲み死んだ。弟子がプラトン（イデア論・哲人政治、アカデメイア）、その弟子がアリストテレス。前6世紀から小アジアのイオニア地方（ミレトス市など、現在のトルコ西岸）ではオリエントの先進諸国とも接しやすかったため自然哲学が興った（タレス・デモクリトス・ピタゴラスなど）。\n【スタサプ補足】市民が対等に議論するポリス社会が、合理的で人間中心の文化を生んだ。直接民主政の発達で弁論術の教師ソフィストが現れ、ソクラテスは問答法により真理の絶対性を説いた。アリストテレスは「万学の祖」と呼ばれ、その哲学はイスラームや中世ヨーロッパのスコラ学に大きな影響を与えた。',
  yoko:['中国の孔子（前551頃〜前479）、インドのガウタマ＝シッダールタ（前563頃〜前483頃）とほぼ同時代。共通の背景は商工業の発展と平民層の台頭'],src:'『ヨコから見る』p.17〜18・21／『同時に学べ』p.14／スタサプ 第2講',rel:['athens','greece','confucius','buddhism']},
 confucius:{img:[{src:'img/p61.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/5/54/Confucius_Tang_Dynasty.jpg',cap:'孔子像（唐・呉道子筆と伝わる）（Wikimedia Commons／パブリックドメイン）'},{src:'img/p62.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Temple_of_Confucius%2C_Qufu%2C_China_%2829315106624%29.jpg/960px-Temple_of_Confucius%2C_Qufu%2C_China_%2829315106624%29.jpg',cap:'孔子の故郷・曲阜（きょくふ）の孔子廟（Wikimedia Commons／brett Vachon／CC BY 2.0）',w:'儒家'}],n:'孔子の活動',y:'前551頃〜前479年｜現在の中国・山東省（魯）',b:'諸子百家の代表・儒家の祖。礼と仁（血縁中心の愛）を説き、周の封建制度の復活を願った。孟子（もうし、性善説・王道政治）、荀子（じゅんし、性悪説、弟子に韓非（かんぴ）や李斯（りし））が代表。ほかに道家（老子（ろうし）・荘子（そうし））、法家（商鞅（しょうおう）・韓非・李斯、秦で採用）、墨家（ぼくか、兼愛（けんあい）・非攻（ひこう））など。諸子百家は各国の富国強兵策の中で生まれたため「処世的（現実対応）」な性格が強く、中でも儒家は後世への影響がとても大きい。\n【スタサプ補足】春秋戦国時代には個人の能力が重視され、各国の君主が有能な人材を求めたため自由な思想が広がり、諸子百家が生まれた。孔子の教えと言行は『論語』に。孟子は徳治主義（とくちしゅぎ）による王道政治と易姓革命（えきせいかくめい）を説き、荀子は礼に基づく統治を説いた。法家（商鞅・韓非）は法治主義、道家（老子・荘子）は無為自然、墨家は兼愛・非攻、兵家（へいか、孫子・呉子（ごし））、陰陽家（いんようか、鄒衍（すうえん））、縦横家（じゅうおうか、蘇秦（そしん）の合従（がっしょう）策・張儀（ちょうぎ）の連衡（れんこう）策）など。',
  yoko:['前6〜前5世紀に三大哲学者・仏教・諸子百家が同時に現れた共通の背景は、商工業の発展と平民層の台頭','プラトンの哲人政治は孟子（もうし）の王道政治と似ている'],src:'『ヨコから見る』p.14〜15・17／『同時に学べ』p.14／スタサプ 第4講',rel:['zhou','socrates','buddhism','qin']},
 rice:{img:[{src:'img/p37.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/YoshinogariIseki.jpg/960px-YoshinogariIseki.jpg',cap:'吉野ヶ里遺跡（佐賀県）の復元集落（Wikimedia Commons／パブリックドメイン）'},{src:'img/p63.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Itazuke_Ruins.jpg/960px-Itazuke_Ruins.jpg',cap:'板付遺跡（福岡市）。最古級の水田跡がある（Wikimedia Commons／Muyo／CC BY-SA 3.0）',w:'九州北部'}],kw:['稲作','米づくり'],n:'九州北部で水田稲作',y:'前8世紀ごろ｜現在の福岡・佐賀',b:'縄文時代の最末期にあたり、紀元前8世紀ごろから九州北部で水田による米づくりが始まる。前5〜前4世紀ごろには東日本にまで広がり、弥生文化が始まる。【スタサプ】稲作は中国から伝わった。中国では淮河（わいが）以南の長江流域が湿潤な気候で稲作中心、以北の黄河流域は畑作中心。',src:'『同時に学べ』p.13〜14／スタサプ 第1・4講',rel:['jomon','jomon_yayoi','長江']},
 // ---- 川 ----
 'ナイル川':{img:[{src:'img/p64.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Nile_River%2C_Felucca_boats%2C_Aswan%2C_Egypt.jpg/960px-Nile_River%2C_Felucca_boats%2C_Aswan%2C_Egypt.jpg',cap:'ナイル川（エジプト・アスワン付近）（Wikimedia Commons／Vyacheslav Argenberg／CC BY 4.0）',w:'ナイル'}],n:'ナイル川',y:'現在のエジプト・スーダン',b:'エジプト文明の舞台（『同時に学べ』p.11 紀元前20世紀以前の地図）。前2・1世紀にはプトレマイオス朝エジプトの領域。【スタサプ】ナイル川の灌漑農業によって豊かな農耕文化が成立（「エジプトはナイルのたまもの」）。前7世紀にアッシリアがエジプトを征服、前525年にアケメネス朝（現在のイラン）が征服、前331年頃アレクサンドロスが征服してアレクサンドリア（現在のエジプト北部）を建設、プトレマイオス朝を経て前30年ローマの属州に。',src:'『同時に学べ』p.11／スタサプ 第1・2講',rel:['ptolemy','alexandria','assyria']},
 'ティグリス川':{img:[{src:'img/p65.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/The_Old_Bridge_and_The_Tigris_River-Mosul_03.jpg/960px-The_Old_Bridge_and_The_Tigris_River-Mosul_03.jpg',cap:'ティグリス川（現在のイラク・モスル付近）（Wikimedia Commons／Abdulsalam Al Dabbagh／CC BY-SA 4.0）',w:'ティグリス'}],n:'ティグリス川',y:'現在のトルコ〜イラク',b:'ユーフラテス川とともにメソポタミア文明の舞台（『同時に学べ』p.11）。前7世紀アッシリア（現在のイラク北部）、前6〜前4世紀アケメネス朝の中心域。【スタサプ】メソポタミア（現在のイラク）の富を求めて周辺の遊牧民が興亡をくり返した。前2世紀中頃、パルティア（現在のイラン・イラク）がメソポタミアを併合し、ティグリス川中流域に首都クテシフォン（現在のイラク・バグダード南東）を建設。',src:'『同時に学べ』p.11・13〜14／スタサプ 第1・2講',rel:['assyria','achaemenid','parthia']},
 'ユーフラテス川':{img:[{src:'img/p66.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Boat_on_Euphrates.jpg/960px-Boat_on_Euphrates.jpg',cap:'ユーフラテス川（現在のシリア）（Wikimedia Commons／Christiaan Briggs／CC BY-SA 3.0）',w:'メソポタミア'}],n:'ユーフラテス川',y:'現在のトルコ〜シリア〜イラク',b:'ティグリス川とともにメソポタミア文明の舞台（『同時に学べ』p.11）。【スタサプ】流域の都市バビロンはバビロン第1王朝・新バビロニア（現在のイラク）の都で、バビロン捕囚（前586〜前538）の舞台。',src:'『同時に学べ』p.11／スタサプ 第1講',rel:['assyria','achaemenid','babylon']},
 'インダス川':{n:'インダス川',y:'現在のパキスタン',b:'インダス文明の舞台（『同時に学べ』p.11）。アレクサンドロスの帝国は「ギリシアからインドの北西まで」及んだ。【スタサプ】ヒマラヤ・カラコルム山脈からインド北西部を南西に流れ、流域は西アジアとの回廊。アケメネス朝（現在のイラン）のダレイオス1世の領土はエーゲ海沿岸からインダス川（現在のパキスタン）に至り、アレクサンドロスもインダス川流域まで達した。マウリヤ朝（現在のインド）はインダス川流域のギリシア勢力を排して統一。',src:'『同時に学べ』p.11・15／スタサプ 第1〜3講',rel:['alexander','maurya','achaemenid']},
 'ガンジス川':{img:[{src:'img/p67.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Varanasi_Munshi_Ghat3.jpg/960px-Varanasi_Munshi_Ghat3.jpg',cap:'ガンジス川（インド・ヴァーラーナシー）（Wikimedia Commons／Marcin Białek／CC BY-SA 3.0）',w:'ガンジス'}],n:'ガンジス川',y:'現在のインド北部〜バングラデシュ',b:'アーリヤ人は前1000年頃、ガンジス川（現在のインド北部）流域に進出。豊かな土地と鉄器の使用（前800年頃）により農業生産は飛躍的に向上し、商工業も発展。マガダ国やコーサラ国（現在のインド北部）が統一をうかがい、この流域で仏教・ジャイナ教が生まれた。【スタサプ】ヒマラヤ山脈からインド北東部を東に流れる。前6世紀頃から中・下流域に城塞を持つ都市国家が多数生まれ、仏教はガンジス川中流から布教が始まった。マウリヤ朝の都パータリプトラ（現在のインド東部パトナ）も中流域。',src:'『ヨコから見る』p.16／スタサプ 第1・3講',rel:['buddhism','maurya','pataliputra']},
 '黄河':{img:[{src:'img/p68.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Shang_Ox_Bone_Oracle_Bone_01.jpg/960px-Shang_Ox_Bone_Oracle_Bone_01.jpg',cap:'殷の甲骨文字（牛の肩甲骨）（Wikimedia Commons／Gary Lee Todd／CC0）',w:'甲骨文字'}],kw:['黄河'],n:'黄河',y:'現在の中国北部',b:'黄河文明の舞台（『同時に学べ』p.11）。中国の黄河流域では高度に発達した青銅器を特徴とする殷（いん、現在の中国河南省）王朝があらわれ（前20〜前11世紀）、周がこれにとってかわった。【スタサプ】淮河（わいが）以北の黄河流域（華北）は降水量が少なく、中流域は肥沃な黄土（こうど）地帯で畑作中心。前6000年頃にアワ・キビの農耕が始まり、仰韶（ぎょうしょう）文化（彩陶（さいとう））→竜山（りゅうざん）文化（黒陶（こくとう））→前1600年頃に最古の王朝・殷（甲骨文字（こうこつもじ）・神権政治）。前11世紀に渭水（いすい）流域の周が殷を滅ぼした。',src:'『同時に学べ』p.11〜13／スタサプ 第1講',rel:['zhou','luoyi','haojing']},
 '長江':{img:[{src:'img/p69.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Three_gorges_on_the_Yangtze_river.jpg/960px-Three_gorges_on_the_Yangtze_river.jpg',cap:'長江の三峡（Wikimedia Commons／Jan Kranendonk／CC BY-SA 4.0）',w:'長江'}],kw:['長江'],n:'長江',y:'現在の中国中南部',b:'長江文明の舞台（『同時に学べ』p.11）。戦国時代、長江文明の後継である楚（そ、現在の中国長江中流域）は謎の蟻鼻銭（ぎびせん）を使った。【スタサプ】淮河（わいが）以南の長江流域（華中・江南）は季節風の影響で湿潤な気候→稲作中心。黄河文明と同時期に長江流域で稲作が定着。春秋時代には大国化した南方の楚が北方諸国の脅威となった。',src:'『同時に学べ』p.11／『ヨコから見る』p.15／スタサプ 第1・4講',rel:['zhou','rice']},
 // ======== 5・6世紀 ========
 'よそ者国家':{kw:['よそ者','寄せていく','郷に入っては郷にしたがえ'],n:'移動の末に成立した「よそ者」国家',y:'5〜6世紀｜ユーラシア各地',b:'3世紀から4世紀は混乱や民族移動の時代で、ゲルマン人たちの移動や中国への遊牧系民族の移動などが代表例。これらの民族はヨーロッパに多くのゲルマン人国家や、中国北部に「五胡十六国」と呼ばれる国家などをつくっていった。民族移動があったということは、裏を返せば、その地域にはもともと暮らしている人々がいたということ。そのような人々にとって、外来の民族は異なる文化や生活様式を持ち込んだ「よそ者」であり、その支配を受け入れ難く感じ、抵抗の意思を示す人もいたであろう。こうした民族移動を受けた5世紀から6世紀は、移動してきた民族によって多くの「よそ者」国家が建設され、そこにもとから住んでいた人々との摩擦が各地で生じていた時代。\n歴史上、多くの「よそ者」すなわち外来の民族が国家をつくっているが、それらの国々は文化の衝突や摩擦、抵抗に直面する。その解決策のひとつが「郷（ごう）に入っては郷にしたがえ」と、外からやってきた民族のほうから、もとからいた人々の文化や生活様式に「寄せていく」というやりかた。裏を返せば、その地を長く統治しようと思えばある程度は「寄せ」ざるを得ない（異民族のやりかたを強制的に押し付ける国家は反発を招き、すぐに滅亡する傾向にある）。5世紀から6世紀の国家の興亡の中で、外来の民族がそこに暮らす人々に「寄せていった」代表例となった国家が東西に存在する。それが、ヨーロッパのフランク王国と、中国北部の北魏。\n北魏の洛陽遷都は494年、フランク王の改宗は496年。奇しくも東西で同じように「寄せていく」動きが見られた。こうした「寄せていく」動きが功を奏して、この2つの国家はのちにそれぞれの地域の「本流」となっていく。フランク王国はカトリック教会と結びつきを深めヨーロッパに君臨する国家となり、中国では北魏の皇帝の家系を受け継ぐ一族の中から隋・唐という中国史上を代表するような皇帝の家系が登場する。',
  yoko:['494年 北魏の洛陽遷都（漢化政策）⇔496年 クローヴィスのアタナシウス派改宗：東西で同時に「寄せていく」動き（『同時に学べ』p.53）','クローヴィスと孝文帝は同時代の人。ともに多数派との融和策によって生きのびようとした（『ヨコから見る』p.66）','「よそ者」国家の中で長期政権になったのは西のフランク王国と東の北魏のみ（『ヨコから見る』p.66）'],
  src:'『同時に学べ』p.52〜53／『ヨコから見る』p.66',rel:['frank','n_wei','クローヴィスの改宗','孝文帝の漢化政策','ゲルマン諸国家']},
 'フン人の移動':{img:[{src:'img/p162.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Eugene_Ferdinand_Victor_Delacroix_Attila_fragment.jpg/960px-Eugene_Ferdinand_Victor_Delacroix_Attila_fragment.jpg',cap:'ドラクロワ「イタリアと諸芸術を蹂躙（じゅうりん）するアッティラ」（部分、19世紀）（Wikimedia Commons／パブリックドメイン）',w:'神の災い'},{src:'img/p139.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Attila-ChroniconPictum.jpg/960px-Attila-ChroniconPictum.jpg',cap:'アッティラ（14世紀ハンガリーの『絵入り年代記』の挿絵）（Wikimedia Commons／パブリックドメイン）',w:'アッティラ'}],kw:['フン人','アッティラ','カタラウヌム'],n:'フン人の移動とアッティラ王',y:'4世紀末〜5世紀半ば（451 カタラウヌムの戦い）｜現在のハンガリー〜フランス',b:'東西分裂したローマの西のほう、西ローマ帝国は395年の分裂後80年ほどは存続したが弱体化が進行し、その周囲では多くのゲルマン人国家が成立した。4世紀末に「ゲルマン人の大移動」が起きたが、ゲルマン人たちが移動先で様々な王国を形成したのが5世紀から6世紀にかけての時代。そもそも「ゲルマン人の大移動」のもとになったのが、東からやってきた「フン人」たちの移動。フン人がゲルマン人たちの東からやってきてゲルマン人たちを圧迫し、ゲルマン人たちは弾かれたビリヤードの球のようにヨーロッパ各地に移動した（このフン人は言語の類似性から中国の北方の「匈奴」と同一であり、匈奴の一部の「北匈奴」が西に移動して「フン人」となったという説がある。ユーラシアをまたにかける大きな民族移動の中に「ゲルマン人の大移動」があった、という説）。\n5世紀の前半、このフン人による圧迫にさらに勢いをつけたのが、ヨーロッパ世界にとっては「神の災い」とまでにおそれられたフン人の王アッティラ。アッティラに率いられたフン人と、フン人に服属していた東ゴート人らは力を強めながら西へ西へと征服をしていった。西へ西へと圧力をかけ続けるアッティラに対し、西ローマ帝国と西ゴート人やブルグンド人、フランク人などのゲルマン勢力は連合して戦い、451年のカタラウヌムの戦いでようやくアッティラを退けることに成功。しかし、なんとかアッティラを退けた西ローマ帝国もこの戦いで大きなダメージを受け、ますます衰退することになる。\n【『ヨコから見る』】フン人は、おそらくは中国の西北にいた匈奴ではないかといわれている。確証はないが、遊牧騎馬民族の移動の速さと距離を考えると納得できる。匈奴は秦の始皇帝や前漢の武帝を悩ませたほどの部族だから、この侵入に黒海北岸の東ゴート人はたまらず降伏し、さらに西岸の西ゴート人は保護を求めてローマ領内に入る（375）（ヨコの鉄則：フン人の移動→東ゴート人を征服、西ゴート人はローマ帝国内に逃げこむ）。ローマに入った西ゴート人は態度が悪く、378年アドリアノープルの戦いではローマ皇帝ヴァレンスを敗死させる。「質素で、あまりしゃべらず、林のように静かで、類まれなリーダーシップを持った人物」と評されたアッティラ王が死ぬと、フン帝国も瓦解（がかい）してしまう。\n【スタサプ補足】4世紀半ば、アジア系遊牧民族のフン人が中央アジアからヨーロッパへ移動開始→黒海北岸の東ゴート人を服属させ、ドナウ川沿いの西ゴート人を圧迫。375年 西ゴート人は南下して翌年ドナウ川を渡りローマ帝国内に流入、他のゲルマン諸部族も帝国内に大規模な移動を開始（約200年にわたるゲルマン人の大移動）。フン人はアッティラ王（位433〜453）によりパンノニア（現ハンガリー）を拠点として大帝国を築く。',
  yoko:['北匈奴の西走（1〜2世紀）→フン人としてヨーロッパへ（4世紀）→ゲルマン人の大移動：ユーラシアをまたにかける民族移動（『同時に学べ』p.54）','同じ5世紀、中央アジアではエフタル（白匈奴）がササン朝を圧迫しグプタ朝を滅ぼす。フン人・エフタルとも匈奴の一派とする説が強く、匈奴がこの時代の主役といってもよい（『ヨコから見る』p.61）'],
  src:'『同時に学べ』p.54〜55／『ヨコから見る』p.61〜62／スタサプ 第7講',rel:['ゲルマン諸国家','西ローマ帝国の滅亡','hephthalite','n_xiongnu','フン人の西進']},
 'ゲルマン諸国家':{img:[{src:'img/p151.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Sutton_Hoo_helmet_2016.png/960px-Sutton_Hoo_helmet_2016.png.jpg',cap:'サットン＝フー出土のアングロ＝サクソン人の兜（7世紀初め、大英博物館）（Wikimedia Commons／Geni／パブリックドメイン）',w:'アングル人'},{src:'img/p150.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Vandal_cavalryman%2C_c._AD_500%2C_from_a_mosaic_pavement_at_Bordj_Djedid_near_Carthage.jpg/960px-Vandal_cavalryman%2C_c._AD_500%2C_from_a_mosaic_pavement_at_Bordj_Djedid_near_Carthage.jpg',cap:'ヴァンダル人の騎兵（500年ごろ、カルタゴ近郊出土のモザイク）（Wikimedia Commons／パブリックドメイン）',w:'ヴァンダル'},{src:'img/p118.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Visigothic_-_Pair_of_Eagle_Fibula_-_Walters_54421%2C_54422.jpg/960px-Visigothic_-_Pair_of_Eagle_Fibula_-_Walters_54421%2C_54422.jpg',cap:'西ゴート人の鷲形フィブラ（留め金、6世紀）（Wikimedia Commons／パブリックドメイン）',w:'西ゴート王国'}],kw:['西ゴート王国','東ゴート王国','ヴァンダル王国','ブルグンド王国','七王国','アングロ＝サクソン','ランゴバルド','テオドリック','ガイセリック'],n:'ゲルマン人国家の成立',y:'5世紀（418 西ゴート／429 ヴァンダル／443 ブルグンド／449 七王国／481 フランク／493 東ゴート）｜ヨーロッパ〜北アフリカ',b:'フン人の移動にまず直面したのが、ゲルマン人の中でも東ゴート人と呼ばれる人々。東ゴート人はフン人に征服され、しばらく服属していた。隣接する西ゴート人はフン人に圧迫されて西に進み、バルカン半島、イタリア半島と大きく移動してイベリア半島に達し、そこに定着して418年に西ゴート王国を建国。同じように、ヴァンダル人はもともとの居住地を遠く離れて429年に北アフリカにヴァンダル王国を、ブルグンド人は443年に現在のフランス中東部にブルグンド王国を、フランク人は481年にフランス北部にフランク王国を、アングル人やサクソン人、ジュート人と呼ばれる人々は449年のブリタニア（現在のイギリスのブリテン島）に進入したことを皮切りに、中部から南部にわたって「七王国」と呼ばれる7つの国をたてた。\n【『ヨコから見る』】西ゴート王国（418〜711）黒海西岸→イベリア半島、都トレド、ウマイヤ朝に滅ぼされる／東ゴート王国（493〜555）黒海北岸→イタリア半島、都ラヴェンナ、テオドリック王が建国、ユスティニアヌス大帝により滅亡／ヴァンダル王国（429〜534）ドイツ→アフリカ北部、ガイセリック王が建国、ユスティニアヌス大帝により滅亡／ブルグンド王国（443〜534）北ドイツ→ガリア東部、フランク王国により滅亡／ランゴバルド王国（568〜774）ドイツ→イタリア北部、フランク王国のカール大帝により滅亡／フランク王国（481〜843）ライン東岸→ガリア北部、西ヨーロッパ世界を統一／アングロ＝サクソン七王国（449〜829）ユトランド半島→ブリタニア、829年エグバートがイングランド王国として統一。この中でフランク王国のみが発展を遂げる。ゲルマン人の中で最も移動距離が短かったのはフランクで、ライン右岸から左岸に膨張する形で移動したため自分たちの社会・制度を破壊することを免れることができた。西ゴートを率いたアラリックはローマを略奪した後（410）アフリカをめざすが船が難破して水死。8歳から東ローマの捕虜となった東ゴート王国のテオドリックはローマに憧れを抱き、ラテン文化の復興に努め、ゲルマン国家の中では最も繁栄した。しかしヴァンダル王国はローマ人を圧迫して反発を招き、東ゴート王国もその繁栄が東ローマの警戒心を呼び起こし、結局ともに東ローマのユスティニアヌス帝によって滅ぼされてしまう（ヨコの鉄則）。\n【スタサプ補足】ゲルマン人の大移動によって建てられた各王国は、移住先で機能していたローマ帝国の法や行政制度を継承した。移動距離が短かったフランク人やアングロ＝サクソン人は長期的に王国を維持した。',
  yoko:['東ゴート王国・ヴァンダル王国は東ローマのユスティニアヌス帝に滅ぼされる（534・555）（『ヨコから見る』p.63）','同じ5世紀、中国北部でも「よそ者」の五胡が国を建て、鮮卑の北魏が華北を統一（439）（『同時に学べ』p.52・61）'],
  src:'『同時に学べ』p.54〜55／『ヨコから見る』p.62〜63／スタサプ 第7講',rel:['フン人の移動','西ローマ帝国の滅亡','frank','e_rome','toledo','ravenna']},
 '西ローマ帝国の滅亡':{img:[{src:'img/p152.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Mausoleum_of_Theodoric_%28Ravenna%29_-_Exterior.jpg/960px-Mausoleum_of_Theodoric_%28Ravenna%29_-_Exterior.jpg',cap:'東ゴート王テオドリックの廟（ラヴェンナ）（Wikimedia Commons／ThePhotografer／CC BY-SA 4.0）',w:'テオドリック'}],kw:['オドアケル','西ローマ帝国の滅亡','476'],n:'西ローマ帝国の滅亡（476年）',y:'476年｜現在のイタリア',b:'なんとかアッティラを退けた西ローマ帝国もカタラウヌムの戦い（451）で大きなダメージを受け、ますます衰退することになる。476年にローマの将軍であったゲルマン人の傭兵隊長のオドアケルに皇帝の位を廃止させられて、西ローマ帝国は滅亡する。しかし、このオドアケルがつくった王国も、フン人の支配を脱した東ゴート人に乗っ取られ、東ゴート王国に取って代わられる（493）。\n【スタサプ補足】アッティラ王の死後フン人の大帝国は崩壊。476年、ゲルマン人傭兵隊長のオドアケルにより西ローマ帝国が滅亡。東ゴート人はテオドリック王に率いられてイタリアに侵入し、493年にオドアケルを倒して建国→555年ビザンツ帝国のユスティニアヌス大帝により滅亡。',
  yoko:['西ローマ帝国滅亡（476）⇔北魏の華北統一（439）：西では帝国が消え、東では「よそ者」王朝が統一（『同時に学べ』p.50〜51の地図）','西ローマは滅んだが東ローマ帝国は安定した勢力を維持し、ローマの伝統（文学・法律・技術）が東ローマに受け継がれ「保存」された（『同時に学べ』p.58）'],
  src:'『同時に学べ』p.55／スタサプ 第7講',rel:['フン人の移動','ゲルマン諸国家','e_rome','odoacer']},
 odoacer:{img:[{src:'img/p163.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Coin%2C_Theodoric_LACMA_M.82.15.3_%282_of_2%29.jpg/960px-Coin%2C_Theodoric_LACMA_M.82.15.3_%282_of_2%29.jpg',cap:'東ゴート王テオドリックの貨幣（ロサンゼルス・カウンティ美術館）（Wikimedia Commons／パブリックドメイン）',w:'テオドリック'}],kw:['オドアケルの王国'],n:'オドアケルの王国',y:'476〜493｜現在のイタリア',b:'476年に西ローマ帝国を滅ぼしたゲルマン人傭兵隊長オドアケルがイタリアに建てた王国。フン人の支配を脱した東ゴート人（テオドリック王）に乗っ取られ、493年に東ゴート王国に取って代わられた。',
  src:'『同時に学べ』p.55／スタサプ 第7講',rel:['西ローマ帝国の滅亡','ゲルマン諸国家']},
 frank:{img:[{src:'img/p140.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Saint_Remy_baptise_Clovis.jpg/960px-Saint_Remy_baptise_Clovis.jpg',cap:'聖レミによるクローヴィスの洗礼（後世の版画）（Wikimedia Commons／パブリックドメイン）',w:'クローヴィス'}],kw:['フランク王国','クローヴィス','メロヴィング朝'],n:'フランク王国',y:'481〜｜現在のフランス北部',b:'ゲルマン人の国家の多くは短命だったが、その中で強大化していったのがゲルマン人の一派であるフランク人が建国したフランク王国。「フランス」の語源が「フランク」であるように、現在のフランス北部に建国された国家。フランク王国が力をつけた理由のひとつが、初代国王であるクローヴィスが496年に行った、アタナシウス派（カトリック）への改宗。481年にフランク人の一派の王となったクローヴィスは周辺民族との抗争やフランク人内部の抗争に勝利し、フランク人唯一の王になる。もともと、フランク王国をはじめゲルマン人国家が建国された地域は昔のローマ帝国の領内で、もともとのローマ人の貴族層が「地域の顔役」として存在しており、ローマの統治のしくみが根強く残っていた。こうした地域にフランク人は「よそ者」として移動してきて国をたてたわけなので、古くから「地域の顔役」として存在しているローマ人の貴族層の協力を得ることなしには統治がスムーズにできない。この貴族層の多くはローマ帝国で国教となっていたキリスト教正統派のアタナシウス派（カトリック）の司祭と深いかかわりがあった。\n【『ヨコから見る』】ゲルマン人は国家を作ったといっても人口の数％を占めるにすぎず、国民の90％以上はアタナシウス派のローマ人だった。しかし大半のゲルマン国家はアリウス派を信仰していたため、ローマ人との協調・融和が困難だった。その中で、481年メロヴィング朝を開いたクローヴィス（位481〜511）のみがアタナシウス派に改宗し（496）、ローマ人との協力関係を築くことに成功した（クローヴィスはアラマン人との戦いでイエスに祈ったところ大勝利を収めた、それが改宗の理由だともいわれている）。\n【スタサプ補足】フランク人はライン川東岸を原住地とするゲルマン人の一派。各部族はクローヴィスによって統一され、5世紀にガリアに侵入、481年ガリア（現フランス）北部にフランク王国を建国。',
  yoko:['フランク王国（西）と北魏（東）：4〜5世紀の東西同時進行の民族大移動期に長期政権となった2つの「よそ者」国家。ともに多数派との融和策で生きのびた（『ヨコから見る』p.66）','クローヴィスの改宗（496）⇔孝文帝の洛陽遷都（494）（『同時に学べ』p.53）'],
  src:'『同時に学べ』p.53・55〜56／『ヨコから見る』p.62〜63／スタサプ 第7講',rel:['クローヴィスの改宗','よそ者国家','ゲルマン諸国家','カトリックの定着','n_wei']},
 'クローヴィスの改宗':{kw:['クローヴィス','アタナシウス派への改宗','496'],n:'クローヴィスのカトリック改宗（496年）',y:'496年｜現在のフランス',b:'クローヴィスはもともとキリスト教を信仰していなかったが、自らキリスト教、とりわけ正統派のアタナシウス派に改宗する（クローヴィスの改宗と時を同じくして、3000人のフランク人たちも改宗したという）ことで、旧ローマ帝国の貴族層に「寄せて」いった。その結果、旧ローマ帝国の貴族層との協力関係がつくられ、国家の運営がスムーズになったことが、フランク王国の発展につながった。\n【『ヨコから見る』】フランク王国のみが発展を遂げた最も大きな要因は、クローヴィスのアタナシウス派（正統教義）への改宗。アタナシウス派＝イエスは神、ローマ人が信仰／アリウス派＝イエスは人間、ゲルマン人が信仰／ネストリウス派＝イエスは神性・人性の両面を持つ、イランと中国に拡大。特別講義「中国と西欧を比較してみよう」：フランク王国は①496年クローヴィスがアタナシウス派に改宗、②移動距離少なくローマの制度・文化との融合が可能→ローマ人・教会の支持獲得。北魏は孝文帝（位471〜499）の漢化政策（中国文化尊重、鮮卑語・鮮卑服の禁止、胡漢通婚の奨励）→漢民族との融和に成功。クローヴィスと孝文帝は同時代の人で、ともに多数派との融和策によって生きのびようとしたことは興味深い。',
  yoko:['496年 クローヴィスの改宗⇔494年 北魏の洛陽遷都：東西同時の「寄せていく」動き（『同時に学べ』p.53）','アリウス派（ゲルマン人）とアタナシウス派（ローマ人）の対立が、多くのゲルマン国家が短命に終わった理由（『ヨコから見る』p.63）'],
  src:'『同時に学べ』p.56／『ヨコから見る』p.62〜63・66',rel:['frank','孝文帝の漢化政策','よそ者国家','christianity_34','カトリックの定着']},
 'カトリックの定着':{img:[{src:'img/p158.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Pope_St_Gregory_the_Great_Dictating_Chants_from_Antiphonary_of_Hartker_of_Monastery_of_St_Gall%2C_circa_1000_%2835810435992%29.jpg/960px-Pope_St_Gregory_the_Great_Dictating_Chants_from_Antiphonary_of_Hartker_of_Monastery_of_St_Gall%2C_circa_1000_%2835810435992%29.jpg',cap:'教皇グレゴリウス1世（1000年ごろの写本挿絵、ザンクト＝ガレン修道院）（Wikimedia Commons／パブリックドメイン）',w:'グレゴリウス1世'}],kw:['グレゴリウス1世','教皇','修道院','カトリックの定着'],n:'西ヨーロッパに定着したカトリック',y:'6世紀（590 グレゴリウス1世）｜西ヨーロッパ',b:'クローヴィスの改宗や、6世紀の「大教皇」と呼ばれたローマ教皇グレゴリウス1世の布教などにより、カトリックは西ヨーロッパに定着することになった。このころ、ローマ教会の長は教皇という称号を用いるようになる。また、キリスト教の布教には、修道院で信仰を深める修道士たちが大きな役割を果たした。\n【スタサプ補足】キリスト教がローマ帝国の国教となり、帝政末期には5つの管区（ローマ・コンスタンティノープル・アンティオキア・イェルサレム・アレクサンドリア＝五本山）に分けて信徒を管理。ローマ教会は使徒ペテロの後継者を自認し、ローマの司教は教皇（法王）を自称。ゲルマン人の移動で西ローマが滅亡し、イタリアはオドアケルの国・東ゴート王国・ランゴバルド王国の支配を受けてローマ＝カトリック教会は弱体化、ビザンツ帝国の保護下にあるギリシア正教会（コンスタンティノープル教会）が優勢になった。529年 ベネディクトゥスがモンテ＝カシノ修道院を創設。',
  yoko:['西ではカトリック教会と修道院、東（中国）では北魏の仏教保護と石窟寺院（雲崗・竜門）——「よそ者」国家がともに宗教を統治に活用（『同時に学べ』p.56・61）'],
  src:'『同時に学べ』p.56／スタサプ 第7講',rel:['frank','クローヴィスの改宗','e_rome']},
 '三大勢力':{kw:['ユーラシアの三大勢力','真の主役','三大帝国'],n:'6世紀ユーラシアの「三大勢力」',y:'6世紀｜東ローマ帝国・ササン朝ペルシア・突厥',b:'ヨーロッパから視点を東に移すと、6世紀のユーラシア大陸に存在する3つの国家の存在感が際立ち、分裂状態にあったヨーロッパと中国を尻目に、大きな勢力圏をつくっていることがわかる。その3つの国家が、西から「東ローマ帝国」「ササン朝ペルシア」「突厥（とっけつ）」。世界史の授業では、どうしてもヨーロッパや中国といった耳になじみがある地域が「主役」のようにクローズアップされる傾向にある（「フランク王国」や「隋」の名前は一度は聞いたことがあるだろうし、「遣隋使」は小学校の歴史の教科書にも書かれる日本史の定番ワード）。一方で「東ローマ帝国」「ササン朝ペルシア」「突厥」の3つの国家は、この時代の主役級の存在なのに、それが一体どのような国家なのか、世界史の中でどのような役割を果たしているのか知らないという人も多い。じつは、この3つの国家は大きな影響を世界の歴史に及ぼしている「真の主役」ともいえる国家。',
  yoko:['6世紀：西ヨーロッパはゲルマン諸国家が分立、中国は南北朝の分裂→その間で東ローマ・ササン朝・突厥が大勢力圏（『同時に学べ』p.57）','ササン朝と突厥は同盟してエフタルを挟撃（560年頃）、ホスロー1世とユスティニアヌスは最盛期同士で激突（『ヨコから見る』p.70〜72）'],
  src:'『同時に学べ』p.57・64',rel:['e_rome','sassanid_56','tujue','justinian']},
 e_rome:{img:[{src:'img/p122.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Theodosian_Walls_of_Constantinople%2C_Istanbul_%2824053561188%29.jpg/960px-Theodosian_Walls_of_Constantinople%2C_Istanbul_%2824053561188%29.jpg',cap:'コンスタンティノープルのテオドシウスの城壁（5世紀）（Wikimedia Commons／Carole Raddato／CC BY-SA 2.0）',w:'コンスタンティノープル'}],kw:['東ローマ帝国','ビザンツ帝国','ローマの伝統'],n:'東ローマ帝国（ビザンツ帝国）',y:'395〜1453｜現在のトルコ・バルカン半島（都コンスタンティノープル）',b:'東ローマ帝国は、ローマ帝国が東西に分裂した「東」のほうの国家。じつは東ローマ帝国は「東ローマ」といわれるものの、東ローマ帝国の人々にとっては、ローマ帝国の後期の都であるコンスタンティノポリス（コンスタンティノープル）をそのまま都とする「ローマ帝国」に変わりなく、呼び名もそのまま「ローマ帝国」だった。西ヨーロッパ世界はゲルマン人の大移動をはじめとする混乱状況にあり、西ローマ帝国も滅亡した。その一方で、東ローマ帝国は安定した勢力を維持している。このことは、ローマの伝統（文学や法律、技術など）が東ローマ帝国に受け継がれ「保存」されることを意味する。もし、ローマが東西ともに滅んでいたら、ローマの文化は今に伝わっていないかもしれない。ローマ帝国の文化がヨーロッパの文化のひとつの基礎として現在にも影響を与えているのも、東ローマ帝国の存在のおかげ。5世紀に西ローマ帝国が滅びると、東ローマ皇帝はローマ帝国の伝統を引き継ぐ唯一の皇帝として周囲の国々からは「一目置かれる存在」として見られ、皇帝たちは西ヨーロッパのゲルマン人国家の分立を尻目に、時にはゲルマン人国家の対立をあおって勢力の保持につとめた。\n【スタサプ補足】ゲルマン人の移動による影響も少なく繁栄を続けたビザンツ帝国の保護下にあるギリシア正教会が優勢になった。ギリシア語が典礼用語。',
  yoko:['西ローマ滅亡（476）後も東ローマは安定→ローマの伝統を「保存」。同じころ中国では南朝（建康）が漢民族の貴族文化（六朝文化）を守った——東西で「古い文化の保存者」が並ぶ','ササン朝との長い抗争は東ローマとササン朝双方の疲弊を招き、7世紀のイスラームの進出を許す（『同時に学べ』p.59）'],
  src:'『同時に学べ』p.57〜58／スタサプ 第7講',rel:['justinian','constantinople','三大勢力','sassanid_56','rome_34']},
 justinian:{img:[{src:'img/p166.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Corpus_Iuris_Civilis%2C_Fragment_%2818506481224%29.jpg/960px-Corpus_Iuris_Civilis%2C_Fragment_%2818506481224%29.jpg',cap:'『ローマ法大全』の写本断片（Wikimedia Commons／UVic Libraries／制限なし）',w:'ローマ法大全'},{src:'img/p165.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Interior_of_Hagia_Sophia_%289%29_-_Istanbul_%282022%29.jpg/960px-Interior_of_Hagia_Sophia_%289%29_-_Istanbul_%282022%29.jpg',cap:'ハギア＝ソフィア聖堂の内部と大ドーム（Wikimedia Commons／ImanFakhri／CC BY-SA 4.0）',w:'ビザンツ様式'},{src:'img/p153.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Mosaic_of_Theodora_-_Basilica_San_Vitale_%28Ravenna%29.jpg/960px-Mosaic_of_Theodora_-_Basilica_San_Vitale_%28Ravenna%29.jpg',cap:'皇后テオドラのモザイク（ラヴェンナ、サン＝ヴィターレ聖堂）（Wikimedia Commons／Petar Milošević／CC BY-SA 4.0）',w:'テオドラ'},{src:'img/p141.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Mosaic_of_Justinianus_I_-_Basilica_San_Vitale_%28Ravenna%29.jpg/960px-Mosaic_of_Justinianus_I_-_Basilica_San_Vitale_%28Ravenna%29.jpg',cap:'ユスティニアヌス帝のモザイク（ラヴェンナ、サン＝ヴィターレ聖堂）（Wikimedia Commons／Petar Milošević／CC BY-SA 4.0）',w:'ユスティニアヌス'},{src:'img/p142.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Hagia_Sophia_Mars_2013.jpg/960px-Hagia_Sophia_Mars_2013.jpg',cap:'ハギア＝ソフィア聖堂（イスタンブール）。ユスティニアヌス帝が再建（Wikimedia Commons／Arild Vågen／CC BY-SA 3.0）',w:'聖ソフィア聖堂'}],kw:['ユスティニアヌス','ローマ法大全','聖ソフィア聖堂','ハギア＝ソフィア','ベリサリオス','テオドラ','養蚕'],n:'「大帝」ユスティニアヌス',y:'位527〜565｜東ローマ帝国',b:'この時代の代表的な東ローマ皇帝が6世紀半ばに登場したユスティニアヌス。ユスティニアヌスは有能な将軍を登用して地中海の再統一に乗り出し、ゲルマン人国家のヴァンダル王国（534）と東ゴート王国（555）を滅ぼし、西ゴート王国の南部も獲得して、地中海を取り巻く部分のローマ帝国の領土をほぼ回復した。この功績からユスティニアヌスは「大帝」と呼ばれることになる。ユスティニアヌスはローマ皇帝の後継者として、古代ローマの法を集めた『ローマ法大全』をつくらせ、首都コンスタンティノープルに壮大な聖ソフィア聖堂を建造した。この聖堂はのちのオスマン帝国の建築に大きな影響を与える。ユスティニアヌスの死後、東ローマ帝国の勢いは衰え、バルカン半島にはスラヴ人が進出し、イタリア半島はゲルマン人の一派であるランゴバルド人に奪われ、さらにはササン朝からの圧迫に苦しめられるようになる。\n【『ヨコから見る』】ビザンツ（東ローマ）帝国で最も有名な皇帝といえばユスティニアヌス帝（位527〜565）に間違いない（入試でビザンツ皇帝に迷ったら、この皇帝名を書くと案外当たる）。実権は妻のテオドラが握っていたともいわれる（熊遣いの娘でサーカスの踊り子の身分から后の座まで昇りつめ、首都コンスタンティノープルで発生したニカの反乱では逃げる皇帝を励まし、将軍ベリサリオスを使って鎮圧）。業績：①外征・イタリアの東ゴート王国を滅ぼす、北アフリカのヴァンダル王国を滅ぼす、イベリア半島の西ゴート王国の一部を奪う。②内政・ハギア（セント）＝ソフィア聖堂を再建、『ローマ法大全』の編纂（トリボニアヌスらに命じる）、非キリスト教文化の弾圧（529年アカデメイアの閉鎖）。冷静に見てみると新しいものをひとつも作っていない——ローマ時代にあったものの再建（聖堂）か、集大成（法典）か、排除（アカデメイア閉鎖）。とはいえ一時的にせよローマ地中海帝国の再現に成功した（ヨコの鉄則）。経済政策では養蚕業の導入も重要で、以後絹織物業は帝国の主要産業として大いに富をもたらした（絹の本場中国は養蚕業を独占しようとしていたが、この時代についに原料の謎が漏れてしまった。ある女性がこっそり髪の中に蚕を隠して運んだともいわれる）。\n【スタサプ補足】6世紀のユスティニアヌス大帝はかつてのローマ帝国の領土を再現し、『ローマ法大全』（法学者トリボニアヌスら）を編纂して帝国の権威を高め、コンスタンティノープルにハギア＝ソフィア大聖堂を再建して総主教座を置いた。『ローマ法大全』はのちにヨーロッパ社会の法体系の規範となった。',
  yoko:['最盛期同士の対決：ユスティニアヌス帝（ビザンツ）vs ホスロー1世（ササン朝）は決着つかず（『ヨコから見る』p.71）','ユスティニアヌスがアカデメイアを閉鎖（529）→行き場を失った学者がササン朝へ流れこみ、ホスロー1世が保護（『ヨコから見る』p.72）','養蚕業の導入：中国が独占していた絹の技術が6世紀に西へ（『ヨコから見る』p.72）','ユスティニアヌスの地中海再統一（534〜555）⇔隋の中国統一（589）：東西で「再統一」がほぼ同世紀（『同時に学べ』p.58・62）'],
  src:'『同時に学べ』p.58／『ヨコから見る』p.71〜72／スタサプ 第2・7講',rel:['e_rome','ゲルマン諸国家','sassanid_56','hosrow','constantinople','三大勢力']},
 sassanid_56:{img:[{src:'img/p168.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Glass_bowl_MET_me34_107_71.jpg/960px-Glass_bowl_MET_me34_107_71.jpg',cap:'ササン朝のカットグラス碗（メトロポリタン美術館）。正倉院の白瑠璃碗（はくるりのわん）と同じ型（Wikimedia Commons／CC0）',w:'正倉院'},{src:'img/p167.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Capital_of_Khosrow_II%2C_Taq-e_Bostan.jpg/960px-Capital_of_Khosrow_II%2C_Taq-e_Bostan.jpg',cap:'ターケ＝ボスターン（イラン）のササン朝後期の柱頭（Wikimedia Commons／Sajad Arya Kia／CC BY-SA 4.0）',w:'ゾロアスター教'},{src:'img/p143.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/001125-TaqKasra-Iraq-IMG_7914-2.jpg/960px-001125-TaqKasra-Iraq-IMG_7914-2.jpg',cap:'クテシフォンの宮殿跡「ターク＝キスラー」（イラク）。ホスロー1世の時代の造営とも（Wikimedia Commons／Safa.daneshvar／CC BY-SA 4.0）',w:'ササン朝'}],kw:['ササン朝の強大化','ホスロー1世','エフタル'],n:'ササン朝ペルシア（5〜6世紀：弱体化→再強大化）',y:'5世紀後半 エフタルに苦戦／6世紀 ホスロー1世の最盛期｜現在のイラン・イラク',b:'前章で成立についてお話ししたササン朝については、5世紀後半に一時的に弱体化したが、6世紀には再び強大化している。初期のササン朝のライバルはローマ帝国だったが、ローマ帝国の分裂後もライバル関係が東ローマ帝国に引き継がれる。5世紀になると、中央ユーラシアのエフタルという民族の侵攻に苦しめられ一時は衰えるが、6世紀に入ると国王ホスロー1世が登場し、突厥と結んでエフタルを挟み撃ちにして滅ぼし、ササン朝の勢いは再び盛んになった。一時は東ローマ帝国にもかなりの優位を誇っていた。しかし、東ローマ帝国との長い抗争はササン朝の疲弊を招き、ホスロー1世の死後、ササン朝は衰退に向かう。ササン朝が世界史に与えた大きな影響は、その文化。精巧な工芸品をはじめとするササン朝の文化の影響は、日本の工芸品にも（獅子のモチーフなどによって）見られる。ササン朝の文化はイランの地を支配したイスラーム教徒に引き継がれ、各地にその影響が見られるようになる。\n【『ヨコから見る』】5世紀頃、中央アジアではエフタルが強大化。エフタルについて詳しいことはわかっていない（イラン系ともトルコ系ともいわれるが、非常に高い文化水準を持ち、軍事力も中央アジアでは最強）。エフタルの南下・北インドへの侵入によりグプタ朝が衰退し、やがて滅亡。さらに西方のササン朝ペルシアをも圧迫し、ササン朝は異端マズダク教の流行とも重なって政治は大きく揺れ動く。\n【スタサプ補足】ホスロー1世（位531〜579）は5世紀に中央アジアの遊牧民エフタルの侵入を受けたが、トルコ系遊牧民突厥と結びこれを滅ぼし、東ローマ帝国（ビザンツ帝国）との抗争でも優位に立った。',
  yoko:['エフタル（中央アジア）がササン朝を圧迫し、グプタ朝を衰退させた（『ヨコから見る』p.61）','ササン朝と突厥の同盟（560年頃）で中央アジア最強の国家エフタルが滅亡（『ヨコから見る』p.71）','ササン朝の工芸→日本の正倉院の宝物（獅子狩文錦など）（『同時に学べ』p.59）'],

 hosrow:{img:[{src:'img/p169.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Coin_of_Kavad_I%2C_possibly_minted_in_Susa.jpg/960px-Coin_of_Kavad_I%2C_possibly_minted_in_Susa.jpg',cap:'ホスロー1世の父カワード1世の銀貨（Wikimedia Commons／LouisAragon／CC BY-SA 2.5）',w:'中央集権'},{src:'img/p160.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Silver_plate_showing_a_king_hunting_lions%2C_Late_Sasanian_period%2C_5th-7th_century_%282%29.jpg/960px-Silver_plate_showing_a_king_hunting_lions%2C_Late_Sasanian_period%2C_5th-7th_century_%282%29.jpg',cap:'獅子狩りをする王を描いたササン朝後期の銀皿（5〜7世紀）。正倉院の宝物にも影響（Wikimedia Commons／HistoryofIran／CC BY-SA 4.0）',w:'工芸'},{src:'img/p144.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Plate_of_Khosrow_I_Anushirvan.jpg/960px-Plate_of_Khosrow_I_Anushirvan.jpg',cap:'ホスロー1世の姿を刻んだササン朝の銀皿（Wikimedia Commons／HistoryofIran／CC BY-SA 4.0）',w:'ホスロー1世'}],kw:['ホスロー1世','ジュンディー＝シャープール','学術保護','ニハーヴァンド'],n:'ホスロー1世',y:'位531〜579｜ササン朝ペルシア',b:'ユスティニアヌス帝の良きライバルといわれたのが、ササン朝ペルシアのホスロー1世（位531〜579）。5世紀のササン朝ペルシアは、東はエフタルの侵攻に悩み、西はビザンツ帝国の逆襲に遭い、一時的に劣勢にあった。この危機を救ったのがホスロー1世。彼はユスティニアヌス帝との戦いを優位に進める一方で、トルコ系の突厥と手を組んで、ついにはエフタルを滅ぼす。また、内政においても中央集権的官僚制を確立し、帝国は黄金時代を迎える。ここで注意してもらいたいのは、ホスロー1世の学術保護。当時ビザンツ帝国ではアカデメイアが閉鎖され、行き場を失った学者たちはササン朝ペルシアへ流れこんできた。ホスローはこの学者たち（特にネストリウス派）を保護し、ジュンディー＝シャープールに学校を設立し、研究に没頭させた。ネストリウス派の学者たちはギリシア語の文献をシリア語に翻訳する。さらにそれは、642年ニハーヴァンドの戦いでササン朝ペルシアがイスラーム勢力に敗れ、651年に滅亡した後、イスラーム勢力に受け継がれる。つまり、ヨーロッパからイスラームの文化の橋渡し役となったわけである（難関校を狙う受験生は覚えておくこと）。\n【『同時に学べ』】ササン朝の精巧な工芸品をはじめとする文化の影響は日本の工芸品にも見られ、ササン朝の文化はイランの地を支配したイスラーム教徒に引き継がれる。',
  yoko:['529年 ユスティニアヌスのアカデメイア閉鎖→学者がササン朝へ→ホスロー1世が保護→のちイスラームへ：ギリシア学術の「橋渡し」（『ヨコから見る』p.72）','ホスロー1世（位531〜579）とユスティニアヌス（位527〜565）は最盛期同士の同時代人（『ヨコから見る』p.71）'],
  src:'『ヨコから見る』p.72／『同時に学べ』p.59／スタサプ 第2講',rel:['sassanid_56','justinian','hephthalite','tujue']},
 hephthalite:{img:[{src:'img/p170.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Buddha_of_Bamiyan.jpg/960px-Buddha_of_Bamiyan.jpg',cap:'バーミヤンの大仏（アフガニスタン、2001年破壊前）。エフタルが支配した地域に5〜6世紀ごろ造られた（Wikimedia Commons／James Gordon／CC BY 4.0）',w:'中央アジア'},{src:'img/p154.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Hephthalites_coins.jpg/960px-Hephthalites_coins.jpg',cap:'エフタルの貨幣。ササン朝の貨幣を手本にしている（Wikimedia Commons／Gary Todd／CC0）',w:'エフタル'}],kw:['エフタル','白匈奴'],n:'エフタル',y:'5世紀に強大化〜560年頃滅亡｜現在のアフガニスタン〜ウズベキスタン',b:'5世紀に中央ユーラシアで強大化した遊牧民族。ササン朝ペルシアを侵攻して一時衰えさせ、6世紀にホスロー1世が突厥と結んで挟み撃ちにして滅ぼした。\n【『ヨコから見る』】中央アジアでは騎馬民族のエフタルが大いに力をふるってササン朝ペルシアを圧迫し、インドのグプタ朝を滅ぼす。エフタルは白匈奴とも呼ばれており、匈奴との関係があるかもしれない。同様にフン人も匈奴の一派とする説が強く、匈奴がこの時代の主役といっても良いかもしれない。エフタルについて詳しいことはわかっていないが（イラン系ともトルコ系とも）、非常に高い文化水準を持ち、軍事力も中央アジアでは最強だった。\n【スタサプ補足】5世紀中頃、中央アジアにトルコ系（イラン系とも）の遊牧民エフタルが勃興。5〜6世紀には柔然・高車・エフタルが中央ユーラシアを三分。6世紀中頃、突厥がササン朝と挟撃してエフタルを征服。',
  yoko:['西のフン人・中央のエフタル・東の五胡（匈奴）——匈奴系の民族がユーラシア全域で「よそ者」国家の時代をつくる（『ヨコから見る』p.61）','エフタルの南下→グプタ朝の衰退・滅亡（550）（『ヨコから見る』p.63）'],
  src:'『同時に学べ』p.59／『ヨコから見る』p.61・63／スタサプ 第2・4講',rel:['sassanid_56','gupta_5','tujue','hosrow']},
 tujue:{img:[{src:'img/p156.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Bilge_Khagan_monument_Mongolia.JPG/960px-Bilge_Khagan_monument_Mongolia.JPG',cap:'ビルゲ＝カガン碑（8世紀、モンゴル）。突厥文字と漢文で刻まれる（Wikimedia Commons／Betta27／パブリックドメイン）',w:'突厥'},{src:'img/p145.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Kultigin_Monument_of_Orkhon_Inscriptions.jpeg/960px-Kultigin_Monument_of_Orkhon_Inscriptions.jpeg',cap:'突厥文字が刻まれたキョル＝テギン碑（8世紀、モンゴル・オルホン渓谷）。遊牧民として初めて文字をつくった（Wikimedia Commons／Vezirtonyukuk／CC BY-SA 4.0）',w:'突厥文字'}],kw:['突厥','テュルク','トルコ民族の源流','突厥文字','柔然'],n:'突厥（トルコ民族の「源流」）',y:'552〜（583 東西分裂）｜モンゴル高原〜中央アジア',b:'突厥（とっけつ）は、モンゴル高原で活躍していたトルコ系の遊牧民族。突厥は6世紀に突厥「帝国」ともいわれるユーラシア大陸の東西にまたがる大遊牧国家をつくり、遊牧民としては初めて文字（突厥文字）をつくった。「突厥」とは「テュルク」という言葉を漢字にしたもので、ズバリ「トルコ人」という意味。この突厥を「源流」にトルコ系民族は各地に移動して、世界の歴史に大きな影響を与える。トルコといえば現在のトルコ共和国が存在するアナトリア（小アジア）をイメージするが、もともとはずっと東のほうに暮らしていた民族。現在のトルコ共和国にとっても突厥は重要な位置づけを持ち、突厥帝国が成立したとされる552年はトルコ共和国の原点と考えられている。\n最も北の草原地帯は遊牧国家が成立するゾーン。3世紀から4世紀にかけて匈奴や鮮卑などいわゆる「五胡」が中国へと南下すると、5世紀にはこの地域に柔然（じゅうぜん）という遊牧国家が成立し、北魏と対立した。6世紀中ごろ、この柔然を倒して独立し、モンゴル高原の覇者となったのが突厥。突厥は一時的に大帝国を築いたが、6世紀の末になると内部対立に加え、南に成立していた隋の分断工作によって東西に分裂し、その勢いは弱まった。\n【スタサプ補足】モンゴル高原には匈奴→鮮卑→柔然→突厥→ウイグルの順に遊牧民が台頭。555年 突厥が柔然を滅ぼす（可汗と称する君主の統率のもと中央ユーラシアに領土を拡大。中国と馬と絹織物を交換する絹馬交易で莫大な利益）。6世紀中頃 ササン朝と挟撃してエフタルを征服。583年 東西に分裂。突厥の中央アジア進出により、中央アジアの主流民族はイラン系（ソグド人）からトルコ系へ代わっていく（『ヨコから見る』p.77）。',
  yoko:['ササン朝と突厥の同盟（560年頃）でエフタルを挟撃→6世紀ユーラシアの「三大勢力」に（『同時に学べ』p.57・59）','6世紀末、隋の分断工作で東西に分裂（583）。隋の煬帝は東突厥を手なずけて西突厥を圧迫する戦術をとったが、高句麗遠征の失敗で破綻（『ヨコから見る』p.74）'],
  src:'『同時に学べ』p.59〜60／『ヨコから見る』p.74・77／スタサプ 第4講',rel:['三大勢力','rouran','sassanid_56','hephthalite','sui','三層構造']},
 rouran:{kw:['柔然'],n:'柔然',y:'5世紀〜552｜モンゴル高原',b:'五胡が中国へ南下したあとのモンゴル高原に5世紀に成立した遊牧国家。華北の北魏と対立。6世紀中ごろ（552）、トルコ系の突厥に倒された。\n【『ヨコから見る』】北アジアでは、勢力をふるっていた鮮卑が中国の華北に入ったため、代わって柔然が台頭する。柔然は華北の北魏を圧迫するが、のちに突厥に滅ぼされてしまう。この柔然は、東欧に入り一大帝国をつくったアヴァール人ではないかともいわれるが、確かな証拠はない。\n【スタサプ補足】5世紀、モンゴル系の遊牧民柔然がモンゴル高原で勢力を伸ばし北魏と対立。',
  yoko:['「草原地帯」の主が匈奴→鮮卑→柔然→突厥と交代。南下した民族の空白を次の民族が埋める（『同時に学べ』p.60）'],
  src:'『同時に学べ』p.60／『ヨコから見る』p.64／スタサプ 第4講',rel:['tujue','n_wei','三層構造']},
 '三層構造':{kw:['三層構造','草原地帯','華北','華南'],n:'中国の「三層構造」（草原地帯・華北・華南）',y:'5〜6世紀にはっきりあらわれる｜現在の中国・モンゴル',b:'中国の長い歴史を見ると、「南北朝時代」や「金と南宋」のように、しばしば南北に分かれることがある。そして、モンゴル高原など北の草原地帯には遊牧民族の国家が次々と成立している。中国周辺の歴史をとらえるには、この「草原地帯」「華北」「華南」という3層構造を頭に入れておくと理解しやすくなる。それぞれ、草原地帯では遊牧、華北では畑作、華南では稲作、と生活様式も異なる。5世紀から6世紀は、この中国の「三層構造」がはっきりとあらわれた時代となる（草原地帯＝柔然→突厥、華北＝北魏など北朝、華南＝南朝）。',
  yoko:['草原＝柔然→突厥／華北＝北魏（鮮卑の「よそ者」国家）／華南＝南朝（漢民族）。ヨーロッパの「ゲルマン諸国家 vs 東ローマ」と対応する南北の構図'],
  src:'『同時に学べ』p.60',rel:['rouran','tujue','n_wei','s_dynasty']},
 n_wei:{img:[{src:'img/p136.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Yungang_Grottoes_03.jpg/960px-Yungang_Grottoes_03.jpg',cap:'北魏がつくった雲崗石窟の大仏（山西省大同）（Wikimedia Commons／Steve Cadman／CC BY-SA 2.0）',w:'雲崗'},{src:'img/p146.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Emperor_Xiaowen_and_his_entourage_worshipping_the_Buddha_522-523_CE._Central_Binyang_Cave_%28also_known_as_Cave_3%29_in_the_Longmen_complex.jpg/960px-Emperor_Xiaowen_and_his_entourage_worshipping_the_Buddha_522-523_CE._Central_Binyang_Cave_%28also_known_as_Cave_3%29_in_the_Longmen_complex.jpg',cap:'竜門石窟・賓陽中洞の「孝文帝礼仏図」（522〜523年ごろ）。漢人風の衣冠をつけた孝文帝の行列（Wikimedia Commons／CC0）',w:'竜門'}],kw:['北魏','拓跋','太武帝','均田制','三長制','北朝','東魏','西魏','北周','北斉'],n:'北魏と華北の統一（439年）',y:'386〜534（439 華北統一）｜現在の中国北部（都：平城→洛陽）',b:'5世紀に入っても、中国の北部（華北）は多くの民族が次々と国家をたてる「五胡十六国」の混乱時代にあった。この五胡十六国の争いの中で有力になったのが、鮮卑の一派である「拓跋部（たくばつぶ）」を中心に建国されていた「北魏」という王朝（ちなみに「東ローマ帝国」が変わらず「ローマ」と名乗り続けたように、北魏も国家の名乗りとしては「魏」。後世の私たちが区別するために「北魏」と呼んでいる）。439年、北魏は華北を統一する。北魏は「五胡」と呼ばれた遊牧民のひとつ、鮮卑がつくった王朝、すなわち「よそ者」国家。北魏の課題は、多くの漢民族が暮らしている地域を支配しなければならないということだった。\nしかし極端な漢化政策は鮮卑の人々の反発を招く。軍隊の反乱をきっかけに北魏は東西に分裂し、東魏、西魏となる。その後、東魏から皇帝の位を譲り受けた北斉、西魏から皇帝の位を譲り受けた北周が成立し、北周が北斉を倒して再び華北を統一する。この北魏から北周までの王朝を北朝といい、いずれも鮮卑の拓跋部出身の有力者を中心とする王朝だった。これら北朝は、鮮卑系の王朝が漢民族や「五胡」などの多くの民族を支配するという構造であったため、民族を超えて適用される共通のルールや制度を導入しなければ不満が出てしまう。この中で律令や土地、税などの制度が培われ、隋や唐に引き継がれるのである。隋や唐の法令や制度は日本にも大きな影響を与えているので、北朝の制度は日本にも大きな影響を与えていることになる。\n【『ヨコから見る』】五胡十六国の混乱を最終的に収拾したのは鮮卑族の北魏。439年に太武帝が華北を統一。孝文帝は均田制を実施し農民支配の基礎を作った（均田制は後の隋・唐にも受け継がれる制度）。北魏時代には国家事業として巨大な石窟寺院が建てられる（平城付近の雲崗（うんこう）、洛陽付近の竜門（りゅうもん）。五胡十六国時代の敦煌の石窟寺院も入試でよく問われる）。これらは遠くインドのガンダーラ様式、グプタ様式の影響も受けていた（ヨコの鉄則：五胡の侵入で中央アジア・西域の異文化が中国に入る→ガンダーラ様式・グプタ様式の影響（寺院）、西域出身の仏教僧の来訪（仏図澄・鳩摩羅什））。孝文帝の死後、冷遇された鮮卑の軍人たちの怒りが六鎮の乱として爆発し、北魏は東魏と西魏に分裂。\n【スタサプ補足】386年 鮮卑の拓跋氏が北魏を建国、平城（現・大同）を都とする。439年 第3代太武帝が華北を統一。第6代孝文帝が均田制（国家が成年男子・妻・奴婢・耕牛に給田し税を徴収）と三長制（5家＝隣、5隣＝里、5里＝党にそれぞれ長）を施行、漢化政策を推進。6世紀 六鎮の乱をきっかけに東魏と西魏に分裂、西魏を継いだ北周が東魏を継いだ北斉を征服し華北を再統一。北魏〜西魏・北周・東魏・北斉の5王朝を北朝と呼ぶ。北魏の寇謙之（こうけんし）が道教を大成し太武帝の時期に道教が国教に。',
  yoko:['北魏（東）とフランク王国（西）：4〜5世紀の民族大移動期に長期政権となった2つの「よそ者」国家（『ヨコから見る』p.66）','北朝で培われた律令・均田制→隋・唐→日本の律令国家へ（『同時に学べ』p.62）','西のカトリック教会・修道院⇔東の北魏の仏教保護と石窟寺院'],
  src:'『同時に学べ』p.60〜62／『ヨコから見る』p.65〜66／スタサプ 第5講',rel:['孝文帝の漢化政策','五胡','xianbei_34','s_dynasty','三層構造','pingcheng','rouran','sui','よそ者国家']},
 '孝文帝の漢化政策':{img:[{src:'img/p173.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Buddha_Maitreya_%28486%29_Northern_Wei._The_Metropolitan_Museum_of_Art_.jpg/960px-Buddha_Maitreya_%28486%29_Northern_Wei._The_Metropolitan_Museum_of_Art_.jpg',cap:'北魏・太和10年（486）銘の金銅弥勒仏（メトロポリタン美術館）。孝文帝の時代（Wikimedia Commons／Ismoon／CC BY-SA 4.0）',w:'仏教'},{src:'img/p155.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Stone_Buddha%2C_Datong.jpg/960px-Stone_Buddha%2C_Datong.jpg',cap:'雲崗石窟の大仏（大同）。北魏の皇帝を模したともいわれる（Wikimedia Commons／パブリックドメイン）',w:'雲崗'}],kw:['孝文帝','漢化政策','洛陽遷都','494'],n:'孝文帝の漢化政策（494年 洛陽遷都）',y:'孝文帝 位471〜499｜平城→洛陽',b:'北魏の第6代の皇帝である孝文帝は、漢民族の文化に思い切った「寄せ方」をする。都を平城というところから中国のど真ん中付近の洛陽に遷都し、鮮卑の言葉や服装を禁止し、漢民族の言葉や服装を大きく取り入れる政策をとった（中国北部には漢民族以外にも「五胡」のいろいろな民族が混ざり合っていた。いろいろな言葉や文化を持つ民族をまとめるには、漢民族の言葉や文化を「共通語」「共通項」としておいたほうが統治するうえで都合がよかったともいえる）。また、孝文帝は仏教を保護し、その時代には大規模な寺院がつくられた。\n【『ヨコから見る』】均田制よりもそれ以上に重要なのは孝文帝の漢化政策。彼は鮮卑族を支配者と位置づけるのではなく、漢民族（中国人）との融和を図ろうとした。この融和策は成功するが、その代わりに鮮卑族は歴史から姿を消してしまう。鮮卑の漢化政策：①鮮卑の言語・服装を禁止→中国語・中国服に（言語禁止には年齢制限があった）、②鮮卑族の姓を漢人風に改める、③都を平城から洛陽に移す、④鮮卑族・漢民族の通婚を奨励。\n【スタサプ補足】漢化政策＝鮮卑の制度や習俗、文化を中国的なものに改め、都を平城から洛陽に移す。',
  yoko:['494年 北魏の洛陽遷都⇔496年 クローヴィスの改宗：東西で同時に「よそ者」が多数派に「寄せていく」（『同時に学べ』p.53）','孝文帝（位471〜499）とクローヴィス（位481〜511）は同時代人（『ヨコから見る』p.66）'],
  src:'『同時に学べ』p.53・61／『ヨコから見る』p.65〜66／スタサプ 第5講',rel:['n_wei','クローヴィスの改宗','よそ者国家','luoyang','pingcheng']},
 s_dynasty:{img:[{src:'img/p174.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Liang_Wudi.jpg/960px-Liang_Wudi.jpg',cap:'梁の武帝（唐・閻立本筆と伝わる『歴代帝王図巻』）。仏教を篤く信仰した（Wikimedia Commons／パブリックドメイン）',w:'梁'},{src:'img/p134.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Seven_Sages_of_the_Bamboo_Grove_1.Nanjing_Museum.jpg/960px-Seven_Sages_of_the_Bamboo_Grove_1.Nanjing_Museum.jpg',cap:'「竹林の七賢」の磚画（南京博物院）。南朝の貴族文化（Wikimedia Commons／Gary Lee Todd／CC BY-SA 4.0）',w:'六朝文化'}],kw:['南朝','宋','斉','梁','陳','六朝','建康','六朝文化'],n:'南朝（宋・斉・梁・陳）',y:'420〜589｜現在の中国南部（都：建康＝南京）',b:'一方、中国の南部（華南）では、東晋から宋、斉、梁、陳と呼ばれる王朝が次々と成立している。東晋は漢民族の貴族を中心とする国家だったが、華北の勢力との戦いの中で武将が実権を握って抗争が始まり、王朝の興亡が続く。宋、斉、梁、陳の王朝は、まとめて「南朝」と呼ばれる。\n【『ヨコから見る』】南の江南には華北の混乱を避けて漢民族の貴族・農民が移住し、東晋滅亡後の宋・斉・梁・陳でも皇帝権力を抑えて貴族が政治の実権を握った。この様子は文化にも反映されて、江南では華やかな貴族文化（六朝（りくちょう）文化）が発展した。武骨な華北の文化とは対照的。六朝とは現在の南京に都を置いた6つの王朝（呉・東晋・宋・斉・梁・陳）を指す。時代ごとに南京は名前が違うので注意：呉の時代は建業、東晋・宋・斉・梁・陳の時代は建康。\n【スタサプ補足】420年 宋、479年 斉、502年 梁、557年 陳。東晋を含め江南の諸王朝を南朝と呼び、北朝と対立した時代を南北朝時代、三国時代から南北朝の動乱期までを魏晋南北朝時代と呼ぶ。戦乱の続く華北から長江流域へ漢民族の大規模な移住がおこり江南の開発が進んだ。',
  yoko:['5世紀の日本の「倭の五王」は南朝の宋に使者を送り冊封関係を結ぼうとした（『同時に学べ』p.53・63）','南朝＝漢民族の伝統文化の保存者⇔東ローマ帝国＝ローマの伝統の保存者'],
  src:'『同時に学べ』p.62／『ヨコから見る』p.66／スタサプ 第5講',rel:['jiankang','n_wei','三層構造','倭の五王','sui','jin']},
 sui:{img:[{src:'img/p176.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Beijing-Hangzhou_Grand_Canal_in_CZ.jpg/960px-Beijing-Hangzhou_Grand_Canal_in_CZ.jpg',cap:'京杭（けいこう）大運河（江蘇省常州）。隋が華北と江南を結んだ運河は今も使われる（Wikimedia Commons／Fumikas Sagisavas／CC BY-SA 4.0）',w:'大運河'},{src:'img/p175.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Anji_Bridge%2C_Zhao_County%2C_2020-09-06_05.jpg/960px-Anji_Bridge%2C_Zhao_County%2C_2020-09-06_05.jpg',cap:'趙州橋（安済橋、河北省）。隋の605年ごろ架けられた現存最古の石造アーチ橋（Wikimedia Commons／Siyuwj／CC BY-SA 4.0）',w:'隋'},{src:'img/p147.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/Sui_Wendi_Tang.jpg/960px-Sui_Wendi_Tang.jpg',cap:'隋の文帝・楊堅（唐・閻立本筆と伝わる『歴代帝王図巻』）（Wikimedia Commons／パブリックドメイン）',w:'楊堅'}],kw:['隋','楊堅','文帝','大運河','科挙','煬帝'],n:'隋の統一（589年）',y:'581〜618（589 南北統一）｜現在の中国（都：大興城＝長安）',b:'581年、北朝の北周の有力者だった楊堅（ようけん）が北周を引き継いでたてた王朝が隋王朝。隋王朝は南朝の陳を滅ぼして中国の南北の統一を果たし（589）、長らく続いた戦乱時代を終わらせた。この楊堅は、隋の文帝と呼ばれる。南北の統一者として、文帝は華北と江南をつなぐ大運河の建設を進めた。この大運河が完成することによって南北が結びつき、中国の政治・経済の一体化が進んだ。また、推薦制であった役人採用のしくみを学科試験に改め、質のよい人材を採用しようとした。この試験は科挙といい、20世紀まで続く人材採用のしくみになる。\n【『ヨコから見る』】文帝（位581〜604）はやや地味な存在だが、南北朝時代に力をふるった門閥貴族の権力を抑えて中央集権をめざした優れた皇帝。北魏時代の均田制や西魏時代の府兵制などを継承・強化し、門閥貴族を生んだ諸悪の根元ともいうべき九品中正を廃止して科挙を実施した（当時は貴族としての資質チェック的な側面が強く、広く民間から登用するというものではなかった）。ヨコの流れとしては2代目の煬帝（ようだい、位604〜618）の方が重要。6世紀の北アジアではトルコ系の突厥が強大な遊牧国家を形成し（6世紀後半に東西に分裂）、朝鮮では高句麗が発展していた。煬帝はこれに対抗し、隋の威信をかけて高句麗を攻めた（3回とも失敗）。隋は東突厥を手なずけて西突厥を圧迫する戦術を用いていたが、高句麗遠征の失敗を契機に東突厥も隋から離反。高句麗遠征に大運河（永済渠）を建設し使用した。\n【スタサプ補足】北魏の皇帝の家系を受け継ぐ一族の中から隋・唐という中国史上を代表する皇帝の家系が登場（『同時に学べ』p.53）。',
  yoko:['隋の中国統一（589）⇔ユスティニアヌスの地中海再統一（534〜555）：分裂の6世紀に東西で「再統一」','ユーラシアの三大勢力（東ローマ・ササン朝・突厥）が並ぶ中で、隋は突厥を東西に分断して自立（『同時に学べ』p.60／『ヨコから見る』p.74）','隋・唐の律令→日本の律令国家（『同時に学べ』p.62）'],
  src:'『同時に学べ』p.62／『ヨコから見る』p.74／スタサプ 第5講',rel:['n_wei','s_dynasty','tujue','goguryeo5','daxing','三層構造']},
 gupta_5:{img:[{src:'img/p171.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Bodhisattva_Padmapani%2C_cave_1%2C_Ajanta%2C_India.jpg/960px-Bodhisattva_Padmapani%2C_cave_1%2C_Ajanta%2C_India.jpg',cap:'アジャンター第1窟の壁画「蓮華手菩薩（れんげしゅぼさつ）」（5世紀末〜6世紀、グプタ様式）（Wikimedia Commons／パブリックドメイン）',w:'アジャンター'},{src:'img/p159.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Temple_12_-_Nalanda_Mahavihara_%2817%29.jpg/960px-Temple_12_-_Nalanda_Mahavihara_%2817%29.jpg',cap:'ナーランダー僧院跡（インド・ビハール州）。グプタ朝期の5世紀に創建された仏教の学院（Wikimedia Commons／Sumitsurai／CC BY-SA 4.0）',w:'ナーランダー'},{src:'img/p127.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Buddha_in_Sarnath_Museum_%28Dhammajak_Mutra%29.jpg/960px-Buddha_in_Sarnath_Museum_%28Dhammajak_Mutra%29.jpg',cap:'サールナート出土の初転法輪仏坐像（475年ごろ）。グプタ様式の代表作（Wikimedia Commons／CC BY-SA 3.0）',w:'グプタ朝'}],kw:['グプタ朝の衰退','ナーランダー','マハーバーラタ','ラーマーヤナ','法顕'],n:'グプタ朝（5世紀：黄金期→衰退）',y:'320頃〜550頃（5世紀後半にエフタルの侵入）｜現在のインド北部',b:'『同時に学べ』p.50の地図で5世紀のインドに示された王朝。4世紀にチャンドラグプタ2世のもとで最盛期を迎え、宮廷を中心に文学や美術が発展、ヒンドゥー教が民衆に定着した。5世紀初めには東晋の僧・法顕（ほっけん）がインドを訪れ、多くの経典を中国に持ち帰った。5世紀後半、中央アジアのエフタルの侵入により衰退し、6世紀半ばに滅亡する。\n【『ヨコから見る』】5世紀にはナーランダー僧院が建設され仏教の最高学府として世界中から僧が集まったが、あまりに哲学的で難解になりすぎたため次第に民衆の信仰を失う。またこの頃、インドの二大叙事詩『マハーバーラタ』『ラーマーヤナ』が成立。『マハーバーラタ』は宗教色が強く、インドの聖書ともいうべき"バガヴァッド＝ギーター"の章が入っている。『ラーマーヤナ』は英雄ラーマが猿などを味方にして、舟をこぎ、セイロン島にいる魔族を退治する話（日本の桃太郎とよく似ている）。しかし古典文化の黄金期を迎えたグプタ朝も、5世紀の民族移動期の中で衰退・滅亡していく。エフタルの南下、北インドへの侵入によりグプタ朝が衰退し、やがて滅亡。グプタ朝滅亡後、インドはしばらく分裂状態にあり、再び統一したのは7世紀のヴァルダナ朝のハルシャ王。\n【スタサプ補足】5世紀後半、地方勢力の台頭や中央アジアの遊牧民エフタルの進出により衰退、6世紀半ば滅亡。',
  yoko:['グプタ朝の衰退（5世紀後半）はエフタルの南下によるもの。西のゲルマン人・東の五胡と同じ「民族移動」の波がインドにも（『ヨコから見る』p.61・63）','法顕（東晋）がグプタ朝を訪問：行きは陸路・帰りは海路（『ヨコから見る』p.56）'],
  src:'『同時に学べ』p.50〜51／『ヨコから見る』p.53・63／スタサプ 第3講',rel:['gupta','hephthalite','pataliputra','sassanid_56']},
 goguryeo5:{img:[{src:'img/p180.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Gold_crown_from_Cheonmachong.jpg/960px-Gold_crown_from_Cheonmachong.jpg',cap:'新羅の金冠（天馬塚出土、5〜6世紀、慶州）（Wikimedia Commons／NW-Photos.com／CC BY 2.0）',w:'新羅'},{src:'img/p179.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Baekje_Diadem_King.jpg/960px-Baekje_Diadem_King.jpg',cap:'百済・武寧王陵出土の金製冠飾（6世紀、韓国・公州）（Wikimedia Commons／mentaldesperado／CC BY-SA 2.0）',w:'百済'},{src:'img/p178.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Goguryeo_tomb_mural.jpg/960px-Goguryeo_tomb_mural.jpg',cap:'高句麗の古墳壁画（狩猟図）（Wikimedia Commons／パブリックドメイン）',w:'高句麗'},{src:'img/p112.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/20230605_Stela_for_Gwanggaeto.jpg/960px-20230605_Stela_for_Gwanggaeto.jpg',cap:'広開土王碑（好太王碑、中国吉林省集安）（Wikimedia Commons／Yumeto／CC BY-SA 4.0）',w:'高句麗'}],kw:['高句麗','百済','新羅','伽耶','加羅','朝鮮の国々','三国時代'],n:'朝鮮の国々（高句麗・百済・新羅・伽耶）',y:'4世紀半ば〜（5〜6世紀）｜現在の朝鮮半島',b:'朝鮮半島情勢にも触れておこう。中国の影響力が弱まった朝鮮半島には、4世紀半ばから国家の形成が見られた。朝鮮半島北部から中国東北部にかけて高句麗、朝鮮半島西南部の百済、朝鮮半島東南部には新羅という国家が有力になる。南端付近には統一的な国家が成立せず、複数の小国（伽耶（かや）諸国）が存在する状態が続く。日本や朝鮮半島では、民族の移動や「よそ者」国家の成立の余波を受けた動きが見られる。中国北部で民族移動が盛んになり、「よそ者」国家が統治に苦慮する中で、中国の王朝が朝鮮半島へ及ぼす影響力が衰え、朝鮮南部では分裂状態となり、北部では高句麗が成長することになる。\n【『ヨコから見る』】6世紀の北アジアではトルコ系の突厥が強大な遊牧国家を形成し、朝鮮では高句麗が発展していた。隋の煬帝はこれに対抗し、隋の威信をかけて高句麗を攻めた。1度目の遠征では113万の軍を派遣するが多くの兵を失い、2度目・3度目の遠征もうまくいかなかった。\n【スタサプ補足】4世紀初め 高句麗が楽浪郡を滅ぼす。4世紀半ば 馬韓の地に百済、辰韓の地に新羅が建国され三国時代に（南端は加羅（伽耶）諸国）。4世紀末 広開土王（好太王）が即位し高句麗が最盛期。戦乱を避けて日本へ移り住む渡来人によって先進的な文化や技術が日本へ伝えられた。',
  yoko:['中国の分裂（南北朝）→朝鮮への影響力低下→高句麗の成長・南部の分裂→日本が影響力拡大をねらう（『同時に学べ』p.53・62）','隋の高句麗遠征（3回）の失敗が隋の滅亡と突厥の離反を招く（『ヨコから見る』p.74）'],
  src:'『同時に学べ』p.53・62／『ヨコから見る』p.74／スタサプ 第4講',rel:['goguryeo','倭の五王','yamato_56','sui','pyongyang','n_wei']},
 '倭の五王':{img:[{src:'img/p157.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Haniwa_-_Warrior_in_Keiko_Armor_cropped.jpg/960px-Haniwa_-_Warrior_in_Keiko_Armor_cropped.jpg',cap:'挂甲（けいこう）の武人埴輪（6世紀、群馬県、東京国立博物館・国宝）（Wikimedia Commons／Kakidai／CC BY-SA 4.0）',w:'古墳'},{src:'img/p111.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/NintokuTomb_Aerial_photograph_2007.jpg/960px-NintokuTomb_Aerial_photograph_2007.jpg',cap:'大仙陵古墳（仁徳天皇陵古墳、大阪府堺市）。日本最大の前方後円墳（5世紀）（Wikimedia Commons／国土地理院／出典表示）',w:'大仙陵古墳'},{src:'img/p148.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/%E9%87%91%E9%8C%AF%E9%8A%98%E9%89%84%E5%89%A3%E3%80%8C%E7%8D%B2%E5%8A%A0%E5%A4%9A%E6%94%AF%E9%B9%B5%E3%80%8D%E9%8A%98%E9%83%A8%E5%88%86.jpg/960px-%E9%87%91%E9%8C%AF%E9%8A%98%E9%89%84%E5%89%A3%E3%80%8C%E7%8D%B2%E5%8A%A0%E5%A4%9A%E6%94%AF%E9%B9%B5%E3%80%8D%E9%8A%98%E9%83%A8%E5%88%86.jpg',cap:'稲荷山古墳出土の金錯銘鉄剣（埼玉県）。「獲加多支鹵（ワカタケル）大王」の銘文（Wikimedia Commons／斑猫／CC0）',w:'ワカタケル'}],kw:['倭の五王','宋書','讃・珍・済・興・武','雄略天皇','ワカタケル','古墳時代','大仙陵古墳'],n:'巨大古墳がつくられた「倭の五王」の時代',y:'5世紀｜現在の日本（大和）',b:'5世紀の日本は、いわゆる「古墳時代」の真っただ中にあった。この時期に、大阪府の堺市にある大仙陵古墳や羽曳野市にある誉田御廟山（こんだごびょうやま）古墳など、巨大な前方後円墳がつくられた。当時の大和政権の大王たちについて、文章による記録は中国の南朝である宋の国の歴史書『宋書』にある。『宋書』には「讃・珍・済・興・武」という倭の5人の王についての記述があり（これを「倭の五王」と呼んでいる）、この王たちは中国の南朝に貢ぎ物を送り、臣下の礼をとって称号や地位をもらったという。彼らは中国の王朝と結びついて立場を向上させ、朝鮮半島南部での外交や軍事を優位に進めようとしたのである。\n「倭の五王」のうち、5人目の「武」王は古墳時代を代表する大王のひとりである雄略天皇と考えられている。武王は中国の宋王朝などから日本のみならず、朝鮮半島の新羅や伽耶の軍を率いる将軍としての称号を得ている。日本国内でも、埼玉県と熊本県に雄略天皇の名を示す「ワカタケル」という文字を彫り込んだ鉄剣と鉄刀が出土しており、この時代のヤマト政権の影響力が関東から九州にまで及んでいたことがわかる。当時、国境という概念は現在よりも薄く、朝鮮半島と日本は相互に影響を与え合っていた。日本は朝鮮半島に勢力を伸ばすだけではなく、朝鮮半島からやってきた渡来人から鉄器や硬質の土器、機織りや金属工芸などの技術や、漢字や儒教などの学術などを学び、大陸の文化を吸収していった。',
  yoko:['倭の五王が使者を送ったのは「南朝」の宋——中国が南北に分裂していたからこそ、南の王朝と結んで朝鮮半島南部での立場を強めようとした（『同時に学べ』p.53・63）','57年 奴国王（後漢）→239年 卑弥呼（魏）→5世紀 倭の五王（宋）：日本の王は一貫して中国の冊封を権威の源に','朝鮮半島と日本のやりとりの増加→多くの渡来人がやってくる（『同時に学べ』p.53）'],
  src:'『同時に学べ』p.53・63／スタサプ 第4講',rel:['yamato_56','s_dynasty','goguryeo5','yamatai','卑弥呼の遣使','jiankang']},
 yamato_56:{img:[{src:'img/p183.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Burner_Baekje_cropped.jpg/960px-Burner_Baekje_cropped.jpg',cap:'百済金銅大香炉（6〜7世紀、国立中央博物館）。仏教は百済から日本へ伝わった（Wikimedia Commons／国立中央博物館／CC BY-SA 4.0）',w:'仏教伝来'},{src:'img/p182.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Iwatoyama_Sekijin.jpg/960px-Iwatoyama_Sekijin.jpg',cap:'岩戸山古墳（福岡県八女市）の石人。筑紫君磐井の墓とされる（Wikimedia Commons／Fred Cherrygarden／CC BY-SA 4.0）',w:'磐井の乱'},{src:'img/p181.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Ishibutai-kofun_Asuka_Nara_pref05n4592.jpg/960px-Ishibutai-kofun_Asuka_Nara_pref05n4592.jpg',cap:'石舞台古墳（奈良県明日香村）。蘇我馬子の墓と伝わる（Wikimedia Commons／663highland／CC BY 2.5）',w:'蘇我馬子'},{src:'img/p149.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Asuka_dera_daibutsu.jpg/960px-Asuka_dera_daibutsu.jpg',cap:'飛鳥寺の釈迦如来像（飛鳥大仏、7世紀初め）。蘇我馬子が建てた日本最古級の寺（Wikimedia Commons／Chris 73／CC BY-SA 3.0）',w:'仏教の伝来'}],kw:['ヤマト政権','磐井の乱','仏教の伝来','蘇我氏','蘇我馬子','物部氏','推古天皇','聖徳太子','厩戸王','崇峻天皇'],n:'ヤマト政権による支配体制の確立と仏教の伝来',y:'6世紀（527 磐井の乱／538 仏教伝来／587 蘇我氏が物部氏を滅ぼす）｜現在の日本',b:'6世紀前半、ヤマト政権に反抗的な立場をとった九州北部の大豪族の磐井（いわい）の反乱が鎮圧されると、ヤマト政権の支配はより強固になった。6世紀の日本にとっての大ニュースは、仏教の伝来。538年（552年ともいう）に、朝鮮半島の百済の王から仏教がもたらされたという。このことは、仏教を積極的に受け入れようとする蘇我氏と排除しようとする物部氏という有力氏族の対立を激化させた。そして、蘇我氏の蘇我馬子は物部氏を滅ぼして権力を握る（蘇我氏は渡来人との関係が深く、仏教受容に積極的で、従来の神々に対するまつりを担当していた物部氏は仏教受容に消極的だった）。政権を握った蘇我馬子は、自身が立てた崇峻（すしゅん）天皇を暗殺し、さらに権力を強める。次に即位したのが、女性の推古天皇。推古天皇は甥の厩戸王（うまやどおう、聖徳太子）と蘇我馬子の協力のもと、政治の改革を開始した。',
  yoko:['仏教は百済経由で日本へ（538）：インド→中国（北魏の石窟寺院など）→朝鮮→日本という仏教の東漸（『同時に学べ』p.64）','6世紀の「まとめ」：西のゲルマン系国家、中央の三大帝国（東ローマ・ササン朝・突厥）、東の南北朝→隋、日本へは渡来人と仏教（『同時に学べ』p.64）','ヨーロッパではカトリック（グレゴリウス1世）、日本では仏教（蘇我氏）——6世紀は宗教が国家統合の道具になる世紀'],
  src:'『同時に学べ』p.64／スタサプ 第4講',rel:['倭の五王','goguryeo5','asuka','n_wei','カトリックの定着']},

 rome_34:{img:[{src:'img/p22.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Roman_Forum_looking_East_panorama.jpg/960px-Roman_Forum_looking_East_panorama.jpg',cap:'ローマのフォルム＝ロマヌム跡（Wikimedia Commons／Nicholas Hartmann／CC BY-SA 4.0）',w:'ローマ帝国'},{src:'img/p96.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Bust_of_Diocletian%2C_Istanbul_Archaeological_Museums.jpg/960px-Bust_of_Diocletian%2C_Istanbul_Archaeological_Museums.jpg',cap:'ディオクレティアヌス帝の胸像（イスタンブール考古学博物館）（Wikimedia Commons／Yair Haklai／CC BY-SA 4.0）',w:'ディオクレティアヌス'},{src:'img/p98.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Portrait_of_the_Four_Tetrarchs_%28Monumento_ai_Tetrarchi%29%2C_San_Marco%2C_Venice_%2836992141183%29.jpg/960px-Portrait_of_the_Four_Tetrarchs_%28Monumento_ai_Tetrarchi%29%2C_San_Marco%2C_Venice_%2836992141183%29.jpg',cap:'「四帝」の像（ヴェネツィア・サン＝マルコ大聖堂）。四帝分治の4人の皇帝（Wikimedia Commons／Dimitris Kamaras／CC BY 2.0）',w:'四帝分治'},{src:'img/p99.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Disco_de_Teodosio.jpg/960px-Disco_de_Teodosio.jpg',cap:'テオドシウス帝の記念銀皿（ミソリウム）（Wikimedia Commons／Ángel M. Felicísimo／CC BY 3.0）',w:'テオドシウス'},{src:'img/p114.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Aurelian_Walls_Rome_2011_1.jpg/960px-Aurelian_Walls_Rome_2011_1.jpg',cap:'アウレリアヌス城壁（ローマ）。軍人皇帝時代の3世紀後半、外敵に備えて首都ローマを囲んだ（Wikimedia Commons／Karelj／パブリックドメイン）',w:'軍人皇帝時代'},{src:'img/p115.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Peristyle_of_Diocletian%27s_Palace_-_Split_-_51388319116.jpg/960px-Peristyle_of_Diocletian%27s_Palace_-_Split_-_51388319116.jpg',cap:'ディオクレティアヌス帝の宮殿（クロアチア・スプリット）（Wikimedia Commons／TimeTravelRome／CC BY 2.0）',w:'専制君主政'}],kw:['軍人皇帝','専制君主政','ディオクレティアヌス','コンスタンティヌス','テオドシウス','東西分裂'],n:'ローマ帝国（軍人皇帝時代→専制君主政）',y:'235〜284 軍人皇帝／284〜 専制君主政／395 東西分裂｜現在のイタリア〜地中海沿岸',b:'2世紀に最盛期を迎え強大さをほこったローマ帝国も、3世紀に入ると衰退期に突入する。気候変動などを背景に、帝国への「外からの圧力」と内部の「仲間割れ」が同時に起こった。外からの圧力の代表がライン川・ドナウ川の北方のゲルマン人で、3世紀に入ると諸部族がまとまって強大化し、帝国内に侵入する頻度が上がった。さらに東方からは新興のササン朝の侵入も始まる。国境を守る各地の軍隊では「たたき上げ」の軍人が一目置かれ、各地の軍隊の指揮官が皇帝の位をめぐって争う「軍人皇帝時代（235〜284）」が始まる。\nこの混乱を再建したのが3世紀末のディオクレティアヌスと4世紀前半のコンスタンティヌスの2人。284年に即位したディオクレティアヌスは、皇帝を神聖化するペルシアの宮廷儀礼を取り入れ、自らを「主人（ドミヌス）」と呼ばせ、元老院の議員を政治から退けて皇帝が独裁的な権力を握った。皇帝が「市民の第一人者」であるという建前が崩れ、皇帝が専制的な君主として存在する「専制君主政（ドミナトゥス）」の始まり。帝国を4分割し東・西、正・副の4人の皇帝で分担統治（四帝分治）。キリスト教には帝国全土で大規模な迫害を行った（303）。\n4世紀半ばから、帝国の西方はゲルマン人に圧迫され、東方はササン朝に対抗する構図になる。375年ごろから「ゲルマン人の大移動」が始まり、「ローマ帝国」としての最後の皇帝テオドシウスは395年に帝国を東西に分割して2人の子に分け与えた。以後ローマがひとつになることはなかった。\n【『ヨコから見る』】「3世紀の危機」。軍人皇帝時代（235〜284）にはわずか50年の間に20数人もの皇帝が次々と暗殺された。ヨコの流れとしては経済的混乱・衰退の方が重要：①奴隷を使った大土地所有制（ラティフンディア）が衰退し、自給自足的な小作人（コロヌス）を使役した小作制（コロナトゥス）に移行、②都市への重税と中産市民層の没落→アジアの物産の需要が低下、③貨幣経済が混乱し現物交換の自然経済へ逆行。これがパルティアやクシャーナ朝の衰退にもつながる（ヨコの鉄則：3世紀、ローマのアジア物産への需要は急速に低下）。\n【スタサプ補足】212年カラカラ帝が帝国領内の全自由人にローマ市民権を付与（ローマ人と外国人の区別がなくなり属州の忠誠心は薄れた）。235〜284年の約50年間に26人の皇帝が乱立。コロナトゥスは中世の農奴制の先駆け。ディオクレティアヌス（位284〜305）は四分統治で政治を安定させ、皇帝崇拝を行い元老院を無力化。コンスタンティヌス（位306〜337）はコロヌスの移動の自由を禁止して身分・職業を固定化し、ソリドゥス金貨を発行、330年にコンスタンティノープルに遷都。',
  yoko:['ローマで五賢帝時代が終わり混乱に入るのが180年、中国で後漢が滅びるもとになる黄巾の乱が184年、パルティアは190年代の反乱とローマの攻撃で弱体化、日本でも180年代に「倭国大乱」→2世紀末という同時期に世界各地で国家の弱体化が起きた（『同時に学べ』p.36）','235年 軍人皇帝時代の始まり⇔220年 後漢の滅亡・魏の成立（ローマも中国も混乱期＝共通）（『ヨコから見る』p.58）','395年 テオドシウス帝死亡でローマの東西分裂決定⇔383年 淝水（ひすい）の戦いで中国の南北分裂決定（共通）（『ヨコから見る』p.58）','ローマの経済衰退でアジア物産の需要が低下→パルティア・クシャーナ朝も衰退（『ヨコから見る』p.49）'],
  src:'『同時に学べ』p.39〜42／『ヨコから見る』p.48〜50／スタサプ 第2講',rel:['ゲルマン人の大移動','christianity_34','sassanid','constantinople','crisis3','三国時代']},
 crisis3:{img:[{src:'img/p116.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Antoninianus_of_Gallienus_-_Obverse.jpg/960px-Antoninianus_of_Gallienus_-_Obverse.jpg',cap:'3世紀の銀貨アントニニアヌス（ガリエヌス帝、257年ごろ）。銀の含有量が下がり貨幣経済が混乱した（Wikimedia Commons／MumblerJamie／CC BY-SA 2.0）',w:'3世紀の危機'}],kw:['3世紀の危機','寒冷化'],n:'「3世紀の危機」と気候の寒冷化',y:'2世紀末〜3世紀末｜ユーラシア全域',b:'「倭国大乱」や三国時代を生んだ2世紀末の混乱と、それに続く3〜4世紀の不安定な時代の背景のひとつが気候の変動。世界史では「14世紀の危機」「17世紀の危機」のように世紀に「危機」をつけて不安定な時代を表現するが、3世紀も「3世紀の危機」と呼ぶことがあり、これらの時代はともに世界的に気候が寒冷化した時代という共通点がある。気候の寒冷化は農業や牧畜に打撃を与え、もともと寒くて乾燥した草原地帯は環境悪化の影響を受けやすい。「ギリギリ遊牧ができる」「ギリギリ耕作ができる」限界付近に住む人々が可能な地域まで南下し、人口移動の圧力が農耕地帯にかかる。農耕地帯の人々にとってそれは「外敵の襲来」に他ならない。3世紀のヨーロッパではゲルマン人の南下や西進、中国では鮮卑（せんぴ）の南下などが見られた。農耕地帯の内部でも収穫の減少から奪い合いが発生し社会が不安定化した。このときの気温低下は2世紀末から3世紀末にかけて2.5度ほどと指摘され、世界に大きなインパクトを与えるのに十分だった。\n【『ヨコから見る』】ローマは軍人皇帝時代（235〜284）、中国は三国時代（220〜280）。東西ともに武人が幅をきかす時代になったので商業・経済の発展は望めず、その影響を直接受けるのが両国の中間に位置するインドのグプタ朝とイランのササン朝ペルシア。両国家には商業の規模がやや縮小され農業が基盤となり、原点に帰る復古（伝統）主義的な性格という共通点がある。',
  yoko:['寒冷化→草原の遊牧民の南下：ヨーロッパではゲルマン人、中国では鮮卑（『同時に学べ』p.38）','東西ともに武人の時代→商業衰退→中間のインド（グプタ朝）・イラン（ササン朝）は農業基盤・復古主義の王朝に（『ヨコから見る』p.48〜49）'],
  src:'『同時に学べ』p.38／『ヨコから見る』p.48〜49',rel:['rome_34','三国時代','五胡','ゲルマン人の大移動','sassanid','gupta']},
 'ゲルマン人の大移動':{img:[{src:'img/p117.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Grande_Ludovisi_sarcophagus.jpg/960px-Grande_Ludovisi_sarcophagus.jpg',cap:'ルドヴィージの大石棺（3世紀半ば）。ローマ軍とゲルマン人（ゴート人）の戦い（Wikimedia Commons／Livioandronico2013／CC BY-SA 4.0）',w:'ゲルマン人'},{src:'img/p118.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Visigothic_-_Pair_of_Eagle_Fibula_-_Walters_54421%2C_54422.jpg/960px-Visigothic_-_Pair_of_Eagle_Fibula_-_Walters_54421%2C_54422.jpg',cap:'西ゴート人の鷲形フィブラ（留め金、6世紀）（Wikimedia Commons／パブリックドメイン）',w:'西ゴート'}],kw:['ゲルマン人の大移動','フン人','西ゴート'],n:'ゲルマン人の侵入と大移動',y:'3世紀〜／大移動は375年ごろ〜｜現在のドイツ〜東欧→ローマ帝国領',b:'「外からの圧力」の代表が、ライン川やドナウ川の北方の諸民族、いわゆるゲルマン人（ローマの人々からそう呼ばれていたが、様々な部族が存在し、ゲルマン系の部族の間に「ゲルマン人」という共通認識はなかった）。ゲルマン人は3世紀以前からローマにしばしば侵入していた。武力を伴う侵入もあれば、交易品を運んでローマ内で商売を行ったり、小作人のような存在や傭兵になったりしてローマ社会に「浸透」する例もあった。3世紀に入るとゲルマン人の諸部族がだんだんとまとまって強大化し、ライン川やドナウ川を越えてローマ帝国内に侵入する頻度が上がった。\n4世紀後半の375年ごろから、いわゆる「ゲルマン人の大移動」が始まる。中央ユーラシアのアジア系遊牧民のフン人が西に移動し、フン人に圧迫されたゲルマン人がローマ帝国領内に大挙して侵入したもの。ゲルマン人に侵入された帝国の西方では混乱が深まった。\n【スタサプ補足】375年の西ゴート族の南下をきっかけにゲルマン人が帝国内に大移動を始めた。ゲルマン人の大移動を引きおこした中央アジアの遊牧民がフン人。ニケーア公会議で異端とされたアリウス派はゲルマン人の間に広まった。\n【『ヨコから見る』p.60〜61 補足】ゲルマン人はローマ帝国初期（前1世紀〜）からライン川・ドナウ川の境界を越えて少しずつ帝国内に移住し、傭兵（ようへい）・下級官吏・コロヌス（小作人）としてローマ社会に入り込んでいた。375年に西進したフン人に押された西ゴート人がドナウ川を渡って帝国内に移住し、378年のアドリアノープルの戦いで皇帝ウァレンスを戦死させたことが「大移動」の本格的な始まり。',
  yoko:['4世紀後半、匈奴の一派とも考えられるフン人の西進がゲルマン人の大移動を引きおこす（『同時に学べ』p.42・スタサプ）','同じ4世紀、中国では五胡が華北に南下して五胡十六国時代（304〜）＝「ユーラシア規模の民族移動」（『同時に学べ』p.46）','寒冷化で「ギリギリ遊牧ができる」地帯の人々が南下→農耕地帯には「外敵の襲来」（『同時に学べ』p.38）'],
  src:'『同時に学べ』p.39・42／スタサプ 第2・4講',rel:['rome_34','フン人の西進','五胡','crisis3']},
 'フン人の西進':{kw:['フン人'],n:'フン人の西進',y:'4世紀後半｜中央ユーラシア→現在のウクライナ・ハンガリー方面',b:'4世紀後半に、中央ユーラシアのアジア系の遊牧民のフン人が西に移動し、フン人に圧迫されたゲルマン人がローマ帝国領内に大挙して侵入した（ゲルマン人の大移動、375年ごろ〜）。\n【スタサプ補足】4世紀半ば、北匈奴の西走で中央アジアの遊牧民フン人がヨーロッパへ移動し、ゲルマン人の大移動を引きおこした。\n【『ヨコから見る』p.60〜61・64 補足】フン人の起源は、1〜2世紀に後漢に敗れて西へ去った北匈奴（きたきょうど）の子孫とする説が有力で、ヴォルガ川流域から黒海北岸のゲルマン人（東ゴート・西ゴート）を圧迫した。つまり「後漢の北匈奴撃退（91年）→北匈奴の西走→フン人の西進→ゲルマン人の大移動」という形で、中国の出来事が数百年後にローマ帝国を揺るがした。中国側で五胡が南下したのと同じ時期に、ヨーロッパ側ではフン人に押されたゲルマン人が南下しており、「ユーラシア規模の民族移動」といえる。',
  yoko:['北匈奴の西走（1〜2世紀に後漢・鮮卑に圧迫される）→4世紀にフン人としてヨーロッパへ、という「草原の道」経由のヨコのつながり'],
  src:'『同時に学べ』p.42／スタサプ 第4講',rel:['ゲルマン人の大移動','n_xiongnu','草原の道']},
 christianity_34:{img:[{src:'img/p77.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/9/90/Good_Shepherd_Catacomb_of_Priscilla.jpg',cap:'ローマのカタコンベ（地下墓所）に描かれた「善き羊飼い」（初期キリスト教美術）（Wikimedia Commons／パブリックドメイン）',w:'キリスト教徒'},{src:'img/p97.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Colossal_head_of_Constantine_%28M.C._inv._1072%29%2C_August_24%2C_2021.jpg/960px-Colossal_head_of_Constantine_%28M.C._inv._1072%29%2C_August_24%2C_2021.jpg',cap:'コンスタンティヌス帝の巨像の頭部（ローマ・カピトリーニ美術館）（Wikimedia Commons／D. Benjamin Miller／パブリックドメイン）',w:'コンスタンティヌス'},{src:'img/p119.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Arch_of_Constantine_%28Rome%29_%2Clateral_view.jpg/960px-Arch_of_Constantine_%28Rome%29_%2Clateral_view.jpg',cap:'コンスタンティヌスの凱旋門（ローマ、315年）（Wikimedia Commons／Livioandronico2013／CC BY-SA 4.0）',w:'大帝'},{src:'img/p120.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Ponte_Milvio_HD.jpg/960px-Ponte_Milvio_HD.jpg',cap:'ミルウィウス橋（ローマ）。312年、コンスタンティヌスがここでの戦いに勝って内乱を収拾（Wikimedia Commons／Livioandronico2013／CC BY-SA 4.0）',w:'内乱'}],kw:['ミラノ勅令','ニケーア公会議','アタナシウス派','アリウス派','三位一体','国教化','キリスト教の公認'],n:'キリスト教の拡大：迫害→公認→国教化',y:'303 大迫害／313 公認／325 ニケーア／392 国教化｜ローマ帝国全域',b:'社会不安の時代は宗教の時代でもあった。ローマ帝国はギリシアの影響を受けた多神教の信仰を持ち、ただひとつの神を信仰し独特な習慣を持つキリスト教徒は奇異な集団と見られていた。特に3世紀は帝国に危機が迫ることが多く、ローマの神々や皇帝への礼拝を拒むキリスト教徒は「帝国が危機に瀕しているのにチームワークを乱すやつらだ」と反社会的な集団とされ、3世紀半ばから国家の政策としての弾圧と迫害が行われる。しかし皇帝たちの意図とは逆に、社会不安の中でキリスト教が人々の心の拠りどころとなり拡大していった。\n皇帝を神聖な存在としたディオクレティアヌスは、ただひとつの神を持つキリスト教とは折り合いが悪く、帝国全土で大規模な迫害（303）を行った（キリスト教徒を円形闘技場に引き出しライオンに食わせるといった公開処刑、教会の書物や財産の没収）が、拡大に歯止めをかけることはできなかった。\n内乱を収拾した「大帝」コンスタンティヌスは、勢力を増すキリスト教徒を迫害するのではなく味方につけたほうが得策と考え、313年にキリスト教を公認して信仰を許し（ミラノ勅令）、教会組織を帝国の統治機構に組み込んだ。公認により「キリスト教の正しい教えは何か」という教会内部の論争（イエスは神そのものなのか、神がつくった「人」なのか）も表面化し、325年のニケーア公会議で「子なるイエスと父なる神は同質」というアタナシウス派が正統、「イエスは神によってつくられた人間」というアリウス派が異端とされた。その後アタナシウス派の説に聖霊も加わり、「父なる神・子なるイエス・聖霊」は3つでありながら同質とする「三位一体説」がキリスト教の正式な教えとなる。このアタナシウス派の考えがキリスト教の中で最大の宗派「カトリック」となる。\nテオドシウスは早くから洗礼を受け、元老院にもキリスト教支持者が多かったことから、キリスト教以外の宗教を厳禁しキリスト教を事実上の国教とした（392）。国教化によりキリスト教がヨーロッパに定着し、以後のヨーロッパ文化のベースとなる。\n【『ヨコから見る』】公会議：325年ニケーア公会議（コンスタンティヌスが主催。アタナシウス派（三位一体説）が正統、アリウス派が異端→アリウス派はゲルマン人に拡大）、381年コンスタンティノープル公会議（ニケーアの再確認）、431年エフェソス公会議（ネストリウス派が異端→中国の景教）、451年カルケドン公会議（単性論派が異端）。\n【スタサプ補足】ローマ帝国は諸宗教に寛容で、初期の迫害はネロ帝（位54〜68）のものなどを除いて少なく、下層市民や女性を中心に帝国全土に広まった。3世紀から皇帝崇拝が強化されて圧力が強まる。ネストリウス派はササン朝ペルシアを経て中国に伝わり景教と呼ばれた。392年の国教化で司教・司祭などの聖職者身分が成立し教会の組織化が進んだ。',
  yoko:['313年 ミラノ勅令・325年 ニケーア公会議（キリスト教によるローマの精神的統一）⇔317年 東晋の建国（中国の統一崩れる）（『ヨコから見る』p.58）','ササン朝はローマに先がけてゾロアスター教で国家をまとめた。「宗教の力で国家を統合する」動きが東西で同時に（『同時に学べ』p.43）','ゾロアスター教の「最後の審判」や天使・悪魔の思想がユダヤ教・キリスト教に影響（『ヨコから見る』p.51）','アリウス派はゲルマン人に、ネストリウス派はササン朝を経て中国に（景教）——宗教もヨコに動く'],
  src:'『同時に学べ』p.39〜42／『ヨコから見る』p.50／スタサプ 第2講',rel:['rome_34','constantinople','sassanid','ゲルマン人の大移動']},
 constantinople:{img:[{src:'img/p97.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Colossal_head_of_Constantine_%28M.C._inv._1072%29%2C_August_24%2C_2021.jpg/960px-Colossal_head_of_Constantine_%28M.C._inv._1072%29%2C_August_24%2C_2021.jpg',cap:'コンスタンティヌス帝の巨像の頭部（ローマ・カピトリーニ美術館）（Wikimedia Commons／D. Benjamin Miller／パブリックドメイン）',w:'コンスタンティヌス'},{src:'img/p121.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Column_of_Constantine.jpg/960px-Column_of_Constantine.jpg',cap:'コンスタンティヌスの記念柱（イスタンブール）。330年の遷都を記念（Wikimedia Commons／Dmitry A. Mottl／CC BY-SA 4.0）',w:'コンスタンティノポリス'},{src:'img/p122.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Theodosian_Walls_of_Constantinople%2C_Istanbul_%2824053561188%29.jpg/960px-Theodosian_Walls_of_Constantinople%2C_Istanbul_%2824053561188%29.jpg',cap:'コンスタンティノープルのテオドシウスの城壁（5世紀）（Wikimedia Commons／Carole Raddato／CC BY-SA 2.0）',w:'東ローマ帝国'}],kw:['コンスタンティノープル','ビザンティウム'],n:'コンスタンティノープル',y:'330年 遷都｜現在のトルコ・イスタンブール',b:'コンスタンティヌスは皇帝直属の強力な騎兵部隊を組織し、ディオクレティアヌスが退けた元老院の議員たちも取り入れながら政治組織を再編成して帝国の運営を安定させた。そして330年に帝国の首都を東方のビザンティウム（現在のトルコ・イスタンブール）に移し、晩年にはコンスタンティノポリス（コンスタンティノープル）と改称。それまでの伝統的なローマの有力者の影響が強いローマから新しい都に移すことで、自らの意向に従う支配層を確立しようとした。\n【スタサプ補足】ビザンティウムはギリシア人の植民市（前8〜前6世紀）に由来。330年 新首都建設。395年の東西分裂後は東ローマ帝国（ビザンツ帝国）の都として1453年まで続く。',
  yoko:['帝国の重心が東へ：ゲルマン人に圧迫される西方より、豊かでササン朝と向き合う東方が中心に'],
  src:'『同時に学べ』p.41／スタサプ 第2講',rel:['rome_34','christianity_34','greeks']},
 sassanid:{img:[{src:'img/p93.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Ctesiphon%2C_Iraq%2C_1932.jpg/960px-Ctesiphon%2C_Iraq%2C_1932.jpg',cap:'ササン朝の都クテシフォンの宮殿跡「ターク＝キスラー」（イラク）（Wikimedia Commons／パブリックドメイン）',w:'クテシフォン'},{src:'img/p100.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Shapur_I_Valerian_Bas_Relief.jpg/960px-Shapur_I_Valerian_Bas_Relief.jpg',cap:'ナクシェ＝ロスタムのレリーフ。シャープール1世の前にひざまずくローマ皇帝（Wikimedia Commons／Farzad Bakhtiar／CC BY 2.5）',w:'ローマ皇帝'},{src:'img/p101.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/171206yd_Naqsh-e_Rostam_Investiture_d%27Ardashir_Ier.jpg/960px-171206yd_Naqsh-e_Rostam_Investiture_d%27Ardashir_Ier.jpg',cap:'ナクシェ＝ロスタムのレリーフ。神アフラ＝マズダから王権を授かるアルダシール1世（Wikimedia Commons／Perri.G／CC BY-SA 4.0）',w:'アルダシール1世'},{src:'img/p123.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Hunting_King_Plate%2C_303-309_AD%2C_Sasanian%2C_Iran%2C_silver_and_gilt_-_Cleveland_Museum_of_Art_-_DSC08117.JPG/960px-Hunting_King_Plate%2C_303-309_AD%2C_Sasanian%2C_Iran%2C_silver_and_gilt_-_Cleveland_Museum_of_Art_-_DSC08117.JPG',cap:'ササン朝の銀皿「狩猟する王」（303〜309年ごろ、クリーヴランド美術館）（Wikimedia Commons／CC0）',w:'ササン朝美術'},{src:'img/p124.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Coin_of_Shapur_I%2C_minted_in_Ctesiphon.jpg/960px-Coin_of_Shapur_I%2C_minted_in_Ctesiphon.jpg',cap:'シャープール1世の金貨（クテシフォン鋳造）。裏面はゾロアスター教の拝火壇（Wikimedia Commons／CC BY-SA 2.5）',w:'シャープール1世'}],kw:['ササン朝','アルダシール','シャープール','ゾロアスター教','マニ教','アヴェスター'],n:'ササン朝ペルシア',y:'224〜651｜現在のイラン・イラク',b:'「3世紀の危機」の時代、ユーラシア各地で弱体化や分裂が見られたが、それとは逆に3世紀に大きく成長した国家がササン朝ペルシア。3世紀初頭（224）にパルティアを滅ぼし、ペルシア（現在のイラン）の地を支配してローマ帝国のライバルとなった。成長の要因のひとつが宗教政策：ゾロアスター教（善と悪の二元論を持つイラン発祥の宗教）を国教のように扱い、宗教の組織力を国家をまとめる力に利用した。のちにローマがキリスト教の力を国家運営に利用するが、ササン朝はローマに先がけて国家統治に宗教の力を利用したことになる。\nササン朝はゾロアスター教以外に、ローマで広がっていたキリスト教やパレスチナ発祥のユダヤ教、インドから伝わった仏教など、さまざまな宗教の影響を受けやすい「宗教の十字路」に位置していた。ここで誕生したのがマニ教（宗教家マニが様々な宗教や哲学の要素を取り入れた「融合宗教」、善悪の二元論が特徴）。全盛期にはローマ帝国全域に広がりキリスト教のライバルとみなされるほどの勢いがあった。第2代シャープール1世はマニ教を保護した（死後、マニ教は弾圧）。シャープール1世はローマ皇帝を生け捕りにして捕虜とするという功績も残す。\n【『ヨコから見る』】パルティアがヘレニズム文化の影響を強く受けたのに対し、ササン朝はイラン人の心の故郷ともいうべきアケメネス朝の再現を強く願った（復古主義）。ゾロアスター教が国教とされ、経典『アヴェスター』が編纂（へんさん）された。火を崇拝し善悪二元論を説くが、最も重要なのは時間論：過去・現在・未来はすべて決定されていて最終ゴールには「最後の審判」が待っており、善神アフラ＝マズダの勝利も約束されている。「最後の審判」や天使・悪魔の思想はユダヤ教・キリスト教に強く影響（ヨコの鉄則）。マニ教はササン朝では弾圧されたが唐代の中国では流行し北アフリカにも浸透（教父アウグスティヌスも一時入信）。ササン朝美術は絹の道を通って遠く日本にまで影響（法隆寺の獅子狩文錦（ししかりもんきん）、正倉院の漆胡瓶（しっこへい））。ササン朝は農業が中心で国家財政の大半を土地税が占めたが商業が衰退したわけではなく、ローマ商人の後退に代わってアフリカ（エチオピア）のアクスム王国の商人が登場し、絹を中心とした東西交易は繁栄を続けた。君主：建国者アルダシール1世、シャープール1世（位241頃〜272頃、東はクシャーナ朝を破り西はローマの軍人皇帝ウァレリアヌスを捕らえた初期の英君）。\n【スタサプ補足】224年アルダシール1世に率いられたイラン高原南部のペルシア人がパルティアを倒して建国。クテシフォンを首都、ゾロアスター教を国教。シャープール1世（位241〜272）は西方ではシリアに侵入してローマ帝国と対抗、東方ではインダス川西岸までの地域を統合し中央集権的体制で統治。ゾロアスター教は南北朝時代の中国にも伝わり祆教（けんきょう）と呼ばれた。ゾロアスター教・仏教・キリスト教の要素を融合したマニ教がおこる。ササン朝美術（ヘレニズム様式や周辺の諸様式を取り入れた）は西はビザンツ帝国から地中海世界、東は中国〜日本に伝えられた。',
  yoko:['224年 パルティア滅亡・ササン朝成立⇔220年 後漢滅亡・魏の成立：東西の大国交代がほぼ同時（『ヨコから見る』p.55）','ササン朝の宗教政策（ゾロアスター教の国教化）はローマのキリスト教国教化（392）に先がける（『同時に学べ』p.43）','グプタ朝（インド）・ササン朝（イラン）ではともに復古主義的な宗教が主流に→インドではヒンドゥー教が成立、イランではゾロアスター教が国教（『ヨコから見る』p.53）','ササン朝美術→絹の道→法隆寺の獅子狩文錦・正倉院の漆胡瓶（『ヨコから見る』p.51）','クシャーナ朝はササン朝のシャープール1世に敗れ、以後ササン朝に服属した地方勢力に（『同時に学べ』p.44）'],
  src:'『同時に学べ』p.43／『ヨコから見る』p.51〜52／スタサプ 第2講',rel:['ササン朝とローマの抗争','parthia','kushan_34','rome_34','christianity_34','ctesiphon']},
 'ササン朝とローマの抗争':{img:[{src:'img/p100.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Shapur_I_Valerian_Bas_Relief.jpg/960px-Shapur_I_Valerian_Bas_Relief.jpg',cap:'ナクシェ＝ロスタム（イラン）のレリーフ。騎馬のシャープール1世の前にひざまずくローマ皇帝（Wikimedia Commons／Farzad Bakhtiar／CC BY 2.5）',w:'シャープール1世'}],kw:['ウァレリアヌス','エデッサ'],n:'ササン朝とローマの抗争',y:'3世紀（260年 ウァレリアヌス捕虜）｜現在のシリア〜イラク',b:'3世紀に入ると東方からは新興国家だったササン朝の侵入も始まり、ローマは国境線の防衛に力を入れざるを得なくなった。ササン朝第2代のシャープール1世はローマの皇帝を生け捕りにして捕虜とするという功績を残している。\n【『ヨコから見る』】軍人皇帝時代（235〜284）、わずか50年の間に20数人もの皇帝が次々と暗殺され、生き残ったのはウァレリアヌス帝（ササン朝のシャープール1世と戦い捕虜になった）のみという悲惨な状況。4世紀半ばからは、ローマ帝国の西方はゲルマン人に圧迫され、東方はササン朝に対抗する構図になり、西方担当と東方担当の皇帝が置かれることが多くなった（→395年の東西分裂へ）。\n【スタサプ補足】シャープール1世（位241〜272）は西方ではシリアに侵入してローマ帝国と対抗した。',
  yoko:['「外からの圧力」＝西のゲルマン人＋東のササン朝が、ローマの東西分担統治（四帝分治→東西分裂）の背景に'],
  src:'『同時に学べ』p.39・42〜43／『ヨコから見る』p.49・51',rel:['sassanid','rome_34','ゲルマン人の大移動']},
 kushan_34:{img:[{src:'img/p80.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Kanishka_enhanced.jpg/960px-Kanishka_enhanced.jpg',cap:'カニシカ王の立像（マトゥラー博物館）（Wikimedia Commons／Biswarup Ganguly／CC BY-SA 3.0）',w:'カニシカ王'},{src:'img/p125.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Peroz_II_Kushanshah_KUSHANO-SASANIAN_KING.jpg/960px-Peroz_II_Kushanshah_KUSHANO-SASANIAN_KING.jpg',cap:'ササン朝に服属したクシャーン王（クシャーノ＝ササン朝）の貨幣（Wikimedia Commons／CNG Coins／CC BY-SA 3.0）',w:'ササン朝に服属'}],kw:['クシャーナ朝','親魏大月氏王'],n:'クシャーナ朝（衰退期）',y:'3世紀に衰退・ササン朝に服属｜現在のパキスタン北部〜アフガニスタン',b:'3世紀に、それまでインドにあった2つの国家であるクシャーナ朝とサータヴァーハナ朝が、いずれも滅亡あるいは衰退した。2世紀のカニシカ王以後のクシャーナ朝の記録はあまり残っていないが、3世紀の王が「親魏大月氏王（しんぎだいげっしおう）」の称号を与えられ金印を授かったことが『三国志』の「魏志」に書かれている。これにより、この時代のクシャーナ朝の王が、魏から見ると卑弥呼と「同格」の扱いだったことがわかる。クシャーナ朝はササン朝のシャープール1世に敗れ、以後はササン朝に服属した地方勢力となる（ササン朝の領域の東端がクシャーナ朝の都周辺のガンダーラ地方（現在のパキスタン北西部））。サータヴァーハナ朝も内紛により衰退し崩壊した。\n【『ヨコから見る』】東西交易は衰退に向かい、商業重視のクシャーナ朝（インド）、パルティア（イラン）は衰退・滅亡。ローマへの物産提供で富を得ていたパルティアやクシャーナ朝は、ローマの経済衰退（アジア物産への需要低下）の影響を当然受けた。',
  yoko:['卑弥呼の「親魏倭王」（239）とクシャーナ朝の王の「親魏大月氏王」——魏は東西の遠国の王を同格に冊封（『同時に学べ』p.44）','ローマのアジア物産需要の低下→商業国家クシャーナ朝・パルティアの衰退（『ヨコから見る』p.49）'],

 india_3c:{img:[{src:'img/p126.jpg',orig:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/1st_to_4th_century_Mahayana_Buddhist_site%2C_Nagarjunakonda_Andhra_Pradesh%2C_India_-_02.jpg/960px-1st_to_4th_century_Mahayana_Buddhist_site%2C_Nagarjunakonda_Andhra_Pradesh%2C_India_-_02.jpg',cap:'ナーガールジュナコンダ遺跡（インド南部、1〜4世紀の大乗仏教遺跡）。サータヴァーハナ朝滅亡後もこの地で仏教が栄えた（Wikimedia Commons／Ms Sarah Welch／CC0）',w:'サータヴァーハナ朝'}],kw:['サータヴァーハナ朝の滅亡'],n:'クシャーナ朝とサータヴァーハナ朝の滅亡',y:'3世紀｜現在のインド',b:'3世紀に、それまでインドにあった2つの国家であるクシャーナ朝（北）とサータヴァーハナ朝（南、デカン高原）が、いずれも滅亡あるいは衰退した。クシャーナ朝はササン朝のシャープール1世に敗れてササン朝に服属した地方勢力となり、サータヴァーハナ朝は内紛により衰退し崩壊。その後しばらくインドは地方政権が分立する時代となったが、4世紀前半、インド北部でグプタ朝がおこり北インドを統合する大国に発展した。\n【『ヨコから見る』】東西交易が衰退に向かい、商業重視のクシャーナ朝・パルティアは衰退・滅亡。代わって復古主義的王朝（アケメネス朝の復興をめざすササン朝、マウリヤ朝の復興をめざすグプタ朝）が繁栄。',
  yoko:['ローマ・後漢の分裂・滅亡で国際商業の規模は縮小（決して消滅したわけではない）→商業に依存したインドの2王朝が衰退（『ヨコから見る』p.49・54）'],
