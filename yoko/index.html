  const pool=EV.filter(e=>inSel(e,range));
  let guard=0;
  while(out.length<qs.n&&guard++<500){
    const m=qs.mode==='mix'?pick(['cent','cent','dyn','order']):qs.mode;
    let q=null;
    if(m==='order'){q=genOrder(range)}
    else{const t=pick(pool);if(used.has(t.i))continue;q=m==='cent'?genCent(t):genDyn(t);if(q)used.add(t.i)}
    if(q&&!out.some(x=>x.key===q.key))out.push(q);
  }
  return out;
}
let run=null;
function startQuiz(set,host='#tab-quiz',back=renderQuizSetup){
  if(!set.length){alert('出題できる問題がありません（範囲や出題対象を変えてください）');return}
  run={set,k:0,ok:0,wrongs:[],host,back};showQ();
}
function showQ(){
  const q=run.set[run.k];const el=$(run.host);
  el.innerHTML=`<div class="bar"><span>${run.k+1} / ${run.set.length}</span><span>正解 ${run.ok}</span></div>
  ${q.type?`<div class="muted">${esc(q.type)}${q.yoko?'　<b style="color:var(--accent)">ヨコ</b>':''}</div>`:''}
  ${q.ctx?`<div class="ctx">${esc(q.ctx).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')}</div>`:''}
  <div class="q">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${NUM[k]} ${esc(o)}</button>`).join('')}</div>
  <div id="qexp"></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  const q=run.set[run.k];const el=$(run.host);const ok=k===q.a;
  if(ok){run.ok++;delWrong(q.key)}else{run.wrongs.push(q);addWrong(q.key,q.label)}
  el.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok');else if(i===k)b.classList.add('ng')});
  const ep=picExp(esc(q.exp));el.querySelector('#qexp').innerHTML=`<div class="exp"><div class="v ${ok?'ok':'ng'}">${ok?'正解':'不正解'}　正解は ${NUM[q.a]}</div>${ktMark(ep.html,[q.opts[q.a]])}</div>${q.geo!==undefined&&GEO[q.geo]?geoSVG(GEO[q.geo]):''}${q.mapP!==undefined&&MAPS.some(m=>m.p===q.mapP)?`<button class="btn sec mapbtn" id="qMap">この時代の地図をすべて見る</button>`:''}<button class="btn" id="qNext">${run.k+1<run.set.length?'次へ':'結果を見る'}</button>`;
  el.querySelectorAll('.exp .pic').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openPic(ep.ims[+b.dataset.ei])});
  bindMaps(el);const mb=el.querySelector('#qMap');if(mb)mb.onclick=()=>openMaps(q.mapP);
  el.querySelector('#qNext').onclick=()=>{run.k++;run.k<run.set.length?showQ():showResult()};
  el.querySelector('#qNext').scrollIntoView({block:'nearest'});
}
function showResult(){
  const el=$(run.host);
  el.innerHTML=`<div class="result"><div class="muted">結果</div><div class="big">${run.ok} / ${run.set.length}</div></div>
  ${run.wrongs.length?`<div class="card"><h3>間違えた問題</h3>${run.wrongs.map(q=>`<div class="wrongitem">${esc(q.label)}</div>`).join('')}</div>`:'<p class="muted" style="text-align:center">全問正解！</p>'}
  <div class="row"><button class="btn sec" id="rBack">設定に戻る</button><button class="btn" id="rRetry">${run.wrongs.length?'間違いだけもう一度':'もう一度'}</button></div>`;
  el.querySelector('#rBack').onclick=run.back;
  const w=run.wrongs.map(q=>genFromKey(q.key)).filter(Boolean);
  el.querySelector('#rRetry').onclick=()=>startQuiz(w.length?w:run.set.map(q=>genFromKey(q.key)).filter(Boolean),run.host,run.back);
}

// ---------- curated ----------
let curSet=store.get('yoko_set',null);
let curFilter=store.get('yoko_filter','yoko');
let curN=store.get('yoko_curn',10);
function renderCurSetup(){
  const el=$('#tab-cur');
  const sets=[...new Set(ALL_CURATED.filter(c=>!c.hidden).map(c=>c.set))];
  if(!sets.includes(curSet))curSet=sets[0];
  const hasYoko=ALL_CURATED.some(c=>c.set===curSet&&c.yoko);
  const idxs=ALL_CURATED.map((c,k)=>k).filter(k=>ALL_CURATED[k].set===curSet&&(curFilter==='all'||!hasYoko||ALL_CURATED[k].yoko));
  const nY=ALL_CURATED.filter(c=>c.set===curSet&&c.yoko).length,nA=ALL_CURATED.filter(c=>c.set===curSet).length;
  const wrongN=Object.keys(wrong).filter(k=>k.startsWith('cur:')&&idxs.includes(+k.split(':')[1])).length;
  const srcs=[...new Set(idxs.flatMap(k=>(ALL_CURATED[k].src.match(/『[^』]+』/g)||[ALL_CURATED[k].src])))];
  el.innerHTML=`<div class="setting"><div class="lab">問題セット</div><div class="chips">${sets.map(s=>`<button class="chip ${s===curSet?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
  ${hasYoko?`<div class="setting"><div class="lab">出題範囲</div><div class="chips"><button class="chip ${curFilter==='yoko'?'on':''}" data-f="yoko">ヨコ中心（${nY}）</button><button class="chip ${curFilter==='all'?'on':''}" data-f="all">知識確認も含む全問（${nA}）</button></div></div>`:''}
  <div class="setting"><div class="lab">1回の問題数</div><div class="chips">${[10,20,999].map(n=>`<button class="chip ${curN===n?'on':''}" data-n="${n}">${n===999?'全問':n+'問'}</button>`).join('')}</div></div>
  <p class="muted">主な出典：${srcs.map(esc).join('、')}。「ヨコ中心」は2地域以上の同時代・影響関係を問う問題だけ。各問の解説末尾に出典を表示。</p>
  <button class="btn" id="cAll">スタート（ランダムに${Math.min(curN,idxs.length)}問）</button>
  <button class="btn sec" id="cWrong">前回の間違いだけ（${wrongN}）</button>`;
  el.querySelectorAll('.chip[data-s]').forEach(b=>b.onclick=()=>{curSet=b.dataset.s;store.set('yoko_set',curSet);renderCurSetup()});
  el.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{curFilter=b.dataset.f;store.set('yoko_filter',curFilter);renderCurSetup()});
  el.querySelectorAll('.chip[data-n]').forEach(b=>b.onclick=()=>{curN=+b.dataset.n;store.set('yoko_curn',curN);renderCurSetup()});
  $('#cAll').onclick=()=>startQuiz(shuffle(idxs).slice(0,curN).map(curQ),'#tab-cur',renderCurSetup);
  $('#cWrong').onclick=()=>startQuiz(shuffle(Object.keys(wrong).filter(k=>k.startsWith('cur:')&&idxs.includes(+k.split(':')[1]))).map(genFromKey).filter(Boolean),'#tab-cur',renderCurSetup);
}

// ---------- 暗記カード ----------
const CK='yoko_cards_todo';let todo=store.get(CK,{});
const cs={deck:store.get('yoko_deck','ev'),src:'all'};let crun=null;
function cardsEv(){return EV.filter(e=>inSel(e,[])).map(e=>({id:'ev:'+e.i,tag:REG[e.r].short,front:qt(e.t),back:`${yfmt(e.y)}年（${pname(e.y)}）`,same:EV.filter(x=>x.i!==e.i&&x.r!==e.r&&Math.abs(x.y-e.y)<=40).sort((a,b)=>a.y-b.y).map(x=>`${yfmt(x.y)} ${REG[x.r].short}：${x.t}`),geo:GEO.findIndex(g=>g.p===pidx(e.y)&&true)>=0?guessGeo({exp:'',q:'前'+Math.abs(e.y)+'年',p:pidx(e.y)}):undefined}))}
function cardsRule(){return RULE_CARDS.map((c,i)=>({id:'rule:'+i,tag:'ヨコの鉄則',front:c.f,back:c.b+'\n\n出典：'+c.s,same:[]}))}
function renderCardSetup(){
  const el=$('#tab-card');const all=cs.deck==='ev'?cardsEv():cardsRule();const nT=all.filter(c=>todo[c.id]).length;
  el.innerHTML=`<div class="setting"><div class="lab">デッキ</div><div class="chips"><button class="chip ${cs.deck==='ev'?'on':''}" data-d="ev">出来事→同時代（${cardsEv().length}）</button><button class="chip ${cs.deck==='rule'?'on':''}" data-d="rule">ヨコの鉄則（${cardsRule().length}）</button></div></div>
  <div class="setting"><div class="lab">対象</div><div class="chips"><button class="chip ${cs.src==='all'?'on':''}" data-s="all">全部</button><button class="chip ${cs.src==='todo'?'on':''}" data-s="todo">「まだ」だけ（${nT}）</button></div></div>
  <p class="muted">カードをタップで裏返し。「覚えた」「まだ」で仕分け。「まだ」はこの端末に保存されます。</p>
  <button class="btn" id="cStart">スタート（シャッフル）</button>`;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{cs.deck=b.dataset.d;store.set('yoko_deck',cs.deck);renderCardSetup()});
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{cs.src=b.dataset.s;renderCardSetup()});
  $('#cStart').onclick=()=>{const set=shuffle(all.filter(c=>cs.src==='all'||todo[c.id]));if(!set.length){alert('カードがありません');return}crun={set,k:0,flip:false};showCard()};
}
function showCard(){
  const el=$('#tab-card');const c=crun.set[crun.k];
  el.innerHTML=`<div class="bar"><span>${crun.k+1} / ${crun.set.length}</span><span>${todo[c.id]?'まだ':''}</span></div>
  <div class="fcard" id="fc"><div class="tag">${esc(c.tag)}</div>${crun.flip?`<div class="front" style="margin-bottom:6px">${esc(c.front)}</div><div class="back">${esc(c.back)}</div>${c.same.length?`<div class="same"><div class="muted">同時期（±40年）の他地域</div>${c.same.map(s=>`<div>${esc(s)}</div>`).join('')}</div>`:''}`:`<div class="front">${esc(c.front)}</div><div class="hint">タップで答え</div>`}</div>
  ${crun.flip&&c.geo!==undefined&&GEO[c.geo]?geoSVG(GEO[c.geo],'all'):''}
  <div class="row"><button class="btn sec" id="cNo">まだ</button><button class="btn" id="cYes">覚えた</button></div>
  <button class="btn sec" id="cQuit" style="margin-top:8px">やめる</button>`;
  $('#fc').onclick=()=>{crun.flip=!crun.flip;showCard()};bindMaps(el);
  const next=()=>{crun.k++;crun.flip=false;crun.k<crun.set.length?showCard():cardResult()};
  $('#cNo').onclick=()=>{todo[c.id]=1;store.set(CK,todo);next()};
  $('#cYes').onclick=()=>{delete todo[c.id];store.set(CK,todo);next()};
  $('#cQuit').onclick=renderCardSetup;
}
function cardResult(){const el=$('#tab-card');const n=crun.set.filter(c=>todo[c.id]).length;el.innerHTML=`<div class="result"><div class="muted">終了</div><div class="big">${crun.set.length-n} / ${crun.set.length}</div><div class="muted">覚えた枚数</div></div><button class="btn" id="cBack">デッキに戻る</button>`;$('#cBack').onclick=renderCardSetup}

// ---------- wrong list ----------
function renderWrong(){
  const el=$('#tab-wrong');const keys=Object.keys(wrong).sort((a,b)=>wrong[b].t-wrong[a].t);
  el.innerHTML=`<p class="muted">間違えた問題はここに保存され、正解すると消えます（この端末のみ）。${keys.length}件</p>
  ${keys.length?`<div class="card">${keys.map(k=>`<div class="wrongitem">${esc(wrong[k].l)}<br><small>${k.split(':')[0]==='cur'?'厳選':k.split(':')[0]==='cent'?'同じ時期':k.split(':')[0]==='dyn'?'その時どこは':'年代整序'}</small></div>`).join('')}</div>
  <button class="btn sec" id="wClear">すべて消去</button>`:''}`;
  const c=$('#wClear');if(c)c.onclick=()=>{if(confirm('間違い記録を消去しますか？')){wrong={};store.set(WK,wrong);renderWrong()}};
}

renderTL();renderQuizSetup();renderCurSetup();
