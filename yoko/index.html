 opts:['Ⅰ―Ⅱ―Ⅲ','Ⅰ―Ⅲ―Ⅱ','Ⅱ―Ⅰ―Ⅲ','Ⅱ―Ⅲ―Ⅰ','Ⅲ―Ⅰ―Ⅱ','Ⅲ―Ⅱ―Ⅰ'],a:4,
 exp:'Ⅲ アッシリアの統一は前7世紀。Ⅰ アケメネス朝（現在のイラン）の滅亡は前330年（東方遠征は前334〜前324）。Ⅱ 秦の統一は前221年。「オリエント統一（アッシリア）→ペルシア帝国→アレクサンドロス→ヘレニズム諸国」の西の流れと，「春秋・戦国→秦→前漢」の東の流れを重ねて覚える。'},
{set:'古代（紀元前）',yoko:true,type:'年代整序（下線部＋Ⅰ・Ⅱ）',src:'『ヨコから見る世界史』LESSON3 p.34・37／LESSON2 p.28',
 ctx:'ノート\n・ローマはカルタゴと3度にわたるポエニ戦争を戦った。第2次では，ハンニバルがイタリアに侵入してカンナエでローマ軍を破ったが，ⓐ<u>ザマの戦いでローマ軍がハンニバルを破った</u>。',
 q:'次の文Ⅰ・Ⅱは，アジアの出来事を述べている。下線部ⓐの出来事と，文Ⅰ・Ⅱとについて，古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。\n\nⅠ　前漢の武帝が，匈奴をはさみ撃ちにするため張騫を大月氏に派遣した。\nⅡ　チャンドラグプタが，インド最初の統一王朝マウリヤ朝を建てた。',
 opts:['Ⅰ―Ⅱ―下線部','Ⅰ―下線部―Ⅱ','Ⅱ―Ⅰ―下線部','Ⅱ―下線部―Ⅰ','下線部―Ⅰ―Ⅱ','下線部―Ⅱ―Ⅰ'],a:3,
 exp:'Ⅱ マウリヤ朝（現在のインド）成立は前317年頃（アレクサンドロスの遠征に刺激）。下線部 ザマ（現在のチュニジア）の戦いは前202年で，劉邦が前漢を建てたのと同年。Ⅰ 張騫の派遣は前139年（武帝の即位は前141年，ローマがカルタゴ（現在のチュニジア）を滅ぼした前146年の直後）。'},
{set:'古代（紀元前）',type:'最も適当な文',src:'『ヨコから見る世界史』LESSON2 p.26',
 q:'ペルシア戦争について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['アケメネス朝はフェニキア人の商業活動を保護しており，サラミスの海戦ではフェニキア人主体のペルシア海軍がアテネ海軍に敗れた。','マラトンの戦いでは，スパルタの重装歩兵がダレイオス1世のペルシア軍を破った。','戦後，スパルタを盟主とするデロス同盟が結成され，ギリシア世界の繁栄を主導した。','この戦争の結果，地中海の支配権はギリシア人からフェニキア人に移った。'],a:0,
 exp:'戦争の原因はアケメネス朝（現在のイラン）によるイオニア（現在のトルコ西岸）諸都市の圧迫とその反乱をアテネが支援したこと。前490マラトン（アテネの重装歩兵），前480テルモピレー（スパルタ（現在のギリシア南部）のレオニダス全滅）・サラミス（海戦），前479プラタイア。戦後アテネはデロス同盟の盟主として繁栄。「第1ラウンドはギリシアが勝利→地中海の支配権はフェニキア人（現在のレバノン沿岸）からギリシア人に移った」（ヨコの鉄則）。'},
{set:'古代（紀元前）',yoko:true,type:'空欄の文と関連事項の組合せ',src:'『ヨコから見る世界史』LESSON2 p.24・27／『世界史と日本史は同時に学べ』p.15',
 ctx:'会話文\n石倉：アレクサンドロス大王は前334年に東方遠征を始め，イッソスの戦い，アルベラの戦いでダレイオス3世を破り，前330年にアケメネス朝を滅ぼしました。\n尾崎：征服地では，［ ア ］。\n先生：そうですね。そしてインドでは，彼の遠征に刺激されて，［ イ ］が成立しました。',
 q:'会話文中の空欄［ ア ］に入る文あ・いと，［ イ ］に関して述べた文Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\n［ ア ］に入る文\nあ　共通ギリシア語のコイネーが普及し，ギリシア人とペルシア人との通婚が奨励されました\nい　ポリスの伝統を守るため，ギリシア人の東方への移住は禁じられました\n\n［ イ ］に関して述べた文\nＸ　チャンドラグプタが建てた，インド最初の統一王朝である。\nＹ　アショーカ王が建てた，仏教を統治理念とする王朝である。',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'アレクサンドロスの東西融合政策は①コイネーの普及②ギリシア人の東方移住とペルシア人との通婚奨励③ペルシアの伝統尊重。その結果ヘレニズム文化（世界市民主義・個人主義）が生まれた。マウリヤ朝（前317頃〜前180頃、現在のインド）はチャンドラグプタがギリシア軍を追って建てたインド最初の統一王朝。アショーカ王は建国者ではなく第3代の王で，仏教に帰依して最盛期を築いた。'},
{set:'古代（紀元前）',type:'あ・いの正誤',src:'『ヨコから見る世界史』LESSON2 p.27〜28',
 q:'ヘレニズム時代の文化について述べた文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　ストア派は禁欲説を唱え，ローマ時代にはセネカやマルクス＝アウレリウス＝アントニヌス帝が代表的な担い手となった。\nい　プトレマイオス朝の都アンティオキアに置かれたムセイオンには，アルキメデスらの学者が集まった。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:1,
 exp:'あは正しい。世界市民主義を代表するストア派は感情の統制を禁欲説で唱え，ローマ帝国で統治理念として受容された。いは誤り。ムセイオン（王立研究所）はプトレマイオス朝の都アレクサンドリア（現在のエジプト北部）にあり，アリスタルコス・アルキメデス・エウクレイデス・エラトステネスらが活動した。アンティオキアはセレウコス朝シリア（現在のシリア〜イラン一帯）の都。'},
{set:'古代（紀元前）',type:'誤っている文',src:'『ヨコから見る世界史』LESSON3 p.34〜35',
 q:'ポエニ戦争とその前後のローマについて述べた文として誤っているものを，次の①〜④のうちから一つ選べ。',
 opts:['第1次ポエニ戦争に勝利したローマは，シチリア島を最初の属州とした。','前216年のカンナエの戦いで，カルタゴのハンニバルがローマ軍を包囲殲滅した。','第3次ポエニ戦争では，ローマの将軍大スキピオがカルタゴを徹底的に滅ぼした。','カルタゴが滅亡した前146年には，ギリシアの有力都市コリントスもローマに滅ぼされた。'],a:2,
 exp:'第3次（前149〜前146）でカルタゴ（現在のチュニジア）を滅ぼしたのは小スキピオ（歴史家ポリビオスが同行）。大スキピオは前202年ザマ（現在のチュニジア）の戦いでハンニバルを破った将軍。ローマはその後，前133年ペルガモン（現在のトルコ西部），前64年シリア，前30年エジプトを滅ぼして地中海を「われらの海」とした。'},
{set:'古代（紀元前）',yoko:true,type:'資料の読み取り',src:'『ヨコから見る世界史』LESSON3 p.36 の表',
 ctx:'資料　アケメネス朝ペルシアと秦の比較（教材の表より作成）\n［軍用道路］アケメネス朝：「王の道」（スサ〜サルデス）／秦：「馳道」（咸陽から約800km）\n［支配］アケメネス朝：サトラップ制。全国を20の州に分け，非世襲のサトラップ（知事）を派遣／秦：郡県制。全国を36郡に分け，その下に県を置き，非世襲の官僚を派遣\n［監察］アケメネス朝：各州に「王の目」「王の耳」を派遣／秦：中央に御史大夫，各郡に監を派遣\n［その他］アケメネス朝：各民族の宗教・言語・法律・習慣に干渉せず寛大／秦：法家に基づく厳しい支配，焚書・坑儒',
 q:'資料から読み取れる事柄や，その背景について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['アケメネス朝は，各州に世襲の知事を置いて統治した。','秦は，全国を郡と県に分け，中央から非世襲の官僚を派遣して統治した。','アケメネス朝は，被支配民族の宗教や言語を禁じ，ペルシアの習慣を強制した。','秦の郡県制がサトラップ制の影響を受けて成立したことは，史料によって裏付けられている。'],a:1,
 exp:'サトラップも郡県制の官僚も非世襲（①誤）。アケメネス朝（現在のイラン）は各民族に寛大（③誤）。両者は似ているが「因果関係・影響は推測の域を出ない」と教材は注意している（④誤）。ただし世界帝国の比較は論述で頻出。始皇帝は法家の李斯を丞相に用いて郡県制を敷いた。'},
{set:'古代（紀元前）',type:'語と事績の組合せ',src:'『ヨコから見る世界史』LESSON3 p.37',
 ctx:'ノート\n・前漢の建国者劉邦（高祖）は，匈奴全盛期の君主［ ウ ］に白登山の戦いで敗れ，以後匈奴に対して和親政策をとった。\n・7代目の武帝は匈奴に対する強烈な巻き返しを行った。',
 q:'ノート中の空欄［ ウ ］に入る人名あ・いと，武帝の対外政策について述べた文Ｘ〜Ｚとについて，最も適当なものの組合せを，次の①〜⑥のうちから一つ選べ。\n\n［ ウ ］に入る人名\nあ　冒頓単于\nい　商鞅\n\n武帝の対外政策\nＸ　張騫を大月氏に派遣し，衛青・霍去病に匈奴を討たせ，西域に河西四郡を設置した。\nＹ　匈奴と国境を定めて交易を認め，西域から軍を撤退させた。\nＺ　南越を保護国として自立させ，朝鮮半島から漢の郡を撤収した。',
 opts:['あ―Ｘ','あ―Ｙ','あ―Ｚ','い―Ｘ','い―Ｙ','い―Ｚ'],a:0,
 exp:'冒頓単于（位前209〜前174）。商鞅は戦国時代に秦の孝公に仕えた法家で，匈奴（現在のモンゴル高原）の君主ではない。武帝は前139張騫派遣→前129衛青・霍去病の匈奴討伐→前121頃河西四郡（敦煌・武威・張掖・酒泉、現在の中国甘粛省）設置→前111南越に9郡→前108朝鮮に楽浪郡（現在の北朝鮮・平壌付近）など4郡。'},
{set:'古代（紀元前）',yoko:true,type:'課題と事例の組合せ',src:'『ヨコから見る世界史』LESSON1 p.16・p.19／LESSON3 p.38',
 q:'生徒たちは，古代の世界について探究するための課題を考えた。課題あ・いと，それぞれの課題を考察するための事例として最も適当なものＷ〜Ｚとについて，組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\n課題\nあ　前6〜前5世紀に，ギリシア・インド・中国で新しい思想や宗教が同時に生まれたのはなぜか。\nい　前2世紀以降，東西の交易路はどのように使われたのか。\n\n事例\nＷ　ガンジス川流域での鉄器の使用と，クシャトリヤ・ヴァイシャの台頭\nＸ　河西四郡の設置と，オアシスの住民による隊商交易\nＹ　アケメネス朝のサトラップ制と秦の郡県制の類似\nＺ　ローマの「分割して統治せよ」によるイタリア半島支配',
 opts:['あ―Ｗ　い―Ｘ','あ―Ｗ　い―Ｙ','あ―Ｘ　い―Ｗ','あ―Ｙ　い―Ｚ'],a:0,
 exp:'あ：教材のまとめ表は「経済発展（植民都市・鋳造貨幣／鉄器／鉄製農具）→社会変化（ポリス民主化／クシャトリヤ・ヴァイシャの台頭／富国強兵と人材登用）→思想・宗教」と3地域を並べる。い：武帝が河西四郡（現在の中国甘粛省）を置いて西域（現在の中国新疆〜中央アジア）経営が本格化し，オアシス住民の隊商交易が絹の道の利益を生んだ。Ｙは統治制度の比較，Ｚはローマ国内の統治で，どちらの課題にも直接は対応しない。'},
{set:'古代（紀元前）',yoko:true,type:'時点の正誤（ヨコ）',src:'『ヨコから見る世界史』LESSON1〜3／『世界史と日本史は同時に学べ』p.14〜16',
 q:'古代の世界の各地域について，時期の関係を述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['アショーカ王が即位した時点で，中国はすでに秦によって統一されていた。','武帝が河西四郡を設置した時点で，ローマはすでにカルタゴを滅ぼしていた。','マウリヤ朝が成立した時点で，アレクサンドロス大王はまだ存命であった。','ソクラテスが処刑された時点で，孔子はまだ存命であった。'],a:1,
 exp:'②が正しい：河西四郡の設置は前121年頃，カルタゴ（現在のチュニジア）滅亡は前146年。①アショーカ王の即位は前268年頃，秦の統一は前221年。③マウリヤ朝（現在のインド）は前317年頃，アレクサンドロスは前323年に33歳で急死。④ソクラテスの処刑は前399年，孔子は前479年に没している（ガウタマ＝シッダールタと孔子は同時代）。'},
{set:'古代（紀元前）',yoko:true,type:'メモの正誤（6択）',src:'『ヨコから見る世界史』LESSON3 p.38「3つのルート」',
 q:'三人の生徒は，東西交易路の「3つのルート」について調べ，メモを作成した。三人がまとめたメモの正誤について述べた文として最も適当なものを，次の①〜⑥のうちから一つ選べ。\n\n佐藤さんのメモ：唐の玄奘は，北方騎馬民族が移動に使った草原の道を通ってインドに向かい，『大唐西域記』を著した。\n鈴木さんのメモ：海の道は，ローマ帝国・サータヴァーハナ朝・後漢などを結び，義浄やイブン＝バットゥータが利用した。\n高橋さんのメモ：製紙法の西伝や大乗仏教の中国伝播は，オアシス都市を結ぶ絹の道を通じて行われた。',
 opts:['佐藤さんのみ正しい。','鈴木さんのみ正しい。','高橋さんのみ正しい。','佐藤さんと鈴木さんのみ正しい。','佐藤さんと高橋さんのみ正しい。','鈴木さんと高橋さんのみ正しい。'],a:5,
 exp:'玄奘が使ったのは絹の道（オアシス＝ロード）で，非常に厳しいコースだが東西を結ぶ最短路。マルコ＝ポーロもこのルートを使った（佐藤は誤り）。草原の道はフン人の西進や，13世紀にプラノ＝カルピニ・ルブルックがカラコルムを訪れたルート。海の道は義浄（『南海寄帰内法伝』）・イブン＝バットゥータ（『大旅行記』）が使用。'},
{set:'古代（紀元前）',yoko:true,type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.12',
 ctx:'パネル（紀元前20世紀〜紀元前11世紀の世界）\n・紀元前2000年ごろから，［ ア ］系の民族が馬にひかせる戦車を用い，様々な文明と接触した。小アジアのヒッタイト王国，エーゲ海周辺に南下したギリシア人，イラン高原のペルシア人，インドに侵入したアーリア人などがこれにあたる。\n・一方，中国の黄河流域では，［ イ ］。\n・このころの日本は，縄文時代の晩期にあたる。',
 q:'パネル中の空欄［ ア ］に入る語と，［ イ ］に入る文との組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―インド＝ヨーロッパ　イ―高度に発達した青銅器を特徴とする殷王朝があらわれた','ア―インド＝ヨーロッパ　イ―鉄製農具と牛耕農法が普及し，諸子百家が現れた','ア―セム　イ―高度に発達した青銅器を特徴とする殷王朝があらわれた','ア―セム　イ―鉄製農具と牛耕農法が普及し，諸子百家が現れた'],a:0,
 exp:'インド＝ヨーロッパ系民族の原住地は南ロシアの草原地帯。ヨーロッパのケルト・ラテン・ゲルマン・スラヴ人も同系統。フェニキア人（現在のレバノン沿岸）やヘブライ人（現在のイスラエル・パレスチナ）はセム系。殷（現在の中国河南省）は高度に発達した青銅器を特徴とする王朝。鉄製農具・諸子百家は前8世紀以降の春秋・戦国時代。'},
{set:'古代（紀元前）',type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.10〜11',
 ctx:'ノート\n・約20万年前，私たちと同じ現生人類に属する［ ア ］がアフリカに登場し，数万年前までに世界各地に分布した。\n・約1万年前に氷期が終わって気候が温暖化し，約9000年前の西アジアで麦の栽培や家畜の飼育が始まった。その後，［ イ ］。',
 q:'ノート中の空欄［ ア ］に入る語と，［ イ ］に入る文との組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―新人　イ―水を引く灌漑農業が始まると食糧生産が増え，大河の流域に人口が集中して文明と都市が生まれた','ア―新人　イ―焼畑農業が始まると人口が分散し，文明の成立は遅れた','ア―原人　イ―水を引く灌漑農業が始まると食糧生産が増え，大河の流域に人口が集中して文明と都市が生まれた','ア―原人　イ―焼畑農業が始まると人口が分散し，文明の成立は遅れた'],a:0,
 exp:'新人（ホモ＝サピエンス）の代表はクロマニョン人・周口店上洞人。原人は北京原人・ジャワ原人。灌漑農業→食糧生産の増加→エジプト・メソポタミア（現在のイラク）・インダス川（現在のパキスタン）周辺・黄河・長江の流域に人口集中→文明の誕生と宗教・交易の中心である都市の成立。日本は約1万6000年前から縄文時代。'},
{set:'古代（紀元前）',type:'あ・いの正誤',src:'『ヨコから見る世界史』LESSON1 p.15',
 q:'諸子百家について述べた文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　儒家では，孟子が性善説と王道政治を，荀子が性悪説を説いた。\nい　道家の老子・荘子は，法治主義と信賞必罰を説き，秦で採用された。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:1,
 exp:'儒家は礼と仁を説き周の封建制の復活を願った。孟子（性善説・王道政治），荀子（性悪説，弟子に韓非や李斯）。道家の老子・荘子は無為自然を説き，のち道教に発展。法治主義・信賞必罰は法家（商鞅・韓非・李斯）で，秦で採用された。'},
{set:'古代（紀元前）',yoko:true,type:'最も適当な文',src:'『ヨコから見る世界史』LESSON1 p.15',
 q:'儒教が後世の世界に与えた影響について，同書が「ヨコの世界史」として挙げている事柄として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['儒教の農業重視は，のちにフランスへ伝わってケネーの重農主義に影響を与えた。','儒教の礼の思想は，ローマ法の成立に影響を与えた。','墨家の兼愛の教えは，儒教を通じてキリスト教の隣人愛に影響を与えた。','儒教の科挙試験は，イギリスの議会制度の成立に影響を与えた。'],a:0,
 exp:'同書は，儒教の農業重視→ケネーの重農主義，儒教の科挙試験→日本・ヨーロッパの公務員試験への影響を挙げ，「十分にヨコの世界史に含まれる」と述べる。科挙が影響したのは議会制度ではなく公務員試験。'},
{set:'古代（紀元前）',type:'語と説明の組合せ',src:'『ヨコから見る世界史』LESSON1 p.17',
 ctx:'ノート\n・前8〜前6世紀，ギリシア世界では人口増加による土地不足や貴族間の政治抗争から，海外への植民活動が活発化した。\n・その代表が［ ア ］である。',
 q:'ノート中の空欄［ ア ］に入る植民市の名あ・いと，その説明Ｘ〜Ｚとについて，最も適当なものの組合せを，次の①〜⑥のうちから一つ選べ。\n\n［ ア ］に入る植民市の名\nあ　ビザンティオン\nい　ルテティア\n\n説明\nＸ　ギリシア人が海岸に建設した植民市で，現在のイスタンブル。\nＹ　ローマ人が内陸に建設した植民市で，現在のパリ。\nＺ　フェニキア人が北アフリカに建設した植民市で，「地中海の女王」と呼ばれた。',
 opts:['あ―Ｘ','あ―Ｙ','あ―Ｚ','い―Ｘ','い―Ｙ','い―Ｚ'],a:0,
 exp:'ギリシアの植民市は海岸中心（ビザンティオン・ネアポリス＝ナポリ・マッサリア＝マルセイユ），ローマの植民市は内陸中心（ルテティア＝パリ・ウィンドボナ＝ウィーン・ロンディニウム＝ロンドン）。土地のやせたギリシアは商業で経済を補ったため海港が多い。Ｚはカルタゴ（ティルス（現在のレバノン南部）の植民市）。'},
{set:'古代（紀元前）',type:'資料の読み取り',src:'『ヨコから見る世界史』LESSON1 p.16 の表',
 ctx:'資料　仏教とジャイナ教（教材の表より作成）\n［開祖］仏教：ガウタマ＝シッダールタ／ジャイナ教：ヴァルダマーナ\n［支持］仏教：主にクシャトリヤの支持を集める／ジャイナ教：主にヴァイシャの支持を集める\n［特徴］仏教：ヴァルナ制を否定，苦行を否定／ジャイナ教：ヴァルナ制を否定，徹底した不殺生主義',
 q:'資料から読み取れる事柄や，その背景について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['仏教は，ヴァルダマーナが開き，主にヴァイシャの支持を集めた。','ジャイナ教は，徹底した不殺生主義を説き，仏教と同じくヴァルナ制を否定した。','仏教は，バラモン教の苦行を受け継ぎ，これを重視した。','両宗教は，バラモンを頂点とする既成の身分制を擁護するために生まれた。'],a:1,
 exp:'鉄器の使用とガンジス川（現在のインド北部）の豊かな土地で農業・商工業が発展し，クシャトリヤ（武士）とヴァイシャ（農民・牧畜民・商人）が力をつけてバラモン教に不満を抱いた。その期待を受けたのが仏教（苦行を否定）とジャイナ教（不殺生）。仏教は普遍性ゆえにアジア全体へ広がり，ジャイナ教は今もインドの民族資本家・商人に信者が多い。'},
{set:'古代（紀元前）',yoko:true,type:'年代整序（6択）',src:'『ヨコから見る世界史』LESSON1 p.18「ヨコの鉄則」',
 q:'次の宗教の成立Ⅰ〜Ⅲについて，古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。\n\nⅠ　ヘブライ人が，「最後の審判」の思想などを取り入れてユダヤ教を作った。\nⅡ　イランで，善悪二元論を説くゾロアスター教が成立した。\nⅢ　インドで，仏教とジャイナ教が誕生した。',
 opts:['Ⅰ―Ⅱ―Ⅲ','Ⅰ―Ⅲ―Ⅱ','Ⅱ―Ⅰ―Ⅲ','Ⅱ―Ⅲ―Ⅰ','Ⅲ―Ⅰ―Ⅱ','Ⅲ―Ⅱ―Ⅰ'],a:2,
 exp:'ゾロアスター教は前7世紀頃イランで成立し，遠く中国まで伝わった。ユダヤ教は前6世紀，ゾロアスター教の「最後の審判」の思想などを取り入れて成立。仏教・ジャイナ教は前5世紀頃。「前7〜前6世紀にかけて，イランではゾロアスター教，イスラエルではユダヤ教，インドでは仏教が成立した」（ヨコの鉄則）。'},
{set:'古代（紀元前）',type:'空欄の文と関連事項の組合せ',src:'『ヨコから見る世界史』LESSON1 p.18',
 ctx:'会話文\n高橋：前6世紀から，小アジアのイオニア地方（ミレトス市など）では，［ ア ］。\n先生：オリエントの先進諸国とも接しやすかったからですね。その代表がタレスです。',
 q:'会話文中の空欄［ ア ］に入る文あ・いと，タレスについて述べた文Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\n［ ア ］に入る文\nあ　自然を合理的に説明しようとする自然哲学が興りました\nい　現実の政治に役立つ処世的な思想が興りました\n\nタレスについて述べた文\nＸ　「万物の根元は水」と説いた。\nＹ　「万物の根元は原子（アトム）」と説いた。',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'イオニア（現在のトルコ西岸）の自然哲学は，中国の諸子百家のように実用的・処世的ではなく，純粋に真理を探究する姿勢が画期的。タレス＝水，デモクリトス＝原子，アナクシマンドロス＝ト＝アペイロン，ピタゴラス＝数，ヘラクレイトス＝「万物は流転する」（火）。'},
{set:'古代（紀元前）',type:'正しい文の組合せ',src:'『ヨコから見る世界史』LESSON2 p.26',
 q:'ペルシア戦争の経過について述べた文あ〜えについて，正しいものの組合せを，次の①〜④のうちから一つ選べ。\n\nあ　前490年のマラトンの戦いで，アテネの重装歩兵がダレイオス1世のペルシア軍を破った。\nい　前480年のテルモピレーの戦いで，レオニダス率いるスパルタ軍がペルシア軍を破った。\nう　前479年のプラタイアの戦いで，アテネ・スパルタ連合軍がペルシアの陸軍を破った。\nえ　前480年のサラミスの海戦で，フェニキア人主体のペルシア海軍がアテネ海軍を破った。',
 opts:['あ・う','あ・え','い・う','い・え'],a:0,
 exp:'テルモピレーではレオニダスのスパルタ（現在のギリシア南部）軍は勇敢に戦うも全滅（い誤）。サラミスの海戦ではペルシア海軍がアテネ海軍に敗北（え誤）。原因はアケメネス朝（現在のイラン）によるイオニア（現在のトルコ西岸）諸都市の圧迫→反乱→アテネの支援。結果，アテネはデロス同盟の盟主として繁栄。'},
{set:'古代（紀元前）',type:'メモの正誤（6択）',src:'『ヨコから見る世界史』LESSON2 p.26〜27',
 q:'三人の生徒は，アレクサンドロス大王について調べ，メモを作成した。三人がまとめたメモの正誤について述べた文として最も適当なものを，次の①〜⑥のうちから一つ選べ。\n\n佐藤さんのメモ：父のフィリッポス2世は，ギリシア世界をコリントス（ヘラス）同盟としてまとめ，ペルシアへの復讐戦を決意したが暗殺された。\n鈴木さんのメモ：アレクサンドロスは，前333年のイッソスの戦い，前331年のアルベラの戦いでダレイオス3世の軍を破った。\n高橋さんのメモ：アレクサンドロスは，征服地の公用語をペルシア語に統一し，ギリシア人とペルシア人の通婚を禁じた。',
 opts:['佐藤さんのみ正しい。','鈴木さんのみ正しい。','高橋さんのみ正しい。','佐藤さんと鈴木さんのみ正しい。','佐藤さんと高橋さんのみ正しい。','鈴木さんと高橋さんのみ正しい。'],a:3,
 exp:'東西融合政策は①コイネー（共通ギリシア語）の普及②ギリシア人の東方移住とペルシア人との通婚奨励③ペルシアの伝統を尊重し東方的専制君主として君臨。高橋のメモは逆。アレクサンドロス（位前336〜前323）は20歳で即位し，前330年アケメネス朝（現在のイラン）を滅ぼし，33歳で急死した。'},
{set:'古代（紀元前）',type:'最も適当な文',src:'『ヨコから見る世界史』LESSON3 p.35「ヘレニズム国家」',
 q:'アレクサンドロス大王の死後に分裂したヘレニズム国家について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['プトレマイオス朝エジプトは，アレクサンドリアを中心に東地中海の覇権を握り，のちにクレオパトラが出た。','セレウコス朝シリアの都アレクサンドリアには，ムセイオンが置かれた。','アンティゴノス朝マケドニアは，ギリシア文化をアジアに伝える「ヨコの関係」で最も重要な国家であった。','セレウコス朝から自立したバクトリアはイラン系，パルティアはギリシア系の国家であった。'],a:0,
 exp:'前301年のイプソスの戦いで①アンティゴノス朝マケドニア（最も後進国、現在のギリシア北部）②プトレマイオス朝エジプト（アレクサンドリア（現在のエジプト北部），学芸の中心，クレオパトラ）③セレウコス朝シリア（都アンティオキア，ギリシア文化をアジアに伝える点で最重要、現在のシリア〜イラン一帯）に分裂。セレウコス朝からイラン系のパルティア（現在のイラン・イラク），ギリシア系のバクトリア（現在のアフガニスタン北部）が自立した。'},
{set:'古代（紀元前）',type:'語と事績の組合せ',src:'『ヨコから見る世界史』LESSON2 p.28',
 ctx:'ノート\n・アレクサンドロスがパンジャーブ地方を平定すると，インド側でも統一の機運が芽生え，前4世紀末にインド最初の統一王朝マウリヤ朝が成立した。\n・マウリヤ朝は第3代の［ ア ］の時代に最盛期を迎えた。',
 q:'ノート中の空欄［ ア ］に入る人名あ・いと，その人物の事績Ｘ〜Ｚとについて，最も適当なものの組合せを，次の①〜⑥のうちから一つ選べ。\n\n［ ア ］に入る人名\nあ　アショーカ王\nい　チャンドラグプタ\n\n事績\nＸ　各地に石柱碑・ストゥーパ・磨崖碑を建て，第3回仏典結集を行い，セイロン島に仏教を布教した。\nＹ　ギリシア軍を追ってマウリヤ朝を建設し，のちセレウコス朝と和を結んだ。\nＺ　ガンダーラ美術を保護し，大乗仏教を広めた。',
 opts:['あ―Ｘ','あ―Ｙ','あ―Ｚ','い―Ｘ','い―Ｙ','い―Ｚ'],a:0,
 exp:'アショーカ王（位前268頃〜前232頃）は仏教に深く帰依し，その普遍性を統治理念に利用した。Ｙは初代チャンドラグプタ（セレウコス朝（現在のシリア〜イラン一帯）の使者メガステネスが『インド誌』を著す）。Ｚはクシャーナ朝（現在のパキスタン〜インド北部）期の内容で時代が異なる。'},
{set:'古代（紀元前）',type:'あ・いの正誤',src:'『ヨコから見る世界史』LESSON3 p.36〜37',
 q:'秦と前漢について述べた文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　秦は，法家に基づく厳しい支配と焚書・坑儒による思想統制を行ったが，改革を急ぎすぎてわずか15年で滅んだ。\nい　前漢の武帝は，即位した頃に起こった呉楚七国の乱を鎮圧できず，諸侯の力が強まった。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:1,
 exp:'秦は前221〜前206年。前漢は秦の諸制度（郡県制など）を受け継いだ。呉楚（現在の中国長江中流域）七国の乱（前154年）は武帝の即位（前141年）以前に鎮圧されており，武帝の頃に前漢は最盛期を迎えていた（い誤）。'},
{set:'古代（紀元前）',type:'空欄の組合せ',src:'『ヨコから見る世界史』LESSON3 p.37',
 ctx:'ノート（武帝の対外遠征）\n①前139年　張騫を大月氏国に派遣\n②前129年　将軍衛青・霍去病の匈奴討伐\n③前121年頃　西域に河西四郡を設置\n④前111年　［ ア ］に遠征→9郡を設置\n⑤前108年　朝鮮に遠征→［ イ ］など4郡を設置',
 q:'ノート中の空欄［ ア ］と［ イ ］に入る語の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―南越　イ―楽浪郡','ア―南越　イ―敦煌郡','ア―大宛　イ―楽浪郡','ア―大宛　イ―敦煌郡'],a:0,
 exp:'南越（現在の中国広東省〜ベトナム北部）は秦末の混乱時に趙佗が独立して作った国（ベトナム付近）。楽浪郡（現在の北朝鮮・平壌付近）は朝鮮4郡の一つで，2026追試では『漢書』地理志の楽浪郡の記事が出題された。敦煌は河西四郡（現在の中国甘粛省）の最西端。大宛（フェルガナ、現在のウズベキスタン東部）は李広利が汗血馬を捕らえに行った国。武帝の遠征は匈奴（現在のモンゴル高原）→西域（現在の中国新疆〜中央アジア）→南越→朝鮮と時計の反対回り。'},
{set:'古代（紀元前）',type:'最も適当な文',src:'『ヨコから見る世界史』LESSON3 p.37〜38',
 q:'前漢の武帝の治世について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['李広利は，大宛（フェルガナ）に遠征して名馬「汗血馬」を持ち帰った。','李陵は，匈奴を破って河西四郡を設置した。','司馬遷は，李陵を弁護して罰せられたのち，『漢書』を著した。','武帝は治世の末年まで匈奴に連勝し，草原の道の支配を完成した。'],a:0,
 exp:'李広利は前104年に失敗したが前102年に大宛（現在のウズベキスタン東部）から汗血馬を持ち帰った。李陵は5000の漢軍を率いて11万の匈奴（現在のモンゴル高原）軍に包囲され投降した将軍で，これを弁護した司馬遷（『史記』）は罰せられた。武帝の治世晩年は匈奴に対して不調。『漢書』は前漢の歴史書（『同時に学べ』p.16）。'},
{set:'古代（紀元前）',yoko:true,type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.16',
 ctx:'パネル（紀元前2世紀・1世紀の世界）\n・東西にローマと前漢という有名な国家が存在している。ローマはまだ皇帝が存在しない「共和政」の段階で，ポエニ戦争でカルタゴを破り，地中海を支配しようとしていた。\n・前漢は当初，モンゴル高原の遊牧国家である匈奴に圧迫されていたが，武帝が匈奴を破った。\n・この時代の日本は，「［ ア ］」と呼ばれており，前漢に使者を送る者がいたということが，前漢の歴史書の［ イ ］に記されている。',
 q:'パネル中の空欄［ ア ］と［ イ ］に入る語の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―倭　イ―『漢書』','ア―倭　イ―『魏志』倭人伝','ア―奴国　イ―『漢書』','ア―奴国　イ―『魏志』倭人伝'],a:0,
 exp:'この時代の日本は「倭」と呼ばれ，前漢に使者を送る者がいたことが前漢の歴史書『漢書』に記されている（『同時に学べ』p.16）。『魏志』倭人伝は後の時代（3世紀）の史料。'},
{set:'古代（紀元前）',type:'人物の事績（最も適当）',src:'『ヨコから見る世界史』LESSON3 p.36／型：2025本試 第2問1',
 ctx:'会話文\n先生：春秋・戦国時代の混乱を収拾して，初めて統一王朝を樹立したのが秦の［ ア ］です。\n生徒：彼はわずか15年で滅ぶ王朝の基礎を，どのように築いたのでしょうか。',
 q:'会話文中の空欄［ ア ］に入る人物の事績として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['法家の李斯を丞相に用い，全国を36郡に分けて非世襲の官僚を派遣する郡県制を敷いた。','呉楚七国の乱を鎮圧し，諸侯の勢力を抑えた。','張騫を大月氏国に派遣し，匈奴のはさみ撃ちを画策した。','商鞅を用いて変法を行い，秦を強国にした。'],a:0,
 exp:'始皇帝は郡県制・焚書坑儒など法家に基づく厳しい支配を行った。②は前漢の景帝（前154年），③は武帝（前139年），④は戦国時代の秦の孝公。共通テストでは「同じ地域の別の時代の君主の事績」を誤答に並べる型が定番（2025本試ではカエサルの事績に対しユスティニアヌス・カラカラ・コンスタンティヌスを配置）。'},
{set:'古代（紀元前）',yoko:true,type:'資料の年代整序（6択）',src:'『ヨコから見る世界史』LESSON1 p.15・LESSON3 p.37／型：2025本試 第2問2',
 ctx:'資料１　秦の孝公に仕えた人物が，郡県制の施行などの政治改革を断行し，秦を強国にしたことを記す記録。\n資料２　匈奴の補給路を断つため，西域に敦煌・武威・張掖・酒泉の四郡が置かれたことを記す記録。\n資料３　農民出身の建国者が，白登山（平城）の戦いで匈奴の単于に手痛い敗北を喫し，以後和親政策をとったことを記す記録。',
 q:'資料１〜３に記された出来事について，古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。',
 opts:['資料１―資料２―資料３','資料１―資料３―資料２','資料２―資料１―資料３','資料２―資料３―資料１','資料３―資料１―資料２','資料３―資料２―資料１'],a:1,
 exp:'資料１は商鞅の変法（前4世紀，戦国時代）。資料３は前漢の高祖劉邦が冒頓単于に敗れた白登山（現在の中国山西省・大同）の戦い（前200年頃）。資料２は武帝の河西四郡（現在の中国甘粛省）設置（前121年頃）。人名を伏せた資料から出来事を特定させる型は2025本試（カエサル・マリウス・グラックス兄弟）で出題。'},
{set:'古代（紀元前）',yoko:true,type:'メモの正誤（比較）',src:'『ヨコから見る世界史』LESSON2 p.27〜28・LESSON3 p.36／型：2025本試 第2問5・2026本試 第4問6',
 q:'生徒たちは，古代の帝国のあり方を比較してメモを作成した。それぞれのメモの正誤について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。\n\n木村さんのメモ：アケメネス朝のサトラップ制と秦の郡県制は，中央から非世襲の官僚を地方に派遣した点で類似していると考えられる。\n清水さんのメモ：アレクサンドロス大王の東西融合政策とアショーカ王の仏教政策は，征服地の宗教を一つに統一した点で類似していると考えられる。',
 opts:['木村さんのみ正しい。','清水さんのみ正しい。','二人とも正しい。','二人とも誤っている。'],a:0,
 exp:'サトラップ（知事）も郡県制の官僚も非世襲で，監察官（王の目・王の耳／御史大夫・監）を置く点も似る（木村は正しい）。アレクサンドロスはコイネーの普及と通婚奨励，ペルシアの伝統尊重による融合を進めたのであって宗教の統一ではなく，アショーカ王は仏教の普遍性を統治理念に利用したが，仏教への統一を強制したわけではない（清水は誤り）。'},
{set:'古代（紀元前）',type:'誤っている文',src:'『ヨコから見る世界史』LESSON2 p.28・LESSON3 p.38／型：2026本試 第3問3',
 q:'古代〜中世の歴史書・旅行記について述べた文として誤っているものを，次の①〜④のうちから一つ選べ。',
 opts:['『史記』は，李陵を弁護して罰せられた司馬遷が著した。','『インド誌』は，セレウコス朝からマウリヤ朝に派遣された使者メガステネスが著した。','『大唐西域記』は，絹の道（オアシス＝ロード）を通ってインドに赴いた玄奘の記録である。','『南海寄帰内法伝』は，草原の道を通ってカラコルムを訪れた義浄の記録である。'],a:3,
 exp:'義浄は海の道（マリン＝ロード）を使ってインドに渡った。草原の道でカラコルムを訪れたのは13世紀のプラノ＝カルピニやルブルック。2026本試では『史記』の紀伝体・『集史』の言語・ラス＝カサス・ランケを並べて「誤っているもの」を問うた。'},
{set:'古代（紀元前）',type:'正しい文の組合せ',src:'『世界史と日本史は同時に学べ』p.12',
 q:'前2000年ごろから各地に広がったインド＝ヨーロッパ系の民族について述べた文あ〜えについて，正しいものの組合せを，次の①〜④のうちから一つ選べ。\n\nあ　ケルト人・ラテン人・ゲルマン人・スラヴ人など，ヨーロッパ各地の民族もインド＝ヨーロッパ系にあたる。\nい　フェニキア人・ヘブライ人など，地中海東岸の民族もインド＝ヨーロッパ系にあたる。\nう　彼らの原住地は，南ロシアの草原地帯と考えられている。\nえ　彼らの原住地は，中国の黄河流域と考えられている。',
 opts:['あ・う','あ・え','い・う','い・え'],a:0,
 exp:'インド＝ヨーロッパ系は小アジアのヒッタイト（現在のトルコ），エーゲ海のギリシア人，イラン高原のペルシア人，インドのアーリア人，ヨーロッパのケルト・ラテン・ゲルマン・スラヴ人。原住地は南ロシアの草原地帯。フェニキア人（現在のレバノン沿岸）・ヘブライ人（現在のイスラエル・パレスチナ）はセム系。同じころ黄河流域には殷（現在の中国河南省）王朝があらわれた。'},
{set:'古代（紀元前）',type:'空欄の組合せ',src:'『ヨコから見る世界史』LESSON1 p.13〜14',
 ctx:'ノート\n・前770年，西方の遊牧民［ ア ］の侵入によって，周王朝は都を鎬京から洛邑へ移した。この事件から諸侯が群雄割拠する春秋・戦国時代となる。\n・中国では黄河流域を中心に夏（伝説の王朝）→殷→周と王朝が続くとされてきたが，最近では文化レベルの高い［ イ ］の存在が明らかになり，日本の縄文文化との関係も指摘されている。',
 q:'ノート中の空欄［ ア ］と［ イ ］に入る語の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―犬戎　イ―長江文明','ア―犬戎　イ―インダス文明','ア―匈奴　イ―長江文明','ア―匈奴　イ―インダス文明'],a:0,
 exp:'犬戎の侵入による周の東遷（前770年）が春秋時代の始まり。匈奴（現在のモンゴル高原）が強大化するのは秦末〜前漢（冒頓単于）。山形県羽黒町の石斧（約5000年前）は長江流域で作られた可能性が指摘されるが，入試でヨコの関連が問われるのは前8世紀くらいからだと同書は述べる。'},
{set:'古代（紀元前）',type:'語と説明の組合せ',src:'『ヨコから見る世界史』LESSON1 p.15',
 q:'諸子百家の学派あ・いと，その代表的人物や主張の説明Ｘ〜Ｚとについて，最も適当なものの組合せを，次の①〜⑥のうちから一つ選べ。\n\n学派\nあ　墨家\nい　縦横家\n\n説明\nＸ　墨子が代表で，兼愛（博愛）と非攻（戦争反対）を説き，儒家に対抗する大勢力となった。\nＹ　蘇秦・張儀が代表で，諸国間の外交策を説いた。\nＺ　鄒衍が代表で，陰陽五行説を説いた。',
 opts:['あ―Ｘ','あ―Ｙ','あ―Ｚ','い―Ｘ','い―Ｙ','い―Ｚ'],a:0,
 exp:'墨家（墨子）は兼愛・非攻を説いたが，血縁中心の儒家の仁に敗れて消滅。その他，陰陽家（鄒衍，陰陽五行説），兵家（孫子），名家（公孫竜），農家（許行），縦横家（蘇秦・張儀）が入試で出る。'},
{set:'古代（紀元前）',type:'空欄の組合せ',src:'『ヨコから見る世界史』LESSON1 p.16',
 ctx:'ノート\n・［ ア ］山脈のカイバル峠を越えて侵入したインド＝ヨーロッパ語族のアーリヤ人は，前1000年頃ガンジス川流域に進出した。\n・ガンジス川の豊かな土地と鉄器の使用（前800年頃使用開始）により，前6世紀頃から農業生産は飛躍的に向上し，商工業も発展した。貨幣の使用もこの頃からであり，同時代の中国とよく似ている。\n・［ イ ］やコーサラ国は対立しながら統一の機をうかがっていた。',
 q:'ノート中の空欄［ ア ］と［ イ ］に入る語の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―ヒンドゥークシュ　イ―マガダ国','ア―ヒンドゥークシュ　イ―マウリヤ朝','ア―ヒマラヤ　イ―マガダ国','ア―ヒマラヤ　イ―マウリヤ朝'],a:0,
 exp:'アーリヤ人はヒンドゥークシュ山脈のカイバル峠を越えて北西インドに入り，前1000年頃ガンジス川（現在のインド北部）流域へ。マガダ国（現在のインド東部ビハール）・コーサラ国はガンジス川流域の有力国。マウリヤ朝（現在のインド）は前4世紀末に成立したインド最初の統一王朝。「前6〜前5世紀，インド・中国ともに鉄器が普及し商工業・貨幣経済が発展した」（ヨコの鉄則）。'},
{set:'古代（紀元前）',yoko:true,type:'空欄の文と関連事項の組合せ',src:'『ヨコから見る世界史』LESSON1 p.13・p.17',
 ctx:'会話文\n小川：前6〜前5世紀に，ギリシアの三大哲学者，インドの仏教・ジャイナ教，中国の諸子百家がほぼ同時に出現したのは偶然ではないと本に書いてありました。\n先生：そうです。背景には［ ア ］。その中で古い体制が崩れ，新しい価値観を求める気運が出てきたのです。\n小川：ギリシアの場合は，前7世紀に小アジアの［ イ ］から鋳造貨幣が入り，商業・貿易が発展したことも大きいのですね。',
 q:'会話文中の空欄［ ア ］に入る文あ・いと，［ イ ］に入る国Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\n［ ア ］に入る文\nあ　商工業の発展があり，平民・庶民層の台頭がありました\nい　大帝国の成立があり，貴族層の権力の強化がありました\n\n［ イ ］に入る国\nＸ　リディア\nＹ　メディア',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'「これらの思想家・宗教の出現は決して偶然ではない。背景には商工業の発展があり，平民・庶民層の台頭があった」。鋳造貨幣を伝えたリディア（現在のトルコ西部）は小アジアの国。イランに建てられたメディア（現在のイラン北西部）と混同しないこと（同書の注意）。ギリシアは本土と植民都市・エジプト・南ロシアを結ぶ貿易で発展した。'},
{set:'古代（紀元前）',type:'語と事績の組合せ',src:'『ヨコから見る世界史』LESSON1 p.17〜18',
 q:'アテネの哲学者あ・いと，その説明Ｘ〜Ｚとについて，最も適当なものの組合せを，次の①〜⑥のうちから一つ選べ。\n\n哲学者\nあ　プラトン\nい　アリストテレス\n\n説明\nＸ　教育機関アカデメイアを設立し，イデア論を唱えて，哲人が支配する哲人政治を説いた。\nＹ　経験的な方法であらゆる分野に功績を残し，アレクサンドロス大王の家庭教師も務め，イスラーム哲学や中世のスコラ哲学に影響を与えた。\nＺ　著作を一つも残さず，若者と対話しながら「無知の知」を説き，アテネの国法に従って毒杯を飲んで死んだ。',
 opts:['あ―Ｘ','あ―Ｙ','あ―Ｚ','い―Ｘ','い―Ｙ','い―Ｚ'],a:0,
 exp:'ソクラテス（Ｚ）→弟子プラトン（Ｘ）→弟子アリストテレス（Ｙ）。プラトンの哲人政治は，ほぼ同時代の孟子の王道政治に似ている。アリストテレスの哲学は，イスラーム哲学や中世ヨーロッパのスコラ哲学に強い影響を与え，イスラーム文化もアリストテレスから大きな恩恵を受けた（同書p.13・18）。'},
{set:'古代（紀元前）',type:'あ・いの正誤',src:'『ヨコから見る世界史』LESSON2 p.27〜28',
 q:'ヘレニズム時代の思想について述べた文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　エピクロス派は唯物論的傾向が強く，瞑想によって精神の安定としての快楽を求め，ローマ時代のルクレティウスもその一人であった。\nい　ストア派は感情の統制を禁欲説で唱え，人種・国籍を超えた世界市民主義的性格が強かった。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:0,
 exp:'両方正しい。エピクロス派の「快楽」は五感の快楽ではなく精神の安定。ルクレティウス（『物の本質について』，未完）は難関校で出題される。ストア派はローマ帝国の統治理念として受容され，セネカやマルクス＝アウレリウス＝アントニヌス帝（『自省録』）が代表。'},
{set:'古代（紀元前）',yoko:true,type:'最も適当な文',src:'『ヨコから見る世界史』LESSON3 p.33〜34',
 q:'ローマがイタリア半島を支配した過程について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['中小土地所有農民の重装歩兵が政治の軸となり，各都市と個別に条約を結ぶ「分割して統治せよ」の方式で半島を支配した。','都市国家ローマは，海岸に多数の植民市を建設する商業国家として出発した。','ローマは，征服したイタリアの諸都市を全て属州として直接支配した。','半島統一の過程で，ローマはカルタゴと同盟を結んで軍艦を提供された。'],a:0,
 exp:'イタリアはギリシアと違って耕作地が広く，ローマは初め地味な農業国家で，重装歩兵民主政が行われた。優れた芸術は生まれなかったが，実用的な建築や統治・支配に非凡な才能を発揮し，「分割して統治せよ」で各都市の利害の一致を避けながらイタリア半島を支配した。最初の属州はポエニ戦争で得たシチリア島。'},
{set:'古代（紀元前）',yoko:true,type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.14／『ヨコから見る世界史』LESSON1 p.12〜13',
 ctx:'会話文\n先生：紀元前6〜前5世紀の地図では，多くの民族を服属させた「初の世界帝国」［ ア ］の存在感が際立っています。\n生徒：同じ時代に，ギリシアのソクラテス，仏教を生んだガウタマ＝シッダールタ，中国の孔子など，多くの哲学者・思想家が活動しているのが面白いです。\n先生：そうですね。3地域とも，［ イ ］という共通の背景がありました。',
 q:'会話文中の空欄［ ア ］に入る語と，［ イ ］に入る文との組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―アケメネス朝ペルシア　イ―商工業が発展して平民・庶民層が台頭し，古い体制が崩れた','ア―アケメネス朝ペルシア　イ―大帝国の支配のもとで戦乱がやみ，貴族が学問を独占した','ア―アッシリア　イ―商工業が発展して平民・庶民層が台頭し，古い体制が崩れた','ア―アッシリア　イ―大帝国の支配のもとで戦乱がやみ，貴族が学問を独占した'],a:0,
 exp:'アッシリア（現在のイラク北部）は前612年に滅亡しており，前6〜前5世紀の「初の世界帝国」はアケメネス朝ペルシア（現在のイラン）。ギリシアは植民活動と貿易，インド・中国は鉄器による農業生産の向上→商工業の発展→庶民層の台頭→新しい価値観を求める気運，という同じ構図（『ヨコから見る』のまとめ表）。日本はこの頃，水田稲作が東日本まで広がり弥生文化が始まる。'},
{set:'古代（紀元前）',yoko:true,type:'資料の読み取り',src:'『ヨコから見る世界史』LESSON1 p.19「この時代のまとめ表」',
 ctx:'資料　前6〜前5世紀の3地域の比較（教材のまとめ表より作成）\n［経済発展］ギリシア：植民都市の建設，リディアからの鋳造貨幣→交易活動の活発化／インド：鉄器（鉄製農具）の使用，ガンジス川の豊かな土地→農業生産の向上／中国：鉄製農具・牛耕農法の普及→農業生産の向上\n［社会変化］ギリシア：ポリス社会の発展と民主化／インド：クシャトリヤ，ヴァイシャの台頭／中国：各国の富国強兵と人材登用\n［宗教（思想）］ギリシア：ソクラテス，プラトン，アリストテレス／インド：仏教，ジャイナ教の誕生／中国：諸子百家（儒家，法家など）の出現',
 q:'資料から読み取れる事柄について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['3地域とも，農業生産の向上が社会変化の出発点となった。','ギリシアは農業生産ではなく，広範囲な貿易活動によって社会が動いた。','インドでは，バラモンが商工業の発展を主導して仏教を生んだ。','中国では，ポリスの民主化が諸子百家を生む背景となった。'],a:1,
 exp:'「中国，インドは農業生産の向上により，ギリシアは広範囲な貿易活動により社会が動いた」（ヨコの鉄則）。土地のやせたギリシアは商業で経済基盤を補い，海岸に植民市を築いた。インドで台頭したのはクシャトリヤ・ヴァイシャで，バラモン教への不満が仏教・ジャイナ教を生んだ。'},
{set:'古代（紀元前）',yoko:true,type:'空欄の文と関連事項の組合せ',src:'『ヨコから見る世界史』LESSON1 p.18',
 ctx:'会話文\n中島：前7世紀頃，イランでは善悪二元論を説くゾロアスター教が成立しました。この宗教は遠く中国まで伝わったそうです。\n先生：そして前6世紀，ヘブライ人たちは，［ ア ］，ユダヤ教を作りました。',
 q:'会話文中の空欄［ ア ］に入る文あ・いと，同じ前6〜前5世紀頃のインドの出来事Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\n［ ア ］に入る文\nあ　ゾロアスター教の「最後の審判」の思想などを取り入れて\nい　ギリシアのイオニア自然哲学の影響を受けて\n\nインドの出来事\nＸ　クシャトリヤやヴァイシャの支持を受けて，仏教とジャイナ教が誕生した。\nＹ　アショーカ王が仏教に帰依し，各地に石柱碑を建てた。',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'「前7〜前6世紀にかけて，イランではゾロアスター教，イスラエルではユダヤ教，インドでは仏教が成立した」。ユダヤ教はゾロアスター教から「最後の審判」の思想を取り入れた（宗教間のヨコの影響）。アショーカ王は前3世紀で時代が異なる。'},
{set:'古代（紀元前）',yoko:true,type:'語と説明の組合せ',src:'『世界史と日本史は同時に学べ』p.12〜16（各地図の「日本」欄）',
 q:'『世界史と日本史は同時に学べ』の地図では，各時代の日本の状況が世界の出来事と並べて示されている。時代あ・いと，その時代の日本の状況Ｘ〜Ｚとについて，正しいものの組合せを，次の①〜⑥のうちから一つ選べ。\n\n時代\nあ　アッシリアがオリエントを統一し，周が都を洛邑に移した頃（前10〜前7世紀）\nい　共和政ローマがカルタゴを破り，前漢の武帝が匈奴を破った頃（前2〜前1世紀）\n\n日本の状況\nＸ　縄文時代の最末期にあたり，九州北部で水田による米づくりが始まった。\nＹ　「倭」と呼ばれ，前漢に使者を送る者がいた（弥生時代）。\nＺ　縄文時代の晩期にあたり，殷王朝と同じ頃であった。',
 opts:['あ―Ｘ　い―Ｙ','あ―Ｘ　い―Ｚ','あ―Ｙ　い―Ｘ','あ―Ｚ　い―Ｘ','あ―Ｚ　い―Ｙ','あ―Ｙ　い―Ｚ'],a:0,
 exp:'同書の対応：前20〜前11世紀（インド＝ヨーロッパ系の拡散・殷）＝縄文晩期／前10〜前7世紀（アッシリア（現在のイラク北部）・周の東遷）＝縄文最末期，九州北部で水田稲作開始／前6・5世紀（アケメネス朝（現在のイラン）・孔子）＝前5〜4世紀に稲作が東日本へ，弥生文化の始まり／前4・3世紀（アレクサンドロス・秦）＝弥生時代／前2・1世紀（ローマ・前漢）＝「倭」が前漢へ遣使（『漢書』）。'},
{set:'古代（紀元前）',yoko:true,type:'時点の正誤（ヨコ）',src:'『世界史と日本史は同時に学べ』p.15〜16／『ヨコから見る世界史』LESSON3',
 q:'紀元前3世紀の世界について，地域どうしの時期の関係を述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['秦の始皇帝が中国を統一した頃，ローマは第2次ポエニ戦争でハンニバルと戦っていた。','秦の始皇帝が中国を統一した頃，ローマはすでにカルタゴを滅ぼしていた。','マウリヤ朝のアショーカ王が即位した頃，アレクサンドロス大王はインドに遠征していた。','前漢が成立した頃，アケメネス朝ペルシアが最盛期を迎えていた。'],a:0,
 exp:'秦の統一は前221年，第2次ポエニ戦争は前218〜前201年（カンナエ（現在のイタリア南部）前216，ザマ前202＝前漢成立と同年）。カルタゴ（現在のチュニジア）滅亡は前146年（武帝即位前141年の直後）。アショーカ王の即位は前268年頃で，アレクサンドロス（前323年没）の遠征より約半世紀後。アケメネス朝（現在のイラン）は前330年に滅亡している。'},
{set:'古代（紀元前）',yoko:true,type:'空欄の文と関連事項の組合せ',src:'『ヨコから見る世界史』LESSON2 p.25・p.28／LESSON3 p.38',
 ctx:'会話文\n先生：アレクサンドロスの東西融合政策の結果，ギリシア文化とオリエントの文化が融合したヘレニズム文化が生まれました。この文化はさらに東へ広がります。\n生徒：インドでは［ ア ］。\n先生：そうです。そしてその仏教は，東西交易路のうち［ イ ］を通って中国へ伝わりました。',
 q:'会話文中の空欄［ ア ］に入る文あ・いと，［ イ ］に入る語Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\n［ ア ］に入る文\nあ　ガンダーラ美術を生み，大乗仏教とともに東方へ伝わりました\nい　バラモン教を復興させ，仏教はインドから消えました\n\n［ イ ］に入る語\nＸ　絹の道（オアシス＝ロード）\nＹ　草原の道（ステップ＝ロード）',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'ヘレニズム文化はインドのガンダーラ美術を生み，高度な自然科学はイスラーム文化に影響した。製紙法の西伝と大乗仏教の中国伝播はいずれも絹の道（オアシス＝ロード）を通じて行われ，玄奘やマルコ＝ポーロもこのルートを使った。草原の道はフン人の西進や13世紀のプラノ＝カルピニらのルート。'},
{set:'古代（紀元前）',yoko:true,type:'メモの正誤（6択）',src:'『世界史と日本史は同時に学べ』p.16／『ヨコから見る世界史』LESSON3 p.32・37',
 q:'三人の生徒は，紀元前2〜前1世紀の「東西の二つの帝国」についてメモを作成した。三人がまとめたメモの正誤について述べた文として最も適当なものを，次の①〜⑥のうちから一つ選べ。\n\n佐藤さんのメモ：ローマと前漢の間にはイラン系のパルティアがあり，ローマとは敵対し，前漢とは交易で結ばれていた。\n鈴木さんのメモ：前漢は当初，モンゴル高原の遊牧国家である匈奴に圧迫され，事実上の属国のような存在だったが，武帝が匈奴を破った。\n高橋さんのメモ：ローマはすでに皇帝が支配する帝政の段階にあり，前漢の武帝と使者を交換していた。',
 opts:['佐藤さんのみ正しい。','鈴木さんのみ正しい。','高橋さんのみ正しい。','佐藤さんと鈴木さんのみ正しい。','佐藤さんと高橋さんのみ正しい。','鈴木さんと高橋さんのみ正しい。'],a:3,
 exp:'前2〜前1世紀のローマはまだ皇帝の存在しない「共和政」の段階（『同時に学べ』p.16）。前漢は高祖が冒頓単于に敗れて和親政策をとり，武帝（前141〜前87）が張騫派遣・衛青と霍去病の討伐で巻き返した。パルティアはセレウコス朝（現在のシリア〜イラン一帯）から自立したイラン系国家で，東西交易路をめぐって匈奴（現在のモンゴル高原）と前漢が争う一方，ローマ・パルティア・前漢が交易でつながった。'},
{set:'古代（紀元前）',yoko:true,type:'課題と事例の組合せ',src:'『ヨコから見る世界史』LESSON1〜3「ヨコの鉄則」',
 q:'生徒たちは，「ヨコの世界史」を探究するための課題を考えた。課題あ・いと，それぞれの課題を考察するための事例Ｗ〜Ｚとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\n課題\nあ　ある地域の出来事が，遠く離れた地域の政治の動きを引き起こした例はあるか。\nい　ある地域で生まれた思想や宗教が，別の地域の制度や学問に影響した例はあるか。\n\n事例\nＷ　アレクサンドロスの遠征に刺激されて，インドでマウリヤ朝が成立したこと\nＸ　儒教の科挙試験が，日本やヨーロッパの公務員試験に影響したこと\nＹ　戦国時代の斉・燕で刀銭が使われたこと\nＺ　ローマが第1次ポエニ戦争でシチリア島を属州としたこと',
 opts:['あ―Ｗ　い―Ｘ','あ―Ｗ　い―Ｙ','あ―Ｚ　い―Ｘ','あ―Ｙ　い―Ｚ'],a:0,
 exp:'Ｗは「遠征→統一の機運→マウリヤ朝（現在のインド）成立」という地域間の政治的連鎖。Ｘは思想・制度の伝播（儒教の農業重視→ケネーの重農主義も同種）。Ｙ・Ｚは一地域内の出来事でヨコの関係ではない。'},
{set:'古代（紀元前）',yoko:true,type:'年代整序（6択）',src:'『世界史と日本史は同時に学べ』p.13〜16',
 q:'次の出来事Ⅰ〜Ⅲについて，古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。\n\nⅠ　前漢の武帝が匈奴を破り，河西四郡を設置した。\nⅡ　ペルシア戦争で，ギリシアがアケメネス朝ペルシアの侵攻を撃退した。\nⅢ　周王朝が，西方の遊牧民の侵入を受けて都を洛邑に移した。',
 opts:['Ⅰ―Ⅱ―Ⅲ','Ⅰ―Ⅲ―Ⅱ','Ⅱ―Ⅰ―Ⅲ','Ⅱ―Ⅲ―Ⅰ','Ⅲ―Ⅰ―Ⅱ','Ⅲ―Ⅱ―Ⅰ'],a:5,
 exp:'Ⅲ 周の東遷は前770年。Ⅱ ペルシア戦争は前5世紀前半（前490マラトン〜前479プラタイア）。Ⅰ 河西四郡（現在の中国甘粛省）は前121年頃。地域をまたぐ整序は「前11C 周／前7C アッシリア（現在のイラク北部）／前6〜5C ペルシア帝国・孔子／前4C アレクサンドロス／前3C 秦・ポエニ戦争／前2C 武帝・カルタゴ（現在のチュニジア）滅亡」の骨格で解く。'},
{set:'古代（紀元前）',yoko:true,type:'あ・いの正誤',src:'『ヨコから見る世界史』LESSON1 p.16〜17',
 q:'前6世紀頃のヨコのつながりについて述べた文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　インドと中国では，鉄器の普及によって農業生産が向上し，商工業と貨幣経済が著しく発展した。\nい　ギリシアでは，小アジアのリディアから鋳造貨幣が入り，本土と植民都市・エジプト・南ロシアを結ぶ商業・貿易が発展した。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:0,
 exp:'両方正しい。「前6〜前5世紀，インド，中国ともに鉄器が普及しており，商工業・貨幣経済が著しく発展した」「中国，インドは農業生産の向上により，ギリシアは広範囲な貿易活動により社会が動いた」（ヨコの鉄則）。'},

// ======== 1・2世紀 ========
{set:'1・2世紀',p:1,yoko:true,type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.22・29／『ヨコから見る世界史』p.40',
 ctx:'会話文\n先生：1世紀の始まりは，ローマの帝政の始まりでもあります。紀元前27年，長い内乱を制した［ ア ］が初代皇帝となり，「尊厳なるもの」を意味するアウグストゥスの名を与えられました。\n田中：同じころの中国はどうだったのですか。\n先生：1世紀のはじめ，中国では［ イ ］。その混乱をおさめて，西暦25年に劉秀が漢王朝を復活させます。',
 q:'会話文中の空欄［ ア ］に入る人物の名と，［ イ ］に入る文との組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―オクタウィアヌス　イ―皇帝の親戚筋にあたる王莽が帝位を奪い，新を建てました','ア―オクタウィアヌス　イ―農民出身の劉邦が項羽を破って前漢を建てました','ア―カエサル　イ―皇帝の親戚筋にあたる王莽が帝位を奪い，新を建てました','ア―カエサル　イ―農民出身の劉邦が項羽を破って前漢を建てました'],a:0,
 exp:'紀元前27年にローマの初代皇帝となったのはオクタウィアヌス（アウグストゥス）。カエサルは紀元前44年に暗殺された共和政末期の人物で，皇帝にはなっていない。中国では西暦8年に前漢の皇帝の親戚筋の王莽（おうもう）が帝位を奪って新を建てたが，反乱が勃発してわずか15年で滅び，25年に劉秀（光武帝）が後漢を建てた。劉邦の前漢建国は紀元前202年で時代が合わない。「1世紀のスタート＝イエスの誕生のころ＝ローマの帝政の始まり」を世界史の「原点」として押さえる。'},
{set:'1・2世紀',p:1,yoko:true,type:'年代整序（6択）',src:'『世界史と日本史は同時に学べ』p.26・31〜32／『ヨコから見る世界史』p.43〜44',
 q:'次の文Ⅰ〜Ⅲは，1〜2世紀の東西交流に関連する出来事について述べている。古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。\n\nⅠ　倭の奴国の王が後漢に朝貢し，光武帝から印綬を授かった。\nⅡ　トラヤヌス帝がパルティアの首都クテシフォンを占領した。\nⅢ　西域都護の班超が，部下の甘英を大秦国（ローマ）に向けて派遣した。',
 opts:['Ⅰ―Ⅱ―Ⅲ','Ⅰ―Ⅲ―Ⅱ','Ⅱ―Ⅰ―Ⅲ','Ⅱ―Ⅲ―Ⅰ','Ⅲ―Ⅰ―Ⅱ','Ⅲ―Ⅱ―Ⅰ'],a:1,
 exp:'Ⅰ 奴国（現在の福岡市付近）王の朝貢は西暦57年（『後漢書』。「漢委奴國王」の金印と考えられる）。Ⅲ 班超は91年に西域（現在の中国新疆〜中央アジア）都護に任じられ，1世紀の末（97年）に甘英をローマ帝国に派遣した。Ⅱ トラヤヌスのクテシフォン（現在のイラク・バグダード南東）占領は115〜117年で，ローマがメソポタミア（現在のイラク）を支配したのはおよそ2年間の「一時占領」にすぎない。したがってⅠ→Ⅲ→Ⅱ。光武帝（位25〜57）・和帝（位88〜105）・五賢帝（96〜180）の順で覚える。'},
{set:'1・2世紀',p:1,type:'あ・いの正誤',src:'『ヨコから見る世界史』p.41〜42／『世界史と日本史は同時に学べ』p.27〜28',
 q:'1〜2世紀のインドの王朝について述べた次の文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　サータヴァーハナ朝はデカン高原に興り，季節風（モンスーン）を利用したローマ帝国との交易で，香辛料などを輸出し金貨などを輸入した。\nい　クシャーナ朝は南インドの半島部に成立した王朝で，都をプルシャプラに置いて海上交易を独占した。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:1,
 exp:'あは正しい。サータヴァーハナ朝（現在のインド中南部）は前1世紀にデカン高原（現在のインド中南部）に興り，ローマ帝国と季節風（モンスーン）を利用した交易を行い，香辛料・真珠・綿布などを輸出し，金貨・ガラス器・陶器などを輸入した。南インドの各地からローマの金貨が数多く発見されている。いは誤り。クシャーナ朝（現在のパキスタン〜インド北部）は「オアシスの道」周辺の遊牧民（イラン系のクシャーン人）が南下してインド北西部を支配した王朝で，インドの王朝といってもだいぶ北寄りに位置し，東西の陸の交易路（絹の道）の要衝を占めて中継貿易で繁栄した。都のプルシャプラ（現在のパキスタン・ペシャワール）は正しいが，南インド・海上交易の部分が誤り。「海路を押さえたのがサータヴァーハナ朝，陸路を押さえたのがクシャーナ朝とパルティア（現在のイラン・イラク）」。'},
{set:'1・2世紀',p:1,type:'語と事績の組合せ',src:'『世界史と日本史は同時に学べ』p.24・26／『ヨコから見る世界史』p.45',
 ctx:'メモ（五賢帝）\n・帝国の最大領域をもたらし，パルティアの首都クテシフォンを占領して一時メソポタミアまで進出した皇帝…［ ア ］\n・ストア派の哲学者としても知られ，『自省録』を著した。中国の歴史書では「大秦王安敦」の名で知られる皇帝…［ イ ］',
 q:'メモ中の空欄［ ア ］・［ イ ］に入る皇帝の名の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―トラヤヌス　イ―マルクス＝アウレリウス＝アントニヌス','ア―トラヤヌス　イ―ハドリアヌス','ア―ネルウァ　イ―マルクス＝アウレリウス＝アントニヌス','ア―ネルウァ　イ―ハドリアヌス'],a:0,
 exp:'五賢帝は，①ネルウァ（位96〜98，属州出身のトラヤヌスを後継者に指名），②トラヤヌス（位98〜117，帝国の最大領域。クテシフォンを占領し115〜117年メソポタミア（現在のイラク）を一時占領），③ハドリアヌス（位117〜138，各地に防壁をつくり守勢に。メソポタミアを放棄），④アントニヌス＝ピウス（位138〜161，「最も平穏な時期」），⑤マルクス＝アウレリウス＝アントニヌス（位161〜180，ストア派の哲人皇帝『自省録』，中国では大秦王安敦）。166年に大秦王安敦の使者が海路ベトナム中部（日南（現在のベトナム中部））に到着した。'},
{set:'1・2世紀',p:1,type:'最も適当な文',src:'『ヨコから見る世界史』p.42／『世界史と日本史は同時に学べ』p.27〜28',
 q:'クシャーナ朝について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['イラン系のクシャーン人が建国し，ギリシア式の仏像彫刻であるガンダーラ様式や，広く大衆を救う大乗仏教が栄えた。','デカン高原に興り，『エリュトゥラー海案内記』に記された海上ルートでローマと交易した。','都をクテシフォンに置き，ローマと後漢を結ぶ絹の中継貿易で繁栄した。','アショーカ王のもとで第3回の仏典結集を行い，セイロン島に上座部仏教を布教した。'],a:0,
 exp:'①が正しい。クシャーナ朝（現在のパキスタン〜インド北部）はインドの王朝といっても建国したのはイラン系のクシャーン人で，国際性・開放性がKey Word。文化ではギリシア式の仏像彫刻のガンダーラ様式が生まれ，宗教では人種・国籍を超えて広く大衆を救う大乗仏教が成立し，カニシカ王が保護・奨励した。②は南インドのサータヴァーハナ朝（現在のインド中南部）。③はパルティア（都クテシフォン（現在のイラク・バグダード南東），中国名「安息」）。④はマウリヤ朝（現在のインド）のアショーカ王（前3世紀）。カニシカ王の業績は「大乗仏教の保護・奨励，第4回の仏典結集，ガンダーラ美術の発展」。'},
{set:'1・2世紀',p:1,yoko:true,type:'資料の読み取り',src:'『世界史と日本史は同時に学べ』p.30・32／『ヨコから見る世界史』p.44',
 ctx:'資料（『後漢書』倭伝の内容をもとに作成）\n建武中元二年（57年），倭の奴国が貢ぎ物を奉じて朝賀した。使者は自ら大夫と称した。奴国は倭の南の果てにあたる。光武帝は印綬を賜った。\n安帝の永初元年（107年），倭国王の帥升等が生口160人を献上し，皇帝への謁見を願った。',
 q:'資料と冊封について述べた文あ・いと，奴国が後漢に朝貢した目的についての考察Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\nあ　印綬は臣下としての辞令とともに授けられ，印章の材質や紐の色で家臣としてのランクがわかるようになっていた。\nい　金印は日本のクニの王だけに授けられた特別な印章であった。\n\nＸ　大陸の文物や称号を手に入れることで，他の小国家に対して倭国内での地位を高めようとした。\nＹ　後漢の皇帝を臣下とみなし，倭国の支配を後漢に広げようとした。',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'冊封は中国の王朝を君主，周辺の国家を臣下とみなしてつながりを持つ関係。周辺諸国は貢ぎ物を贈り（朝貢），冊封のしるしとして臣下としての辞令と印綬（印章と組みひも）を授けられた。印章は金・銀・銅などの材質や，紫・青・黒などの紐の色で家臣としてのランクがわかる。後漢は多くの国家や民族と冊封関係を結んだので「金印」は日本だけのものではない（いは誤り）。倭のクニは銅鏡や金属器などの大陸の文物や称号を手に入れることで，他の小国家に対して倭国内での地位を高めようとしたと考えられる（Ｘ）。Ｙは冊封の君臣関係が逆で誤り。生口は「生きている人」，奴隷のことと考えられている。'},
{set:'1・2世紀',p:1,yoko:true,type:'メモの正誤（6択）',src:'『ヨコから見る世界史』p.43／『世界史と日本史は同時に学べ』p.25〜26',
 ctx:'メモ1　パルティアはセレウコス朝シリアから独立したイラン人の国家で，ティグリス河畔のクテシフォンを拠点にローマと中国を結ぶ交易路をおさえ，中国では「安息」と呼ばれた。\nメモ2　ローマはトラヤヌス帝の時代にメソポタミアを征服し，以後4世紀までこの地を維持してパルティアを圧倒した。',
 q:'生徒が作成したメモ1・2の正誤について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['メモ1のみ正しい。','メモ2のみ正しい。','二つとも正しい。','二つとも誤っている。'],a:0,
 exp:'メモ1は正しい。パルティアはセレウコス朝シリア（現在のシリア〜イラン一帯）から独立したイラン人の国家で，クテシフォン（現在のイラク・バグダード南東）を都とし，漢とローマ帝国との絹を中心とした中継貿易で繁栄した。中国では建国者アルサケスの音に由来する「安息」の名で知られた。メモ2は誤り。ローマはパルティアに対して圧倒的といえるほどの優位には立てず，トラヤヌスがクテシフォンを占領してメソポタミア（現在のイラク）を支配したのは115〜117年のおよそ2年間の「一時占領」にすぎない。後継者のハドリアヌスは維持の困難さからこの地を放棄した。両者は互角の戦いを繰り広げ，パルティアが撃退するというパターンが数多く繰り返された。'},
{set:'1・2世紀',p:1,yoko:true,type:'時点の正誤（ヨコ）',src:'『ヨコから見る世界史』p.44・47',
 q:'後漢の光武帝が亡くなった頃（57年）のローマの状況について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['ネロ帝の治世で，キリスト教徒への迫害が行われた。','五賢帝の一人トラヤヌス帝のもとで帝国の領域が最大となっていた。','オクタウィアヌスが元老院から「アウグストゥス」の称号を与えられ，元首政を始めた。','各地の軍隊が皇帝を擁立する軍人皇帝時代の混乱の中にあった。'],a:0,
 exp:'光武帝の在位は25〜57年。ローマではネロ帝（位54〜68）の時代にあたり，ネロ帝はキリスト教の迫害を行った。②トラヤヌス帝は位98〜117で，五賢帝時代（96〜180）は1世紀末から。③オクタウィアヌスの元首政開始は紀元前27年で，アウグストゥス帝の在位は前27〜後14年。④軍人皇帝時代は3世紀（235〜284年）。「ほぼ同時代のこの2人の皇帝（光武帝とアウグストゥス）」という対比を軸に，1世紀の年表を組み立てる。'},
{set:'1・2世紀',p:1,type:'正しい文の組合せ',src:'『世界史と日本史は同時に学べ』p.21・25／『ヨコから見る世界史』p.44',
 ctx:'ノート（「シルクロード」の3つのルート）\n・「シルクロード」は一本の道ではなく，多くの交易ルートからなり，大きく「草原の道」「オアシスの道」「海の道」の3つに分かれる。\n・これらの交易ルートは，ローマ帝国・パルティア・クシャーナ朝・後漢王朝の安定期を背景に，1〜2世紀に「道」として十分に機能し始めた。',
 q:'ノートを参考にしつつ，シルクロードについて述べた文あ〜えについて，正しいものの組合せを，次の①〜④のうちから一つ選べ。\n\nあ　「草原の道」は最も北に位置し，牧畜を営む遊牧民がたてた遊牧国家が交易を担っていた。\nい　「オアシスの道」のオアシス都市の民族は，大国の支配下に置かれながらも，その保護を受けて隊商交易に従事した。\nう　「海の道」はローマとインドを結ぶだけで，中国の港町には達していなかった。\nえ　「絹の道（シルク＝ロード）」の名は，西域都護の班超が命名したものである。',
 opts:['あ・い','あ・え','い・う','う・え'],a:0,
 exp:'あ・いが正しい。「草原の道」はシルクロードの中でも最も北に位置し，遊牧国家が交易を担った。「オアシスの道」は中国の西からインド北部，現在のウズベキスタンやトルクメニスタンに位置し，山麓や砂漠のオアシスの町を結び，オアシス都市の民族は大国の内部に取り込まれることが多く，その保護を受けながら隊商交易に従事した。うは誤り。「海の道」はエジプトやアラビア半島，インド，東南アジアから中国までの港町を結ぶ海上交易ルート。えは誤り。絹の道（シルク＝ロード）と命名したのはドイツの地理学者リヒトホーフェン。班超は北匈奴（現在のモンゴル高原）を駆逐してオアシスの道を確保した西域（現在の中国新疆〜中央アジア）都護。'},
{set:'1・2世紀',p:1,yoko:true,type:'空欄の文と関連事項の組合せ',src:'『ヨコから見る世界史』p.44・46',
 ctx:'会話文\n鈴木：ローマの五賢帝時代が終わった180年から間もなく，後漢でも［ ア ］。\n先生：そうですね。「ローマ・後漢は衰退・滅亡へ向かう」というヨコの鉄則です。ただし，この2つの出来事の関係については注意が必要です。',
 q:'会話文中の空欄［ ア ］に入る文あ・いと，下線部について先生が注意を促した内容Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\nあ　184年に太平道の張角が率いた農民反乱である黄巾の乱が起こりました\nい　8年に王莽が帝位を奪い，新という王朝が成立しました\n\nＸ　ローマと後漢の衰退には互いに因果関係はなく，偶然同時期に下降線をたどった。\nＹ　黄巾の乱による後漢の混乱が絹の道の交易を断ち，ローマの衰退を引き起こした。',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'後漢は宦官と儒派官僚の抗争である党錮（とうこ）の禁で政治が混乱し，184年には太平道の張角が率いた農民反乱，黄巾（こうきん）の乱でついに滅亡へ向かい，三国時代へ突入する（あ）。いの王莽の新は西暦8年で，後漢の成立（25年）より前。『ヨコから見る世界史』は「五賢帝時代の終焉は180年，黄巾の乱の発生は184年→ローマ・後漢は衰退・滅亡へ向かう」としつつ，「互いに因果関係はありませんが，偶然同時期に下降線をたどっていきます」と述べている（Ｘ）。'},
{set:'1・2世紀',p:1,type:'誤っている文',src:'『ヨコから見る世界史』p.43〜44／『世界史と日本史は同時に学べ』p.30〜31',
 q:'後漢の外交について述べた文として誤っているものを，次の①〜④のうちから一つ選べ。',
 opts:['光武帝は，倭国の使者に「漢委奴国王」の印を賜った。','和帝は班超を西域都護に任じ，班超は部下の甘英をローマに向けて派遣した。','桓帝の時代に，大秦王安敦の使者が海路でベトナム中部の日南に到着した。','明帝は，匈奴を挟み撃ちにするため張騫を大月氏に派遣した。'],a:3,
 exp:'④が誤り。張騫を大月氏（現在のアフガニスタン北部〜ウズベキスタン）に派遣したのは前漢の武帝（前139年）。①光武帝時代（位25〜57）に倭国の使者に「漢委奴国（現在の福岡市付近）王」の印を賜う（57年）。②和帝時代（位88〜105）に班超を西域（現在の中国新疆〜中央アジア）都護に任ずる（91年）→部下の甘英がローマに向かうが条支国（シリア付近、現在のシリア付近）でひき返す。③桓帝時代（位146〜167）に大秦王安敦の使者が海路ベトナム中部（日南（現在のベトナム中部））に到着（166年）。ヨコの鉄則「前漢は内政が頻出，後漢は外交が頻出（班超・甘英・大秦王安敦の使者）」。'},
{set:'1・2世紀',p:1,yoko:true,type:'課題と事例の組合せ',src:'『世界史と日本史は同時に学べ』p.21・28／『ヨコから見る世界史』p.40〜42',
 ctx:'生徒たちが立てた探究の課題\nあ　1〜2世紀に東西交易が活発化した背景を，各地域の政治状況から考える。\nい　東西交易によってもたらされた文化の融合の具体例を調べる。',
 q:'課題あ・いと，それぞれの課題を探究するために有効と考えられる事例Ｘ〜Ｚとの組合せとして最も適当なものを，次の①〜④のうちから一つ選べ。\n\nＸ　ローマ帝国・パルティア・クシャーナ朝・後漢という大帝国が同時に存在し，それぞれ安定した統治を行っていた。\nＹ　ガンダーラ地方で，ギリシア文化の影響を受けて仏の姿を像にあらわす最初期の仏像がつくられた。\nＺ　アッシリアが鉄製の武器を用いてオリエントを統一し，歴史上初めて多数の民族を支配した。',
 opts:['あ―Ｘ　い―Ｙ','あ―Ｘ　い―Ｚ','あ―Ｙ　い―Ｘ','あ―Ｚ　い―Ｙ'],a:0,
 exp:'1〜2世紀は「シルクロードが最初の繁栄を迎えた時代」といわれ，東西に安定した統治を行っていた大帝国（ローマ帝国・パルティア・クシャーナ朝（現在のパキスタン〜インド北部）・後漢）が並び，活発に交易した（あ―Ｘ）。クシャーナ朝の都プルシャプラ周辺のガンダーラ地方（現在のパキスタン北西部）では，ギリシア文化の影響から最初期の仏像がつくられ，鼻筋のとおった西洋風の顔立ちでギリシア風の服を着た「ガンダーラ様式」の仏像が生まれた。これは東西交易による文化の融合の具体例（い―Ｙ）。Ｚのアッシリア（現在のイラク北部）は紀元前7世紀の出来事で，時代が異なる。'},
{set:'1・2世紀',p:1,type:'空欄の組合せ',src:'『ヨコから見る世界史』p.41／『世界史と日本史は同時に学べ』p.28',
 ctx:'ノート（インド洋交易）\n・後1世紀にギリシア人（作者不明）によって書かれた『［ ア ］』には，紅海⇄アラビア海⇄インド洋の航海ルートが詳しく載っている。\n・インド洋を吹き渡る季節風は，夏には大陸に向かって吹き，冬には大陸から海へ吹く。商人たちは夏には東行き，冬には西行きにこの風を使ってインド洋を横断した。\n・この交易でローマ帝国から大量の金貨がもたらされ繁栄した南インドの王朝が［ イ ］である。',
 q:'ノート中の空欄［ ア ］・［ イ ］に入る語句の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―エリュトゥラー海案内記　イ―サータヴァーハナ朝','ア―エリュトゥラー海案内記　イ―マウリヤ朝','ア―ゲルマニア　イ―サータヴァーハナ朝','ア―ゲルマニア　イ―マウリヤ朝'],a:0,
 exp:'『エリュトゥラー海案内記』は後1世紀にギリシア人（作者不明）によって書かれ，紅海⇄アラビア海⇄インド洋の航海ルートが詳しく載っている。当時の海上貿易の存在を示す史料で，入試（特に私大）頻出。『ゲルマニア』はローマの歴史家タキトゥスの著作。季節風（モンスーン）を利用したローマとの交易で繁栄した南インドの王朝はサータヴァーハナ朝（前1〜後3世紀，全盛期は後1〜2世紀頃、現在のインド中南部）。マウリヤ朝（現在のインド）は前4世紀末〜前2世紀のインド最初の統一王朝で時代が異なる。'},
{set:'1・2世紀',p:1,yoko:true,type:'語と説明の組合せ',src:'『世界史と日本史は同時に学べ』p.31／『ヨコから見る世界史』p.42・47',
 q:'1〜2世紀の東南アジアについて述べた次の文中の空欄［ ア ］に入る語と，下線部の遺跡から出土したものとして『世界史と日本史は同時に学べ』が挙げているものＸ・Ｙとの組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\n東西の活発な交流は「海の道」も発展させ，中国とインドの中継地点にあたる東南アジアの沿岸の都市も発展した。現在のタイ南部からカンボジア，ベトナム南部にいたる領域を持ち，「東南アジア初の王朝」と呼ばれることもある［ ア ］の主要な港であったオケオの遺跡からは，活発な東西交易の様子をうかがわせる遺物が発見されている。\n\nＸ　ローマ帝国の金貨や中国の銅鏡\nＹ　アッシリアの粘土板文書やギリシアの陶器',
 opts:['ア―扶南　Ｘ','ア―扶南　Ｙ','ア―林邑　Ｘ','ア―林邑　Ｙ'],a:0,
 exp:'扶南（ふなん、現在のカンボジア〜ベトナム南部）はメコン川流域に成立した「東南アジア初の王朝」と呼ばれることもある国で，主要な港オケオ（現在のベトナム南部）の遺跡からはインドの仏像や中国の銅鏡をはじめ，ローマ帝国の金貨も発見されており，ローマ・インド・中国と交易した様子がうかがえる（Ｘ）。林邑（りんゆう，チャンパー（現在のベトナム中部））はベトナム中部の沿岸に後漢王朝から自立した国家で，こちらも海洋交易で繁栄した。まずマレー半島や大陸部の沿岸に港市国家が登場し，その後内陸の農耕文化と結びついて広い領域を持つ国家が出現した。'},
// ======== 3・4世紀 ========
{set:'3・4世紀',p:2,yoko:true,type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.36／『ヨコから見る世界史』p.58',
 ctx:'会話文\n先生：前の時代に「大国」として登場したローマ帝国・後漢・パルティアは，いずれも2世紀末に弱体化の時代を迎えます。ローマで五賢帝時代が終わるのが180年，中国で［ ア ］が起きたのが184年です。\n佐藤：日本はどうだったのですか。\n先生：日本でも180年代に［ イ ］と呼ばれる混乱期があったことが中国の歴史書に書かれています。',
 q:'会話文中の空欄［ ア ］・［ イ ］に入る語の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―黄巾の乱　イ―倭国大乱','ア―黄巾の乱　イ―磐井の乱','ア―赤眉の乱　イ―倭国大乱','ア―赤眉の乱　イ―磐井の乱'],a:0,
 exp:'184年に宗教結社（太平道の張角）が中心となって起きたのが黄巾（こうきん）の乱で，後漢が滅びるもととなった。赤眉（せきび）の乱は王莽（おうもう）の新に対する反乱（18〜27年）で時代が合わない。日本では「魏志」倭人伝によると2世紀末ごろから「倭国大乱」といわれる戦乱が続き，諸国が共同で邪馬台国の卑弥呼を女王に立ててようやくおさまった。磐井（いわい）の乱は6世紀の九州の反乱。不思議と2世紀末という同時期に世界各地で国家の弱体化につながる変化が起き，それが3世紀の本格的な混乱の時代を招く。'},
{set:'3・4世紀',p:2,yoko:true,type:'年代整序（6択）',src:'『ヨコから見る世界史』p.49〜50・55／『世界史と日本史は同時に学べ』p.43・45',
 q:'次の文Ⅰ〜Ⅲは，3世紀の東西の出来事について述べている。古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。\n\nⅠ　ローマで軍人皇帝時代が始まった。\nⅡ　アルダシール1世がパルティアを倒し，ササン朝ペルシアを建てた。\nⅢ　曹丕が後漢の皇帝から帝位を奪い，魏を建てた。',
 opts:['Ⅰ―Ⅱ―Ⅲ','Ⅰ―Ⅲ―Ⅱ','Ⅱ―Ⅰ―Ⅲ','Ⅱ―Ⅲ―Ⅰ','Ⅲ―Ⅰ―Ⅱ','Ⅲ―Ⅱ―Ⅰ'],a:5,
 exp:'Ⅲ 220年，曹操の子の曹丕（そうひ）が後漢から帝位を奪って魏を建国（三国時代の始まり）。Ⅱ 224年，アルダシール1世に率いられたイラン高原南部のペルシア人がパルティアを倒しササン朝ペルシアを建国。Ⅰ 235年から284年のディオクレティアヌス帝の即位までが軍人皇帝時代。したがってⅢ→Ⅱ→Ⅰ。「220年 後漢の滅亡・魏の成立」と「235年 軍人皇帝時代始まる」は東西ともに混乱期に入る「共通」の年号として押さえる（『ヨコから見る』の重要年号チェック）。'},
{set:'3・4世紀',p:2,type:'あ・いの正誤',src:'『ヨコから見る世界史』p.49〜50／スタサプ 第2講',
 q:'3世紀のローマ帝国について述べた次の文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　奴隷を使った大土地所有制（ラティフンディア）が衰退し，小作人（コロヌス）を使役する小作制（コロナトゥス）に移行した。\nい　ディオクレティアヌス帝は元老院を尊重する元首政を復活させ，帝国を4分割して統治する四帝分治を行った。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:1,
 exp:'あは正しい。ローマ衰退の経済的要因は，①ラティフンディアが衰退し自給自足的な小作人（コロヌス）を使役した小作制（コロナトゥス）に移行，②都市への重税と中産市民層の没落→アジアの物産の需要が低下，③貨幣経済が混乱し現物交換の自然経済へ逆行，の3点。コロナトゥスは中世の農奴制の先駆けとされる。いは誤り。ディオクレティアヌス帝（位284〜305）は皇帝を神聖化するペルシアの宮廷儀礼を取り入れて自らを「主人（ドミヌス）」と呼ばせ，元老院の議員を政治から退けて独裁的な権力を握った。「市民の第一人者」という建前が崩れ，専制君主政（ドミナトゥス）が始まる。四帝分治（テトラルキア，2人の正帝と2人の副帝）の部分は正しい。'},
{set:'3・4世紀',p:2,type:'語と事績の組合せ',src:'『世界史と日本史は同時に学べ』p.40〜42／『ヨコから見る世界史』p.50',
 ctx:'メモ（4世紀のローマ皇帝）\n・313年にキリスト教を公認し，330年に帝国の首都をビザンティウムに移した皇帝…［ ア ］\n・キリスト教以外の宗教を厳禁してキリスト教を事実上の国教とし，395年に帝国を東西に分割して2人の子に分け与えた皇帝…［ イ ］',
 q:'メモ中の空欄［ ア ］・［ イ ］に入る皇帝の名の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―コンスタンティヌス　イ―テオドシウス','ア―コンスタンティヌス　イ―ディオクレティアヌス','ア―ディオクレティアヌス　イ―テオドシウス','ア―ディオクレティアヌス　イ―コンスタンティヌス'],a:0,
 exp:'混乱するローマを再建したのが3世紀末のディオクレティアヌス（位284〜305，専制君主政，キリスト教の大迫害303）と4世紀前半のコンスタンティヌス（位306〜337）。コンスタンティヌスは313年にミラノ勅令でキリスト教を公認して教会組織を帝国の統治機構に組み込み，325年にニケーア公会議を主催，330年に首都をビザンティウム（コンスタンティノープル，現在のイスタンブール）に移した。テオドシウス（位379〜395）は392年にキリスト教を国教化し，死に際して帝国を東西に分割（395）。以後ローマがひとつになることはなかった。'},
{set:'3・4世紀',p:2,type:'最も適当な文',src:'『世界史と日本史は同時に学べ』p.43／『ヨコから見る世界史』p.51〜52／スタサプ 第2講',
 q:'ササン朝ペルシアについて述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['都をパータリプトラに置き，マウリヤ朝の復興をめざす復古主義を掲げた。','キリスト教を国教とし，ネストリウス派を異端として追放した。','ゾロアスター教を国教のように扱い，宗教の組織力を国家をまとめる力に利用した。','ヘレニズム文化の影響を強く受け，ギリシア風の貨幣を発行してローマと中国を結ぶ絹の中継貿易で栄えた。'],a:2,
 exp:'①が正しい。ササン朝（224〜651）はゾロアスター教（善と悪の二元論を持つイラン発祥の宗教）を国教のように扱い，宗教の組織力を国家をまとめる力に利用した。のちにローマがキリスト教の力を国家運営に利用するが，ササン朝はローマに先がけて国家統治に宗教の力を利用した。②はパルティアの説明。パルティアがヘレニズム文化の影響を強く受けたのに対し，ササン朝はイラン人の心の故郷であるアケメネス朝の再現を願った。③はグプタ朝（復古主義のスローガンは共通するが，パータリプトラ・マウリヤ朝はインド）。④は誤り。ネストリウス派は431年のエフェソス公会議で異端とされ，ササン朝ペルシアを経て中国に伝わり景教と呼ばれた。'},
{set:'3・4世紀',p:2,yoko:true,type:'資料の読み取り',src:'『世界史と日本史は同時に学べ』p.44・47／スタサプ 第4講',
 ctx:'資料（『三国志』「魏志」の内容をもとに作成）\n景初三年（239年），倭の女王が大夫難升米らを遣わして朝献した。皇帝は倭の女王に「親魏倭王」の称号を与え，金印と紫綬を授け，銅鏡百枚などを下賜した。\n また，魏の皇帝は大月氏（クシャーナ朝）の王にも「親魏大月氏王」の称号と金印を与えた。',
 q:'資料について述べた文あ・いと，魏が遠方の国の王に称号を与えた背景についての考察Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\nあ　卑弥呼は中国の皇帝に対して従属的な関係である冊封関係に入り，その関係を利用して倭の中での自らの権威を高めたと考えられる。\nい　卑弥呼は魏と対等な同盟を結び，魏の皇帝から独立した「倭王」として承認された。\n\nＸ　魏は三国の中で最も強大だったが，蜀・呉と対立していたため，東西の遠国と結んで自らの正統性と威信を示そうとした。\nＹ　魏は蜀・呉をすでに滅ぼして中国を統一しており，周辺諸国への関心を失っていた。',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'卑弥呼は239年に魏の皇帝に使いを送り，「親魏倭王」の称号と金印，多数の銅鏡を贈られた。これは中国の皇帝に対して従属的な関係である「冊封関係」であり（あが正しい，いは誤り），卑弥呼はこの関係を利用して倭の中での自らの権威を高めたと考えられる。同じころクシャーナ朝の王も「親魏大月氏王」の称号を与えられており，魏から見ると卑弥呼と「同格」の扱いだった。魏は三国の中で最も強力だったが蜀・呉が連合したため統一はできず（Ｙは誤り），蜀を滅ぼすのは263年，呉が滅びるのは晋の時代の280年。遠国からの朝貢は皇帝の徳を示すものとして重視された（Ｘ）。'},
{set:'3・4世紀',p:2,yoko:true,type:'メモの正誤（6択）',src:'『世界史と日本史は同時に学べ』p.36〜38',
 ctx:'メモ1　邪馬台国の女王卑弥呼と蜀の軍師諸葛孔明は，同じ時期に活躍した人物であり，ともに『三国志』によって世に知られている。\nメモ2　諸葛孔明は魏に仕えて蜀を倒すために戦い，卑弥呼も魏を倒すために蜀と同盟を結んだ。',
 q:'生徒が作成したメモ1・2の正誤について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['メモ1のみ正しい。','メモ2のみ正しい。','二つとも正しい。','二つとも誤っている。'],a:0,
 exp:'メモ1は正しい。古代日本の卑弥呼と『三国志』の諸葛孔明は一見別の世界の人物のようだが，同じ時期に活躍した（卑弥呼のほうが年上だが没年は孔明のほうが早く，孔明の生きた年代は卑弥呼の年代とすべてかぶる）。2人の活躍はともに2世紀末から3世紀の「乱世」が背景で，同じ書物＝陳寿が3世紀末に書いた歴史書『三国志』によって知られる（孔明は「蜀志」，卑弥呼は「魏志」倭人伝）。メモ2は誤り。諸葛孔明は魏のライバル国家の蜀の軍師として魏を倒すために戦った人物であり，卑弥呼は自らの権威を高めるために魏と友好関係を結ぼうとした人物。ここには同じ「魏」という国家が登場している。'},
{set:'3・4世紀',p:2,yoko:true,type:'時点の正誤（ヨコ）',src:'『ヨコから見る世界史』p.53〜54・58',
 q:'ローマでディオクレティアヌス帝が即位した頃（284年）の中国の状況について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['五胡が華北に進出し，晋の一族は南に逃れて東晋を建てていた。','鮮卑の拓跋氏が北魏を建て，華北を統一していた。','司馬炎が建てた晋（西晋）が呉を滅ぼし，中国を統一していた。','曹丕が後漢の皇帝から帝位を奪ったばかりで，三国の対立が始まっていた。'],a:2,
 exp:'265年に魏の家臣・司馬炎（しばえん）が魏を乗っ取って晋（西晋）を建て，280年に最後に残った呉を滅ぼして中国を統一した。284年はその直後で①が正しい。②は220年，③は316年の西晋滅亡→317年の東晋建国，④は386年の北魏建国（華北統一は439年）でいずれも時期が合わない。「ディオクレティアヌスの専制君主政（284〜）」と「晋の統一（280）」はともに3世紀の危機をいったん収拾した時点として対応させて覚える。'},
{set:'3・4世紀',p:2,yoko:true,type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.38・42・46／スタサプ 第4・5講',
 ctx:'会話文\n先生：4世紀後半の375年ごろから，中央ユーラシアの遊牧民［ ア ］に圧迫されたゲルマン人がローマ帝国領内に大挙して侵入する「ゲルマン人の大移動」が始まります。\n木村：同じ4世紀の中国はどうでしたか。\n先生：中国でも［ イ ］。これらはユーラシア規模の民族移動といえます。',
 q:'会話文中の空欄［ ア ］に入る語と，［ イ ］に入る文との組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―フン人　イ―匈奴・鮮卑などの遊牧系民族が万里の長城の内側に次々と国を建て，五胡十六国時代が訪れました','ア―フン人　イ―突厥が柔然を滅ぼしてモンゴル高原から中央アジアに大帝国を築きました','ア―スキタイ　イ―匈奴・鮮卑などの遊牧系民族が万里の長城の内側に次々と国を建て，五胡十六国時代が訪れました','ア―スキタイ　イ―突厥が柔然を滅ぼしてモンゴル高原から中央アジアに大帝国を築きました'],a:0,
 exp:'ゲルマン人の大移動は，中央ユーラシアのアジア系遊牧民フン人が西に移動し，フン人に圧迫されたゲルマン人（375年の西ゴート族の南下がきっかけ）がローマ帝国領内に大挙して侵入したもの。スキタイは前6世紀ごろ最初の遊牧国家を建てたイラン系民族で時代が合わない。中国では晋の混乱の時期に気候の寒冷化も要因となり，「匈奴」「鮮卑」「羯」「羌」「氐」の五胡が万里の長城の内部に次々と国を建て，五胡十六国時代（304〜439）となった。突厥が柔然を滅ぼすのは6世紀半ば（552）。寒冷化→草原の民の南下という同じ背景から，ヨーロッパではゲルマン人，中国では五胡の移動が同時に起きた。'},
{set:'3・4世紀',p:2,type:'最も適当な文',src:'『ヨコから見る世界史』p.52〜53／『世界史と日本史は同時に学べ』p.44／スタサプ 第3講',
 q:'グプタ朝について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['アショーカ王が仏教を保護し，各地に石柱碑や磨崖碑を建てて法（ダルマ）による統治を示した。','バラモン教にインドの民間信仰が融合したヒンドゥー教が成立し，純インド的なグプタ様式の美術が発達した。','イラン系民族が建国し，ギリシア文化の影響を受けたガンダーラ美術と大乗仏教が栄えた。','都をプルシャプラに置き，カニシカ王のもとで第4回仏典結集を行った。'],a:1,
 exp:'①が正しい。グプタ朝（320頃〜550頃）はクシャーナ朝の国際性を嫌い，マウリヤ朝を理想とした復古主義（"インドの原点に帰る"）の王朝。宗教もバラモン教を中心にインドのさまざまな民間信仰が融合した純インド的なヒンドゥー教が成立（シヴァ神・ヴィシュヌ神など）。美術も純インド的なグプタ様式が発達し，アジャンター・エローラの石窟寺院が代表。最盛期はチャンドラグプタ2世（超日王）で東晋の法顕がインドを訪れた。②③はクシャーナ朝（1〜2世紀），④はマウリヤ朝（前3世紀）。マウリヤ朝の都パータリプトラ・建国者チャンドラグプタと，グプタ朝の都パータリプトラ・建国者チャンドラグプタ1世が似ているのは偶然ではない。'},
{set:'3・4世紀',p:2,yoko:true,type:'あ・いの正誤',src:'『ヨコから見る世界史』p.53〜54',
 q:'三国時代の中国と周辺地域について述べた次の文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　呉の時代には華北の農業技術が江南に導入されて開発が進み，呉はカンボジアの扶南に使節を派遣するなど東南アジア諸国と交易を行った。\nい　魏では前漢以来の郷挙里選に代わって九品中正が実施され，中正官が地方の人材を9つの等級に分けて推薦した。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:0,
 exp:'あは正しい。ヨコの流れで考えると三国の中では呉が最も重要。豪族に率いられた農民が江南地方へ移住し，華北の農業技術が導入されて開発が進んだ。この経済力を背景に呉は北ベトナムに進出し，扶南に使節を派遣して東南アジアの諸国と交易した（ヨコの鉄則）。いも正しい。魏の九品中正は前漢（武帝時代）の郷挙里選（地方長官が有徳者を推薦，1ランク）に代わる官吏任用制度で，プロの中正官が地方の人材を九品等（9ランク）に分けて推薦した。しかし中正官はその地方の名門豪族だったため家柄でランクが決まり（「上品に寒門なく，下品に勢族なし」），門閥貴族という特権階級が形成された。'},
{set:'3・4世紀',p:2,yoko:true,type:'年代整序（6択）',src:'『ヨコから見る世界史』p.50・58／『世界史と日本史は同時に学べ』p.42・46',
 q:'次の文Ⅰ〜Ⅲは，4世紀の出来事について述べている。古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。\n\nⅠ　テオドシウス帝が死去し，ローマ帝国が東西に分裂した。\nⅡ　コンスタンティヌス帝がニケーア公会議を開き，アタナシウス派が正統とされた。\nⅢ　晋の一族の司馬睿が建康で即位し，東晋を建てた。',
 opts:['Ⅰ―Ⅱ―Ⅲ','Ⅰ―Ⅲ―Ⅱ','Ⅱ―Ⅰ―Ⅲ','Ⅱ―Ⅲ―Ⅰ','Ⅲ―Ⅰ―Ⅱ','Ⅲ―Ⅱ―Ⅰ'],a:5,
 exp:'Ⅲ 317年，西晋滅亡（316）の翌年に司馬睿（しばえい）が建康（現在の南京）で東晋を建国。Ⅱ 325年，ニケーア公会議（アタナシウス派が正統，アリウス派が異端）。Ⅰ 395年，テオドシウス帝の死で帝国が東西に分裂。したがってⅢ→Ⅱ→Ⅰ。『ヨコから見る』の重要年号チェックでは「313年 ミラノ勅令・325年 ニケーア公会議（キリスト教によるローマの精神的統一）⇔317年 東晋の建国（中国の統一崩れる）」，「395年 テオドシウス帝死亡（ローマの東西分裂決定）⇔383年 淝水の戦い（中国の南北分裂決定）」を対応させる。'},
{set:'3・4世紀',p:2,yoko:true,type:'最も適当な文',src:'『ヨコから見る世界史』p.51／『世界史と日本史は同時に学べ』p.43',
 q:'ササン朝ペルシアと他地域との文化的な関係について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['ササン朝で生まれたマニ教は，ローマ帝国では厳禁されたが，ササン朝では一貫して国教として保護された。','ササン朝は仏教を国教とし，ガンダーラ美術を中国・日本へ伝えた。','ササン朝の商人が後退したため，3世紀以降，絹を中心とした東西交易は完全に途絶えた。','ゾロアスター教の「最後の審判」や天使・悪魔の思想はユダヤ教・キリスト教に影響を与え，ササン朝美術は絹の道を通って日本の法隆寺や正倉院の宝物にも影響した。'],a:3,
 exp:'①が正しい。ゾロアスターは時間を一枚のCD盤のように考え，過去・現在・未来はすべて決定されていて最終ゴールには「最後の審判」が待っており善神アフラ＝マズダの勝利も約束されているとした。「最後の審判」や天使・悪魔の思想はユダヤ教・キリスト教に強く影響（ヨコの鉄則）。ササン朝美術は絹の道を通って遠く日本にまで影響し，法隆寺の獅子狩文錦（ししかりもんきん）や正倉院の漆胡瓶（しっこへい）・白瑠璃碗（はくるりわん）は入試でよく問われる。②は逆：マニ教はササン朝では（シャープール1世の死後）弾圧されたが唐代の中国では流行し，北アフリカにも浸透してアウグスティヌスも一時入信した。③はクシャーナ朝。④は誤り。ローマ商人は後退したが，アフリカ（エチオピア）のアクスム王国の商人が代わって登場し，絹を中心とした東西交易は依然として繁栄を続けた。'},
{set:'3・4世紀',p:2,yoko:true,type:'資料の読み取り',src:'『世界史と日本史は同時に学べ』p.48／スタサプ 第4講',
 ctx:'資料（4世紀の日本と朝鮮半島に関する生徒のまとめ）\n・4世紀の日本については文献資料が少なく，「空白の4世紀」といわれる。\n・大和地方を中心に規模の大きな前方後円墳が増え，地方にも同じような前方後円墳が見られるようになった。\n・現在の中国東北地方に残る石碑には，日本が朝鮮半島北部の国家と交戦したことが記されている。',
 q:'資料から読み取れることや，その背景について述べた文あ・いと，Ｘ・Ｙとについて，最も適当なものの組合せを，次の①〜④のうちから一つ選べ。\n\nあ　前方後円墳の広がりから，「ヤマト政権」という連合体が成立し，東西にその影響力を拡大したとみられる。\nい　前方後円墳の広がりは，各地の小国が完全に独立して互いに争っていたことを示す。\n\nＸ　石碑に記された国家は高句麗で，4世紀の中国が五胡十六国の混乱期にあり，相対的に日本の朝鮮半島南部への影響力が強まっていたことが背景にある。\nＹ　石碑に記された国家は新羅で，唐と結んだ新羅が朝鮮半島を統一したことが背景にある。',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'大和地方を中心に規模の大きな前方後円墳が増え，地方にも同じような前方後円墳が見られるようになったことなどから，「ヤマト政権」という連合体が成立し東西に影響力を拡大したとみられる（あ）。いは逆の読み取り。石碑は広開土王碑（好太王碑）で，日本が高句麗と交戦したことが記されている（Ｘ）。4世紀の中国は「五胡十六国時代」のような混乱期で，相対的に日本が朝鮮半島南部に及ぼす影響力が強まり，朝鮮半島へ出兵することもあったようだ。新羅の半島統一は7世紀（676）で時代が合わない（Ｙは誤り）。朝鮮半島では4世紀初めに高句麗が楽浪郡を滅ぼし，4世紀半ばに百済・新羅が建国されて三国時代に入る。'},
// ======== 5・6世紀 ========
{set:'5・6世紀',p:3,yoko:true,type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.52〜53／『ヨコから見る世界史』p.66',
 ctx:'会話文\n先生：3・4世紀の民族移動でできた「よそ者」の国家は，もとからいた多数派の人々とどう向き合うかが問われました。中国北部を統一した北魏の孝文帝は，494年に都を平城から［ ア ］に移して漢化政策を進めました。\n田中：ヨーロッパではどうでしたか。\n先生：フランク王国のクローヴィスが496年に［ イ ］に改宗して，ローマ人の貴族層に「寄せて」いきました。この二つはほぼ同時ですね。',
 q:'会話文中の空欄［ ア ］・［ イ ］に入る語の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―洛陽　イ―アタナシウス派','ア―洛陽　イ―アリウス派','ア―長安　イ―アタナシウス派','ア―長安　イ―アリウス派'],a:0,
 exp:'北魏の孝文帝（こうぶんてい）は494年に都を平城（へいじょう，現在の大同）から洛陽（らくよう）へ移し，鮮卑（せんぴ）の言語や服装を禁じて漢人風の姓に改めさせるなど漢化政策を行った。フランク王国のクローヴィスは496年にアタナシウス派（カトリック）に改宗した。ほかのゲルマン諸国家の多くは異端とされたアリウス派で，人口の9割を占めるローマ人と融和できず短命に終わったのに対し，フランクは旧ローマ貴族層と結んで発展した。494年と496年——東西で同時に多数派に「寄せていった」国だけが，のちの中国（隋・唐）と西ヨーロッパの「本流」になった。長安は前漢・隋・唐の都。'},
{set:'5・6世紀',p:3,yoko:true,type:'年代整序（6択）',src:'『世界史と日本史は同時に学べ』p.54〜56／『ヨコから見る世界史』p.62〜63・66',
 q:'次の文Ⅰ〜Ⅲは，5世紀の東西の出来事について述べている。古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。\n\nⅠ　ゲルマン人傭兵隊長オドアケルが西ローマ皇帝を廃位した。\nⅡ　北魏の太武帝が華北を統一した。\nⅢ　西ローマ帝国とゲルマン諸勢力の連合軍が，カタラウヌムの戦いでアッティラを撃退した。',
 opts:['Ⅰ―Ⅱ―Ⅲ','Ⅰ―Ⅲ―Ⅱ','Ⅱ―Ⅰ―Ⅲ','Ⅱ―Ⅲ―Ⅰ','Ⅲ―Ⅰ―Ⅱ','Ⅲ―Ⅱ―Ⅰ'],a:3,
 exp:'Ⅱ 439年，鮮卑の拓跋氏（たくばつし）が建てた北魏の太武帝（たいぶてい）が五胡十六国の争いを制して華北を統一。Ⅲ 451年，「神の災い」とおそれられたフン人の王アッティラに西ローマ帝国とゲルマン諸勢力が連合して勝ったが，西ローマも大きなダメージを受けた。Ⅰ 476年，傭兵隊長オドアケルが西ローマ皇帝ロムルス＝アウグストゥルスを廃位し西ローマ帝国は滅亡。したがってⅡ→Ⅲ→Ⅰ。中国では439年に南北朝の対立がはっきりし，ヨーロッパでは476年に西ローマが消える——「分裂の固定化」が5世紀の東西で進む。'},
{set:'5・6世紀',p:3,type:'語と説明の組合せ',src:'『世界史と日本史は同時に学べ』p.54〜55／『ヨコから見る世界史』p.61〜62／スタサプ 第7講',
 q:'5世紀に成立したゲルマン人の国家について，国名と説明の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['西ゴート王国―北アフリカに建国し，のちにユスティニアヌス帝に滅ぼされた','ヴァンダル王国―イベリア半島に建国し，都をトレドに置いた','東ゴート王国―テオドリックがオドアケルを倒してイタリアに建国した','フランク王国―ブリタニアに渡って七王国（ヘプターキー）を建てた'],a:2,
 exp:'東ゴート王国はテオドリック（大王）が東ローマ皇帝の命でイタリアに入り，493年にオドアケルを倒して建国，都はラヴェンナ（③正）。西ゴート王国は410年にローマを略奪したのちイベリア半島に定住し（418），都はトレド（①は北アフリカのヴァンダル王国の説明）。ヴァンダル王国は429年に北アフリカに建国され，534年にユスティニアヌス帝に滅ぼされた（②はイベリア半島の西ゴートの説明）。ブリタニアに七王国を建てたのはアングル人・サクソン人（449〜）で，フランク王国はガリア北部に成立した（④誤り）。フン人に押されたゲルマン人は「ビリヤードの球のように」はじき出されて各地に国を建てた。'},
{set:'5・6世紀',p:3,yoko:true,type:'あ・いの正誤',src:'『ヨコから見る世界史』p.64／『世界史と日本史は同時に学べ』p.60〜61',
 q:'4〜5世紀のヨーロッパと中国の民族移動について述べた次の文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　ゲルマン人はローマ帝国の傭兵や下級官吏として，五胡は中国の兵力として，それぞれ帝国の側が招き入れていた民族であり，国家が弱ると自立して国を建てた。\nい　五胡のうち羯はチベット系，氐と羌は匈奴系の民族で，鮮卑の拓跋氏が建てた北魏が最終的に華北を統一した。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:1,
 exp:'ゲルマン人はローマ帝国初期から少しずつ帝国内に移住し，傭兵（ようへい）や下級官吏，コロヌスとして働いていた。中国の五胡（ごこ）も八王の乱（290〜306）で諸王が兵力として招き入れた民族で，永嘉（えいか）の乱（311〜316）で西晋を滅ぼした。「招き入れた側が弱ると，招かれた側が国を建てる」という構図は東西で共通（あ正）。五胡は匈奴（きょうど）・鮮卑（せんぴ）・羯（けつ）が匈奴系，氐（てい）・羌（きょう）がチベット系で，いは系統が逆（い誤）。鮮卑の拓跋（たくばつ）氏の北魏が439年に華北を統一したことは正しい。'},
{set:'5・6世紀',p:3,type:'最も適当な文',src:'『世界史と日本史は同時に学べ』p.55〜56／『ヨコから見る世界史』p.62〜63／スタサプ 第7講',
 q:'フランク王国の成長について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['クローヴィスはアリウス派に改宗して，ローマ人貴族と対立した。','メロヴィング朝を開いたクローヴィスは，ガリアのほぼ全域を支配下に置いた。','クローヴィスは西ローマ皇帝を廃位して，イタリアに王国を建てた。','フランク王国は6世紀にユスティニアヌス帝に征服され，東ローマ領となった。'],a:1,
 exp:'クローヴィスは481年にフランク諸部族を統一してメロヴィング朝を開き，ガリア（現在のフランス）のほぼ全域を支配した（②正）。496年の改宗先は正統派のアタナシウス派（カトリック）で，これによりローマ人貴族と融和できた（①誤り）。西ローマ皇帝を廃位したのはオドアケル（③誤り）。ユスティニアヌス帝が滅ぼしたのはヴァンダル王国（534）と東ゴート王国（555）で，フランク王国は征服されておらず，ゲルマン諸国家の中で最も長く続く「本流」となった（④誤り）。'},
{set:'5・6世紀',p:3,yoko:true,type:'空欄の組合せ',src:'『世界史と日本史は同時に学べ』p.58〜59／『ヨコから見る世界史』p.70〜72／スタサプ 第2・7講',
 ctx:'メモ\n6世紀のユーラシアでは，東ローマ帝国・ササン朝ペルシア・［ ア ］の三大勢力が並び立った。東ローマ帝国の［ イ ］帝は地中海沿岸の旧ローマ領をほぼ回復し，ササン朝の［ ウ ］は中央集権化を進めて黄金時代を築いた。両者はほぼ同時代の最盛期の君主として争ったが，決着はつかなかった。',
 q:'メモ中の空欄［ ア ］〜［ ウ ］に入る語の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['ア―柔然　イ―ユスティニアヌス　ウ―シャープール1世','ア―突厥　イ―テオドシウス　ウ―シャープール1世','ア―突厥　イ―ユスティニアヌス　ウ―ホスロー1世','ア―柔然　イ―テオドシウス　ウ―ホスロー1世'],a:2,
 exp:'6世紀の「三大勢力」は東ローマ帝国（ビザンツ帝国）・ササン朝ペルシア・突厥（とっけつ）。突厥は552年にモンゴル高原の柔然（じゅうぜん）を倒して東西にまたがる大遊牧国家を建てた。東ローマ帝国のユスティニアヌス帝（位527〜565）はヴァンダル・東ゴートを滅ぼして地中海をほぼ再統一，『ローマ法大全』を編纂（へんさん）し聖ソフィア聖堂を再建。ササン朝のホスロー1世（位531〜579）は中央集権的な官僚制で最盛期を築き，ユスティニアヌスの「良きライバル」として抗争した。テオドシウスは4世紀末のローマ皇帝，シャープール1世は3世紀のササン朝の王で時代が合わない。'},
{set:'5・6世紀',p:3,type:'正しい文の組合せ',src:'『世界史と日本史は同時に学べ』p.58／『ヨコから見る世界史』p.71〜72／スタサプ 第2講',
 q:'ユスティニアヌス帝の事績について述べた次の文a〜dのうち，正しいものの組合せを，次の①〜④のうちから一つ選べ。\n\na　ヴァンダル王国と東ゴート王国を滅ぼし，地中海沿岸の旧ローマ領をほぼ回復した。\nb　フランク王国と西ゴート王国を滅ぼし，ガリアとイベリア半島を回復した。\nc　トリボニアヌスらに命じて『ローマ法大全』を編纂させた。\nd　ミラノ勅令を出してキリスト教を公認した。',
 opts:['a・d','a・c','b・c','b・d'],a:1,
 exp:'ユスティニアヌス帝（大帝）は北アフリカのヴァンダル王国（534）とイタリアの東ゴート王国（555）を滅ぼし，西ゴートからもイベリア半島南部を奪って，地中海を取り巻く旧ローマ領の大半を回復した（a正）。フランク王国・西ゴート王国は滅ぼされていない（b誤り）。法学者トリボニアヌスらに命じて『ローマ法大全』を編纂させ，聖ソフィア聖堂（ハギア＝ソフィア）を再建，529年にはアテネのアカデメイアを閉鎖して異教の学問を禁じた（c正）。ミラノ勅令（313）はコンスタンティヌス帝（d誤り）。養蚕（ようさん）業を中国から導入したことも押さえる。'},
{set:'5・6世紀',p:3,yoko:true,type:'あ・いの正誤',src:'『ヨコから見る世界史』p.71〜73／『世界史と日本史は同時に学べ』p.59',
 q:'6世紀のササン朝ペルシアについて述べた次の文あ・いの正誤の組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\nあ　ホスロー1世は突厥と結んで，中央アジアの遊牧民エフタルを挟撃して滅ぼした。\nい　ユスティニアヌス帝がアカデメイアを閉鎖したため行き場を失ったギリシアの学者を，ホスロー1世は保護した。',
 opts:['あ―正　い―正','あ―正　い―誤','あ―誤　い―正','あ―誤　い―誤'],a:0,
 exp:'5世紀後半，中央アジアの騎馬民族エフタルはササン朝を圧迫し，北インドのグプタ朝を衰退させた「最強の遊牧民」だったが，ホスロー1世は新興の突厥と手を結び，560年ごろエフタルを東西から挟撃（きょうげき）して滅ぼした（あ正）。またユスティニアヌス帝が529年にアテネのアカデメイアを閉鎖すると，行き場を失った学者たちをホスロー1世が受け入れ，ジュンディー＝シャープールの学院でギリシアの学術が保存された。これがのちにイスラーム世界へギリシア学術が伝わる「橋渡し」になる（い正）。ライバル同士でありながら，文化の面では東ローマ→ササン朝→イスラームという流れが生まれた。'},
{set:'5・6世紀',p:3,type:'最も適当な文',src:'『世界史と日本史は同時に学べ』p.59〜60／『ヨコから見る世界史』p.74・77／スタサプ 第4講',
 q:'6世紀の突厥について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['漢の武帝に敗れて西に移動し，のちフン人としてヨーロッパに現れた。','北魏を建国して華北を統一し，漢化政策を進めた。','柔然を倒してモンゴル高原を支配し，遊牧民として初めて独自の文字をつくった。','唐の太宗に服属し，太宗は「天可汗」の称号を受けた。'],a:2,
 exp:'突厥（とっけつ）は552年に柔然を倒してモンゴル高原の覇者となり，東は中国の北辺から西は中央アジアまで東西にまたがる大遊牧国家を築いた。ササン朝と結んでエフタルを滅ぼし，遊牧民として初めて独自の文字（突厥文字）をつくった（③正）。「突厥」は「テュルク」の音写で，現在のトルコ人につながるトルコ系民族の源流。583年，隋の分断工作で東突厥と西突厥に分裂した。①は北匈奴，②は鮮卑の拓跋氏の説明。④は7世紀（630年，東突厥の服属）で時代が合わない。'},
{set:'5・6世紀',p:3,type:'誤っている文',src:'『世界史と日本史は同時に学べ』p.53・61〜62／『ヨコから見る世界史』p.65〜66／スタサプ 第5講',
 q:'北魏について述べた文として誤っているものを，次の①〜④のうちから一つ選べ。',
 opts:['鮮卑の拓跋氏が建て，太武帝のときに華北を統一した。','孝文帝は均田制を実施し，これは隋・唐に受け継がれた。','雲崗や竜門に石窟寺院がつくられ，仏教が保護された。','孝文帝は科挙を創設して，貴族の勢力をおさえた。'],a:3,
 exp:'科挙（かきょ）は6世紀末に隋の文帝が九品中正（きゅうひんちゅうせい）を廃止して始めた官吏登用制度で，北魏の孝文帝の事績ではない（④誤り）。北魏は鮮卑の拓跋氏が386年に建国し，太武帝が439年に華北を統一（①正）。孝文帝は485年に均田制を施行して農民に土地を給付し，これは北朝を通じて隋・唐へ受け継がれ，日本の班田収授法（はんでんしゅうじゅほう）の手本にもなった（②正）。仏教は保護され，平城近郊の雲崗（うんこう），洛陽近郊の竜門（りゅうもん）に石窟寺院がつくられた（③正）。'},
{set:'5・6世紀',p:3,yoko:true,type:'空欄の文と関連事項の組合せ',src:'『世界史と日本史は同時に学べ』p.62／『ヨコから見る世界史』p.74／スタサプ 第5講',
 ctx:'メモ\n589年，隋の文帝（楊堅）が南朝の陳を滅ぼし，［ ア ］以来約270年ぶりに中国を統一した。同じ6世紀，ヨーロッパでも東ローマ帝国のユスティニアヌス帝が地中海の再統一をめざしていた。',
 q:'メモ中の空欄［ ア ］に入る文と，隋の政策について述べた文との組合せとして正しいものを，次の①〜④のうちから一つ選べ。\n\n［ ア ］に入る文\nあ　西晋の滅亡\nい　後漢の滅亡\n\n隋の政策\nＸ　九品中正を廃止して科挙を始め，華北と江南を結ぶ大運河を建設した。\nＹ　郡国制を採用し，儒学を官学とした。',
 opts:['あ―Ｘ','あ―Ｙ','い―Ｘ','い―Ｙ'],a:0,
 exp:'西晋が316年に滅亡して以来，中国は五胡十六国・南北朝の分裂が続いた。581年に北周の外戚（がいせき）楊堅（ようけん，文帝）が隋を建て，589年に南朝の陳を滅ぼして統一した（あ）。後漢の滅亡（220）のあとも西晋（280〜316）が一時統一しているので，「約270年ぶり」に合うのは西晋滅亡。隋は豪族の推薦による九品中正を廃止して試験による科挙を始め，華北と江南を結ぶ大運河を建設した（Ｘ）。郡国制と儒学の官学化は前漢の政策（Ｙ誤り）。534〜555年のユスティニアヌスの地中海再統一と589年の隋の統一——分裂の世紀に東西で「再統一」が試みられたことをヨコで押さえる。'},
{set:'5・6世紀',p:3,yoko:true,type:'資料の読み取り',src:'『世界史と日本史は同時に学べ』p.53・63／スタサプ 第4講',
 ctx:'資料\n順帝の昇明二年，使いを遣わして上表して曰く，「封国は偏遠にして，藩を外に作す。……東は毛人を征すること五十五国，西は衆夷を服すること六十六国，渡りて海北を平ぐること九十五国」と。\n（『宋書』倭国伝，一部要約）',
 q:'資料について述べた文として最も適当なものを，次の①〜④のうちから一つ選べ。',
 opts:['資料の「宋」は10世紀に建国された宋（北宋）で，倭の使者は開封を訪れた。','資料の使者を送った倭王武は，南朝の宋と結んで朝鮮半島南部での立場を強めようとしたと考えられる。','資料の倭王は卑弥呼で，「親魏倭王」の称号を授かった。','資料の時期，中国は隋によって統一されていた。'],a:1,
 exp:'資料は5世紀の「倭の五王」（讃・珍・済・興・武）のうち，最後の武（雄略天皇にあたるとされる）が478年に南朝の宋の順帝に送った上表文。この「宋」は420年に建国された南朝の宋（劉宋）で，10世紀の宋（北宋）とは別（①誤り）。倭王は中国南朝の皇帝から称号を得ることで，高句麗と対抗しながら朝鮮半島南部（百済・加耶）での立場を強めようとした（②正）。卑弥呼が「親魏倭王」を受けたのは239年の魏（③誤り）。隋の統一は589年で，5世紀の中国は北魏と南朝に分かれていた（④誤り）。大仙陵古墳など巨大前方後円墳がつくられたのもこの時期。'},
{set:'5・6世紀',p:3,yoko:true,type:'年代整序（6択）',src:'『世界史と日本史は同時に学べ』p.57・64／『ヨコから見る世界史』p.74',
 q:'次の文Ⅰ〜Ⅲは，6世紀の東西の出来事について述べている。古いものから年代順に正しく配列したものを，次の①〜⑥のうちから一つ選べ。\n\nⅠ　蘇我馬子が物部守屋を滅ぼした。\nⅡ　北魏が東魏と西魏に分裂した。\nⅢ　突厥が柔然を倒して，モンゴル高原の覇者となった。',
 opts:['Ⅰ―Ⅱ―Ⅲ','Ⅰ―Ⅲ―Ⅱ','Ⅱ―Ⅰ―Ⅲ','Ⅱ―Ⅲ―Ⅰ','Ⅲ―Ⅰ―Ⅱ','Ⅲ―Ⅱ―Ⅰ'],a:3,
 exp:'Ⅱ 534年，孝文帝の死後に冷遇された鮮卑軍人の反乱（六鎮（りくちん）の乱）を経て北魏が東魏・西魏に分裂（のち北斉・北周）。同じ534年にユスティニアヌス帝がヴァンダル王国を滅ぼしている。Ⅲ 552年，突厥が柔然を倒す。Ⅰ 587年，仏教の受容をめぐって蘇我馬子（そがのうまこ）が排仏派の物部守屋（もののべのもりや）を滅ぼし，蘇我氏の権力が確立した。したがってⅡ→Ⅲ→Ⅰ。538年（552年説もある）に百済の聖明王から仏教が伝わったことが蘇我・物部対立の背景。'},
{set:'5・6世紀',p:3,type:'語と事績の組合せ',src:'『世界史と日本史は同時に学べ』p.56〜57／スタサプ 第7講',
 q:'6世紀末のカトリック教会について，人物と事績の組合せとして正しいものを，次の①〜④のうちから一つ選べ。',
 opts:['テオドシウス帝―ミラノ勅令でキリスト教を公認した','グレゴリウス1世―ニケーア公会議を開いてアリウス派を異端とした','テオドシウス帝―聖ソフィア聖堂を再建した','グレゴリウス1世―ゲルマン人への布教を進め，ローマ教会の首位を確立した'],a:3,
 exp:'590年に教皇となったグレゴリウス1世（大教皇）は，修道院を拠点にゲルマン人への布教を進め，ローマ教会の長としての「教皇」の権威を確立した。クローヴィスの改宗（496）とグレゴリウス1世の布教によってカトリックが西ヨーロッパに定着し，のちの「ローマ教会とゲルマン人」というヨーロッパ世界の骨組みができる（④正）。ニケーア公会議（325）とミラノ勅令（313）はコンスタンティヌス帝，テオドシウス帝は392年にキリスト教を国教化した皇帝，聖ソフィア聖堂の再建は6世紀のユスティニアヌス帝。'},

];

const CURATED_BOOKS = [
{set:'古代（旧・一問一答風）',hidden:true,src:'『世界史と日本史は同時に学べ』p.13／補助：スタサプ スタンダード世界史 第1講',
 q:'前7世紀、鉄製の武器を用いて史上初めてオリエントを統一し、多数の民族を支配したことから「帝国」と呼ばれた国はどれか。また、その頃の中国の状況として正しい組み合わせを選べ。',
 opts:['アッシリア ― 殷の全盛期','アッシリア ― 周が弱体化した春秋時代','ヒッタイト ― 戦国時代','アケメネス朝 ― 秦の統一'],a:1,
 exp:'前7世紀にオリエントを統一したのはアッシリア（前612年滅亡）。同書は「歴史上初めて多数の民族を支配したことから帝国の名で呼ばれる」と説明。中国は前770年の東遷以降、周王の力が衰えた春秋時代。ヒッタイトは前12世紀ごろ滅亡、アケメネス朝は前550年成立で時代が合わない。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.18「ヨコの鉄則」',
 q:'前7〜前6世紀にかけて各地で成立した宗教の組み合わせとして誤っているものはどれか。',
 opts:['イラン ― ゾロアスター教','イスラエル ― ユダヤ教','インド ― 仏教','中国 ― 道教'],a:3,
 exp:'鉄則は「前7〜前6世紀、イランではゾロアスター教、イスラエルではユダヤ教、インドでは仏教が成立」。ゾロアスター教の「最後の審判」の思想はユダヤ教に取り入れられた。中国でこの時期に現れたのは諸子百家（儒家・道家など）で、宗教としての道教は後漢末〜南北朝に成立する。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.17／問題チェック①',
 q:'前7世紀、ギリシアに鋳造貨幣を伝えた国リディアが位置する地域はどこか。',
 opts:['イラン高原','エジプト','小アジア（アナトリア）','南ロシア'],a:2,
 exp:'リディアは小アジア西部の王国。同書は「イランに建てられたメディアと混同しないように」と注意している。同じ前6世紀ごろ、インド・中国でも鉄器の普及とともに貨幣使用が始まっており、3地域そろって商工業・貨幣経済が発展した（p.16鉄則）。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.13・p.19まとめ表',
 q:'前6〜前5世紀に、ギリシアの三大哲学者、インドの仏教・ジャイナ教、中国の諸子百家がほぼ同時に出現した背景として同書が強調するものはどれか。',
 opts:['大帝国の成立による長期の平和','商工業の発展と平民・庶民層の台頭','文字の発明と書物の普及','異民族の侵入による旧王朝の滅亡'],a:1,
 exp:'ギリシアは植民市建設と貿易、インド・中国は鉄器による農業生産の向上→商工業の発展→旧体制が崩れ、新しい価値観を求める気運が生まれた（p.13）。まとめ表では「経済発展→社会変化→宗教（思想）」の3段で3地域を並べている。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『世界史と日本史は同時に学べ』p.14／『ヨコから見る世界史』LESSON1 問題チェック④',
 q:'ガウタマ＝シッダールタ（前563頃〜前483頃）が仏教を開いたのとほぼ同じ時代の人物として正しい組み合わせはどれか。',
 opts:['孔子 ― ソクラテス','孟子 ― プラトン','始皇帝 ― アレクサンドロス','老子 ― アリストテレス'],a:0,
 exp:'孔子（前551頃〜前479）とソクラテス（前470頃〜前399）はガウタマと同じ前6〜前5世紀。孟子（前372頃〜前289頃）とプラトン（前429頃〜前347）は一世代後の「王道政治／哲人政治」の組み合わせ（同書問題チェック⑤）。始皇帝とアレクサンドロスは前4〜前3世紀。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON2 p.26「ヨコの鉄則」',
 q:'ペルシア戦争（前5世紀前半）の結果について、同書が「地中海の支配権が移った」と述べている民族の組み合わせはどれか。',
 opts:['ギリシア人 → ペルシア人','フェニキア人 → ギリシア人','エジプト人 → フェニキア人','ギリシア人 → ローマ人'],a:1,
 exp:'アケメネス朝はフェニキア人の商業活動を保護しており、サラミスの海戦（前480）で敗れたペルシア海軍の主体もフェニキア人だった。「第1ラウンド（ペルシア戦争）はギリシアが勝利→地中海の支配権はフェニキア人からギリシア人に移った」。ギリシア→ローマへ移るのはポエニ戦争後。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON2 問題チェック③／『世界史と日本史は同時に学べ』p.15',
 q:'アレクサンドロス大王が東方遠征を開始した前334年、中国はどの時代だったか。',
 opts:['春秋時代','戦国時代','秦','前漢'],a:1,
 exp:'戦国時代（前403〜前221）。同書は語呂「さあさしっかり東方遠征」で前334年を覚えさせる。『同時に学べ』の地図（前4・3世紀）でも「戦国時代→秦」と匈奴が描かれ、日本は弥生時代とされる。秦の統一（前221）はアレクサンドロスの死（前323）から約100年後。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『世界史と日本史は同時に学べ』p.15／『ヨコから見る世界史』LESSON2 p.24',
 q:'インド最初の統一王朝マウリヤ朝（前4世紀末成立）について、両書が成立の契機として挙げているものはどれか。',
 opts:['アーリヤ人のガンジス川流域への進出','アショーカ王による仏教の保護','アレクサンドロスの遠征に刺激された統一の機運','セレウコス朝との和平'],a:2,
 exp:'アレクサンドロスがパンジャーブ地方まで進出したことで「インド側でも統一の機運が芽生え」、チャンドラグプタがギリシア軍を追ってマウリヤ朝を建てた。のちにセレウコス朝と和し、使者メガステネスが『インド誌』を著した。アショーカ王は第3代で最盛期の王。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON3 p.35',
 q:'ローマがカルタゴとポエニ戦争を始めた前264年ごろ、オリエント世界の状況として正しいものはどれか。',
 opts:['アケメネス朝が最盛期を迎えていた','アレクサンドロスの帝国が健在だった','イプソスの戦い（前301）を経て3つのヘレニズム国家に分裂していた','ササン朝がパルティアを倒したところだった'],a:2,
 exp:'アレクサンドロスの死後ディアドコイ戦争が続き、前301年のイプソスの戦いで①アンティゴノス朝マケドニア②プトレマイオス朝エジプト③セレウコス朝シリアに分裂。ローマはカルタゴを滅ぼした前146年にコリントスも滅ぼし、前133年ペルガモン、前64年シリア、前30年エジプトを滅ぼして地中海を「われらの海」とした。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON3 問題チェック③',
 q:'ハンニバルがザマの戦いでローマに敗れた前202年、中国で成立した王朝はどれか。',
 opts:['秦','前漢','新','後漢'],a:1,
 exp:'ザマの戦いは前202年。同年、劉邦（高祖）が項羽を破って前漢を建てた。秦は前221年統一・前206年滅亡で、わずか15年の王朝。「ザマ＝前漢成立」は年号のヨコ対応として同書が明示している。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON3 p.37／『世界史と日本史は同時に学べ』p.16',
 q:'前漢の武帝が即位した前141年ごろのローマの状況として最も適切なものはどれか。',
 opts:['王政から共和政に移行した直後だった','カルタゴを滅ぼし（前146）地中海の覇者となったころだった','カエサルがガリアを征服していた','アウグストゥスが帝政を始めていた'],a:1,
 exp:'同書は「武帝の即位は前141年。ちょうどローマがカルタゴを滅ぼした頃」と明記。ローマは第3次ポエニ戦争（前149〜前146）でカルタゴを徹底的に滅ぼした。武帝は張騫を大月氏へ派遣（前139）し、匈奴を討って河西四郡を置き、東西交易が活発化する。共和政成立は前509、カエサルは前1世紀、帝政開始は前27年。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON3 p.32・問題チェック⑤',
 q:'前2〜前1世紀、ローマと前漢の間に位置して両者を結ぶ交易を担い、セレウコス朝シリアから分離したイラン系国家はどれか。',
 opts:['バクトリア','パルティア','大月氏','クシャーナ朝'],a:1,
 exp:'パルティアはセレウコス朝から自立したイラン系国家で、時代概観の地図では「ローマと敵対・前漢と交易」と描かれる。バクトリアも同じくセレウコス朝から自立したがギリシア系。大月氏は張騫が派遣された先で、バクトリア地方を中心に栄えた（民族系統不明）。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『世界史と日本史は同時に学べ』p.10〜11',
 q:'約20万年前にアフリカに登場し、数万年前までに世界各地に広がった現生人類（新人）の代表例として同書が挙げるものの組み合わせはどれか。',
 opts:['北京原人とジャワ原人','ネアンデルタール人と周口店上洞人','クロマニョン人と周口店上洞人','アウストラロピテクスとサヘラントロプス'],a:2,
 exp:'新人（ホモ＝サピエンス）の代表は西南ヨーロッパのクロマニョン人と中国の周口店上洞人。北京原人・ジャワ原人は原人、ネアンデルタール人は旧人、アウストラロピテクスとサヘラントロプス（700万年前・最古の人類）は猿人。新人は剝片石器・骨角器を用いた。日本は約1万6000年前から縄文時代（p.11）。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『世界史と日本史は同時に学べ』p.11',
 q:'約9000年前の西アジアで始まった農耕が、大河の流域で文明を生む決め手になったと同書が説明する農業の形態はどれか。',
 opts:['焼畑農業','灌漑農業','牛耕農法','二圃制'],a:1,
 exp:'初期の農耕は雨水頼りで収穫が少なかったが、水を引く灌漑農業が始まると食糧生産が増え、エジプト・メソポタミア・インダス川周辺・黄河・長江の流域に人口が集中して文明と都市が生まれた。牛耕農法は『ヨコから見る世界史』が春秋・戦国時代の中国で強調するもの。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『世界史と日本史は同時に学べ』p.12（前20〜前11世紀）',
 q:'前2000年ごろから馬にひかせる戦車を用いて各地に広がったインド＝ヨーロッパ系の民族として誤っているものはどれか。',
 opts:['ヒッタイト人','アーリア人','ペルシア人','フェニキア人'],a:3,
 exp:'同書が挙げるインド＝ヨーロッパ系は、小アジアのヒッタイト、エーゲ海に南下したギリシア人、イラン高原のペルシア人、インドに侵入したアーリア人、ヨーロッパのケルト・ラテン・ゲルマン・スラヴ人。原住地は南ロシアの草原地帯。フェニキア人はセム系（『ヨコから見る世界史』p.20）。同じころ中国では殷が青銅器文明を築き、日本は縄文晩期。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.14',
 q:'『ヨコから見る世界史』が、春秋・戦国時代に諸子百家を生んだ社会変化の出発点として図示しているものはどれか。',
 opts:['青銅貨幣の使用','鉄製農具と牛耕農法の普及','氏族共同体の解体','大都市の発展'],a:1,
 exp:'図は「鉄製農具・牛耕農法の普及→農業生産力の向上→①商工業の発展（青銅貨幣、製鉄・製塩業）②社会の変化（大都市、氏族共同体の解体と家族単位の農業経営）③文化（諸子百家）」の順。各国の富国強兵策で人材が登用され、自由に意見を言える雰囲気の中で諸子百家が生まれた。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.15「諸子百家」',
 q:'諸子百家の学派と人物・主張の組み合わせとして正しいものはどれか。',
 opts:['儒家 ― 商鞅 ― 法治主義','法家 ― 韓非・李斯 ― 信賞必罰','道家 ― 墨子 ― 兼愛・非攻','墨家 ― 老子・荘子 ― 無為自然'],a:1,
 exp:'法家は商鞅（秦の孝公に仕える）・韓非・李斯（始皇帝に仕える）で、法治主義・信賞必罰を説き秦で採用された。儒家は孔子・孟子（性善説・王道政治）・荀子（性悪説）、道家は老子・荘子の無為自然、墨家は墨子の兼愛・非攻。同書は諸子百家のキーワードを「処世的（現実対応）」とし、儒家を特に重視。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.15 特別講義／問題チェック⑦',
 q:'戦国時代に斉・燕の地域で使われた青銅貨幣はどれか。',
 opts:['刀銭','布銭','円銭（環銭）','蟻鼻銭'],a:0,
 exp:'斉・燕は狩猟中心で戦いも多く刀の形の刀銭。農業地域の韓・魏（趙）は農具の形の布銭。西方の秦は合理的な円形の円銭（環銭）。楚は未解読の文字を刻んだ蟻鼻銭。すべて青銅製。同書は「どこでどの貨幣が使われたかはよく出題される」と注意。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.16／問題チェック③',
 q:'前6世紀ごろのインドで、仏教・ジャイナ教を支持して既成のバラモン教に不満を抱いた身分の組み合わせはどれか。',
 opts:['バラモンとクシャトリヤ','クシャトリヤとヴァイシャ','ヴァイシャとシュードラ','バラモンとシュードラ'],a:1,
 exp:'ガンジス川流域の豊かな土地と鉄器の使用で農業・商工業が発展し、クシャトリヤ（武士）と商業で力をつけたヴァイシャ（農民・牧畜民・商人）が、バラモン（司祭）を頂点とするバラモン教に不満を抱いた。仏教は主にクシャトリヤ、ジャイナ教は主にヴァイシャの支持を集めた（同書の表）。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.17／LESSON2 問題チェック①',
 q:'ギリシア人が建設した植民市でないものはどれか。',
 opts:['ビザンティオン（現イスタンブル）','ネアポリス（現ナポリ）','マッサリア（現マルセイユ）','ルテティア（現パリ）'],a:3,
 exp:'ギリシアの植民市は海岸中心（ビザンティオン・ネアポリス・マッサリア）、ローマの植民市は内陸中心（ルテティア＝パリ、ウィンドボナ＝ウィーン、ロンディニウム＝ロンドン）。土地のやせたギリシアは貿易で経済を補ったため海港植民市が多い。カルタゴはフェニキア人ティルスの植民市（LESSON2 問題チェック①）。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON1 p.18「イオニアの自然哲学」',
 q:'前6世紀以降、小アジアのイオニア地方（ミレトスなど）で興った自然哲学者と主張の組み合わせとして正しいものはどれか。',
 opts:['タレス ― 万物の根元は数','ピタゴラス ― 万物の根元は水','デモクリトス ― 万物の根元は原子（アトム）','ヘラクレイトス ― 万物の根元はト＝アペイロン'],a:2,
 exp:'タレス＝水、デモクリトス＝原子、アナクシマンドロス＝ト＝アペイロン（無制限）、ピタゴラス＝数、ヘラクレイトス＝「万物は流転する」根元は火。イオニアはオリエントの先進諸国と接しやすく、中国のように処世的ではなく純粋に真理を探究する姿勢が画期的だったと同書は評価。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON2 p.26／問題チェック④',
 q:'ペルシア戦争の勝利後、アテネが盟主となって結成した海上同盟はどれか。また、その結成（前478年頃）のときの中国の都はどこか。',
 opts:['デロス同盟 ― 洛邑','デロス同盟 ― 咸陽','コリントス同盟 ― 鎬京','コリントス同盟 ― 長安'],a:0,
 exp:'デロス同盟は参加都市200にも及び、アテネはその盟主として繁栄した。中国は東周（春秋時代）で都は洛邑。ただし東周の支配地はいち小国にも及ばないほど縮小していた。コリントス（ヘラス）同盟はフィリッポス2世がギリシアをまとめた同盟。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON2 p.27〜28',
 q:'アレクサンドロス大王の東西融合政策の結果生まれたヘレニズム文化の特徴と、それを代表する思想の組み合わせはどれか。',
 opts:['ポリス市民の団結 ― エピクロス派','世界市民主義（コスモポリタニズム） ― ストア派','一神教の普及 ― ユダヤ教','東方的専制の否定 ― イオニア自然哲学'],a:1,
 exp:'征服地へのコイネー（共通ギリシア語）普及、ペルシア人との通婚奨励などの融合政策で、ポリスの伝統が崩れ世界市民主義と個人主義に向かった。世界市民主義を代表するのがストア派（禁欲説）で、ローマ帝国で歓迎されセネカやマルクス＝アウレリウス＝アントニヌス帝（『自省録』）が代表。エピクロス派は精神の安定としての快楽を求めた。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON2 p.28／問題チェック⑤',
 q:'プトレマイオス朝エジプトのムセイオン（王立研究所）で活動した学者でないのはどれか。',
 opts:['アルキメデス','エウクレイデス（ユークリッド）','エラトステネス','タレス'],a:3,
 exp:'ムセイオンにはアリスタルコス（太陽中心説）、アルキメデス（円周率・てこの原理）、エウクレイデス（平面幾何学）、エラトステネス（地球の子午線測定）らが集まり自然科学が発展した。タレスとデモクリトスは前6〜前5世紀のギリシア自然哲学者で時代が異なる。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON2 p.28',
 q:'マウリヤ朝第3代アショーカ王（位前268頃〜前232頃）の事業として誤っているものはどれか。',
 opts:['各地に石柱碑・磨崖碑を建てた','第3回仏典結集を行った','セイロン島に仏教を布教した','ガンダーラ美術を生み出した'],a:3,
 exp:'アショーカ王は仏教に深く帰依し、その普遍性を統治理念に利用した。石柱碑・ストゥーパ（サーンチー）・磨崖碑、第3回仏典結集、王族マヒンダによるセイロン島布教で上座部仏教が南に伝わる契機を作った。ガンダーラ美術はヘレニズム文化がインドで生んだもので、王の死後のクシャーナ朝期に栄えた。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON3 p.34',
 q:'ポエニ戦争についての記述として誤っているものはどれか。',
 opts:['第1次（前264〜前241）でローマはシチリア島を最初の属州とした','第2次では前216年カンナエの戦いでハンニバルがローマ軍を包囲殲滅した','第2次は前202年ザマの戦いでローマ軍がハンニバルを破って終わった','第3次（前149〜前146）では大スキピオがカルタゴを滅ぼした'],a:3,
 exp:'第3次でカルタゴを徹底的に滅ぼしたのは小スキピオ（ギリシア人の歴史家ポリビオスが同行し炎上を目撃）。ザマで勝ったのが大スキピオ。ハンニバルはイベリア半島のカルタゴ＝ノヴァから出発しアルプスを越えた（問題チェック②）。ポエニ戦争で勝ったローマは西地中海の制海権を得た。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON3 p.36',
 q:'秦の始皇帝が法家の李斯を用いて実施した郡県制と比較される、アケメネス朝ペルシアの地方統治制度はどれか。',
 opts:['サトラップ制','属州制','封建制','ポリス制'],a:0,
 exp:'サトラップ制は全国を20の州に分け中央から非世襲のサトラップ（知事）を派遣する制度。郡県制は全国を36郡に分け非世襲の官僚を派遣する。「王の道」と「馳道」、「王の目・王の耳」と「御史大夫・監」など監察制度も似るが、因果関係は推測の域を出ないと同書は注意。世界帝国の比較は論述で頻出。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON3 p.37',
 q:'前漢の劉邦（高祖）が白登山の戦いで敗れ、以後和親政策をとる相手となった匈奴全盛期の君主はだれか。',
 opts:['冒頓単于','張騫','衛青','李陵'],a:0,
 exp:'冒頓単于（位前209〜前174）のもとで匈奴は強大化し、前漢は事実上の属国のような存在だった（『同時に学べ』p.16）。巻き返したのは7代目の武帝で、張騫を大月氏に派遣（前139）、衛青・霍去病が匈奴を討ち（前129）、河西四郡を設置（前121頃）。李陵は武帝晩年に匈奴に投降した将軍で、司馬遷（『史記』）が弁護した。'},
{set:'古代（旧・一問一答風）',hidden:true,src:'『ヨコから見る世界史』LESSON3 p.37／問題チェック⑧',
 q:'武帝が匈奴の補給路を断つために西域に設置した河西四郡のうち、最も西に位置する郡はどれか。',
 opts:['武威','張掖','酒泉','敦煌'],a:3,
 exp:'東から武威→張掖→酒泉→敦煌の順。河西四郡の設置（前121年頃）で西域経営が本格化し東西交渉が活発になった。武帝の遠征は前129匈奴→前121西域→前111南越→前108朝鮮（楽浪郡など4郡）と時計の反対回りに進んだ（特別講義）。'},

function genCent(t,corFixed){

  const NEAR=40;

  if(!cands.length&&!corFixed)return null;
  const cor=corFixed||pick(cands);
  const gap=e=>Math.abs(e.y-t.y);
  // 過去問（2021〜2026, 10回分）の実例：誤答は「正解と同じ地域の別の時代」が主流で30〜900年差。他地域の誤答は300年以内

  for(const e of near.concat(far)){if(ds.length>=3)break;if(!ds.includes(e)&&ok(e))ds.push(e)}
  for(const e of shuffle(other)){if(ds.length>=3)break;if(ok(e))ds.push(e)}
  for(const e of shuffle(EV.filter(e=>gap(e)>300&&gap(e)<=900))){if(ds.length>=3)break;if(ok(e))ds.push(e)}

    q:`「${qt(t.t)}」とほぼ同じ時期（前後${NEAR}年以内）に起きた出来事はどれか。`,

  if(!ys.length)return gs[Math.min(1,gs.length-1)];
  const y=ys.sort((a,b)=>a-b)[Math.floor(ys.length/2)];
  const k=y<-600?0:y<-400?1:y<-200?2:3;
  return gs[Math.min(k,gs.length-1)];
}
function curQ(k){const c=ALL_CURATED[k];const fixed=!!c.type;const order=fixed?c.opts.map((o,i)=>i):shuffle(c.opts.map((o,i)=>i));return {key:`cur:${k}`,label:(c.type?`【${c.type}】`:'')+c.q.replace(/\n[\s\S]*/,'').slice(0,26)+'…',q:c.q,ctx:c.ctx||'',type:c.type||'',yoko:!!c.yoko,mapP:c.p!==undefined?c.p:(c.set==='古代（紀元前）'?0:undefined),geo:guessGeo(c),opts:order.map(o=>c.opts[o]),a:order.indexOf(c.a),exp:c.exp+(c.src?`\n\n出典：${c.src}`:'')}}

// ---------- quiz UI ----------
const qs={mode:store.get('yoko_mode','mix'),sel:store.get('yoko_sel',[]),src:'all',n:store.get('yoko_n',10)};
function renderQuizSetup(){
  const el=$('#tab-quiz');
  const modes=[['mix','ミックス'],['cent','同じ時期は？'],['dyn','その時どこは？'],['order','年代整序']];
  const wrongN=Object.keys(wrong).filter(k=>!k.startsWith('cur:')).length;
  el.innerHTML=`
  <div class="setting"><div class="lab">出題形式</div><div class="chips">${modes.map(m=>`<button class="chip ${qs.mode===m[0]?'on':''}" data-k="mode" data-v="${m[0]}">${m[1]}</button>`).join('')}</div></div>
  <div class="setting"><div class="lab">時代区分（複数選択可・未選択＝全範囲）</div><div class="grid">${AVAILABLE.length>1?`<button class="chip ${!qs.sel.length?'on':''}" data-k="sel" data-v="-1">全範囲</button>`:''}${PERIODS.map((p,k)=>AVAILABLE.includes(k)?`<button class="chip ${qs.sel.includes(k)||AVAILABLE.length===1?'on':''}" data-k="sel" data-v="${k}">${p.n}</button>`:'').join('')}</div></div>
  <div class="setting"><div class="lab">出題対象</div><div class="chips"><button class="chip ${qs.src==='all'?'on':''}" data-k="src" data-v="all">全問</button><button class="chip ${qs.src==='wrong'?'on':''}" data-k="src" data-v="wrong">前回の間違いだけ（${wrongN}）</button></div></div>
  <div class="setting"><div class="lab">問題数</div><div class="chips">${[10,20,30].map(n=>`<button class="chip ${qs.n===n?'on':''}" data-k="n" data-v="${n}">${n}問</button>`).join('')}</div></div>
  <button class="btn" id="qStart">スタート</button>
  <p class="muted">「同じ時期は？」は前後40年以内が正解、誤答は主に正解と同じ地域の別時代（60〜600年差）。共テ10回分の実例に合わせた幅。「その時どこは？」は他地域の王朝を答える。解説に全選択肢の年を表示。</p>`;
  el.querySelectorAll('.chip[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==='sel'){const v=+b.dataset.v;if(v<0)qs.sel=[];else qs.sel=qs.sel.includes(v)?qs.sel.filter(x=>x!==v):[...qs.sel,v].sort((a,b)=>a-b);}
    else qs[k]=(k==='n')?+b.dataset.v:b.dataset.v;
    store.set('yoko_'+k,qs[k]);renderQuizSetup()});
  $('#qStart').onclick=()=>startQuiz(buildSet());
}
function buildSet(){
  const range=qs.sel;const out=[];const used=new Set();
  if(qs.src==='wrong'){
    const keys=shuffle(Object.keys(wrong).filter(k=>!k.startsWith('cur:')));
    for(const k of keys){const q=genFromKey(k);if(q){out.push(q)}if(out.length>=qs.n)break}
    return out;
  }
  const pool=EV.filter(e=>inSel(e,range));
  let guard=0;
  while(out.length<qs.n&&guard++<500){
    const m=qs.mode==='mix'?pick(['cent','cent','dyn','order']):qs.mode;
    let q=null;
    if(m==='order'){q=genOrder(range)}
    else{const t=pick(pool);if(used.has(t.i))continue;q=m==='cent'?genCent(t):genDyn(t);if(q)used.add(t.i)}
    if(q&&!out.some(x=>x.key===q.key))out.push(q);
  }
  return out;
}
let run=null;
function startQuiz(set,host='#tab-quiz',back=renderQuizSetup){
  if(!set.length){alert('出題できる問題がありません（範囲や出題対象を変えてください）');return}
  run={set,k:0,ok:0,wrongs:[],host,back};showQ();
}
function showQ(){
  const q=run.set[run.k];const el=$(run.host);
  el.innerHTML=`<div class="bar"><span>${run.k+1} / ${run.set.length}</span><span>正解 ${run.ok}</span></div>
  ${q.type?`<div class="muted">${esc(q.type)}${q.yoko?'　<b style="color:var(--accent)">ヨコ</b>':''}</div>`:''}
  ${q.ctx?`<div class="ctx">${esc(q.ctx).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')}</div>`:''}
  <div class="q">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${NUM[k]} ${esc(o)}</button>`).join('')}</div>
  <div id="qexp"></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  const q=run.set[run.k];const el=$(run.host);const ok=k===q.a;
  if(ok){run.ok++;delWrong(q.key)}else{run.wrongs.push(q);addWrong(q.key,q.label)}
  el.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok');else if(i===k)b.classList.add('ng')});
  const ep=picExp(esc(q.exp));el.querySelector('#qexp').innerHTML=`<div class="exp"><div class="v ${ok?'ok':'ng'}">${ok?'正解':'不正解'}　正解は ${NUM[q.a]}</div>${ktMark(ep.html,[q.opts[q.a]])}</div>${q.geo!==undefined&&GEO[q.geo]?geoSVG(GEO[q.geo]):''}${q.mapP!==undefined&&MAPS.some(m=>m.p===q.mapP)?`<button class="btn sec mapbtn" id="qMap">この時代の地図をすべて見る</button>`:''}<button class="btn" id="qNext">${run.k+1<run.set.length?'次へ':'結果を見る'}</button>`;
  el.querySelectorAll('.exp .pic').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openPic(ep.ims[+b.dataset.ei])});
  bindMaps(el);const mb=el.querySelector('#qMap');if(mb)mb.onclick=()=>openMaps(q.mapP);
  el.querySelector('#qNext').onclick=()=>{run.k++;run.k<run.set.length?showQ():showResult()};
  el.querySelector('#qNext').scrollIntoView({block:'nearest'});
}
function showResult(){
  const el=$(run.host);
  el.innerHTML=`<div class="result"><div class="muted">結果</div><div class="big">${run.ok} / ${run.set.length}</div></div>
  ${run.wrongs.length?`<div class="card"><h3>間違えた問題</h3>${run.wrongs.map(q=>`<div class="wrongitem">${esc(q.label)}</div>`).join('')}</div>`:'<p class="muted" style="text-align:center">全問正解！</p>'}
  <div class="row"><button class="btn sec" id="rBack">設定に戻る</button><button class="btn" id="rRetry">${run.wrongs.length?'間違いだけもう一度':'もう一度'}</button></div>`;
  el.querySelector('#rBack').onclick=run.back;
  const w=run.wrongs.map(q=>genFromKey(q.key)).filter(Boolean);
  el.querySelector('#rRetry').onclick=()=>startQuiz(w.length?w:run.set.map(q=>genFromKey(q.key)).filter(Boolean),run.host,run.back);
}

// ---------- curated ----------
let curSet=store.get('yoko_set',null);
let curFilter=store.get('yoko_filter','yoko');
let curN=store.get('yoko_curn',10);
function renderCurSetup(){
  const el=$('#tab-cur');
  const sets=[...new Set(ALL_CURATED.filter(c=>!c.hidden).map(c=>c.set))];
  if(!sets.includes(curSet))curSet=sets[0];
  const hasYoko=ALL_CURATED.some(c=>c.set===curSet&&c.yoko);
  const idxs=ALL_CURATED.map((c,k)=>k).filter(k=>ALL_CURATED[k].set===curSet&&(curFilter==='all'||!hasYoko||ALL_CURATED[k].yoko));
  const nY=ALL_CURATED.filter(c=>c.set===curSet&&c.yoko).length,nA=ALL_CURATED.filter(c=>c.set===curSet).length;
  const wrongN=Object.keys(wrong).filter(k=>k.startsWith('cur:')&&idxs.includes(+k.split(':')[1])).length;
  const srcs=[...new Set(idxs.flatMap(k=>(ALL_CURATED[k].src.match(/『[^』]+』/g)||[ALL_CURATED[k].src])))];
  el.innerHTML=`<div class="setting"><div class="lab">問題セット</div><div class="chips">${sets.map(s=>`<button class="chip ${s===curSet?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
  ${hasYoko?`<div class="setting"><div class="lab">出題範囲</div><div class="chips"><button class="chip ${curFilter==='yoko'?'on':''}" data-f="yoko">ヨコ中心（${nY}）</button><button class="chip ${curFilter==='all'?'on':''}" data-f="all">知識確認も含む全問（${nA}）</button></div></div>`:''}
  <div class="setting"><div class="lab">1回の問題数</div><div class="chips">${[10,20,999].map(n=>`<button class="chip ${curN===n?'on':''}" data-n="${n}">${n===999?'全問':n+'問'}</button>`).join('')}</div></div>
  <p class="muted">主な出典：${srcs.map(esc).join('、')}。「ヨコ中心」は2地域以上の同時代・影響関係を問う問題だけ。各問の解説末尾に出典を表示。</p>
  <button class="btn" id="cAll">スタート（ランダムに${Math.min(curN,idxs.length)}問）</button>
  <button class="btn sec" id="cWrong">前回の間違いだけ（${wrongN}）</button>`;
  el.querySelectorAll('.chip[data-s]').forEach(b=>b.onclick=()=>{curSet=b.dataset.s;store.set('yoko_set',curSet);renderCurSetup()});
  el.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{curFilter=b.dataset.f;store.set('yoko_filter',curFilter);renderCurSetup()});
  el.querySelectorAll('.chip[data-n]').forEach(b=>b.onclick=()=>{curN=+b.dataset.n;store.set('yoko_curn',curN);renderCurSetup()});
  $('#cAll').onclick=()=>startQuiz(shuffle(idxs).slice(0,curN).map(curQ),'#tab-cur',renderCurSetup);
  $('#cWrong').onclick=()=>startQuiz(shuffle(Object.keys(wrong).filter(k=>k.startsWith('cur:')&&idxs.includes(+k.split(':')[1]))).map(genFromKey).filter(Boolean),'#tab-cur',renderCurSetup);
}

// ---------- 暗記カード ----------
const CK='yoko_cards_todo';let todo=store.get(CK,{});
const cs={deck:store.get('yoko_deck','ev'),src:'all'};let crun=null;
function cardsEv(){return EV.filter(e=>inSel(e,[])).map(e=>({id:'ev:'+e.i,tag:REG[e.r].short,front:qt(e.t),back:`${yfmt(e.y)}年（${pname(e.y)}）`,same:EV.filter(x=>x.i!==e.i&&x.r!==e.r&&Math.abs(x.y-e.y)<=40).sort((a,b)=>a.y-b.y).map(x=>`${yfmt(x.y)} ${REG[x.r].short}：${x.t}`),geo:GEO.findIndex(g=>g.p===pidx(e.y)&&true)>=0?guessGeo({exp:'',q:'前'+Math.abs(e.y)+'年',p:pidx(e.y)}):undefined}))}
function cardsRule(){return RULE_CARDS.map((c,i)=>({id:'rule:'+i,tag:'ヨコの鉄則',front:c.f,back:c.b+'\n\n出典：'+c.s,same:[]}))}
function renderCardSetup(){
  const el=$('#tab-card');const all=cs.deck==='ev'?cardsEv():cardsRule();const nT=all.filter(c=>todo[c.id]).length;
  el.innerHTML=`<div class="setting"><div class="lab">デッキ</div><div class="chips"><button class="chip ${cs.deck==='ev'?'on':''}" data-d="ev">出来事→同時代（${cardsEv().length}）</button><button class="chip ${cs.deck==='rule'?'on':''}" data-d="rule">ヨコの鉄則（${cardsRule().length}）</button></div></div>
  <div class="setting"><div class="lab">対象</div><div class="chips"><button class="chip ${cs.src==='all'?'on':''}" data-s="all">全部</button><button class="chip ${cs.src==='todo'?'on':''}" data-s="todo">「まだ」だけ（${nT}）</button></div></div>
  <p class="muted">カードをタップで裏返し。「覚えた」「まだ」で仕分け。「まだ」はこの端末に保存されます。</p>
  <button class="btn" id="cStart">スタート（シャッフル）</button>`;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{cs.deck=b.dataset.d;store.set('yoko_deck',cs.deck);renderCardSetup()});
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{cs.src=b.dataset.s;renderCardSetup()});
  $('#cStart').onclick=()=>{const set=shuffle(all.filter(c=>cs.src==='all'||todo[c.id]));if(!set.length){alert('カードがありません');return}crun={set,k:0,flip:false};showCard()};
}
function showCard(){
  const el=$('#tab-card');const c=crun.set[crun.k];
  el.innerHTML=`<div class="bar"><span>${crun.k+1} / ${crun.set.length}</span><span>${todo[c.id]?'まだ':''}</span></div>
  <div class="fcard" id="fc"><div class="tag">${esc(c.tag)}</div>${crun.flip?`<div class="front" style="margin-bottom:6px">${esc(c.front)}</div><div class="back">${esc(c.back)}</div>${c.same.length?`<div class="same"><div class="muted">同時期（±40年）の他地域</div>${c.same.map(s=>`<div>${esc(s)}</div>`).join('')}</div>`:''}`:`<div class="front">${esc(c.front)}</div><div class="hint">タップで答え</div>`}</div>
  ${crun.flip&&c.geo!==undefined&&GEO[c.geo]?geoSVG(GEO[c.geo],'all'):''}
  <div class="row"><button class="btn sec" id="cNo">まだ</button><button class="btn" id="cYes">覚えた</button></div>
  <button class="btn sec" id="cQuit" style="margin-top:8px">やめる</button>`;
  $('#fc').onclick=()=>{crun.flip=!crun.flip;showCard()};bindMaps(el);
  const next=()=>{crun.k++;crun.flip=false;crun.k<crun.set.length?showCard():cardResult()};
  $('#cNo').onclick=()=>{todo[c.id]=1;store.set(CK,todo);next()};
  $('#cYes').onclick=()=>{delete todo[c.id];store.set(CK,todo);next()};
  $('#cQuit').onclick=renderCardSetup;
}
function cardResult(){const el=$('#tab-card');const n=crun.set.filter(c=>todo[c.id]).length;el.innerHTML=`<div class="result"><div class="muted">終了</div><div class="big">${crun.set.length-n} / ${crun.set.length}</div><div class="muted">覚えた枚数</div></div><button class="btn" id="cBack">デッキに戻る</button>`;$('#cBack').onclick=renderCardSetup}

// ---------- wrong list ----------
function renderWrong(){
  const el=$('#tab-wrong');const keys=Object.keys(wrong).sort((a,b)=>wrong[b].t-wrong[a].t);
  el.innerHTML=`<p class="muted">間違えた問題はここに保存され、正解すると消えます（この端末のみ）。${keys.length}件</p>
  ${keys.length?`<div class="card">${keys.map(k=>`<div class="wrongitem">${esc(wrong[k].l)}<br><small>${k.split(':')[0]==='cur'?'厳選':k.split(':')[0]==='cent'?'同じ時期':k.split(':')[0]==='dyn'?'その時どこは':'年代整序'}</small></div>`).join('')}</div>
  <button class="btn sec" id="wClear">すべて消去</button>`:''}`;
  const c=$('#wClear');if(c)c.onclick=()=>{if(confirm('間違い記録を消去しますか？')){wrong={};store.set(WK,wrong);renderWrong()}};
}

renderTL();renderQuizSetup();renderCurSetup();
</script>
